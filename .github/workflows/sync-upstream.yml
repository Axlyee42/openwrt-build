#!/usr/bin/env bash

set -euo pipefail


# ==============================================================
# OpenWrt upstream synchronization
#
# Tracks:
#
#   OpenWrt 25.12 stable release
#   OpenWrt packages openwrt-25.12
#   OpenWrt LuCI openwrt-25.12
#
# Also tracks:
#
#   PassWall
#   OpenClash
#   Aurora
#   Bandix
#   luci-app-run
#
# The resulting upstream-state.env is committed to the repo.
# ==============================================================


STATE_FILE="upstream-state.env"


# ==============================================================
# GitHub repositories
# ==============================================================

OPENWRT_REPO="https://github.com/openwrt/openwrt.git"

PACKAGES_REPO="https://github.com/openwrt/packages.git"

LUCI_REPO="https://github.com/openwrt/luci.git"

PASSWALL_REPO="https://github.com/Openwrt-Passwall/openwrt-passwall.git"

PASSWALL_PACKAGES_REPO="https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git"

OPENCLASH_REPO="https://github.com/vernesong/OpenClash.git"

AURORA_REPO="https://github.com/eamonxg/luci-theme-aurora.git"

BANDIX_REPO="https://github.com/timsaya/openwrt-bandix.git"

BANDIX_LUCI_REPO="https://github.com/timsaya/luci-app-bandix.git"

LUCI_APP_RUN_REPO="https://github.com/wukongdaily/luci-app-run.git"


# ==============================================================
# Helper
# ==============================================================

get_branch_commit() {

    local repo="$1"

    local branch="$2"


    git ls-remote \
        "${repo}" \
        "refs/heads/${branch}" |
    awk '{print $1}'

}


get_tag_commit() {

    local repo="$1"

    local tag="$2"


    git ls-remote \
        "${repo}" \
        "refs/tags/${tag}" |
    awk '{print $1}'

}


# ==============================================================
# Find latest OpenWrt 25.12 stable release
# ==============================================================

echo
echo "=========================================="
echo "Checking OpenWrt releases"
echo "=========================================="


OPENWRT_VERSION="$(
    git ls-remote \
        --tags \
        "${OPENWRT_REPO}" \
        'refs/tags/v25.12.*' |
    sed 's#.*refs/tags/v##' |
    grep -E '^25\.12\.[0-9]+$' |
    sort -V |
    tail -1
)"


if [ -z "${OPENWRT_VERSION}" ]; then

    echo
    echo "ERROR:"
    echo "Cannot find OpenWrt 25.12 release."

    exit 1

fi


OPENWRT_COMMIT="$(
    get_tag_commit \
        "${OPENWRT_REPO}" \
        "v${OPENWRT_VERSION}"
)"


echo
echo "OpenWrt version:"
echo "${OPENWRT_VERSION}"

echo
echo "OpenWrt commit:"
echo "${OPENWRT_COMMIT}"


# ==============================================================
# packages
# ==============================================================

echo
echo "=========================================="
echo "Checking packages"
echo "=========================================="


PACKAGES_COMMIT="$(
    get_branch_commit \
        "${PACKAGES_REPO}" \
        "openwrt-25.12"
)"


if [ -z "${PACKAGES_COMMIT}" ]; then

    echo "ERROR: packages branch not found."

    exit 1

fi


echo "packages:"
echo "${PACKAGES_COMMIT}"


# ==============================================================
# LuCI
# ==============================================================

echo
echo "=========================================="
echo "Checking LuCI"
echo "=========================================="


LUCI_COMMIT="$(
    get_branch_commit \
        "${LUCI_REPO}" \
        "openwrt-25.12"
)"


if [ -z "${LUCI_COMMIT}" ]; then

    echo "ERROR: LuCI branch not found."

    exit 1

fi


echo "LuCI:"
echo "${LUCI_COMMIT}"


# ==============================================================
# Third party sources
#
# These are not used to decide OpenWrt version.
#
# But their commits are tracked.
# ==============================================================


echo
echo "=========================================="
echo "Third-party packages"
echo "=========================================="


PASSWALL_COMMIT="$(
    get_branch_commit \
        "${PASSWALL_REPO}" \
        "main"
)"


PASSWALL_PACKAGES_COMMIT="$(
    get_branch_commit \
        "${PASSWALL_PACKAGES_REPO}" \
        "main"
)"


OPENCLASH_COMMIT="$(
    get_branch_commit \
        "${OPENCLASH_REPO}" \
        "master"
)"


AURORA_COMMIT="$(
    get_branch_commit \
        "${AURORA_REPO}" \
        "main"
)"


BANDIX_COMMIT="$(
    get_branch_commit \
        "${BANDIX_REPO}" \
        "main"
)"


BANDIX_LUCI_COMMIT="$(
    get_branch_commit \
        "${BANDIX_LUCI_REPO}" \
        "main"
)"


LUCI_APP_RUN_COMMIT="$(
    get_branch_commit \
        "${LUCI_APP_RUN_REPO}" \
        "main"
)"


echo
echo "PassWall:"
echo "${PASSWALL_COMMIT}"


echo
echo "PassWall packages:"
echo "${PASSWALL_PACKAGES_COMMIT}"


echo
echo "OpenClash:"
echo "${OPENCLASH_COMMIT}"


echo
echo "Aurora:"
echo "${AURORA_COMMIT}"


echo
echo "Bandix:"
echo "${BANDIX_COMMIT}"


echo
echo "Bandix LuCI:"
echo "${BANDIX_LUCI_COMMIT}"


echo
echo "luci-app-run:"
echo "${LUCI_APP_RUN_COMMIT}"


# ==============================================================
# Generate state
# ==============================================================

TMP_FILE="$(mktemp)"


cat > "${TMP_FILE}" <<EOF

# ==========================================================
# Automatically generated by shell/sync-upstream.sh
#
# DO NOT EDIT MANUALLY
# ==========================================================

OPENWRT_VERSION="${OPENWRT_VERSION}"

OPENWRT_COMMIT="${OPENWRT_COMMIT}"

PACKAGES_COMMIT="${PACKAGES_COMMIT}"

LUCI_COMMIT="${LUCI_COMMIT}"

PASSWALL_COMMIT="${PASSWALL_COMMIT}"

PASSWALL_PACKAGES_COMMIT="${PASSWALL_PACKAGES_COMMIT}"

OPENCLASH_COMMIT="${OPENCLASH_COMMIT}"

AURORA_COMMIT="${AURORA_COMMIT}"

BANDIX_COMMIT="${BANDIX_COMMIT}"

BANDIX_LUCI_COMMIT="${BANDIX_LUCI_COMMIT}"

LUCI_APP_RUN_COMMIT="${LUCI_APP_RUN_COMMIT}"

EOF


# ==============================================================
# Compare
# ==============================================================

if [ ! -f "${STATE_FILE}" ]; then

    echo
    echo "No previous upstream state."

    mv "${TMP_FILE}" "${STATE_FILE}"

    exit 0

fi


if cmp -s "${TMP_FILE}" "${STATE_FILE}"; then

    echo
    echo "=========================================="
    echo "No upstream changes."
    echo "=========================================="

    rm -f "${TMP_FILE}"

    exit 0

fi


# ==============================================================
# Show differences
# ==============================================================

echo
echo "=========================================="
echo "UPSTREAM CHANGES"
echo "=========================================="


diff -u \
    "${STATE_FILE}" \
    "${TMP_FILE}" \
    || true


mv "${TMP_FILE}" "${STATE_FILE}"


echo
echo "=========================================="
echo "Upstream state updated."
echo "=========================================="
