name: Check OpenWrt upstream

on:

  # ==========================================================
  # 每天北京时间 10:30 自动检查
  # GitHub Actions 使用 UTC
  # 02:30 UTC = 北京时间 10:30
  # ==========================================================

  schedule:
    - cron: "30 2 * * *"

  # ==========================================================
  # 允许手动检查
  # ==========================================================

  workflow_dispatch:


# ============================================================
# 权限
# ============================================================

permissions:
  contents: write


# ============================================================
# 防止重复运行
# ============================================================

concurrency:

  group: check-openwrt-upstream

  cancel-in-progress: true


jobs:

  check:

    runs-on: ubuntu-24.04

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ======================================================
      # 检查最新 OpenWrt 25.12.x
      # ======================================================

      - name: Check latest OpenWrt release

        id: check

        shell: bash

        run: |

          set -e


          echo
          echo "=========================================="
          echo "Checking OpenWrt 25.12.x"
          echo "=========================================="


          # --------------------------------------------------
          # 获取最新 25.12.x
          # --------------------------------------------------

          LATEST="$(
            git ls-remote \
              --tags \
              https://github.com/openwrt/openwrt.git \
              'refs/tags/v25.12.*' |
            sed 's#.*refs/tags/v##' |
            grep -E '^25\.12\.[0-9]+$' |
            sort -V |
            tail -1
          )"


          # --------------------------------------------------
          # 检查是否成功获取版本
          # --------------------------------------------------

          if [ -z "${LATEST}" ]; then

            echo
            echo "ERROR:"
            echo "Cannot determine latest OpenWrt 25.12.x release."

            exit 1

          fi


          echo
          echo "Latest OpenWrt:"
          echo "${LATEST}"


          # ==================================================
          # 读取当前版本
          # ==================================================

          CURRENT=""

          if [ -f openwrt-version ]; then

            CURRENT="$(
              tr -d '[:space:]' < openwrt-version
            )"

          fi


          echo
          echo "Current OpenWrt:"
          echo "${CURRENT:-none}"


          # ==================================================
          # 比较版本
          # ==================================================

          if [ "${LATEST}" = "${CURRENT}" ]; then

            echo
            echo "=========================================="
            echo "No new OpenWrt release."
            echo "Nothing to build."
            echo "=========================================="


            echo "OPENWRT_CHANGED=false" >> "$GITHUB_OUTPUT"


            exit 0

          fi


          # ==================================================
          # 检测到新版本
          # ==================================================

          echo
          echo "=========================================="
          echo "New OpenWrt release detected!"
          echo "=========================================="


          echo
          echo "Old:"
          echo "${CURRENT:-none}"


          echo
          echo "New:"
          echo "${LATEST}"


          # ==================================================
          # 更新版本文件
          # ==================================================

          printf '%s\n' "${LATEST}" > openwrt-version


          # ==================================================
          # 输出 GitHub Actions 环境变量
          # ==================================================

          echo "OPENWRT_CHANGED=true" >> "$GITHUB_OUTPUT"

          echo "OPENWRT_VERSION=${LATEST}" >> "$GITHUB_OUTPUT"


          echo
          echo "Version file updated."


      # ======================================================
      # 提交新版本
      # ======================================================

      - name: Commit new version

        if: steps.check.outputs.OPENWRT_CHANGED == 'true'

        shell: bash

        run: |

          set -e


          echo
          echo "=========================================="
          echo "Commit OpenWrt version update"
          echo "=========================================="


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add openwrt-version


          git commit \
            -m "chore: update OpenWrt version to ${{ steps.check.outputs.OPENWRT_VERSION }}"


          git push


          echo
          echo "Version committed successfully."


      # ======================================================
      # 触发编译
      # ======================================================

      - name: Trigger build

        if: steps.check.outputs.OPENWRT_CHANGED == 'true'

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |

          set -e


          echo
          echo "=========================================="
          echo "Trigger OpenWrt build"
          echo "=========================================="


          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type="openwrt-release" \
            -f "client_payload[openwrt_version]=${{ steps.check.outputs.OPENWRT_VERSION }}"


          echo
          echo "Build triggered successfully."


          echo
          echo "OpenWrt version:"
          echo "${{ steps.check.outputs.OPENWRT_VERSION }}"
