name: Check OpenWrt upstream

on:

  schedule:
    # 每天北京时间 10:30
    - cron: "30 2 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  check:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ==========================================================
      # 检查 OpenWrt 最新 25.12.x
      # ==========================================================

      - name: Check latest OpenWrt release
        id: check
        shell: bash
        run: |

          LATEST="$(
            git ls-remote \
              --tags \
              https://github.com/openwrt/openwrt.git \
              'refs/tags/v25.12.*' |
            sed 's#.*refs/tags/v##' |
            grep -E '^25\.12\.[0-9]+$' |
            sort -V |
            tail -1
          )"


          if [ -z "${LATEST}" ]; then

            echo "Cannot determine latest OpenWrt version."

            exit 1

          fi


          echo "Latest OpenWrt: ${LATEST}"


          CURRENT=""


          if [ -f openwrt-version ]; then
            CURRENT="$(cat openwrt-version)"
          fi


          echo "Current version: ${CURRENT}"


          if [ "${LATEST}" = "${CURRENT}" ]; then

            echo "OPENWRT_CHANGED=false" >> "$GITHUB_OUTPUT"

            echo
            echo "No new OpenWrt release."
            echo "Nothing to build."

            exit 0

          fi


          echo "${LATEST}" > openwrt-version


          echo "OPENWRT_CHANGED=true" >> "$GITHUB_OUTPUT"

          echo "OPENWRT_VERSION=${LATEST}" >> "$GITHUB_OUTPUT"


          echo
          echo "=========================================="
          echo "New OpenWrt release detected!"
          echo
          echo "Old: ${CURRENT:-none}"
          echo "New: ${LATEST}"
          echo "=========================================="


      # ==========================================================
      # 保存版本
      # ==========================================================

      - name: Commit new version
        if: steps.check.outputs.OPENWRT_CHANGED == 'true'
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add openwrt-version


          git commit \
            -m "chore: update OpenWrt version to ${{ steps.check.outputs.OPENWRT_VERSION }}"


          git push


      # ==========================================================
      # 触发编译
      # ==========================================================

      - name: Trigger build
        if: steps.check.outputs.OPENWRT_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type="openwrt-release" \
            -f client_payload[openwrt_version]="${{ steps.check.outputs.OPENWRT_VERSION }}"

          echo
          echo "Build triggered."
