name: Trigger OpenWrt build once

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch 4G formal build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-x86-64.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f openwrt_version=25.12.5 \
            -f rootfs_size=4G \
            -f filesystem=ext4 \
            -f qcow2=true \
            -f publish=true
