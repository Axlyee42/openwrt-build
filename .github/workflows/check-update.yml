name: Check OpenWrt version

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest stable OpenWrt tag
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote --tags https://github.com/openwrt/openwrt.git 'refs/tags/v*' \
            | awk -F/ '{print $3}' \
            | sed 's/\^{}//' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)"
          test -n "$latest"
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          echo "Latest stable OpenWrt: ${latest#v}"

      - name: Compare with recorded version
        id: compare
        env:
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          current="$(cat latest-version.txt 2>/dev/null || true)"
          echo "current=$current"
          echo "latest=$LATEST"
          if [ "$current" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record new version
        if: steps.compare.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LATEST" > latest-version.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-version.txt
          git commit -m "chore: update OpenWrt version to ${LATEST}"
          git push

      - name: Trigger build for new version
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          gh workflow run build-x86-64.yml \
            --ref main \
            -f openwrt_version="$VERSION" \
            -f rootfs_size='1G'
