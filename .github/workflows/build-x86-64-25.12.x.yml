name: Build 25.12.x x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空使用最新版本"
        required: false
        default: ""
        type: string
      custom_router_ip:
        description: "请设置路由器的管理地址（多网口路由器有效）"
        required: true
        default: "192.168.1.2"
        type: string
      rootfs_size:
        description: "选择软件包空间大小"
        required: true
        default: "4G"
        type: choice
        options: ["1G", "2G", "3G", "4G"]
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]
      pppoe_account:
        description: "宽带账号（若启用PPPoE）"
        required: false
        default: ""
        type: string
      pppoe_password:
        description: "宽带密码（若启用PPPoE）"
        required: false
        default: ""
        type: string
      bios:
        description: "生成 BIOS EXT4"
        required: true
        default: false
        type: boolean
      uefi:
        description: "生成 UEFI EXT4"
        required: true
        default: true
        type: boolean
      qcow2:
        description: "生成 QCOW2"
        required: true
        default: true
        type: boolean
      vmdk:
        description: "生成 VMDK"
        required: true
        default: false
        type: boolean
      raw:
        description: "生成 RAW"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: openwrt-25.12-x86-64
  cancel-in-progress: false

env:
  OPENWRT_BRANCH: "25.12"
  DEFAULT_LAN_IP: "192.168.1.2"
  DEFAULT_ROOTFS_SIZE: "4G"

jobs:
  check-version:
    name: Check latest OpenWrt 25.12.x
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check OpenWrt version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git | grep -oE 'refs/tags/v25[.]12[.][0-9]+$' | sed 's#refs/tags/v##' | sort -V | tail -n 1)"
          [ -n "$latest" ] || { echo "ERROR: cannot determine latest OpenWrt 25.12.x"; exit 1; }
          requested="${{ inputs.openwrt_version }}"
          last=""
          [ -f openwrt-version ] && last="$(tr -d '[:space:]' < openwrt-version)"
          version="${requested:-$latest}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then should_build=true; else
            if [ -z "$last" ] || [ "$last" != "$latest" ]; then should_build=true; else should_build=false; fi
          fi
          printf '%s\n' "$version" | grep -Eq '^25[.]12[.][0-9]+$' || { echo "ERROR: invalid OpenWrt version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "Latest: $latest"
          echo "Last built: ${last:-none}"
          echo "Selected: $version"
          echo "Should build: $should_build"

  build:
    name: Build OpenWrt with official ImageBuilder
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    env:
      OPENWRT_VERSION: ${{ needs.check-version.outputs.version }}
      LAN_IP: ${{ inputs.custom_router_ip || '192.168.1.2' }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size || '4G' }}
      ENABLE_PPPOE: ${{ inputs.enable_pppoe || 'no' }}
      PPPOE_ACCOUNT: ${{ inputs.pppoe_account || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl git qemu-utils zstd xz-utils gzip tar unzip openssl python3
      - name: Mask PPPoE password
        shell: bash
        env:
          PPPOE_PASSWORD: ${{ inputs.pppoe_password || '' }}
        run: |
          echo "::add-mask::${PPPOE_PASSWORD}"
      - name: Validate PPPoE Inputs
        shell: bash
        env:
          PPPOE_PASSWORD: ${{ inputs.pppoe_password || '' }}
        run: |
          set -euo pipefail
          if [ "$ENABLE_PPPOE" = "yes" ] && { [ -z "$PPPOE_ACCOUNT" ] || [ -z "$PPPOE_PASSWORD" ]; }; then
            echo "ERROR: PPPoE account and password must be provided when PPPoE is enabled."
            exit 1
          fi
      - name: Prepare ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          archive="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$base/$archive" -o "$archive"
          curl -fL "$base/sha256sums" -o sha256sums
          checksum="$(awk -v f="$archive" '$NF == f || $NF == ("*" f) {print $1; exit}' sha256sums)"
          [ -n "$checksum" ] || { echo "ERROR: checksum entry not found for $archive"; exit 1; }
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          [ "$actual" = "$checksum" ] || { echo "ERROR: checksum mismatch for $archive"; exit 1; }
          rm -rf imagebuilder
          mkdir -p imagebuilder
          tar --use-compress-program=unzstd -xf "$archive" -C imagebuilder --strip-components=1
          test -f imagebuilder/Makefile
          test -x imagebuilder/staging_dir/host/bin/apk
      - name: Show ImageBuilder information
        working-directory: imagebuilder
        shell: bash
        run: make info
      - name: Validate custom APK manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f shell/apk-custom-packages.sh
          bash -n shell/apk-custom-packages.sh
          CUSTOM_PACKAGES=""
          source shell/apk-custom-packages.sh
          printf '%s\n' "$CUSTOM_PACKAGES"
          for required in geoview xray-core sing-box hysteria; do
            printf '%s\n' "$CUSTOM_PACKAGES" | grep -qw "$required" || { echo "ERROR: required default package missing: $required"; exit 1; }
          done
      - name: Prepare network settings
        shell: bash
        env:
          PPPOE_PASSWORD: ${{ inputs.pppoe_password || '' }}
        run: |
          set -euo pipefail
          mkdir -p imagebuilder/files/etc/config
          printf '%s\n' "$LAN_IP" > imagebuilder/files/etc/config/custom_router_ip.txt
          cat > imagebuilder/files/etc/config/pppoe-settings <<EOF
          enable_pppoe='$ENABLE_PPPOE'
          pppoe_account='$PPPOE_ACCOUNT'
          pppoe_password='$PPPOE_PASSWORD'
          EOF
          chmod 0600 imagebuilder/files/etc/config/pppoe-settings
      - name: Build with ImageBuilder
        working-directory: imagebuilder
        shell: bash
        env:
          LAN_IP: ${{ env.LAN_IP }}
          PROFILE_INPUT: ${{ env.ROOTFS_SIZE }}
          ENABLE_PPPOE: ${{ env.ENABLE_PPPOE }}
          PPPOE_ACCOUNT: ${{ env.PPPOE_ACCOUNT }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password || '' }}
        run: |
          set -euo pipefail
          case "$PROFILE_INPUT" in 1G) PROFILE=1024;; 2G) PROFILE=2048;; 3G) PROFILE=3072;; 4G) PROFILE=4096;; *) echo "ERROR: invalid ROOTFS_SIZE: $PROFILE_INPUT"; exit 1;; esac
          export PROFILE LAN_IP ENABLE_PPPOE PPPOE_ACCOUNT PPPOE_PASSWORD
          chmod +x "$GITHUB_WORKSPACE/x86-64/build25.sh"
          bash "$GITHUB_WORKSPACE/x86-64/build25.sh"
      - name: Verify build output
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail
          out="bin/targets/x86/64"
          test -d "$out"
          find "$out" -maxdepth 1 -type f -printf '%f\n' | sort
          if [ "${{ inputs.bios }}" = "true" ]; then test -n "$(find "$out" -maxdepth 1 -type f -name '*ext4-combined.img.gz' -print -quit)"; fi
          if [ "${{ inputs.uefi }}" = "true" ]; then test -n "$(find "$out" -maxdepth 1 -type f -name '*ext4-combined-efi.img.gz' -print -quit)"; fi
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          case "$ROOTFS_SIZE" in 1G) PARTSIZE=1024;; 2G) PARTSIZE=2048;; 3G) PARTSIZE=3072;; 4G) PARTSIZE=4096;; *) exit 1;; esac
          stamp="$(date -u '+%Y%m%d-%H%M%S')"
          release=release
          out=imagebuilder/bin/targets/x86/64
          mkdir -p "$release"
          bios="$(find "$out" -maxdepth 1 -type f -name '*ext4-combined.img.gz' -print -quit || true)"
          uefi="$(find "$out" -maxdepth 1 -type f -name '*ext4-combined-efi.img.gz' -print -quit || true)"
          if [ "${{ inputs.bios }}" = "true" ]; then cp "$bios" "$release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${stamp}-BIOS-ext4.img.gz"; fi
          if [ "${{ inputs.uefi }}" = "true" ]; then cp "$uefi" "$release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${stamp}-UEFI-ext4.img.gz"; fi
          if [ "${{ inputs.qcow2 }}" = "true" ] || [ "${{ inputs.vmdk }}" = "true" ] || [ "${{ inputs.raw }}" = "true" ]; then gzip -dc "$uefi" > /tmp/openwrt.raw; fi
          if [ "${{ inputs.qcow2 }}" = "true" ]; then qemu-img convert -f raw -O qcow2 /tmp/openwrt.raw "$release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${stamp}-UEFI.qcow2"; fi
          if [ "${{ inputs.vmdk }}" = "true" ]; then qemu-img convert -f raw -O vmdk /tmp/openwrt.raw "$release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${stamp}-UEFI.vmdk"; fi
          if [ "${{ inputs.raw }}" = "true" ]; then cp /tmp/openwrt.raw "$release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${stamp}-UEFI.raw"; fi

          CUSTOM_PACKAGES=""
          source "$GITHUB_WORKSPACE/shell/apk-custom-packages.sh"
          package_list="$(printf '%s\n' "$CUSTOM_PACKAGES" | tr ' ' '\n' | sed '/^$/d' | sort -u)"
          formats=""
          [ "${{ inputs.bios }}" = "true" ] && formats="${formats}BIOS EXT4, "
          [ "${{ inputs.uefi }}" = "true" ] && formats="${formats}UEFI EXT4, "
          [ "${{ inputs.qcow2 }}" = "true" ] && formats="${formats}QCOW2, "
          [ "${{ inputs.vmdk }}" = "true" ] && formats="${formats}VMDK, "
          [ "${{ inputs.raw }}" = "true" ] && formats="${formats}RAW, "
          formats="${formats%, }"

          {
            printf '%s\n' '# OpenWrt Custom x86-64'
            printf '%s\n' ''
            printf 'Version: %s\n' "$OPENWRT_VERSION"
            printf 'Build time (UTC): %s\n' "$(date -u '+%Y-%m-%d %H:%M:%S')"
            printf 'Build method: Official OpenWrt ImageBuilder\n'
            printf 'Target: x86/64 generic\n'
            printf 'Filesystem: EXT4\n'
            printf 'ROOTFS partition: %s MB (%s)\n' "$PARTSIZE" "$ROOTFS_SIZE"
            printf 'LAN IP: %s\n' "$LAN_IP"
            printf 'PPPoE enabled: %s\n' "$ENABLE_PPPOE"
            printf 'Generated formats: %s\n' "$formats"
            printf '%s\n' ''
            printf '%s\n' '## Third-party / custom APK packages'
            printf '%s\n' ''
            printf '%s\n' '```text'
            printf '%s\n' "$package_list"
            printf '%s\n' '```'
            printf '%s\n' ''
            printf '%s\n' 'Package source: shell/apk-custom-packages.sh'
            printf '%s\n' 'PassWall2: not included'
            printf '%s\n' ''
            printf '%s\n' '## Generated files'
            printf '%s\n' ''
            printf '%s\n' '```text'
            find "$release" -maxdepth 1 -type f -printf '%f\n' | sort
            printf '%s\n' '```'
          } > "$release/build-info.md"
          cp "$release/build-info.md" "$release/build-info.txt"
          (cd "$release" && sha256sum *.img.gz *.qcow2 *.vmdk *.raw 2>/dev/null > sha256sums || true)
          (cd "$release" && sha256sum build-info.md build-info.txt >> sha256sums)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ github.run_number }}
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 #${{ github.run_number }}"
          body_path: release/build-info.md
          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update openwrt-version
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$OPENWRT_VERSION" > openwrt-version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openwrt-version
          if git diff --cached --quiet; then
            echo "openwrt-version already current."
          else
            git commit -m "chore: update OpenWrt version to ${OPENWRT_VERSION}"
            git push
          fi
