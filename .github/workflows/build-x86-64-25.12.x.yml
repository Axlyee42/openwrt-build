name: Build 25.12.x x86-64

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
        type: string
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OPENWRT_VERSION: "25.12.5"
      IMAGEBUILDER_DIR: "${{ github.workspace }}/imagebuilder"
      CUSTOM_ROUTER_IP: "192.168.100.1"
      PROFILE_INPUT: "1G"
      INCLUDE_DOCKER: "yes"
      ENABLE_PPPOE: "no"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd curl wget git

      - name: Download official OpenWrt ImageBuilder
        run: |
          set -euo pipefail
          url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$url" -o /tmp/imagebuilder.tar.zst
          rm -rf "$IMAGEBUILDER_DIR"
          mkdir -p "$IMAGEBUILDER_DIR"
          tar --use-compress-program=unzstd -xf /tmp/imagebuilder.tar.zst -C "$IMAGEBUILDER_DIR" --strip-components=1
          test -f "$IMAGEBUILDER_DIR/Makefile"

      - name: Set executable permissions
        run: chmod +x "${{ github.workspace }}/x86-64/build25.sh"

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${IMAGEBUILDER_DIR}/files/etc/config"
          echo "${CUSTOM_ROUTER_IP}" > "${IMAGEBUILDER_DIR}/files/etc/config/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${CUSTOM_ROUTER_IP}"

      - name: Prepare PPPoE settings
        run: |
          mkdir -p "${IMAGEBUILDER_DIR}/files/etc/config"
          cat > "${IMAGEBUILDER_DIR}/files/etc/config/pppoe-settings" <<EOF
          enable_pppoe=${ENABLE_PPPOE}
          pppoe_account=
          pppoe_password=
          EOF

      - name: Enable Store integration
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_store == 'true' }}
        run: |
          printf '\nCUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"\n' >> shell/apk-custom-packages.sh
          echo "✅ 已追加 luci-app-store"

      - name: Install wukongdaily custom defaults
        run: |
          mkdir -p "${IMAGEBUILDER_DIR}/files/etc/uci-defaults"
          install -m 0755 files/etc/uci-defaults/99-custom.sh \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

      - name: Build OpenWrt x86-64 EFI 25.12.5
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROFILE_INPUT="${{ github.event.inputs.profile }}"
            CUSTOM_ROUTER_IP="${{ github.event.inputs.custom_router_ip }}"
            INCLUDE_DOCKER="${{ github.event.inputs.include_docker }}"
            ENABLE_PPPOE="${{ github.event.inputs.enable_pppoe }}"
            if [ "$ENABLE_PPPOE" = "yes" ]; then
              test -n "${{ github.event.inputs.pppoe_account }}"
              test -n "${{ github.event.inputs.pppoe_password }}"
            fi
            mkdir -p "${IMAGEBUILDER_DIR}/files/etc/config"
            printf '%s\n' "$CUSTOM_ROUTER_IP" > "${IMAGEBUILDER_DIR}/files/etc/config/custom_router_ip.txt"
            cat > "${IMAGEBUILDER_DIR}/files/etc/config/pppoe-settings" <<EOF
          enable_pppoe=${ENABLE_PPPOE}
          pppoe_account=${{ github.event.inputs.pppoe_account }}
          pppoe_password=${{ github.event.inputs.pppoe_password }}
          EOF
          fi

          case "$PROFILE_INPUT" in
            1G) PROFILE=1024 ;;
            2G) PROFILE=2048 ;;
            3G) PROFILE=3072 ;;
            4G) PROFILE=4096 ;;
            *) echo "Invalid profile: $PROFILE_INPUT"; exit 1 ;;
          esac
          export PROFILE INCLUDE_DOCKER ENABLE_PPPOE PPPOE_ACCOUNT PPPOE_PASSWORD
          cd "$IMAGEBUILDER_DIR"
          bash "${GITHUB_WORKSPACE}/x86-64/build25.sh"

      - name: Create info
        run: |
          cat > "${{ github.workspace }}/router-info.md" <<EOF
          ## 📡 路由器后台信息

          - 🏠 **后台地址**: ${CUSTOM_ROUTER_IP}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          - 🧩 **基础系统**: OpenWrt ${OPENWRT_VERSION} x86-64
          - 💾 **软件包空间**: ${PROFILE_INPUT}
          EOF

          if [ "${INCLUDE_DOCKER}" == "yes" ]; then
            echo -e "\n#### 默认带docker" >> "${{ github.workspace }}/router-info.md"
          else
            echo -e "\n#### 不带docker" >> "${{ github.workspace }}/router-info.md"
          fi

      - name: Upload OpenWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/imagebuilder/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
