name: Build OpenWrt 25.12.x x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt 25.12.x version (blank = latest)
        required: false
        default: ''
      rootfs_size:
        description: Rootfs size
        required: false
        type: choice
        options: [1G, 2G, 3G, 4G]
        default: 4G
      lan_ip:
        description: LAN management IP
        required: false
        default: 192.168.1.2
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: openwrt-25.12-x86-64
  cancel-in-progress: true

env:
  OPENWRT_VERSION: 25.12.5

jobs:
  check-version:
    name: Check latest OpenWrt 25.12.x
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check OpenWrt version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git | grep -oE 'refs/tags/v25[.]12[.][0-9]+$' | sed 's#refs/tags/v##' | sort -V | tail -n 1)"
          if [ -z "$latest" ]; then
            echo "ERROR: cannot determine latest OpenWrt 25.12.x"
            exit 1
          fi

          requested="${{ inputs.openwrt_version }}"
          last=""
          if [ -f openwrt-version ]; then
            last="$(tr -d '[:space:]' < openwrt-version)"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$requested" ]; then
            version="$requested"
            should_build=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="$latest"
            should_build=true
          elif [ -z "$last" ] || [ "$last" != "$latest" ]; then
            version="$latest"
            should_build=true
          else
            version="$latest"
            should_build=false
          fi

          if ! printf '%s\n' "$version" | grep -Eq '^25[.]12[.][0-9]+$'; then
            echo "ERROR: invalid OpenWrt version: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "Latest: $latest"
          echo "Last built: ${last:-none}"
          echo "Selected: $version"
          echo "Should build: $should_build"

  build:
    name: Build OpenWrt with official ImageBuilder
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    env:
      OPENWRT_VERSION: ${{ needs.check-version.outputs.version }}
      LAN_IP: ${{ inputs.lan_ip || '192.168.1.2' }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size || '4G' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl git qemu-utils zstd xz-utils gzip tar unzip openssl python3

      - name: Prepare ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          archive="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$base/$archive" -o "$archive"
          expected="313221253d9bac534e4a4ee6492a4941b4ba0f43200eceb8d16a4785470ae9df"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum -c -
          tar --zstd -xf "$archive"
          mv "openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64" imagebuilder
          cd imagebuilder
          make info

      - name: Validate custom APK manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f shell/apk-custom-packages.sh
          bash -n shell/apk-custom-packages.sh
          source shell/apk-custom-packages.sh
          printf 'Selected third-party APKs: %s\n' "${CUSTOM_PACKAGES:-none}"

      - name: Build with ImageBuilder
        working-directory: imagebuilder
        shell: bash
        env:
          LAN_IP: ${{ env.LAN_IP }}
          PROFILE_INPUT: ${{ env.ROOTFS_SIZE }}
        run: |
          set -euo pipefail
          case "$PROFILE_INPUT" in
            1G) PROFILE=1024 ;;
            2G) PROFILE=2048 ;;
            3G) PROFILE=3072 ;;
            4G) PROFILE=4096 ;;
            *) echo "ERROR: invalid ROOTFS_SIZE: $PROFILE_INPUT"; exit 1 ;;
          esac
          export PROFILE LAN_IP
          chmod +x "$GITHUB_WORKSPACE/x86-64/build25.sh"
          bash "$GITHUB_WORKSPACE/x86-64/build25.sh"

      - name: Verify build output
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail
          out="bin/targets/x86/64"
          test -d "$out"
          find "$out" -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find "$out" -maxdepth 1 -type f -name '*ext4-combined.img.gz' -print -quit)"
          test -n "$(find "$out" -maxdepth 1 -type f -name '*ext4-combined-efi.img.gz' -print -quit)"

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d)"
          mkdir -p release
          out="imagebuilder/bin/targets/x86/64"
          for f in "$out"/*ext4-combined.img.gz "$out"/*ext4-combined-efi.img.gz "$out"/*.qcow2 "$out"/*.vmdk "$out"/*.img.gz; do
            [ -f "$f" ] || continue
            cp -f "$f" "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${stamp}-$(basename "$f")"
          done
          cp -f openwrt-version release/ 2>/dev/null || true
          cat > release/build-info.txt <<EOF
OpenWrt: ${OPENWRT_VERSION}
Target: x86-64
ImageBuilder: official
APK format: APKv3
Third-party APKs: opt-in via shell/apk-custom-packages.sh
HomeProxy fork: szwjp/homeproxy (when enabled)
sing-box: 1.14.0 bundled for HomeProxy (when enabled)
Build date UTC: ${stamp}
EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ github.run_number }}
          name: OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ github.run_number }}
          generate_release_notes: true
          files: release/*

      - name: Update openwrt-version
        shell: bash
        run: |
          printf '%s\n' "$OPENWRT_VERSION" > openwrt-version
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add openwrt-version
          git diff --cached --quiet || git commit -m "chore: record OpenWrt $OPENWRT_VERSION"
          git push
