name: Fix build25 local APK workaround

on:
  push:
    paths:
      - shell/apk-custom-packages.sh

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Patch build25.sh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('x86-64/build25.sh')
          text = path.read_text()
          old = '''replacement = (\n    "\\t# OPENWRT_BUILD_LOCAL_APK_WORKAROUND\\n"\n    "\\tLOCAL_APK_FILES := " + local_apks + "\\n"\n    "\\t$(APK) add --arch $(ARCH_PACKAGES) --no-scripts " + filtered + " $(LOCAL_APK_FILES)"\n)'''
          new = '''replacement = (\n    "\\t# OPENWRT_BUILD_LOCAL_APK_WORKAROUND\\n"\n    "\\t$(APK) add --arch $(ARCH_PACKAGES) --no-scripts " + filtered + " " + local_apks\n)'''
          if old not in text:
              if '"\\tLOCAL_APK_FILES := " + local_apks' not in text:
                  raise SystemExit('build25.sh is already patched or has unexpected workaround syntax')
              raise SystemExit('expected workaround block not found exactly')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- x86-64/build25.sh; then
            echo 'No build25.sh change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x86-64/build25.sh
          git commit -m 'fix: correct local APK ImageBuilder workaround'
          git push
