name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本（留空使用 latest-version.txt）'
        required: false
        default: ''
        type: string
      lan_ip:
        description: 'LAN 默认 IP 地址'
        required: true
        default: '192.168.1.2'
        type: string
      rootfs_size:
        description: '根文件系统大小'
        required: true
        default: '4G'
        type: choice
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
  workflow_call:
    inputs:
      openwrt_version:
        required: false
        type: string
      lan_ip:
        required: false
        type: string
        default: '192.168.1.2'
      rootfs_size:
        required: false
        type: string
        default: '4G'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve OpenWrt version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.openwrt_version || github.event.inputs.openwrt_version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(cat latest-version.txt)"
          fi
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve LAN IP
        id: network
        shell: bash
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip || github.event.inputs.lan_ip }}
        run: |
          set -euo pipefail
          lan_ip="${INPUT_LAN_IP:-192.168.1.2}"
          python3 - "$lan_ip" <<'PY'
          import ipaddress, sys
          ip = ipaddress.ip_address(sys.argv[1])
          if ip.version != 4:
              raise SystemExit('LAN IP must be an IPv4 address')
          print(f'lan_ip={ip}')
          PY
          echo "lan_ip=$lan_ip" >> "$GITHUB_OUTPUT"

      - name: Download official OpenWrt ImageBuilder
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y zstd
          url="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$url" -o imagebuilder.tar.zst
          mkdir imagebuilder
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1

      - name: Prepare PassWall and DAED feeds
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x shell/prepare-feeds.sh
          shell/prepare-feeds.sh "$VERSION" "$(pwd)/imagebuilder" "$(pwd)/imagebuilder/files"

      - name: Prepare default system and network settings
        env:
          LAN_IP: ${{ steps.network.outputs.lan_ip }}
        run: |
          set -euo pipefail
          mkdir -p imagebuilder/files/etc/config imagebuilder/files/etc/uci-defaults

          cat > imagebuilder/files/etc/config/system <<'EOF'
          config system
                  option hostname 'OpenWrt'
                  option timezone 'CST-8'
                  option zonename 'Asia/Shanghai'
          EOF

          cat > imagebuilder/files/etc/config/network <<EOF
          config interface 'loopback'
                  option device 'lo'
                  option proto 'static'
                  option ipaddr '127.0.0.1'
                  option netmask '255.0.0.0'

          config device
                  option name 'br-lan'
                  option type 'bridge'

          config interface 'lan'
                  option device 'br-lan'
                  option proto 'static'
                  option ipaddr '${LAN_IP}'
                  option netmask '255.255.255.0'
          EOF

          cat > imagebuilder/files/etc/uci-defaults/99-default-locale <<'EOF'
          #!/bin/sh
          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci
          exit 0
          EOF
          chmod 0755 imagebuilder/files/etc/uci-defaults/99-default-locale

      - name: Resolve selected APK packages
        run: |
          set -euo pipefail
          chmod +x shell/apk-custom-packages.sh
          PACKAGES="$(shell/apk-custom-packages.sh)"
          printf '%s\n' "$PACKAGES" > selected-packages.txt
          echo "Selected packages:"
          echo "$PACKAGES"

      - name: Build UEFI EXT4 image
        env:
          ROOTFS_SIZE: ${{ inputs.rootfs_size || github.event.inputs.rootfs_size }}
        run: |
          set -euo pipefail
          case "${ROOTFS_SIZE:-4G}" in
            1G) size=1024 ;;
            2G) size=2048 ;;
            3G) size=3072 ;;
            4G) size=4096 ;;
            *) echo 'Invalid rootfs size'; exit 1 ;;
          esac
          cd imagebuilder
          make image \
            PROFILE='generic' \
            PACKAGES="$(cat ../selected-packages.txt)" \
            FILES='files' \
            ROOTFS_PARTSIZE="$size"

      - name: Prepare compressed IMG
        run: |
          set -euo pipefail
          src=$(find imagebuilder/bin/targets/x86/64 -type f -name '*ext4-combined-efi.img.gz' | head -1)
          test -n "$src"
          gzip -dc "$src" | gzip -9 -c > openwrt-x86-64-ext4-uefi.img.gz
          test -s openwrt-x86-64-ext4-uefi.img.gz

      - name: Create QCOW2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y qemu-utils
          src=$(find imagebuilder/bin/targets/x86/64 -type f -name '*ext4-combined-efi.img.gz' | head -1)
          test -n "$src"
          gzip -dc "$src" > /tmp/openwrt-x86-64-ext4-uefi.img
          qemu-img convert -f raw -O qcow2 -c \
            /tmp/openwrt-x86-64-ext4-uefi.img openwrt-x86-64.qcow2
          rm -f /tmp/openwrt-x86-64-ext4-uefi.img

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LAN_IP: ${{ steps.network.outputs.lan_ip }}
          ROOTFS_SIZE: ${{ inputs.rootfs_size || github.event.inputs.rootfs_size }}
        run: |
          set -euo pipefail
          {
            echo "# OpenWrt ${VERSION} x86-64 固件"
            echo
            echo "## 基础信息"
            echo
            echo "- 基础系统：OpenWrt 官方 ImageBuilder"
            echo "- 目标平台：x86-64"
            echo "- 固件格式：UEFI + EXT4"
            echo "- 虚拟机格式：QCOW2"
            echo "- 根文件系统：${ROOTFS_SIZE:-4G}"
            echo "- 默认 LAN 地址：${LAN_IP}"
            echo "- 默认语言：简体中文"
            echo "- 默认时区：中国标准时间（Asia/Shanghai）"
            echo
            echo "## 第三方软件源"
            echo
            echo "- PassWall APK 源：已加入"
            echo "- DAE / DAED APK 源：已加入"
            echo
            echo "## 固件文件"
            echo
            echo "- UEFI EXT4 压缩镜像：openwrt-x86-64-ext4-uefi.img.gz"
            echo "- QCOW2：openwrt-x86-64.qcow2"
            echo
            echo "## 本次额外选择的软件包"
            echo
            if ./scripts/release-package-list.sh selected-packages.txt | grep -q .; then
              ./scripts/release-package-list.sh selected-packages.txt | while IFS= read -r pkg; do
                echo "- \`$pkg\`"
              done
            else
              echo "- 无（仅使用默认基础组件）"
            fi
          } > release-notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-${{ steps.version.outputs.version }}
          name: OpenWrt ${{ steps.version.outputs.version }} x86-64
          body_path: release-notes.md
          files: |
            openwrt-x86-64-ext4-uefi.img.gz
            openwrt-x86-64.qcow2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}