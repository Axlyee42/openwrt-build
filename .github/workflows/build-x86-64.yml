name: Build OpenWrt x86-64

on:

  workflow_dispatch:

    inputs:

      openwrt_version:
        description: "OpenWrt 25.12.x version，留空自动使用最新 25.12.x"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "RootFS / 固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

      bios:
        description: "生成 BIOS 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2 虚拟机镜像"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK 虚拟机镜像"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW 镜像"
        required: true
        default: false
        type: boolean


  repository_dispatch:

    types:
      - openwrt-release


permissions:

  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 确定 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:

          MANUAL_VERSION: ${{ inputs.openwrt_version }}

          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |

          set -euo pipefail


          VERSION="${MANUAL_VERSION:-}"


          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi


          # ------------------------------------------------------
          # 如果没有手动指定版本
          # 自动获取最新 25.12.x
          # ------------------------------------------------------

          if [ -z "${VERSION}" ]; then

            echo
            echo "Detecting latest OpenWrt 25.12.x..."
            echo


            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"

          fi


          # ------------------------------------------------------
          # 检查版本号
          # ------------------------------------------------------

          if ! echo "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then

            echo
            echo "ERROR: Invalid OpenWrt version:"
            echo "${VERSION}"
            echo

            exit 1

          fi


          # ------------------------------------------------------
          # 获取对应 commit
          # ------------------------------------------------------

          COMMIT="$(
            git ls-remote \
              https://github.com/openwrt/openwrt.git \
              "refs/tags/v${VERSION}" |
            awk '{print $1}'
          )"


          if [ -z "${COMMIT}" ]; then

            echo
            echo "ERROR: Cannot find OpenWrt commit."
            echo

            exit 1

          fi


          # ------------------------------------------------------
          # 输出环境变量
          # ------------------------------------------------------

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          echo "OPENWRT_COMMIT=${COMMIT}" >> "${GITHUB_ENV}"

          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "${GITHUB_ENV}"

          echo "BUILD_TIME=$(date -u +%H%M%S)" >> "${GITHUB_ENV}"


          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "OpenWrt commit  : ${COMMIT}"
          echo "=========================================="
          echo


      # ==========================================================
      # RootFS 大小
      # ==========================================================

      - name: Configure RootFS
        shell: bash
        run: |

          set -euo pipefail


          SIZE="${{ inputs.rootfs_size }}"


          case "${SIZE}" in

            1G)

              PARTSIZE=1024

              ;;

            2G)

              PARTSIZE=2048

              ;;

            3G)

              PARTSIZE=3072

              ;;

            4G)

              PARTSIZE=4096

              ;;

            *)

              echo "ERROR: Invalid RootFS size."

              exit 1

              ;;

          esac


          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"

          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"


          echo
          echo "RootFS size:"
          echo "${SIZE}"

          echo
          echo "RootFS partition size:"
          echo "${PARTSIZE} MB"


      # ==========================================================
      # 安装编译依赖
      # ==========================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update


          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar


      # ==========================================================
      # Clone OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        run: |

          set -euo pipefail


          git clone \
            https://github.com/openwrt/openwrt.git \
            openwrt


          cd openwrt


          git checkout "${OPENWRT_COMMIT}"


          echo
          echo "=========================================="
          echo "OpenWrt source"
          echo "=========================================="

          git describe --always --tags

          git status


      # ==========================================================
      # PassWall feeds
      # ==========================================================

      - name: Configure PassWall feeds
        working-directory: openwrt
        run: |

          set -euo pipefail


          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          EOF


      # ==========================================================
      # 更新官方 + PassWall feeds
      # ==========================================================

      - name: Update feeds
        working-directory: openwrt
        run: |

          set -euo pipefail


          ./scripts/feeds update -a


          ./scripts/feeds install -a


      # ==========================================================
      # 添加第三方 packages
      #
      # 统一由：
      #
      # shell/apk-custom-packages.sh
      #
      # 负责
      # ==========================================================

      - name: Add custom packages
        working-directory: openwrt
        shell: bash
        run: |

          set -euo pipefail


          chmod +x \
            ../shell/apk-custom-packages.sh


          ../shell/apk-custom-packages.sh


      # ==========================================================
      # 生成基础 .config
      # ==========================================================

      - name: Generate configuration
        working-directory: openwrt
        run: |

          set -euo pipefail


          cat > .config <<EOF

          # ======================================================
          # Target
          # ======================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y


          # ======================================================
          # RootFS
          # ======================================================

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}


          # ======================================================
          # BIOS / UEFI
          # ======================================================

          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y


          # ======================================================
          # LuCI
          # ======================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          # ======================================================
          # Package Manager
          # ======================================================

          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y


          # ======================================================
          # mwan3
          # ======================================================

          CONFIG_PACKAGE_luci-app-mwan3=y


          # ======================================================
          # UPnP
          # ======================================================

          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y


          # ======================================================
          # ttyd
          # ======================================================

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y


          # ======================================================
          # PPPoE
          # ======================================================

          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y


          # ======================================================
          # IPv6
          # ======================================================

          CONFIG_PACKAGE_luci-proto-ipv6=y

          CONFIG_PACKAGE_ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y


          # ======================================================
          # PassWall
          # ======================================================

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_hysteria=y

          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y


          # ======================================================
          # OpenClash
          # ======================================================

          CONFIG_PACKAGE_luci-app-openclash=y


          # ======================================================
          # NFT
          # ======================================================

          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y


          # ======================================================
          # Aurora
          # ======================================================

          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y
          CONFIG_PACKAGE_luci-i18n-aurora-config-zh-cn=y


          # ======================================================
          # Shadcn
          # ======================================================

          CONFIG_PACKAGE_luci-theme-shadcn=y


          # ======================================================
          # Bandix
          # ======================================================

          CONFIG_PACKAGE_bandix=y
          CONFIG_PACKAGE_luci-app-bandix=y
          CONFIG_PACKAGE_luci-i18n-bandix-zh-cn=y


          # ======================================================
          # luci-app-run
          # ======================================================

          CONFIG_PACKAGE_luci-app-run=y


          # ======================================================
          # FileBrowser
          # ======================================================

          CONFIG_PACKAGE_filebrowser=y
          CONFIG_PACKAGE_luci-app-filebrowser-go=y
          CONFIG_PACKAGE_luci-i18n-filebrowser-go-zh-cn=y


          # ======================================================
          # VLMCSd
          # ======================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y


          # ======================================================
          # Timewol
          # ======================================================

          CONFIG_PACKAGE_luci-app-timewol=y
          CONFIG_PACKAGE_luci-i18n-timewol-zh-cn=y


          # ======================================================
          # Autoreboot
          # ======================================================

          CONFIG_PACKAGE_luci-app-autoreboot=y
          CONFIG_PACKAGE_luci-i18n-autoreboot-zh-cn=y

          EOF


          echo
          echo "=========================================="
          echo "Running make defconfig"
          echo "=========================================="
          echo


          make defconfig


      # ==========================================================
      # 显示最终配置
      # ==========================================================

      - name: Show selected packages
        working-directory: openwrt
        run: |

          echo
          echo "=========================================="
          echo "Selected packages"
          echo "=========================================="
          echo


          grep '^CONFIG_PACKAGE_' .config |
            grep -E \
            'luci|passwall|openclash|aurora|shadcn|bandix|filebrowser|vlmcsd|timewol|autoreboot|xray|sing-box|hysteria|v2ray' \
            || true


      # ==========================================================
      # 检查关键依赖
      #
      # 这里不再检查语言包是否出现在 .config
      #
      # 只检查真正会导致编译失败的后端依赖
      # ==========================================================

      - name: Check custom package dependencies
        working-directory: openwrt
        shell: bash
        run: |

          set -euo pipefail


          echo
          echo "=========================================="
          echo "Checking custom packages"
          echo "=========================================="
          echo


          REQUIRED_FILES="

          package/custom/filebrowser/Makefile
          package/custom/luci-app-filebrowser-go/Makefile

          package/custom/vlmcsd/Makefile
          package/custom/luci-app-vlmcsd/Makefile

          "


          FAILED=0


          while IFS= read -r FILE; do

            [ -z "${FILE}" ] && continue


            if [ -f "${FILE}" ]; then

              echo "OK: ${FILE}"

            else

              echo "ERROR: Missing ${FILE}"

              FAILED=1

            fi

          done <<< "${REQUIRED_FILES}"


          if [ "${FAILED}" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "ERROR: Required custom package missing."
            echo "=========================================="

            exit 1

          fi


          echo
          echo "All required custom packages are present."


      # ==========================================================
      # 生成默认网络配置
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2~eth5 = LAN
      #
      # PPPoE 密码使用 GitHub Secrets
      #
      # WAN1_USER
      # WAN1_PASS
      # WAN2_USER
      # WAN2_PASS
      # ==========================================================

      - name: Generate network configuration
        env:

          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |

          set -euo pipefail


          if [ -z "${WAN1_USER}" ]; then

            echo "ERROR: WAN1_USER is empty."

            exit 1

          fi


          if [ -z "${WAN1_PASS}" ]; then

            echo "ERROR: WAN1_PASS is empty."

            exit 1

          fi


          if [ -z "${WAN2_USER}" ]; then

            echo "ERROR: WAN2_USER is empty."

            exit 1

          fi


          if [ -z "${WAN2_PASS}" ]; then

            echo "ERROR: WAN2_PASS is empty."

            exit 1

          fi


          LAN_IP="${{ inputs.lan_ip }}"


          if [ -z "${LAN_IP}" ]; then

            LAN_IP="192.168.1.2"

          fi


          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/network <<EOF

          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'


          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'


          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'


          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 'auto'


          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'


          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 'auto'


          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          EOF


      # ==========================================================
      # DHCP + IPv6 RA
      # ==========================================================

      - name: Generate DHCP configuration
        run: |

          set -euo pipefail


          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/dhcp <<'EOF'

          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'


          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'


          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'


          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'

          EOF


      # ==========================================================
      # 默认简体中文
      # ==========================================================

      - name: Set default language
        run: |

          set -euo pipefail


          mkdir -p \
            openwrt/files/etc/uci-defaults


          cat > openwrt/files/etc/uci-defaults/99-default-language <<'EOF'

          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'

          uci -q commit luci

          exit 0

          EOF


          chmod +x \
            openwrt/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # Build 信息
      # ==========================================================

      - name: Create build information
        run: |

          set -euo pipefail


          mkdir -p \
            openwrt/files/etc/openwrt-custom


          cat > openwrt/files/etc/openwrt-custom/build-info <<EOF

          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          OpenWrt Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC

          LAN:
          ${{ inputs.lan_ip }}

          eth0:
          WAN / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          Enabled

          EOF


      # ==========================================================
      # 下载源码包
      # ==========================================================

      - name: Download packages
        working-directory: openwrt
        run: |

          set -euo pipefail


          make download \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 编译
      # ==========================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |

          set -euo pipefail


          make \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 创建 Release 目录
      # ==========================================================

      - name: Prepare release directory
        run: |

          set -euo pipefail


          rm -rf release


          mkdir -p release


      # ==========================================================
      # BIOS 镜像
      # ==========================================================

      - name: Copy BIOS image
        if: inputs.bios
        run: |

          set -euo pipefail


          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined.img.gz' \
              ! -name '*efi*' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: BIOS image not found."

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1

          fi


          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-BIOS.img.gz"


      # ==========================================================
      # UEFI 镜像
      # ==========================================================

      - name: Copy UEFI image
        if: inputs.uefi
        run: |

          set -euo pipefail


          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI image not found."

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1

          fi


          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


      # ==========================================================
      # 准备 Raw
      #
      # QCOW2 / VMDK / RAW 都从 UEFI RAW 转换
      # ==========================================================

      - name: Prepare raw image
        if: inputs.qcow2 || inputs.vmdk || inputs.raw
        run: |

          set -euo pipefail


          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI image not found."

            exit 1

          fi


          gzip -dc \
            "${IMAGE}" \
            > openwrt.raw


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        if: inputs.qcow2
        run: |

          set -euo pipefail


          qemu-img convert \
            -f raw \
            -O qcow2 \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


      # ==========================================================
      # VMDK
      # ==========================================================

      - name: Create VMDK
        if: inputs.vmdk
        run: |

          set -euo pipefail


          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.vmdk"


      # ==========================================================
      # RAW
      # ==========================================================

      - name: Create RAW
        if: inputs.raw
        run: |

          set -euo pipefail


          cp \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.raw"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        run: |

          set -euo pipefail


          cd release


          sha256sum * \
            > sha256sums


      # ==========================================================
      # Release 信息
      # ==========================================================

      - name: Create release information
        run: |

          set -euo pipefail


          cat > release/build-info.txt <<EOF

          ==========================================
          OpenWrt Custom Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          OpenWrt commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME} UTC


          ==========================================
          Network
          ==========================================

          eth0 = WAN / PPPoE

          eth1 = WANB / PPPoE

          eth2 = LAN

          eth3 = LAN

          eth4 = LAN

          eth5 = LAN


          LAN IP:
          ${{ inputs.lan_ip }}


          IPv6:
          Enabled


          ==========================================
          Packages
          ==========================================

          LuCI
          Simplified Chinese
          LuCI Package Manager
          mwan3
          UPnP
          ttyd

          PassWall
          OpenClash

          Aurora
          Aurora Config
          Shadcn

          Bandix
          luci-app-run

          FileBrowser Go
          VLMCSd
          Timewol
          Autoreboot


          ==========================================

          EOF


      # ==========================================================
      # 显示最终文件
      # ==========================================================

      - name: Show release files
        run: |

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="
          echo


          ls -lh release


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ inputs.lan_ip }}`
            - IPv6: Enabled

            ## Included

            - LuCI
            - Simplified Chinese
            - LuCI Package Manager
            - mwan3
            - UPnP
            - ttyd
            - PassWall
            - OpenClash
            - Aurora
            - Aurora Config
            - Shadcn
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - VLMCSd
            - Timewol
            - Autoreboot

          files: |
            release/*

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
