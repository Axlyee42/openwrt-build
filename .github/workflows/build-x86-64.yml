name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x，留空使用 openwrt-version"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "RootFS 大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

  repository_dispatch:
    types:
      - openwrt-release

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # Resolve OpenWrt version
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi

          if [ -z "${VERSION}" ] && [ -f openwrt-version ]; then
            VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -n 1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" |
            grep -Eq '^25\.12\.[0-9]+$'
          then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=$(date +%H%M%S)" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt : ${VERSION}"
          echo "Date    : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="


      # ==========================================================
      # RootFS
      # ==========================================================

      - name: Configure RootFS
        shell: bash
        env:
          INPUT_SIZE: ${{ inputs.rootfs_size }}

        run: |
          set -euo pipefail

          SIZE="${INPUT_SIZE:-4G}"

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid RootFS size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS: ${SIZE}"
          echo "Partition: ${PARTSIZE} MB"


      # ==========================================================
      # LAN IP
      # ==========================================================

      - name: Configure LAN
        shell: bash
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}

        run: |
          set -euo pipefail

          LAN_IP="${INPUT_LAN_IP:-192.168.1.2}"

          if ! printf '%s\n' "${LAN_IP}" |
            grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
          then
            echo "ERROR: Invalid LAN IP: ${LAN_IP}"
            exit 1
          fi

          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"

          echo "LAN IP: ${LAN_IP}"


      # ==========================================================
      # PPPoE Secrets
      # ==========================================================

      - name: Validate PPPoE secrets
        shell: bash
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |
          set -euo pipefail

          for NAME in \
            WAN1_USER \
            WAN1_PASS \
            WAN2_USER \
            WAN2_PASS
          do
            if [ -z "${!NAME:-}" ]; then
              echo "ERROR: GitHub Secret ${NAME} is missing."
              exit 1
            fi
          done

          echo "PPPoE secrets are configured."


      # ==========================================================
      # Dependencies
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bash \
            curl \
            file \
            git \
            jq \
            qemu-utils \
            rsync \
            wget \
            zstd


      # ==========================================================
      # Download official OpenWrt ImageBuilder
      # ==========================================================

      - name: Download official ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${ARCHIVE}"

          echo
          echo "=========================================="
          echo "Downloading ImageBuilder"
          echo "=========================================="

          echo "${URL}"

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            "${URL}" \
            -O "${ARCHIVE}"

          rm -rf imagebuilder

          mkdir -p imagebuilder

          tar \
            --zstd \
            -xf "${ARCHIVE}" \
            --strip-components=1 \
            --no-same-owner \
            -C imagebuilder

          echo
          echo "ImageBuilder ready."

          ls -lah imagebuilder


      # ==========================================================
      # ImageBuilder info
      # ==========================================================

      - name: Check ImageBuilder
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          make info


      # ==========================================================
      # PassWall APK repository
      # ==========================================================

      - name: Configure PassWall repository
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f repositories ]; then
            echo "ERROR: ImageBuilder repositories file not found."
            exit 1
          fi

          PASSWALL_BASE="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64"

          cat >> repositories <<EOF

          ${PASSWALL_BASE}/passwall_luci/packages.adb
          ${PASSWALL_BASE}/passwall_packages/packages.adb
          ${PASSWALL_BASE}/passwall2/packages.adb
          EOF

          echo
          echo "Repositories:"
          cat repositories


      # ==========================================================
      # PassWall public key
      # ==========================================================

      - name: Install PassWall key
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p keys

          wget \
            --retry-connrefused \
            --tries=5 \
            https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub \
            -O keys/openwrt-passwall-build.pem

          echo "PassWall key installed."


      # ==========================================================
      # 下载 wukongdaily APK 仓库
      #
      # 注意：
      # 25.12 x86-64 在该仓库中对应 run/x86/
      # ==========================================================

      - name: Download wukongdaily APK repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third-party-apk

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk

          if [ ! -d third-party-apk/run/x86 ]; then
            echo "ERROR: third-party-apk/run/x86 not found."
            exit 1
          fi

          echo
          echo "wukongdaily x86 packages:"
          find third-party-apk/run/x86 \
            -type f \
            -name "*.apk" \
            -printf "%P\n" |
          sort


      # ==========================================================
      # 使用 wukongdaily 官方脚本准备 APK
      #
      # 这部分直接按照它自己的 build25.sh + apk-prepare-packages.sh
      # 的逻辑来，而不是再自己猜 APK 路径。
      # ==========================================================

      - name: Prepare wukongdaily x86 APK packages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            extra-packages \
            imagebuilder/packages

          mkdir -p \
            extra-packages \
            imagebuilder/packages

          cp -a \
            third-party-apk/run/x86/. \
            extra-packages/

          cat > /tmp/apk-prepare-packages.sh <<'EOF'
          #!/bin/sh

          set -eu

          BASE_DIR="extra-packages"
          TEMP_DIR="${BASE_DIR}/temp-unpack"
          TARGET_DIR="imagebuilder/packages"

          rm -rf \
            "${TEMP_DIR}" \
            "${TARGET_DIR}"

          mkdir -p \
            "${TEMP_DIR}" \
            "${TARGET_DIR}"

          # 1. 解压 .run
          for run_file in "${BASE_DIR}"/*.run; do
              [ -e "${run_file}" ] || continue

              echo "Extracting ${run_file}"

              sh "${run_file}" \
                --target "${TEMP_DIR}" \
                --noexec
          done

          # 2. 收集 .run 解压出来的 APK
          find "${TEMP_DIR}" \
            -type f \
            -name "*.apk" \
            -exec cp -v {} "${TARGET_DIR}/" \;

          # 3. 收集 extra-packages 一级子目录中的 APK
          find "${BASE_DIR}" \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name "*.apk" \
            ! -path "${TEMP_DIR}/*" \
            -exec cp -v {} "${TARGET_DIR}/" \;

          echo
          echo "Prepared APK packages:"
          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" |
          sort
          EOF

          chmod +x /tmp/apk-prepare-packages.sh

          /tmp/apk-prepare-packages.sh


      # ==========================================================
      # 检查 wukongdaily APK
      # ==========================================================

      - name: Verify wukongdaily packages
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "wukongdaily APK packages"
          echo "=========================================="

          find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" |
          sort


      # ==========================================================
      # OpenClash
      #
      # 这里不要求文件名出现 x86。
      # OpenClash 官方 Makefile 的 PKGARCH 是 all。
      #
      # GitHub Release 当前提供：
      # luci-app-openclash-*.apk
      # ==========================================================

      - name: Prepare OpenClash APK
        shell: bash
        run: |
          set -euo pipefail

          LOCAL="$(
            find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name 'luci-app-openclash-*.apk' \
              -print |
            sort -V |
            tail -n 1
          )"

          if [ -n "${LOCAL}" ]; then
            echo "OpenClash already provided by wukongdaily:"
            echo "${LOCAL}"
          else

            echo "Downloading OpenClash official APK..."

            curl \
              -fsSL \
              https://api.github.com/repos/vernesong/OpenClash/releases/latest \
              -o /tmp/openclash.json

            URL="$(
              jq -r '
                .assets[]
                | select(.name | endswith(".apk"))
                | select(.name | startswith("luci-app-openclash-"))
                | .browser_download_url
              ' /tmp/openclash.json |
              head -n 1
            )"

            if [ -z "${URL}" ]; then

              echo
              echo "ERROR: OpenClash APK not found."

              jq -r '.assets[].name' /tmp/openclash.json

              exit 1

            fi

            echo "OpenClash APK:"
            echo "${URL}"

            wget \
              --retry-connrefused \
              --tries=5 \
              --timeout=30 \
              "${URL}" \
              -P imagebuilder/packages
          fi


      # ==========================================================
      # OpenClash core
      #
      # 按 wukongdaily 的 build25.sh 工作方式，直接把
      # amd64 clash_meta 放进 files。
      # ==========================================================

      - name: Prepare OpenClash core
        shell: bash
        run: |
          set -euo pipefail

          if ! find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name 'luci-app-openclash-*.apk' |
            grep -q .
          then
            echo "ERROR: OpenClash APK was not prepared."
            exit 1
          fi

          mkdir -p \
            imagebuilder/files/etc/openclash/core

          META_URL="https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64-v1.tar.gz"

          echo "Downloading OpenClash clash_meta..."

          wget \
            -q \
            -O /tmp/clash_meta.tar.gz \
            "${META_URL}"

          tar \
            -xOzf \
            /tmp/clash_meta.tar.gz \
            > imagebuilder/files/etc/openclash/core/clash_meta

          chmod +x \
            imagebuilder/files/etc/openclash/core/clash_meta

          echo "OpenClash clash_meta installed."


      # ==========================================================
      # OpenClash GeoIP / GeoSite
      # ==========================================================

      - name: Prepare OpenClash geodata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            imagebuilder/files/etc/openclash

          wget \
            -q \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat \
            -O imagebuilder/files/etc/openclash/GeoIP.dat

          wget \
            -q \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat \
            -O imagebuilder/files/etc/openclash/GeoSite.dat

          test -s imagebuilder/files/etc/openclash/GeoIP.dat
          test -s imagebuilder/files/etc/openclash/GeoSite.dat


      # ==========================================================
      # 自定义 files
      # ==========================================================

      - name: Prepare custom files
        shell: bash
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |
          set -euo pipefail

          if [ -z "${WAN1_USER:-}" ] || [ -z "${WAN1_PASS:-}" ]; then
            echo "ERROR: WAN1_USER / WAN1_PASS is missing."
            exit 1
          fi

          if [ -z "${WAN2_USER:-}" ] || [ -z "${WAN2_PASS:-}" ]; then
            echo "ERROR: WAN2_USER / WAN2_PASS is missing."
            exit 1
          fi

          # 保留仓库已有 files 中的其它内容
          if [ -d files ]; then
            rsync -a \
              files/ \
              imagebuilder/files/
          fi

          mkdir -p \
            imagebuilder/files/etc/config \
            imagebuilder/files/etc/uci-defaults


          # ------------------------------------------------------
          # network
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/config/network <<EOF
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'

          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 '1'

          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 '1'

          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'
          EOF


          # ------------------------------------------------------
          # DHCP / IPv6
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/config/dhcp <<'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'

          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'

          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          EOF


          # ------------------------------------------------------
          # 默认中文
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/uci-defaults/99-default-language <<'EOF'
          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0
          EOF

          chmod +x \
            imagebuilder/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # 处理用户 package 清单
      # ==========================================================

      - name: Load custom package list
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f shell/apk-custom-packages.sh ]; then
            echo "ERROR: shell/apk-custom-packages.sh not found."
            exit 1
          fi

          source shell/apk-custom-packages.sh

          printf '%s\n' "${CUSTOM_PACKAGES:-}" \
            | tr ' ' '\n' \
            | sed '/^[[:space:]]*$/d' \
            > /tmp/user-packages


      # ==========================================================
      # 最终软件包列表
      #
      # 只加入我们已经有可靠来源的软件：
      #
      # 官方：
      #   LuCI
      #   PPPoE
      #   IPv6
      #   mwan3
      #   ttyd
      #   UPnP
      #
      # wukongdaily x86：
      #   Aurora
      #   Bandix
      #   luci-app-run
      #   以及它仓库中实际存在的包
      #
      # PassWall:
      #   外部 APK repo
      #
      # OpenClash:
      #   官方 APK
      #
      # FileBrowser/VLMCSd/Autoreboot/Timewol：
      #   如果 ImageBuilder 官方/已准备本地 APK 中存在则加入，
      #   否则记录到 missing-packages.txt，不阻断构建。
      # ==========================================================

      - name: Build final package list
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            selected-packages.txt \
            missing-packages.txt

          touch \
            selected-packages.txt \
            missing-packages.txt


          # ------------------------------------------------------
          # 官方 OpenWrt packages
          # ------------------------------------------------------

          cat >> selected-packages.txt <<'EOF'
          luci
          luci-i18n-base-zh-cn

          ppp
          ppp-mod-pppoe
          kmod-pppoe

          luci-proto-ppp
          luci-proto-ipv6

          ipv6
          odhcp6c
          odhcpd-ipv6only

          mwan3
          luci-app-mwan3
          luci-i18n-mwan3-zh-cn

          luci-app-ttyd
          luci-i18n-ttyd-zh-cn

          luci-app-upnp
          luci-i18n-upnp-zh-cn
          EOF


          # ------------------------------------------------------
          # PassWall
          # ------------------------------------------------------

          cat >> selected-packages.txt <<'EOF'
          luci-app-passwall
          luci-i18n-passwall-zh-cn
          EOF


          # ------------------------------------------------------
          # OpenClash
          # ------------------------------------------------------

          echo "luci-app-openclash" \
            >> selected-packages.txt


          # ------------------------------------------------------
          # 用户清单中，只加入已经知道来源的包
          # ------------------------------------------------------

          while IFS= read -r PACKAGE; do

            case "${PACKAGE}" in

              luci-theme-aurora|\
              luci-app-aurora-config|\
              luci-i18n-aurora-config-zh-cn|\
              bandix|\
              luci-app-bandix|\
              luci-i18n-bandix-zh-cn|\
              luci-app-run)

                if find imagebuilder/packages \
                  -maxdepth 1 \
                  -type f \
                  -name "${PACKAGE}-*.apk" |
                  grep -q .
                then

                  echo "${PACKAGE}" \
                    >> selected-packages.txt

                else

                  echo "${PACKAGE}" \
                    >> missing-packages.txt

                fi

                ;;

              luci-app-filebrowser-go|\
              luci-i18n-filebrowser-go-zh-cn|\
              luci-app-vlmcsd|\
              luci-i18n-vlmcsd-zh-cn|\
              luci-app-autoreboot|\
              luci-i18n-autoreboot-zh-cn|\
              luci-i18n-timewol-zh-cn)

                # 如果本地 packages/ 已经有对应 APK，就使用；
                # 否则只记录缺失，不阻断镜像。

                if find imagebuilder/packages \
                  -maxdepth 1 \
                  -type f \
                  -name "${PACKAGE}-*.apk" |
                  grep -q .
                then

                  echo "${PACKAGE}" \
                    >> selected-packages.txt

                else

                  echo "${PACKAGE}" \
                    >> missing-packages.txt

                fi

                ;;

              *)
                # 其它用户自定义包：
                # 让 ImageBuilder 官方仓库处理。
                echo "${PACKAGE}" \
                  >> selected-packages.txt
                ;;

            esac

          done < /tmp/user-packages


          # ------------------------------------------------------
          # 去重
          # ------------------------------------------------------

          sort -u \
            selected-packages.txt \
            -o selected-packages.txt


          sort -u \
            missing-packages.txt \
            -o missing-packages.txt


          if [ ! -s missing-packages.txt ]; then
            echo "None" > missing-packages.txt
          fi


          echo
          echo "=========================================="
          echo "Selected packages"
          echo "=========================================="

          cat selected-packages.txt


          echo
          echo "=========================================="
          echo "Missing packages"
          echo "=========================================="

          cat missing-packages.txt


      # ==========================================================
      # 检查必要第三方 APK
      # ==========================================================

      - name: Verify required third-party APKs
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED=0

          for PACKAGE in \
            luci-theme-aurora \
            luci-app-aurora-config \
            luci-i18n-aurora-config-zh-cn \
            bandix \
            luci-app-bandix \
            luci-i18n-bandix-zh-cn \
            luci-app-run
          do

            if find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name "${PACKAGE}-*.apk" |
              grep -q .
            then

              echo "OK: ${PACKAGE}"

            else

              echo "ERROR: Required third-party APK missing:"
              echo "${PACKAGE}"

              REQUIRED=1

            fi

          done


          if [ "${REQUIRED}" -ne 0 ]; then
            exit 1
          fi


      # ==========================================================
      # 构建 UEFI
      #
      # 不再调用：
      # make package_list
      # make manifest
      #
      # 直接让 ImageBuilder 自己处理 APK index。
      # ==========================================================

      - name: Build UEFI image
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          PACKAGES="$(
            tr '\n' ' ' \
              < "${GITHUB_WORKSPACE}/selected-packages.txt"
          )"

          mkdir -p \
            "${GITHUB_WORKSPACE}/output"


          echo
          echo "=========================================="
          echo "Building OpenWrt UEFI"
          echo "=========================================="


          echo
          echo "Packages:"
          echo "${PACKAGES}"


          echo
          echo "RootFS:"
          echo "${ROOTFS_PARTSIZE} MB"


          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            BIN_DIR="${GITHUB_WORKSPACE}/output" \
            EXTRA_IMAGE_NAME="${ROOTFS_SIZE}-${BUILD_DATE}"


      # ==========================================================
      # 找 UEFI
      # ==========================================================

      - name: Locate UEFI image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find output \
              -type f \
              -name '*combined-efi.img.gz' |
            head -n 1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI image not found."

            echo
            echo "Output:"
            find output \
              -type f \
              -print

            exit 1

          fi


          FINAL="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


          mv \
            "${IMAGE}" \
            "${FINAL}"


          echo "UEFI_IMAGE=${FINAL}" \
            >> "${GITHUB_ENV}"


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        shell: bash
        run: |
          set -euo pipefail

          QCOW2="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"

          gzip \
            -dc \
            "${UEFI_IMAGE}" \
            > /tmp/openwrt.raw

          qemu-img convert \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            /tmp/openwrt.raw \
            "${QCOW2}"

          rm -f /tmp/openwrt.raw

          test -s "${QCOW2}"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: output
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            *.img.gz \
            *.qcow2 \
            > sha256sums.txt

          cat sha256sums.txt


      # ==========================================================
      # Build info
      # ==========================================================

      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/build-info.txt <<EOF
          OpenWrt Custom ImageBuilder Build

          OpenWrt:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          ImageBuilder:
          Official OpenWrt

          RootFS:
          ${ROOTFS_SIZE}

          RootFS partition:
          ${ROOTFS_PARTSIZE} MB

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME}

          LAN:
          ${LAN_IP}

          Network:
          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          IPv6:
          Enabled

          Images:
          UEFI
          QCOW2
          EOF


      # ==========================================================
      # 保存包清单
      # ==========================================================

      - name: Save package lists
        shell: bash
        run: |
          set -euo pipefail

          cp \
            selected-packages.txt \
            output/selected-packages.txt

          cp \
            missing-packages.txt \
            output/missing-packages.txt


      # ==========================================================
      # 最终检查
      # ==========================================================

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail

          UEFI_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          QCOW2_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


          test -s "${UEFI_FILE}"
          test -s "${QCOW2_FILE}"
          test -s output/sha256sums.txt
          test -s output/build-info.txt
          test -s output/selected-packages.txt
          test -s output/missing-packages.txt


          echo
          echo "=========================================="
          echo "Final output"
          echo "=========================================="

          ls -lh output


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          TAG="v${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${GITHUB_RUN_NUMBER}"

          TITLE="OpenWrt ${OPENWRT_VERSION} x86-64 ${ROOTFS_SIZE} ${BUILD_DATE}"


          cat > release-notes.md <<EOF
          # OpenWrt ${OPENWRT_VERSION} x86-64

          ## Build

          - OpenWrt: \`${OPENWRT_VERSION}\`
          - Target: \`x86-64\`
          - ImageBuilder: Official OpenWrt
          - RootFS: \`${ROOTFS_SIZE}\`
          - Build date: \`${BUILD_DATE}\`

          ## Network

          - \`eth0\` → WAN / PPPoE
          - \`eth1\` → WANB / PPPoE
          - \`eth2\` → LAN
          - \`eth3\` → LAN
          - \`eth4\` → LAN
          - \`eth5\` → LAN

          - LAN IP: \`${LAN_IP}\`
          - IPv6: Enabled

          ## Images

          - UEFI
          - QCOW2

          ## Package status

          See:

          - \`selected-packages.txt\`
          - \`missing-packages.txt\`

          EOF


          gh release create \
            "${TAG}" \
            output/*.img.gz \
            output/*.qcow2 \
            output/sha256sums.txt \
            output/build-info.txt \
            output/selected-packages.txt \
            output/missing-packages.txt \
            --title "${TITLE}" \
            --notes-file release-notes.md


          echo
          echo "=========================================="
          echo "Release created"
          echo "=========================================="

          echo "${TAG}"
