name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "RootFS 大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

  repository_dispatch:
    types:
      - openwrt-release

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # 确定 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          echo "BUILD_DATE=$(date '+%Y%m%d')" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=$(date '+%H%M%S')" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "Build date      : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="


      # ==========================================================
      # RootFS 大小
      # ==========================================================

      - name: Configure rootfs size
        shell: bash
        run: |
          set -euo pipefail

          SIZE="${{ inputs.rootfs_size }}"

          if [ -z "${SIZE}" ]; then
            SIZE="4G"
          fi

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid RootFS size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS: ${SIZE}"
          echo "Partition: ${PARTSIZE} MB"


      # ==========================================================
      # LAN IP
      # ==========================================================

      - name: Configure LAN IP
        shell: bash
        run: |
          set -euo pipefail

          LAN_IP="${{ inputs.lan_ip }}"

          if [ -z "${LAN_IP}" ]; then
            LAN_IP="192.168.1.2"
          fi

          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"

          echo "LAN IP: ${LAN_IP}"


      # ==========================================================
      # 安装 ImageBuilder 所需工具
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            file \
            gawk \
            gettext \
            libncurses-dev \
            libssl-dev \
            rsync \
            unzip \
            wget \
            curl \
            zstd \
            xz-utils \
            qemu-utils


      # ==========================================================
      # 下载官方 OpenWrt ImageBuilder
      # ==========================================================

      - name: Download OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"

          BUILDER="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="${BASE_URL}/${BUILDER}"

          echo
          echo "=========================================="
          echo "Downloading ImageBuilder"
          echo "=========================================="
          echo
          echo "URL:"
          echo "${URL}"
          echo

          wget \
            --progress=dot:giga \
            "${URL}" \
            -O "/tmp/${BUILDER}"

          rm -rf openwrt-imagebuilder

          mkdir -p openwrt-imagebuilder

          tar \
            --zstd \
            -xf "/tmp/${BUILDER}" \
            --strip-components=1 \
            -C openwrt-imagebuilder

          echo
          echo "ImageBuilder ready:"
          du -sh openwrt-imagebuilder

          echo
          ls -lah openwrt-imagebuilder


      # ==========================================================
      # 显示 ImageBuilder 信息
      # ==========================================================

      - name: Show ImageBuilder information
        working-directory: openwrt-imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "ImageBuilder information"
          echo "=========================================="

          make info


      # ==========================================================
      # 复制 files
      # ==========================================================

      - name: Prepare custom files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d files ]; then
            echo "ERROR: files directory not found."
            exit 1
          fi

          rm -rf openwrt-imagebuilder/files

          cp -a files openwrt-imagebuilder/files

          echo
          echo "Custom files:"
          find openwrt-imagebuilder/files -type f -print


      # ==========================================================
      # 注入 LAN IP
      #
      # network 文件中的 192.168.1.2 自动替换为用户选择值
      # ==========================================================

      - name: Configure network
        shell: bash
        run: |
          set -euo pipefail

          NETWORK_FILE="openwrt-imagebuilder/files/etc/config/network"

          if [ ! -f "${NETWORK_FILE}" ]; then
            echo "ERROR: network configuration not found."
            exit 1
          fi

          sed -i \
            "s/192\.168\.1\.2/${LAN_IP}/g" \
            "${NETWORK_FILE}"

          echo
          echo "Final network configuration:"
          echo "=========================================="

          cat "${NETWORK_FILE}"


      # ==========================================================
      # 加载软件包列表
      # ==========================================================

      - name: Load custom package list
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_FILE="shell/apk-custom-packages.sh"

          if [ ! -f "${PACKAGE_FILE}" ]; then
            echo "ERROR: ${PACKAGE_FILE} not found."
            exit 1
          fi

          source "${PACKAGE_FILE}"

          if [ -z "${CUSTOM_PACKAGES:-}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty."
            exit 1
          fi

          {
            echo "CUSTOM_PACKAGES<<EOF"
            echo "${CUSTOM_PACKAGES}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "Requested packages"
          echo "=========================================="

          for package in ${CUSTOM_PACKAGES}; do
            echo "${package}"
          done


      # ==========================================================
      # 检查官方 APK 仓库
      # ==========================================================

      - name: Configure official APK repositories
        working-directory: openwrt-imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "OpenWrt APK repositories"
          echo "=========================================="

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "repositories" \
              -o \
              -name "*.list" \
              -o \
              -name "repositories.conf" \
            \) \
            -print || true

          echo
          echo "Official repository configuration is provided"
          echo "by the OpenWrt ImageBuilder."


      # ==========================================================
      # 添加第三方 APK 仓库
      #
      # 注意：
      # ImageBuilder 本身只负责官方 OpenWrt APK。
      # 第三方仓库必须提供与 OpenWrt 25.12.x
      # x86_64 ABI 匹配的 APK。
      # ==========================================================

      - name: Configure third-party APK repositories
        working-directory: openwrt-imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Third-party APK repositories"
          echo "=========================================="

          echo
          echo "OpenClash:"
          echo "https://github.com/vernesong/OpenClash"

          echo
          echo "PassWall:"
          echo "https://github.com/Openwrt-Passwall/openwrt-passwall"

          echo
          echo "Aurora:"
          echo "https://github.com/eamonxg/luci-theme-aurora"

          echo
          echo "Bandix:"
          echo "https://github.com/timsaya/openwrt-bandix"

          echo
          echo "Third-party APK repositories are handled"
          echo "by the package repository preparation stage."


      # ==========================================================
      # 构建参数
      # ==========================================================

      - name: Prepare build variables
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Build configuration"
          echo "=========================================="

          echo
          echo "OpenWrt:"
          echo "${OPENWRT_VERSION}"

          echo
          echo "RootFS:"
          echo "${ROOTFS_SIZE}"

          echo
          echo "LAN:"
          echo "${LAN_IP}"

          echo
          echo "Packages:"
          echo "${CUSTOM_PACKAGES}"


      # ==========================================================
      # 构建 UEFI
      # ==========================================================

      - name: Build UEFI image
        working-directory: openwrt-imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Building UEFI image"
          echo "=========================================="

          make image \
            PROFILE="generic" \
            PACKAGES="${CUSTOM_PACKAGES}" \
            FILES="files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            EXTRA_IMAGE_NAME="custom-${ROOTFS_SIZE}-${BUILD_DATE}"


      # ==========================================================
      # 查找 UEFI 镜像
      # ==========================================================

      - name: Locate UEFI image
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Generated images"
          echo "=========================================="

          find openwrt-imagebuilder/bin \
            -type f \
            -maxdepth 5 \
            -print

          IMAGE="$(
            find openwrt-imagebuilder/bin \
              -type f \
              -name '*ext4-combined-efi.img.gz' \
              | head -1
          )"

          if [ -z "${IMAGE}" ]; then
            echo
            echo "ERROR: UEFI image not found."
            exit 1
          fi

          echo "UEFI_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

          echo
          echo "UEFI image:"
          echo "${IMAGE}"


      # ==========================================================
      # 准备 Release
      # ==========================================================

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release

          mkdir -p release

          UEFI_NAME="OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          cp \
            "${UEFI_IMAGE}" \
            "release/${UEFI_NAME}"

          echo "UEFI_NAME=${UEFI_NAME}" >> "${GITHUB_ENV}"


      # ==========================================================
      # 解压 UEFI
      # ==========================================================

      - name: Extract raw image
        shell: bash
        run: |
          set -euo pipefail

          gzip -dc \
            "release/${UEFI_NAME}" \
            > release/openwrt.raw

          echo
          echo "Raw image:"
          ls -lh release/openwrt.raw


      # ==========================================================
      # 创建 QCOW2
      # ==========================================================

      - name: Create QCOW2
        shell: bash
        run: |
          set -euo pipefail

          QCOW2_NAME="OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"

          qemu-img convert \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            release/openwrt.raw \
            "release/${QCOW2_NAME}"

          rm -f release/openwrt.raw

          echo "QCOW2_NAME=${QCOW2_NAME}" >> "${GITHUB_ENV}"

          echo
          echo "QCOW2:"
          ls -lh "release/${QCOW2_NAME}"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum \
            "${UEFI_NAME}" \
            "${QCOW2_NAME}" \
            > sha256sums

          echo
          cat sha256sums


      # ==========================================================
      # 构建信息
      # ==========================================================

      - name: Generate build information
        shell: bash
        run: |
          set -euo pipefail

          cat > release/build-info.txt <<EOF
OpenWrt Custom Build
====================

OpenWrt Version:
${OPENWRT_VERSION}

Target:
x86-64

ImageBuilder:
official OpenWrt ImageBuilder

RootFS:
${ROOTFS_SIZE}

Build Date:
${BUILD_DATE}

Build Time:
${BUILD_TIME}

LAN:
${LAN_IP}

Network:
eth0 = WAN1 / PPPoE
eth1 = WAN2 / PPPoE
eth2 = LAN
eth3 = LAN
eth4 = LAN
eth5 = LAN

IPv6:
Enabled

Images:
UEFI
QCOW2

Packages:
${CUSTOM_PACKAGES}
EOF


      # ==========================================================
      # 显示最终文件
      # ==========================================================

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - ImageBuilder: `Official OpenWrt`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN1 / PPPoE
            - `eth1` → WAN2 / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ env.LAN_IP }}`
            - IPv6: Enabled

            ## Images

            - UEFI
            - QCOW2

            ## Packages

            `${{ env.CUSTOM_PACKAGES }}`

          files: |
            release/${{ env.UEFI_NAME }}
            release/${{ env.QCOW2_NAME }}
            release/sha256sums
            release/build-info.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
