name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        required: true
        default: "25.12.5"
      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.1.2"
      rootfs_size:
        description: "Firmware/rootfs size"
        required: true
        type: choice
        default: "1G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"
      filesystem:
        description: "Filesystem"
        required: true
        type: choice
        default: "ext4"
        options:
          - "ext4"
          - "squashfs"
      build_uefi:
        description: "Build UEFI image"
        required: true
        type: boolean
        default: true
      build_qcow2:
        description: "Build QCOW2 image"
        required: true
        type: boolean
        default: true

  # Temporary automatic trigger so the repository can self-test the fixes.
  # It can be removed after the first successful build.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version || '25.12.5' }}
      LAN_IP: ${{ inputs.lan_ip || '192.168.1.2' }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size || '1G' }}
      FILESYSTEM: ${{ inputs.filesystem || 'ext4' }}
      BUILD_UEFI: ${{ inputs.build_uefi == '' && 'true' || inputs.build_uefi }}
      BUILD_QCOW2: ${{ inputs.build_qcow2 == '' && 'true' || inputs.build_qcow2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            gzip \
            qemu-utils \
            wget \
            xz-utils \
            zstd

      - name: Download OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euxo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"
          IB_ROOT="${RUNNER_TEMP}/imagebuilder"

          rm -rf "${IB_ROOT}"
          mkdir -p "${IB_ROOT}"
          cd "${IB_ROOT}"

          wget -q --show-progress "${BASE_URL}/${ARCHIVE}"
          tar --zstd -xf "${ARCHIVE}"

          IMAGEBUILDER_DIR="$(
            find . -mindepth 1 -maxdepth 1 -type d \
              -name "openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64" \
              -print -quit
          )"

          test -n "${IMAGEBUILDER_DIR}"
          IMAGEBUILDER_DIR="$(cd "${IMAGEBUILDER_DIR}" && pwd)"
          echo "IMAGEBUILDER_DIR=${IMAGEBUILDER_DIR}" >> "${GITHUB_ENV}"
          echo "ImageBuilder: ${IMAGEBUILDER_DIR}"

      - name: Load third-party APK manifest
        shell: bash
        run: |
          set -euxo pipefail

          test -f scripts/apk-custom-packages.sh
          source scripts/apk-custom-packages.sh

          CUSTOM_PACKAGES="$(
            printf '%s\n' "${CUSTOM_PACKAGES:-}" |
              tr '[:space:]' '\n' |
              awk 'NF && !seen[$0]++' |
              paste -sd ' ' -
          )"

          test -n "${CUSTOM_PACKAGES}"
          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "${GITHUB_ENV}"

          echo "Selected third-party packages:"
          printf '%s\n' "${CUSTOM_PACKAGES}" | tr ' ' '\n'

      - name: Prepare third-party APK repository
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"

          THIRD_PARTY_REPO="${RUNNER_TEMP}/wukongdaily-apk"
          EXTRA_DIR="${RUNNER_TEMP}/extra-packages"
          PREPARED_DIR="${RUNNER_TEMP}/prepared-apk"

          rm -rf "${THIRD_PARTY_REPO}" "${EXTRA_DIR}" "${PREPARED_DIR}"

          git clone --depth=1 \
            https://github.com/wukongdaily/apk.git \
            "${THIRD_PARTY_REPO}"

          mkdir -p "${EXTRA_DIR}" "${PREPARED_DIR}"

          # x86 APKs live under run/x86. Some packages are direct APKs,
          # while the larger package bundles are makeself .run archives.
          cp -a "${THIRD_PARTY_REPO}/run/x86/." "${EXTRA_DIR}/"

          rm -rf packages
          mkdir -p packages

          # Extract all x86 .run bundles, then collect the APKs. This is the
          # same preparation model used by the upstream ImageBuilder project.
          BASE_DIR="${EXTRA_DIR}" \
          TARGET_DIR="${PREPARED_DIR}" \
            scripts/apk-prepare-packages.sh

          echo
          echo "Prepared APKs:"
          find "${PREPARED_DIR}" -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort

          # Select the exact package names requested by CUSTOM_PACKAGES.
          # Do not rename APKs: OpenWrt 25.12 ImageBuilder validates the APK
          # filename against the package metadata, including '~' revisions.
          for pkg in ${CUSTOM_PACKAGES}; do
            mapfile -t matches < <(
              find "${PREPARED_DIR}" \
                -maxdepth 1 \
                -type f \
                -name "${pkg}-*.apk" \
                -printf '%p\n' |
                sort -V
            )

            if [[ "${#matches[@]}" -eq 0 ]]; then
              echo
              echo "ERROR: requested APK package was not prepared: ${pkg}" >&2
              echo "Matching files:" >&2
              find "${PREPARED_DIR}" \
                -maxdepth 1 \
                -type f \
                -name "${pkg}*.apk" \
                -printf '%f\n' |
                sort >&2 || true
              exit 1
            fi

            src="${matches[${#matches[@]}-1]}"
            cp -f "${src}" packages/
            echo "  ${pkg} <- $(basename "${src}")"
          done

          echo
          echo "Local APK files supplied to ImageBuilder:"
          find packages -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort

          test -n "$(find packages -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Prepare ImageBuilder configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"

          case "${ROOTFS_SIZE}" in
            1G) ROOTFS_PARTSIZE=1024 ;;
            2G) ROOTFS_PARTSIZE=2048 ;;
            3G) ROOTFS_PARTSIZE=3072 ;;
            4G) ROOTFS_PARTSIZE=4096 ;;
            *) echo "Invalid ROOTFS_SIZE=${ROOTFS_SIZE}" >&2; exit 1 ;;
          esac

          echo "ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}" >> "${GITHUB_ENV}"

          # Configure only the selected filesystem.
          sed -i \
            -e '/^CONFIG_TARGET_ROOTFS_SQUASHFS=/d' \
            -e '/^# CONFIG_TARGET_ROOTFS_SQUASHFS is not set$/d' \
            -e '/^CONFIG_TARGET_ROOTFS_EXT4FS=/d' \
            -e '/^# CONFIG_TARGET_ROOTFS_EXT4FS is not set$/d' \
            .config

          case "${FILESYSTEM}" in
            ext4)
              printf '%s\n' \
                'CONFIG_TARGET_ROOTFS_SQUASHFS=n' \
                'CONFIG_TARGET_ROOTFS_EXT4FS=y' >> .config
              ;;
            squashfs)
              printf '%s\n' \
                'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
                'CONFIG_TARGET_ROOTFS_EXT4FS=n' >> .config
              ;;
            *) echo "Invalid FILESYSTEM=${FILESYSTEM}" >&2; exit 1 ;;
          esac

          # UEFI only. BIOS, VDI, VMDK, VHDX and ISO are never released.
          sed -i \
            -e '/^CONFIG_GRUB_IMAGES=/d' \
            -e '/^# CONFIG_GRUB_IMAGES is not set$/d' \
            -e '/^CONFIG_GRUB_EFI_IMAGES=/d' \
            -e '/^# CONFIG_GRUB_EFI_IMAGES is not set$/d' \
            -e '/^CONFIG_VDI_IMAGES=/d' \
            -e '/^# CONFIG_VDI_IMAGES is not set$/d' \
            -e '/^CONFIG_VMDK_IMAGES=/d' \
            -e '/^# CONFIG_VMDK_IMAGES is not set$/d' \
            -e '/^CONFIG_VHDX_IMAGES=/d' \
            -e '/^# CONFIG_VHDX_IMAGES is not set$/d' \
            -e '/^CONFIG_ISO_IMAGES=/d' \
            -e '/^# CONFIG_ISO_IMAGES is not set$/d' \
            .config

          if [[ "${BUILD_UEFI}" == "true" ]]; then
            printf '%s\n' \
              'CONFIG_GRUB_IMAGES=n' \
              'CONFIG_GRUB_EFI_IMAGES=y' \
              'CONFIG_VDI_IMAGES=n' \
              'CONFIG_VMDK_IMAGES=n' \
              'CONFIG_VHDX_IMAGES=n' \
              'CONFIG_ISO_IMAGES=n' >> .config
          else
            printf '%s\n' \
              'CONFIG_GRUB_IMAGES=n' \
              'CONFIG_GRUB_EFI_IMAGES=n' \
              'CONFIG_VDI_IMAGES=n' \
              'CONFIG_VMDK_IMAGES=n' \
              'CONFIG_VHDX_IMAGES=n' \
              'CONFIG_ISO_IMAGES=n' >> .config
          fi

          echo "Filesystem configuration:"
          grep -E '^CONFIG_TARGET_ROOTFS_(SQUASHFS|EXT4FS)=' .config || true

          echo "Image format configuration:"
          grep -E '^(CONFIG_GRUB_IMAGES|CONFIG_GRUB_EFI_IMAGES|CONFIG_VDI_IMAGES|CONFIG_VMDK_IMAGES|CONFIG_VHDX_IMAGES|CONFIG_ISO_IMAGES)=' .config || true

      - name: Prepare custom files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${IMAGEBUILDER_DIR}/files/etc/uci-defaults"
          cp files/etc/uci-defaults/99-custom.sh \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"
          chmod +x "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

          # Escape replacement text for sed, then substitute the placeholder.
          ESCAPED_LAN_IP="$(printf '%s' "${LAN_IP}" | sed 's/[&|\\]/\\&/g')"
          sed -i "s|__LAN_IP__|${ESCAPED_LAN_IP}|g" \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

      - name: Build OpenWrt image
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"

          BASE_PACKAGES="curl luci-i18n-firewall-zh-cn luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn luci-i18n-package-manager-zh-cn luci-i18n-ttyd-zh-cn openssh-sftp-server"

          PACKAGES="$(
            printf '%s\n' "${BASE_PACKAGES}" "${CUSTOM_PACKAGES:-}" |
              tr '[:space:]' '\n' |
              awk 'NF && !seen[$0]++' |
              paste -sd ' ' -
          )"

          test -n "${PACKAGES}"

          echo "============================================================"
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "Target          : x86/64"
          echo "LAN IP          : ${LAN_IP}"
          echo "Firmware size   : ${ROOTFS_SIZE}"
          echo "Filesystem      : ${FILESYSTEM}"
          echo "UEFI            : ${BUILD_UEFI}"
          echo "QCOW2           : ${BUILD_QCOW2}"
          echo "Rootfs partsize : ${ROOTFS_PARTSIZE} MiB"
          echo "============================================================"
          echo
          echo "Packages:"
          printf '%s\n' "${PACKAGES}" | tr ' ' '\n'

          # ImageBuilder's APK implementation reads packages/ as the local
          # package source. Keep PACKAGES a single whitespace-separated line.
          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="${IMAGEBUILDER_DIR}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}"

      - name: Collect images
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_DIR="${IMAGEBUILDER_DIR}/bin/targets/x86/64"
          OUT="${GITHUB_WORKSPACE}/release"

          rm -rf "${OUT}"
          mkdir -p "${OUT}"
          shopt -s nullglob

          if [[ "${BUILD_UEFI}" == "true" ]]; then
            if [[ "${FILESYSTEM}" == "ext4" ]]; then
              candidates=(
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img
              )
            else
              candidates=(
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img
              )
            fi

            if [[ "${#candidates[@]}" -eq 0 ]]; then
              echo "ERROR: UEFI ${FILESYSTEM} image not found." >&2
              find "${BUILD_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort
              exit 1
            fi

            src="${candidates[0]}"
            raw_img="${RUNNER_TEMP}/openwrt-x86-64-uefi-${FILESYSTEM}.img"

            case "${src}" in
              *.gz) gzip -dc "${src}" > "${raw_img}" ;;
              *) cp -f "${src}" "${raw_img}" ;;
            esac

            # RAW is only an intermediate. It is never uploaded.
            if [[ "${BUILD_QCOW2}" == "true" ]]; then
              qemu-img convert \
                -p \
                -f raw \
                -O qcow2 \
                "${raw_img}" \
                "${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2"
            fi

            rm -f "${raw_img}"
          fi

          echo "Final artifacts:"
          find "${OUT}" -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find "${OUT}" -maxdepth 1 -type f -print -quit)"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euxo pipefail
          cd release
          sha256sum * > sha256sums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ env.OPENWRT_VERSION }}-${{ env.FILESYSTEM }}
          path: release/*
          if-no-files-found: error
