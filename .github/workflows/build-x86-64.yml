name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:

      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

  repository_dispatch:
    types:
      - openwrt-release


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 确定 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash

        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |

          set -euo pipefail

          VERSION="${MANUAL_VERSION}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION}"
          fi

          if [ -z "${VERSION}" ]; then

            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"

          fi

          if ! echo "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          COMMIT="$(
            git ls-remote \
              https://github.com/openwrt/openwrt.git \
              "refs/tags/v${VERSION}" |
            awk '{print $1}'
          )"

          if [ -z "${COMMIT}" ]; then
            echo "ERROR: Cannot find OpenWrt commit."
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "OPENWRT_COMMIT=${COMMIT}" >> "$GITHUB_ENV"

          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%H%M%S)" >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "OpenWrt commit  : ${COMMIT}"
          echo "Build date      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="


      # ==========================================================
      # RootFS
      # ==========================================================

      - name: Configure RootFS
        shell: bash

        run: |

          set -euo pipefail

          SIZE="${{ inputs.rootfs_size }}"

          if [ -z "${SIZE}" ]; then
            SIZE="4G"
          fi

          case "${SIZE}" in

            1G)
              PARTSIZE=1024
              ;;

            2G)
              PARTSIZE=2048
              ;;

            3G)
              PARTSIZE=3072
              ;;

            4G)
              PARTSIZE=4096
              ;;

            *)
              echo "ERROR: Invalid RootFS size."
              exit 1
              ;;

          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "$GITHUB_ENV"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "$GITHUB_ENV"


      # ==========================================================
      # 安装编译依赖
      # ==========================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar


      # ==========================================================
      # Clone OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        run: |

          git clone \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          git checkout "${OPENWRT_COMMIT}"


      # ==========================================================
      # 配置第三方 feeds
      #
      # PassWall:
      #   PassWall packages
      #   PassWall LuCI
      #
      # Bandix:
      #   Bandix
      #   Bandix LuCI
      # ==========================================================

      - name: Configure third-party feeds
        working-directory: openwrt
        run: |

          set -euo pipefail

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main

          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          src-git bandix https://github.com/timsaya/openwrt-bandix.git;main

          src-git bandix_luci https://github.com/timsaya/luci-app-bandix.git;main

          EOF


      # ==========================================================
      # 更新 feeds
      # ==========================================================

      - name: Update feeds
        working-directory: openwrt
        run: |

          set -euo pipefail

          ./scripts/feeds update -a


      # ==========================================================
      # 安装 feeds
      # ==========================================================

      - name: Install feeds
        working-directory: openwrt
        run: |

          set -euo pipefail

          ./scripts/feeds install -a


      # ==========================================================
      # 添加第三方源码包
      #
      # Aurora
      # luci-app-run
      # OpenClash
      #
      # 注意：
      # Aurora 会同时作为源码包编译进固件。
      # 运行时软件源另外写入 /etc/apk/repositories。
      # ==========================================================

      - name: Add custom packages
        working-directory: openwrt
        run: |

          set -euo pipefail

          mkdir -p package/custom


          echo
          echo "=========================================="
          echo "Adding Aurora"
          echo "=========================================="


          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            package/custom/luci-theme-aurora


          echo
          echo "=========================================="
          echo "Adding shadcn"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-shadcn.git \
            package/custom/luci-theme-shadcn


          echo
          echo "=========================================="
          echo "Adding luci-app-run"
          echo "=========================================="


          git clone \
            --depth=1 \
            https://github.com/wukongdaily/luci-app-run.git \
            package/custom/luci-app-run


          echo
          echo "=========================================="
          echo "Adding OpenClash"
          echo "=========================================="


          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            package/custom/OpenClash


          echo
          echo "=========================================="
          echo "Custom packages"
          echo "=========================================="


          find package/custom \
            -type f \
            -name Makefile \
            -print |
          sort


      # ==========================================================
      # 生成基础配置
      # ==========================================================

      - name: Generate base configuration
        working-directory: openwrt
        run: |

          set -euo pipefail

          cat > .config <<EOF

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y

          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_ipv6=y
          CONFIG_PACKAGE_kmod-ipv6=y

          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y

          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_hysteria=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-theme-shadcn=y

          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          EOF


          make defconfig


      # ==========================================================
      # 加载自定义包
      # ==========================================================

      - name: Load custom packages
        shell: bash

        run: |

          set -euo pipefail

          if [ ! -f shell/apk-custom-packages.sh ]; then
            echo "ERROR: shell/apk-custom-packages.sh not found."
            exit 1
          fi

          source shell/apk-custom-packages.sh

          if [ -z "${CUSTOM_PACKAGES:-}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty."
            exit 1
          fi


          echo
          echo "=========================================="
          echo "Requested custom packages"
          echo "=========================================="

          echo "${CUSTOM_PACKAGES}"


          cd openwrt


          while IFS= read -r package; do

            [ -z "${package}" ] && continue

            echo
            echo "Checking package: ${package}"

            if grep -R \
              -q \
              -E \
              "define Package/${package}($|[^A-Za-z0-9_-])" \
              package \
              feeds \
              2>/dev/null
            then

              echo "Found: ${package}"

              echo \
                "CONFIG_PACKAGE_${package}=y" \
                >> .config

            else

              echo
              echo "WARNING: Package not found:"
              echo "${package}"

            fi

          done <<< "${CUSTOM_PACKAGES}"


          sort -u \
            .config \
            -o .config


          make defconfig


      # ==========================================================
      # 最终 package 检查
      # ==========================================================

      - name: Verify important packages
        working-directory: openwrt
        run: |

          set -euo pipefail

          echo
          echo "=========================================="
          echo "Verifying important packages"
          echo "=========================================="


          REQUIRED_PACKAGES="
          luci
          luci-i18n-base-zh-cn
          luci-app-package-manager
          luci-i18n-package-manager-zh-cn

          luci-app-mwan3
          luci-app-upnp
          luci-app-ttyd

          luci-app-passwall
          luci-i18n-passwall-zh-cn

          geoview
          xray-core
          sing-box
          hysteria
          v2ray-geoip
          v2ray-geosite

          luci-app-openclash

          kmod-nft-socket
          kmod-nft-tproxy

          luci-theme-aurora
          luci-theme-shadcn
          luci-app-aurora-config
          luci-i18n-aurora-config-zh-cn

          bandix
          luci-app-bandix
          luci-i18n-bandix-zh-cn

          luci-app-run

          luci-app-filebrowser-go

          luci-app-vlmcsd

          luci-app-timewol

          luci-app-autoreboot
          "


          FAILED=0


          while IFS= read -r PACKAGE; do

            [ -z "${PACKAGE}" ] && continue

            if grep -qx \
              "CONFIG_PACKAGE_${PACKAGE}=y" \
              .config
            then

              echo "OK: ${PACKAGE}"

            else

              echo "WARNING: ${PACKAGE} not selected."

              FAILED=1

            fi

          done <<< "${REQUIRED_PACKAGES}"


          if [ "${FAILED}" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "ERROR: Some important packages are missing."
            echo "=========================================="

            exit 1

          fi


      # ==========================================================
      # 网络配置
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2~eth5 = LAN
      # ==========================================================

      - name: Generate network configuration
        env:

          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |

          set -euo pipefail

          if [ -z "${WAN1_USER}" ] || [ -z "${WAN1_PASS}" ]; then

            echo "ERROR: WAN1_USER / WAN1_PASS is not configured."

            exit 1

          fi


          if [ -z "${WAN2_USER}" ] || [ -z "${WAN2_PASS}" ]; then

            echo "ERROR: WAN2_USER / WAN2_PASS is not configured."

            exit 1

          fi


          LAN_IP="${{ inputs.lan_ip }}"

          if [ -z "${LAN_IP}" ]; then
            LAN_IP="192.168.1.2"
          fi


          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/network <<EOF

          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'


          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'


          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'


          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 '1'


          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'


          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 '1'


          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          EOF


      # ==========================================================
      # DHCP / IPv6 RA
      # ==========================================================

      - name: Generate DHCP configuration
        run: |

          set -euo pipefail

          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/dhcp <<'EOF'

          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'


          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'


          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'


          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'

          EOF


      # ==========================================================
      # APK 软件源
      # ==========================================================

      - name: Install APK repository configuration
        run: |

          set -euo pipefail

          mkdir -p \
            openwrt/files/etc/apk


          cp \
            files/etc/apk/repositories \
            openwrt/files/etc/apk/repositories


      # ==========================================================
      # OpenClash 更新工具
      # ==========================================================

      - name: Install OpenClash updater
        run: |

          set -euo pipefail

          mkdir -p \
            openwrt/files/usr/bin


          cp \
            files/usr/bin/openclash-update \
            openwrt/files/usr/bin/openclash-update


          chmod +x \
            openwrt/files/usr/bin/openclash-update


      # ==========================================================
      # 第三方主题软件源（Aurora / shadcn）
      #
      # eamonxg 官方安装脚本会根据 OpenWrt 版本与架构写入正确的 APK feed。
      # 这样 Aurora / shadcn 后续可以直接通过 apk update / apk upgrade 更新。
      # ==========================================================

      - name: Install Aurora and shadcn feed bootstrap
        run: |
          set -euo pipefail

          mkdir -p \
            openwrt/files/etc/uci-defaults

          cat > openwrt/files/etc/uci-defaults/97-eamonxg-feed <<'EOF'
          #!/bin/sh
          set -e

          if command -v wget >/dev/null 2>&1; then
              wget -qO- https://openwrt.eamonxg.fun/install.sh | sh || true
          elif command -v uclient-fetch >/dev/null 2>&1; then
              uclient-fetch -qO- https://openwrt.eamonxg.fun/install.sh | sh || true
          fi

          exit 0
          EOF

          chmod +x \
            openwrt/files/etc/uci-defaults/97-eamonxg-feed


      # ==========================================================
      # 默认简体中文
      # ==========================================================

      - name: Set default language
        run: |

          set -euo pipefail

          mkdir -p \
            openwrt/files/etc/uci-defaults


          cat > openwrt/files/etc/uci-defaults/99-default-language <<'EOF'

          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'

          uci -q commit luci

          exit 0

          EOF


          chmod +x \
            openwrt/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # 设置 Aurora 为默认主题
      # ==========================================================

      - name: Set Aurora default theme
        run: |

          set -euo pipefail

          mkdir -p \
            openwrt/files/etc/uci-defaults


          cat > openwrt/files/etc/uci-defaults/98-default-theme <<'EOF'

          #!/bin/sh

          if uci -q get luci.themes.Aurora >/dev/null 2>&1; then

              uci -q set luci.main.mediaurlbase='/luci-static/aurora'

              uci -q commit luci

          fi

          exit 0

          EOF


          chmod +x \
            openwrt/files/etc/uci-defaults/98-default-theme


      # ==========================================================
      # 写入固件信息
      # ==========================================================

      - name: Create build information
        run: |

          set -euo pipefail

          mkdir -p \
            openwrt/files/etc/openwrt-custom


          cat > openwrt/files/etc/openwrt-custom/build-info <<EOF

          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          OpenWrt Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC

          LAN:
          ${{ inputs.lan_ip }}

          eth0:
          WAN / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          Enabled

          EOF


      # ==========================================================
      # 下载源码包
      # ==========================================================

      - name: Download packages
        working-directory: openwrt
        run: |

          set -euo pipefail

          make download \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 编译
      # ==========================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |

          set -euo pipefail

          make \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 准备 Release
      # ==========================================================

      - name: Prepare release directory
        run: |

          set -euo pipefail

          rm -rf release

          mkdir -p release


      # ==========================================================
      # UEFI
      # ==========================================================

      - name: Copy UEFI image
        run: |

          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI image not found."

            echo
            echo "Available images:"

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1

          fi


          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


      # ==========================================================
      # 从 UEFI 镜像生成 RAW 临时文件
      # ==========================================================

      - name: Prepare raw image
        run: |

          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI image not found."

            exit 1

          fi


          gzip -dc \
            "${IMAGE}" \
            > openwrt.raw


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        run: |

          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        run: |

          set -euo pipefail

          cd release

          sha256sum * > sha256sums


      # ==========================================================
      # Release 信息
      # ==========================================================

      - name: Create release information
        run: |

          set -euo pipefail

          cat > release/build-info.txt <<EOF

          ==========================================
          OpenWrt Custom Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          OpenWrt commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME} UTC

          Network:

          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          LAN:
          ${{ inputs.lan_ip }}

          IPv6:
          Enabled

          Output:

          UEFI
          QCOW2

          ==========================================

          Included:

          LuCI
          Simplified Chinese
          LuCI Package Manager
          PassWall
          Geoview
          Xray Core
          Sing-box
          Hysteria
          OpenClash
          Aurora
          shadcn
          Aurora Config
          Bandix
          luci-app-run
          FileBrowser Go
          VLMCSd
          TimeWOL
          AutoReboot
          mwan3
          UPnP
          ttyd
          PPPoE
          IPv6

          Kernel:

          kmod-nft-socket
          kmod-nft-tproxy

          ==========================================

          EOF


      # ==========================================================
      # 显示最终文件
      # ==========================================================

      - name: Show release files
        run: |

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"

          body: |

            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build information

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ inputs.lan_ip }}`
            - IPv6: Enabled

            ## Included

            - LuCI
            - Simplified Chinese
            - LuCI Package Manager
            - PassWall
            - Geoview
            - Xray Core
            - Sing-box
            - Hysteria
            - OpenClash
            - Aurora
            - shadcn
            - Aurora Config
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - VLMCSd
            - TimeWOL
            - AutoReboot
            - mwan3
            - UPnP
            - ttyd
            - PPPoE
            - IPv6
            - kmod-nft-socket
            - kmod-nft-tproxy

            ## Images

            - UEFI
            - QCOW2

          files: |
            release/*

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
