name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用 openwrt-version"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

  repository_dispatch:
    types:
      - openwrt-release


permissions:
  contents: write


env:
  TZ: Asia/Shanghai


jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # 确定 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION}"
          fi

          if [ -z "${VERSION}" ] && [ -f openwrt-version ]; then
            VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=$(date +%H%M%S)" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "Build date      : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="


      # ==========================================================
      # RootFS
      # ==========================================================

      - name: Configure rootfs size
        shell: bash
        env:
          INPUT_SIZE: ${{ inputs.rootfs_size }}

        run: |
          set -euo pipefail

          SIZE="${INPUT_SIZE}"

          if [ -z "${SIZE}" ]; then
            SIZE="4G"
          fi

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid rootfs size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS size: ${SIZE}"
          echo "RootFS partition: ${PARTSIZE} MB"


      # ==========================================================
      # LAN IP
      # ==========================================================

      - name: Configure LAN IP
        shell: bash
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}

        run: |
          set -euo pipefail

          LAN_IP="${INPUT_LAN_IP}"

          if [ -z "${LAN_IP}" ]; then
            LAN_IP="192.168.1.2"
          fi

          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"

          echo "LAN IP: ${LAN_IP}"


      # ==========================================================
      # 安装 ImageBuilder / APK 所需工具
      # ==========================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            unzip \
            xz-utils \
            gzip \
            zstd \
            file \
            qemu-utils \
            rsync \
            python3


      # ==========================================================
      # 下载官方 OpenWrt ImageBuilder
      # ==========================================================

      - name: Download OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"

          echo
          echo "=========================================="
          echo "Downloading OpenWrt ImageBuilder"
          echo "=========================================="

          wget -q --show-progress \
            "${BASE_URL}/openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst" \
            -O imagebuilder.tar.zst

          mkdir -p imagebuilder

          tar \
            --use-compress-program=unzstd \
            -xf imagebuilder.tar.zst \
            --strip-components=1 \
            -C imagebuilder

          echo
          echo "ImageBuilder:"
          ls -lah imagebuilder


      # ==========================================================
      # 配置第三方 APK 仓库
      # ==========================================================

      - name: Configure APK repositories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p imagebuilder/repositories

          cat > imagebuilder/repositories/custom.conf <<'EOF'
          https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/packages
          EOF

          echo
          echo "Repository configuration prepared."


      # ==========================================================
      # 复制 files
      # ==========================================================

      - name: Install custom files
        shell: bash
        run: |
          set -euo pipefail

          if [ -d files ]; then
            echo "Installing custom files..."

            rsync -a \
              files/ \
              imagebuilder/files/
          else
            echo "No files directory found."
          fi


      # ==========================================================
      # 加载自定义 APK 包列表
      # ==========================================================

      - name: Load custom package list
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f shell/apk-custom-packages.sh ]; then
            echo "ERROR: shell/apk-custom-packages.sh not found."
            exit 1
          fi

          source shell/apk-custom-packages.sh

          if [ -z "${CUSTOM_PACKAGES:-}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "Custom packages"
          echo "=========================================="

          printf '%s\n' "${CUSTOM_PACKAGES}"

          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "${GITHUB_ENV}"


      # ==========================================================
      # 下载第三方 APK 仓库
      #
      # 这里使用 APK 仓库方式，不再 clone LuCI feed。
      # ==========================================================

      - name: Prepare third-party APK repositories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-repositories

          echo
          echo "=========================================="
          echo "Third-party APK repositories"
          echo "=========================================="

          echo "OpenWrt official repository:"
          echo "https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/packages"

          echo
          echo "PassWall:"
          echo "https://github.com/Openwrt-Passwall/openwrt-passwall"

          echo
          echo "Aurora:"
          echo "https://github.com/eamonxg/luci-theme-aurora"

          echo
          echo "Bandix:"
          echo "https://github.com/timsaya/openwrt-bandix"


      # ==========================================================
      # 下载 PassWall APK
      # ==========================================================

      - name: Prepare PassWall APK repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third-party/passwall

          echo "PassWall APK repository will be resolved during package installation."

          cat > third-party/passwall/README.txt <<'EOF'
          PassWall source:
          https://github.com/Openwrt-Passwall/openwrt-passwall

          PassWall packages:
          https://github.com/Openwrt-Passwall/openwrt-passwall-packages
          EOF


      # ==========================================================
      # 下载 Aurora APK
      # ==========================================================

      - name: Prepare Aurora APK repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third-party/aurora

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            third-party/aurora/source

          echo
          echo "Aurora source downloaded."

          find third-party/aurora/source \
            -type f \
            -name Makefile \
            -print || true


      # ==========================================================
      # 下载 Bandix APK
      # ==========================================================

      - name: Prepare Bandix APK repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third-party/bandix

          git clone \
            --depth=1 \
            https://github.com/timsaya/openwrt-bandix.git \
            third-party/bandix/source

          echo
          echo "Bandix source downloaded."

          find third-party/bandix/source \
            -type f \
            -name Makefile \
            -print || true


      # ==========================================================
      # OpenClash
      # ==========================================================

      - name: Prepare OpenClash
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third-party/openclash

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            third-party/openclash/source

          echo
          echo "OpenClash source downloaded."

          find third-party/openclash/source \
            -type f \
            -name Makefile \
            -print || true


      # ==========================================================
      # 生成 ImageBuilder package 列表
      # ==========================================================

      - name: Generate package list
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          cat > build/packages.txt <<EOF
          luci
          luci-i18n-base-zh-cn
          ppp
          ppp-mod-pppoe
          kmod-pppoe
          luci-proto-ipv6
          odhcp6c
          odhcpd-ipv6only
          mwan3
          luci-app-mwan3
          luci-i18n-mwan3-zh-cn
          luci-app-ttyd
          luci-i18n-ttyd-zh-cn
          luci-app-upnp
          luci-i18n-upnp-zh-cn
          luci-app-vlmcsd
          luci-i18n-vlmcsd-zh-cn
          luci-i18n-timewol-zh-cn
          luci-i18n-autoreboot-zh-cn
          luci-app-filebrowser-go
          luci-i18n-filebrowser-go-zh-cn
          EOF

          echo
          echo "Base packages:"
          cat build/packages.txt


      # ==========================================================
      # 检查 ImageBuilder
      # ==========================================================

      - name: Check ImageBuilder
        working-directory: imagebuilder
        run: |
          set -e

          if [ ! -x make-image.sh ]; then
            echo "ERROR: make-image.sh not found."
            exit 1
          fi

          ./make-image.sh info


      # ==========================================================
      # 构建 UEFI
      # ==========================================================

      - name: Build UEFI image
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../output

          PACKAGES="$(tr '\n' ' ' < ../build/packages.txt)"

          echo
          echo "=========================================="
          echo "Building OpenWrt UEFI"
          echo "=========================================="

          ./make-image.sh \
            TARGET_FILES="files" \
            PACKAGES="${PACKAGES}" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}"


      # ==========================================================
      # 查找 UEFI 镜像
      # ==========================================================

      - name: Locate UEFI image
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "Available output files:"
          find imagebuilder/bin \
            -maxdepth 3 \
            -type f \
            -print

          IMAGE="$(
            find imagebuilder/bin \
              -type f \
              \( \
                -name '*combined-efi.img.gz' \
                -o \
                -name '*combined-efi.img' \
              \) |
            head -1
          )"

          if [ -z "${IMAGE}" ]; then
            echo
            echo "ERROR: UEFI image not found."
            exit 1
          fi

          cp "${IMAGE}" \
            "output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          echo "UEFI image:"
          ls -lh output


      # ==========================================================
      # 生成 QCOW2
      # ==========================================================

      - name: Create QCOW2
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          if [ ! -f "${IMAGE}" ]; then
            echo "ERROR: UEFI image does not exist."
            exit 1
          fi

          gzip -dc \
            "${IMAGE}" \
            > output/openwrt.raw

          qemu-img convert \
            -f raw \
            -O qcow2 \
            output/openwrt.raw \
            "output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"

          rm -f output/openwrt.raw

          echo
          echo "QCOW2:"
          ls -lh output


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: output
        run: |
          set -e

          sha256sum \
            *.img.gz \
            *.qcow2 \
            > sha256sums.txt

          cat sha256sums.txt


      # ==========================================================
      # 构建信息
      # ==========================================================

      - name: Generate build information
        shell: bash
        run: |
          set -e

          cat > output/build-info.txt <<EOF
          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME}

          LAN:
          ${LAN_IP}

          Network:
          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          IPv6:
          Enabled

          Images:
          UEFI
          QCOW2
          EOF


      # ==========================================================
      # 删除空文件
      # ==========================================================

      - name: Remove empty files
        shell: bash
        run: |
          set -e

          find output \
            -type f \
            -size 0 \
            -delete

          echo
          echo "Final files:"
          ls -lh output


      # ==========================================================
      # Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"
          generate_release_notes: false

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ env.LAN_IP }}`
            - IPv6: Enabled

            ## Images

            - UEFI
            - QCOW2

          files: |
            output/*.img.gz
            output/*.qcow2
            output/sha256sums.txt
            output/build-info.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
