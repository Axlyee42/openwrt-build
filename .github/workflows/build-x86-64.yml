name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        required: true
        default: "25.12.5"

      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.1.2"

      rootfs_size:
        description: "Firmware size"
        required: true
        type: choice
        default: "4G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      filesystem:
        description: "Filesystem"
        required: true
        type: choice
        default: "ext4"
        options:
          - "ext4"
          - "squashfs"

      qcow2:
        description: "Build QCOW2"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      LAN_IP: ${{ inputs.lan_ip }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
      FILESYSTEM: ${{ inputs.filesystem }}
      BUILD_QCOW2: ${{ inputs.qcow2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            gzip \
            git \
            qemu-utils \
            tar \
            wget \
            xz-utils \
            zstd

      - name: Download OpenWrt x86-64 ImageBuilder
        shell: bash
        run: |
          set -euxo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          WORK="${RUNNER_TEMP}/imagebuilder"
          rm -rf "${WORK}"
          mkdir -p "${WORK}"

          cd "${WORK}"

          wget -q --show-progress \
            "${BASE_URL}/${ARCHIVE}"

          tar --zstd -xf "${ARCHIVE}"

          IMAGEBUILDER_DIR="$(
            find "${WORK}" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name 'openwrt-imagebuilder-*' \
              -print \
              | head -n 1
          )"

          test -n "${IMAGEBUILDER_DIR}"
          test -f "${IMAGEBUILDER_DIR}/Makefile"

          echo "IMAGEBUILDER_DIR=${IMAGEBUILDER_DIR}" >> "${GITHUB_ENV}"

          echo "ImageBuilder:"
          echo "${IMAGEBUILDER_DIR}"

      - name: Prepare third-party APK packages
        shell: bash
        run: |
          set -euxo pipefail

          test -f scripts/apk-custom-packages.sh
          chmod +x scripts/apk-custom-packages.sh

          IMAGEBUILDER_DIR="${IMAGEBUILDER_DIR}" \
            scripts/apk-custom-packages.sh

          test -s "${IMAGEBUILDER_DIR}/.third-party-packages"

          CUSTOM_PACKAGES="$(
            tr '\n' ' ' < "${IMAGEBUILDER_DIR}/.third-party-packages"
          )"

          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "${GITHUB_ENV}"

          echo
          echo "Selected third-party packages:"
          cat "${IMAGEBUILDER_DIR}/.third-party-packages"

          echo
          echo "Local APK files:"
          find "${IMAGEBUILDER_DIR}/packages" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' \
            | sort

      - name: Prepare custom files
        shell: bash
        run: |
          set -euxo pipefail

          TARGET="${IMAGEBUILDER_DIR}/files/etc/uci-defaults"

          mkdir -p "${TARGET}"

          cp \
            files/etc/uci-defaults/99-custom.sh \
            "${TARGET}/99-custom.sh"

          sed -i \
            "s/__LAN_IP__/${LAN_IP}/g" \
            "${TARGET}/99-custom.sh"

          chmod +x \
            "${TARGET}/99-custom.sh"

          echo "LAN IP configured as: ${LAN_IP}"

      - name: Configure filesystem
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"

          test -f .config

          case "${FILESYSTEM}" in
            ext4)
              echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
              echo "# CONFIG_TARGET_ROOTFS_SQUASHFS is not set" >> .config
              ;;

            squashfs)
              echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
              echo "# CONFIG_TARGET_ROOTFS_EXT4FS is not set" >> .config
              ;;

            *)
              echo "Unsupported filesystem: ${FILESYSTEM}"
              exit 1
              ;;
          esac

          # Let Kconfig normalize the duplicate/overridden entries.
          make defconfig

          echo
          echo "Final rootfs configuration:"
          grep -E \
            '^CONFIG_TARGET_ROOTFS_(EXT4FS|SQUASHFS)=' \
            .config \
            || true

      - name: Build OpenWrt image
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"

          ROOTFS_PARTSIZE="$(( ${ROOTFS_SIZE%G} * 1024 ))"

          BASE_PACKAGES="
            curl
            luci
            luci-i18n-base-zh-cn
            luci-i18n-firewall-zh-cn
            luci-i18n-package-manager-zh-cn
            luci-i18n-ttyd-zh-cn
            luci-theme-bootstrap
            luci-theme-argon
            luci-app-argon-config
            luci-i18n-argon-config-zh-cn
            openssh-sftp-server
          "

          PACKAGES="${BASE_PACKAGES} ${CUSTOM_PACKAGES}"

          echo "============================================================"
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "Target          : x86/64"
          echo "LAN IP          : ${LAN_IP}"
          echo "Firmware size   : ${ROOTFS_SIZE}"
          echo "Filesystem      : ${FILESYSTEM}"
          echo "QCOW2           : ${BUILD_QCOW2}"
          echo "Rootfs partsize : ${ROOTFS_PARTSIZE} MiB"
          echo "============================================================"
          echo
          echo "Packages:"
          printf '%s\n' "${PACKAGES}"
          echo

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="${IMAGEBUILDER_DIR}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}"

      - name: Collect UEFI image
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_DIR="${IMAGEBUILDER_DIR}/bin/targets/x86/64"
          OUT="${GITHUB_WORKSPACE}/release"

          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          shopt -s nullglob

          case "${FILESYSTEM}" in
            ext4)
              candidates=(
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img
              )
              ;;

            squashfs)
              candidates=(
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img
              )
              ;;
          esac

          if (( ${#candidates[@]} == 0 )); then
            echo "ERROR: UEFI ${FILESYSTEM} image was not generated."
            echo
            echo "ImageBuilder output:"
            find "${BUILD_DIR}" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
            exit 1
          fi

          SRC="${candidates[0]}"
          IMG="${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.img"

          case "${SRC}" in
            *.gz)
              gzip -dc "${SRC}" > "${IMG}"
              ;;
            *)
              cp "${SRC}" "${IMG}"
              ;;
          esac

          test -s "${IMG}"

          echo "Generated UEFI image:"
          ls -lh "${IMG}"

      - name: Build QCOW2
        if: ${{ inputs.qcow2 }}
        shell: bash
        run: |
          set -euxo pipefail

          IMG="${GITHUB_WORKSPACE}/release/openwrt-x86-64-uefi-${FILESYSTEM}.img"
          QCOW2="${GITHUB_WORKSPACE}/release/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2"

          test -s "${IMG}"

          qemu-img convert \
            -p \
            -f raw \
            -O qcow2 \
            "${IMG}" \
            "${QCOW2}"

          qemu-img info "${QCOW2}"

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}/release"

          sha256sum * > sha256sums.txt

          cat sha256sums.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ inputs.openwrt_version }}-${{ inputs.filesystem }}-${{ inputs.rootfs_size }}
          path: release/*
          if-no-files-found: error
