name: Build OpenWrt 25.12.x x86-64 ImageBuilder

on:

  workflow_dispatch:

    inputs:

      openwrt_version:
        description: "OpenWrt 版本，留空自动使用最新 25.12.x"
        required: false
        default: ""
        type: string

      lan_ip:
        description: "LAN 管理地址"
        required: true
        default: "192.168.1.2"
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      bios:
        description: "生成 BIOS ext4 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI ext4 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2 镜像"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK 镜像"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW 镜像"
        required: true
        default: false
        type: boolean


  # 每天检查一次 OpenWrt 25.12.x
  #
  # 这里只负责检查。
  # 只有发现新版本才真正构建。

  schedule:

    - cron: "0 3 * * *"


permissions:

  contents: write


jobs:

  # ==========================================================
  # 检查 OpenWrt 最新版本
  # ==========================================================

  check-update:

    name: Check OpenWrt update

    runs-on: ubuntu-24.04

    outputs:

      should_build: ${{ steps.check.outputs.should_build }}

      version: ${{ steps.check.outputs.version }}


    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Check latest OpenWrt 25.12.x

        id: check

        shell: bash

        run: |

          set -euo pipefail


          echo
          echo "=========================================="
          echo "Checking OpenWrt 25.12.x"
          echo "=========================================="
          echo


          # 获取官方最新 25.12.x

          LATEST_VERSION="$(
            git ls-remote \
              --tags \
              --refs \
              https://github.com/openwrt/openwrt.git |
            sed -n \
              's#.*refs/tags/v\(25\.12\.[0-9]\+\)$#\1#p' |
            sort -V |
            tail -n 1
          )"


          if [ -z "${LATEST_VERSION}" ]; then

            echo "ERROR: Unable to determine latest OpenWrt 25.12.x."

            exit 1

          fi


          echo "Latest OpenWrt:"
          echo "${LATEST_VERSION}"


          # 读取本仓库已经成功构建的版本

          if [ -f openwrt-version ]; then

            LAST_VERSION="$(
              tr -d '[:space:]' < openwrt-version
            )"

          else

            LAST_VERSION=""

          fi


          echo
          echo "Last built version:"
          echo "${LAST_VERSION:-NONE}"


          # 手动运行直接构建

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then

            SHOULD_BUILD="true"


          # 没有版本记录

          elif [ -z "${LAST_VERSION}" ]; then

            SHOULD_BUILD="true"


          # 发现新版本

          elif [ "${LATEST_VERSION}" != "${LAST_VERSION}" ]; then

            SHOULD_BUILD="true"


          # 没有更新

          else

            SHOULD_BUILD="false"

          fi


          echo
          echo "Should build:"
          echo "${SHOULD_BUILD}"


          echo "version=${LATEST_VERSION}" \
            >> "${GITHUB_OUTPUT}"


          echo "should_build=${SHOULD_BUILD}" \
            >> "${GITHUB_OUTPUT}"


  # ==========================================================
  # ImageBuilder
  # ==========================================================

  build:

    name: Build OpenWrt ImageBuilder

    needs:

      - check-update


    if: |

      needs.check-update.outputs.should_build == 'true'


    runs-on: ubuntu-24.04


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4


      # ======================================================
      # 设置 OpenWrt 版本
      # ======================================================

      - name: Set OpenWrt version

        shell: bash

        run: |

          set -euo pipefail


          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
             [ -n "${{ inputs.openwrt_version }}" ]; then

            VERSION="${{ inputs.openwrt_version }}"

          else

            VERSION="${{ needs.check-update.outputs.version }}"

          fi


          if ! echo "${VERSION}" |
             grep -Eq '^25\.12\.[0-9]+$'; then

            echo "ERROR: Invalid OpenWrt version: ${VERSION}"

            exit 1

          fi


          echo "OPENWRT_VERSION=${VERSION}" \
            >> "${GITHUB_ENV}"


          echo
          echo "OpenWrt ${VERSION}"


      # ======================================================
      # 固件大小
      # ======================================================

      - name: Set rootfs size

        shell: bash

        run: |

          set -euo pipefail


          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then

            SIZE="${{ inputs.rootfs_size }}"

          else

            SIZE="4G"

          fi


          case "${SIZE}" in

            1G)
              ROOTFS_PARTSIZE=1024
              ;;

            2G)
              ROOTFS_PARTSIZE=2048
              ;;

            3G)
              ROOTFS_PARTSIZE=3072
              ;;

            4G)
              ROOTFS_PARTSIZE=4096
              ;;

            *)
              echo "ERROR: Invalid rootfs size."

              exit 1
              ;;

          esac


          echo "ROOTFS_SIZE=${SIZE}" \
            >> "${GITHUB_ENV}"


          echo "ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}" \
            >> "${GITHUB_ENV}"


          echo
          echo "RootFS size: ${SIZE}"
          echo "Partition size: ${ROOTFS_PARTSIZE} MB"


      # ======================================================
      # 安装 ImageBuilder 所需工具
      # ======================================================

      - name: Install dependencies

        shell: bash

        run: |

          set -euo pipefail


          sudo apt-get update


          sudo apt-get install -y \
            wget \
            curl \
            git \
            zstd \
            xz-utils \
            gzip \
            tar \
            qemu-utils \
            unzip \
            file


      # ======================================================
      # 下载官方 OpenWrt ImageBuilder
      # ======================================================

      - name: Download OpenWrt ImageBuilder

        shell: bash

        run: |

          set -euo pipefail


          IMAGEBUILDER="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"


          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${IMAGEBUILDER}"


          echo
          echo "=========================================="
          echo "Download ImageBuilder"
          echo "=========================================="
          echo


          echo "${URL}"


          wget \
            --progress=bar:force \
            -O "${IMAGEBUILDER}" \
            "${URL}"


          rm -rf imagebuilder


          mkdir imagebuilder


          tar \
            --use-compress-program=unzstd \
            -xf "${IMAGEBUILDER}" \
            -C imagebuilder \
            --strip-components=1


          echo
          echo "ImageBuilder ready."


      # ======================================================
      # ImageBuilder 信息
      # ======================================================

      - name: Show ImageBuilder information

        working-directory: imagebuilder

        shell: bash

        run: |

          set -euo pipefail

          make info


      # ======================================================
      # 下载第三方 APK 仓库
      #
      # 25.12.x 使用 APK。
      #
      # 不进行源码编译。
      #
      # 直接使用 wukongdaily/apk 中已经准备好的
      # x86 第三方 APK / RUN 包。
      # ======================================================

      - name: Download third-party APK repository

        shell: bash

        run: |

          set -euo pipefail


          rm -rf third-party-apk


          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk


          echo
          echo "Third-party APK repository downloaded."


      # ======================================================
      # 准备第三方 APK
      # ======================================================

      - name: Prepare third-party APK packages

        shell: bash

        run: |

          set -euo pipefail


          rm -rf extra-packages

          rm -rf packages


          mkdir -p extra-packages

          mkdir -p packages


          # --------------------------------------------------
          # x86 第三方包
          # --------------------------------------------------

          if [ -d third-party-apk/run/x86 ]; then

            cp -rf \
              third-party-apk/run/x86/. \
              extra-packages/

          else

            echo "ERROR: third-party-apk/run/x86 not found."

            exit 1

          fi


          echo
          echo "=========================================="
          echo "Third-party files"
          echo "=========================================="
          echo


          find extra-packages \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" |
          sort


          # --------------------------------------------------
          # 使用官方 ImageBuilder 项目的处理逻辑
          # --------------------------------------------------

          BASE_DIR="extra-packages"

          TEMP_DIR="${BASE_DIR}/temp-unpack"

          TARGET_DIR="packages"


          rm -rf "${TEMP_DIR}"

          mkdir -p "${TEMP_DIR}"

          mkdir -p "${TARGET_DIR}"


          # --------------------------------------------------
          # 解包 RUN
          # --------------------------------------------------

          for RUN_FILE in "${BASE_DIR}"/*.run; do

            [ -f "${RUN_FILE}" ] || continue


            echo
            echo "Unpacking:"
            echo "$(basename "${RUN_FILE}")"


            chmod +x "${RUN_FILE}"


            (
              cd "${TEMP_DIR}"

              sh "${GITHUB_WORKSPACE}/${RUN_FILE}" \
                --noexec
            ) || {

              echo "WARNING: unable to extract ${RUN_FILE}"

            }

          done


          # --------------------------------------------------
          # 收集 APK
          # --------------------------------------------------

          find "${TEMP_DIR}" \
            -type f \
            -name "*.apk" \
            -exec cp -f {} "${TARGET_DIR}/" \;


          find "${BASE_DIR}" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -exec cp -f {} "${TARGET_DIR}/" \;


          find "${BASE_DIR}" \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name "*.apk" \
            -exec cp -f {} "${TARGET_DIR}/" \;


          echo
          echo "=========================================="
          echo "Prepared APK packages"
          echo "=========================================="
          echo


          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" |
          sort


      # ======================================================
      # 复制第三方 APK 到 ImageBuilder
      # ======================================================

      - name: Install third-party APK into ImageBuilder

        shell: bash

        run: |

          set -euo pipefail


          cp -f \
            packages/*.apk \
            imagebuilder/packages/ \
            || true


          echo
          echo "ImageBuilder custom packages:"


          find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" |
          sort


      # ======================================================
      # 自定义 files
      # ======================================================

      - name: Prepare custom files

        shell: bash

        run: |

          set -euo pipefail


          rm -rf files


          mkdir -p \
            files/etc/config \
            files/etc/uci-defaults


      # ======================================================
      # 生成 network
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2~eth5 = LAN
      #
      # IPv6 开启
      # ======================================================

      - name: Generate network configuration

        shell: bash

        env:

          WAN1_USER: ${{ secrets.WAN1_USER }}

          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}

          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |

          set -euo pipefail


          if [ -z "${WAN1_USER}" ] ||
             [ -z "${WAN1_PASS}" ] ||
             [ -z "${WAN2_USER}" ] ||
             [ -z "${WAN2_PASS}" ]; then

            echo
            echo "ERROR: PPPoE secrets are missing."
            echo
            echo "Please create these GitHub Secrets:"
            echo
            echo "WAN1_USER"
            echo "WAN1_PASS"
            echo "WAN2_USER"
            echo "WAN2_PASS"
            echo

            exit 1

          fi


          LAN_IP="${{ inputs.lan_ip }}"


          if [ -z "${LAN_IP}" ]; then

            LAN_IP="192.168.1.2"

          fi


          cat > files/etc/config/network <<EOF

config interface 'loopback'
    option device 'lo'
    option proto 'static'
    option ipaddr '127.0.0.1'
    option netmask '255.0.0.0'


config device
    option name 'br-lan'
    option type 'bridge'
    list ports 'eth2'
    list ports 'eth3'
    list ports 'eth4'
    list ports 'eth5'


config interface 'lan'
    option device 'br-lan'
    option proto 'static'
    option ipaddr '${LAN_IP}'
    option netmask '255.255.255.0'
    option ip6assign '64'


config interface 'wan'
    option device 'eth0'
    option proto 'pppoe'
    option username '${WAN1_USER}'
    option password '${WAN1_PASS}'
    option ipv6 'auto'


config interface 'wan6'
    option device '@wan'
    option proto 'dhcpv6'
    option reqaddress 'try'
    option reqprefix 'auto'


config interface 'wanb'
    option device 'eth1'
    option proto 'pppoe'
    option username '${WAN2_USER}'
    option password '${WAN2_PASS}'
    option ipv6 'auto'


config interface 'wanb6'
    option device '@wanb'
    option proto 'dhcpv6'
    option reqaddress 'try'
    option reqprefix 'auto'

EOF


      # ======================================================
      # DHCP / IPv6
      # ======================================================

      - name: Generate DHCP configuration

        shell: bash

        run: |

          set -euo pipefail


          cat > files/etc/config/dhcp <<'EOF'

config dnsmasq
    option domainneeded '1'
    option boguspriv '1'
    option localise_queries '1'
    option rebind_protection '1'
    option local '/lan/'
    option domain 'lan'
    option expandhosts '1'
    option authoritative '1'
    option readethers '1'
    option leasefile '/tmp/dhcp.leases'
    option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


config dhcp 'lan'
    option interface 'lan'
    option start '100'
    option limit '150'
    option leasetime '12h'
    option dhcpv4 'server'
    option dhcpv6 'server'
    option ra 'server'
    option ra_management '1'


config dhcp 'wan'
    option interface 'wan'
    option ignore '1'


config dhcp 'wanb'
    option interface 'wanb'
    option ignore '1'


config odhcpd 'odhcpd'
    option maindhcp '0'
    option leasefile '/tmp/hosts/odhcpd'
    option leasetrigger '/usr/sbin/odhcpd-update'
    option loglevel '4'

EOF


      # ======================================================
      # 默认简体中文
      # ======================================================

      - name: Set default Chinese language

        shell: bash

        run: |

          set -euo pipefail


          cat > files/etc/uci-defaults/99-default-language <<'EOF'

#!/bin/sh

uci -q set luci.main.lang='zh_cn'

uci -q commit luci

exit 0

EOF


          chmod +x \
            files/etc/uci-defaults/99-default-language


      # ======================================================
      # 最终软件包
      # ======================================================

      - name: Prepare package list

        shell: bash

        run: |

          set -euo pipefail


          PACKAGES=""


          # ==================================================
          # LuCI
          # ==================================================

          PACKAGES="${PACKAGES} luci"

          PACKAGES="${PACKAGES} luci-ssl"

          PACKAGES="${PACKAGES} luci-i18n-base-zh-cn"

          PACKAGES="${PACKAGES} luci-app-package-manager"

          PACKAGES="${PACKAGES} luci-i18n-package-manager-zh-cn"


          # ==================================================
          # 网络
          # ==================================================

          PACKAGES="${PACKAGES} luci-app-mwan3"

          PACKAGES="${PACKAGES} luci-i18n-mwan3-zh-cn"

          PACKAGES="${PACKAGES} luci-app-upnp"

          PACKAGES="${PACKAGES} luci-i18n-upnp-zh-cn"

          PACKAGES="${PACKAGES} luci-app-ttyd"

          PACKAGES="${PACKAGES} luci-i18n-ttyd-zh-cn"


          # ==================================================
          # PPPoE
          # ==================================================

          PACKAGES="${PACKAGES} ppp"

          PACKAGES="${PACKAGES} ppp-mod-pppoe"

          PACKAGES="${PACKAGES} kmod-pppoe"

          PACKAGES="${PACKAGES} luci-proto-ppp"


          # ==================================================
          # IPv6
          # ==================================================

          PACKAGES="${PACKAGES} luci-proto-ipv6"

          PACKAGES="${PACKAGES} odhcp6c"

          PACKAGES="${PACKAGES} odhcpd-ipv6only"


          # ==================================================
          # FileManager
          # ==================================================

          PACKAGES="${PACKAGES} luci-app-filemanager"

          PACKAGES="${PACKAGES} luci-i18n-filemanager-zh-cn"


          # ==================================================
          # FileBrowser Go
          # ==================================================

          PACKAGES="${PACKAGES} luci-app-filebrowser-go"

          PACKAGES="${PACKAGES} luci-i18n-filebrowser-go-zh-cn"


          # ==================================================
          # Timewol
          # ==================================================

          PACKAGES="${PACKAGES} luci-app-timewol"

          PACKAGES="${PACKAGES} luci-i18n-timewol-zh-cn"


          # ==================================================
          # VLMCSd
          # ==================================================

          PACKAGES="${PACKAGES} luci-app-vlmcsd"

          PACKAGES="${PACKAGES} luci-i18n-vlmcsd-zh-cn"


          # ==================================================
          # Autoreboot
          # ==================================================

          PACKAGES="${PACKAGES} luci-app-autoreboot"

          PACKAGES="${PACKAGES} luci-i18n-autoreboot-zh-cn"


          # ==================================================
          # Aurora
          # ==================================================

          PACKAGES="${PACKAGES} luci-theme-aurora"

          PACKAGES="${PACKAGES} luci-app-aurora-config"

          PACKAGES="${PACKAGES} luci-i18n-aurora-config-zh-cn"


          # ==================================================
          # Bandix
          # ==================================================

          PACKAGES="${PACKAGES} bandix"

          PACKAGES="${PACKAGES} luci-app-bandix"

          PACKAGES="${PACKAGES} luci-i18n-bandix-zh-cn"


          # ==================================================
          # Run
          # ==================================================

          PACKAGES="${PACKAGES} luci-app-run"


          # ==================================================
          # PassWall / 代理组件
          # ==================================================

          PACKAGES="${PACKAGES} geoview"

          PACKAGES="${PACKAGES} xray-core"

          PACKAGES="${PACKAGES} sing-box"

          PACKAGES="${PACKAGES} hysteria"

          PACKAGES="${PACKAGES} luci-i18n-passwall-zh-cn"


          # ==================================================
          # OpenClash
          # ==================================================

          PACKAGES="${PACKAGES} luci-app-openclash"

          PACKAGES="${PACKAGES} luci-compat"

          PACKAGES="${PACKAGES} kmod-tun"

          PACKAGES="${PACKAGES} kmod-inet-diag"

          PACKAGES="${PACKAGES} kmod-nft-tproxy"

          PACKAGES="${PACKAGES} bash"

          PACKAGES="${PACKAGES} curl"

          PACKAGES="${PACKAGES} ip-full"

          PACKAGES="${PACKAGES} unzip"


          # ==================================================
          # 第三方 APK
          #
          # 这里直接使用 apk-custom-packages.sh
          # ==================================================

          source \
            "${GITHUB_WORKSPACE}/shell/apk-custom-packages.sh"


          PACKAGES="${PACKAGES} ${CUSTOM_PACKAGES}"


          # 去重

          PACKAGES="$(
            printf '%s\n' ${PACKAGES} |
            awk '!seen[$0]++' |
            tr '\n' ' '
          )"


          PACKAGES="$(
            echo "${PACKAGES}" |
            xargs
          )"


          echo
          echo "=========================================="
          echo "FINAL PACKAGE LIST"
          echo "=========================================="
          echo


          printf '%s\n' ${PACKAGES} |
          sort


          echo


          echo \
            "FINAL_PACKAGES=${PACKAGES}" \
            >> "${GITHUB_ENV}"


      # ======================================================
      # 构建
      #
      # 这里是真正的 ImageBuilder。
      #
      # 不执行：
      #
      # make world
      # make toolchain
      # make target/linux/compile
      #
      # 只执行：
      #
      # make image
      # ======================================================

      - name: Build image

        working-directory: imagebuilder

        shell: bash

        run: |

          set -euo pipefail


          echo
          echo "=========================================="
          echo "Building OpenWrt ImageBuilder"
          echo "=========================================="
          echo


          make image \
            PROFILE="generic" \
            PACKAGES="${FINAL_PACKAGES}" \
            FILES="${GITHUB_WORKSPACE}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            V=s


      # ======================================================
      # Build 日期
      # ======================================================

      - name: Set build date

        shell: bash

        run: |

          set -euo pipefail


          BUILD_DATE="$(
            date -u '+%Y%m%d'
          )"


          BUILD_TIME="$(
            date -u '+%H%M%S'
          )"


          echo "BUILD_DATE=${BUILD_DATE}" \
            >> "${GITHUB_ENV}"


          echo "BUILD_TIME=${BUILD_TIME}" \
            >> "${GITHUB_ENV}"


      # ======================================================
      # 准备 Release
      # ======================================================

      - name: Prepare release directory

        shell: bash

        run: |

          set -euo pipefail


          rm -rf release

          mkdir -p release


      # ======================================================
      # BIOS EXT4
      # ======================================================

      - name: Export BIOS ext4 image

        if: |

          github.event_name != 'workflow_dispatch' ||
          inputs.bios == true

        shell: bash

        run: |

          set -euo pipefail


          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined.img.gz' |
            head -n 1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: BIOS ext4 image not found."

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-BIOS-ext4.img.gz"


      # ======================================================
      # UEFI EXT4
      # ======================================================

      - name: Export UEFI ext4 image

        if: |

          github.event_name != 'workflow_dispatch' ||
          inputs.uefi == true

        shell: bash

        run: |

          set -euo pipefail


          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -n 1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI ext4 image not found."

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI-ext4.img.gz"


      # ======================================================
      # RAW 中间镜像
      # ======================================================

      - name: Prepare RAW image

        if: |

          github.event_name != 'workflow_dispatch' ||
          inputs.qcow2 == true ||
          inputs.vmdk == true ||
          inputs.raw == true

        shell: bash

        run: |

          set -euo pipefail


          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -n 1
          )


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI ext4 image not found."

            exit 1

          fi


          gzip -dc \
            "${IMAGE}" \
            > openwrt.raw


      # ======================================================
      # QCOW2
      # ======================================================

      - name: Create QCOW2

        if: |

          github.event_name != 'workflow_dispatch' ||
          inputs.qcow2 == true

        shell: bash

        run: |

          set -euo pipefail


          qemu-img convert \
            -f raw \
            -O qcow2 \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.qcow2"


      # ======================================================
      # VMDK
      # ======================================================

      - name: Create VMDK

        if: |

          github.event_name == 'workflow_dispatch' &&
          inputs.vmdk == true

        shell: bash

        run: |

          set -euo pipefail


          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.vmdk"


      # ======================================================
      # RAW
      # ======================================================

      - name: Export RAW

        if: |

          github.event_name == 'workflow_dispatch' &&
          inputs.raw == true

        shell: bash

        run: |

          set -euo pipefail


          cp openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.raw"


      # ======================================================
      # SHA256
      # ======================================================

      - name: Generate SHA256

        shell: bash

        run: |

          set -euo pipefail


          cd release


          sha256sum \
            * \
            > sha256sums


      # ======================================================
      # Build 信息
      # ======================================================

      - name: Create build information

        shell: bash

        run: |

          LAN_IP="${{ inputs.lan_ip }}"


          if [ -z "${LAN_IP}" ]; then

            LAN_IP="192.168.1.2"

          fi


          cat > release/build-info.txt <<EOF

OpenWrt Custom ImageBuilder
============================

OpenWrt:
${OPENWRT_VERSION}

Target:
x86-64

RootFS:
${ROOTFS_SIZE}

Build date:
${BUILD_DATE}

Build time:
${BUILD_TIME}


Network
=======

eth0:
WAN / PPPoE

eth1:
WANB / PPPoE

eth2:
LAN

eth3:
LAN

eth4:
LAN

eth5:
LAN

LAN IP:
${LAN_IP}

IPv6:
Enabled


Build method
============

Official OpenWrt ImageBuilder

No source compilation.
No toolchain compilation.
No kernel compilation.

EOF


      # ======================================================
      # 显示最终文件
      # ======================================================

      - name: Show release files

        shell: bash

        run: |

          set -euo pipefail


          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="
          echo


          ls -lh release


      # ======================================================
      # GitHub Release
      # ======================================================

      - name: Publish GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: "OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            基于 OpenWrt 官方 ImageBuilder 生成。

            ## 基本信息

            - OpenWrt：`${{ env.OPENWRT_VERSION }}`
            - Target：`x86-64`
            - RootFS：`${{ env.ROOTFS_SIZE }}`
            - Build date：`${{ env.BUILD_DATE }}`
            - Build time：`${{ env.BUILD_TIME }}`

            ## 网络

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN：`${{ inputs.lan_ip || '192.168.1.2' }}`
            - IPv6：Enabled

            ## 固件

            - BIOS ext4
            - UEFI ext4
            - QCOW2（按选项）
            - VMDK（按选项）
            - RAW（按选项）

            ## 构建方式

            OpenWrt 25.12.x ImageBuilder。

            **不是源码编译。**

          files: |
            release/*

          token: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # 更新 openwrt-version
      #
      # 只有 Release 成功之后才更新。
      # ======================================================

      - name: Update openwrt-version

        shell: bash

        run: |

          set -euo pipefail


          echo "${OPENWRT_VERSION}" \
            > openwrt-version


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add openwrt-version


          if git diff --cached --quiet; then

            echo "openwrt-version already up to date."

            exit 0

          fi


          git commit \
            -m "Update OpenWrt version to ${OPENWRT_VERSION}"


          git push
