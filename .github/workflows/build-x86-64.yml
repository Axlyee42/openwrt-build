name: Build OpenWrt 25.12.x x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 版本，留空使用最新 25.12.x"
        required: false
        default: ""
        type: string

      lan_ip:
        description: "LAN 管理地址"
        required: true
        default: "192.168.1.2"
        type: string

      rootfs_size:
        description: "EXT4 固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      bios:
        description: "生成 BIOS EXT4 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI EXT4 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2 镜像"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK 镜像"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW 镜像"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

env:
  OPENWRT_BRANCH: "25.12"
  DEFAULT_LAN_IP: "192.168.1.2"
  DEFAULT_ROOTFS_SIZE: "4G"

jobs:

  check-version:
    name: Check latest OpenWrt 25.12.x
    runs-on: ubuntu-24.04

    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check latest OpenWrt version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking OpenWrt 25.12.x"
          echo "=========================================="

          LATEST_VERSION="$(
            git ls-remote \
              --tags \
              --refs \
              https://github.com/openwrt/openwrt.git |
            sed -nE 's#.*refs/tags/v(25\.12\.[0-9]+)$#\1#p' |
            sort -V |
            tail -n 1
          )"

          if [ -z "${LATEST_VERSION}" ]; then
            echo "ERROR: Cannot determine latest OpenWrt 25.12.x"
            exit 1
          fi

          echo "Latest version: ${LATEST_VERSION}"

          LAST_VERSION=""

          if [ -f openwrt-version ]; then
            LAST_VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi

          echo "Last built version: ${LAST_VERSION:-NONE}"

          SHOULD_BUILD="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            SHOULD_BUILD="true"
          elif [ -z "${LAST_VERSION}" ]; then
            SHOULD_BUILD="true"
          elif [ "${LATEST_VERSION}" != "${LAST_VERSION}" ]; then
            SHOULD_BUILD="true"
          fi

          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"
          echo "version=${LATEST_VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Should build: ${SHOULD_BUILD}"


  build:
    name: Build OpenWrt ImageBuilder
    needs: check-version

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            git \
            zstd \
            xz-utils \
            gzip \
            tar \
            unzip \
            file \
            qemu-utils \
            openssl \
            python3

      - name: Determine OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          LATEST_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="${LATEST_VERSION}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${MANUAL_VERSION}" ]; then
            VERSION="${MANUAL_VERSION}"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          echo "OpenWrt version: ${VERSION}"

      - name: Determine rootfs size
        shell: bash
        env:
          INPUT_SIZE: ${{ inputs.rootfs_size }}
        run: |
          set -euo pipefail

          SIZE="${DEFAULT_ROOTFS_SIZE}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_SIZE}" ]; then
            SIZE="${INPUT_SIZE}"
          fi

          case "${SIZE}" in
            1G)
              PARTSIZE="1024"
              ;;
            2G)
              PARTSIZE="2048"
              ;;
            3G)
              PARTSIZE="3072"
              ;;
            4G)
              PARTSIZE="4096"
              ;;
            *)
              echo "ERROR: Unsupported rootfs size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS size: ${SIZE}"
          echo "RootFS partition: ${PARTSIZE} MB"

      - name: Download official OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          IMAGEBUILDER="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${IMAGEBUILDER}"

          echo "=========================================="
          echo "Downloading official ImageBuilder"
          echo "=========================================="

          echo "${URL}"

          wget \
            --progress=bar:force \
            -O "${IMAGEBUILDER}" \
            "${URL}"

          rm -rf imagebuilder

          mkdir -p imagebuilder

          tar \
            --use-compress-program=unzstd \
            -xf "${IMAGEBUILDER}" \
            -C imagebuilder \
            --strip-components=1

          echo "ImageBuilder extracted."

      - name: Verify ImageBuilder
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -x ./make ]; then
            echo "ERROR: ImageBuilder make executable not found."
            exit 1
          fi

          make info

      - name: Prepare custom files
        shell: bash
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}
        run: |
          set -euo pipefail

          LAN_IP="${INPUT_LAN_IP:-${DEFAULT_LAN_IP}}"

          if [ -z "${WAN1_USER}" ] || [ -z "${WAN1_PASS}" ]; then
            echo "ERROR: WAN1_USER / WAN1_PASS secrets are required."
            exit 1
          fi

          if [ -z "${WAN2_USER}" ] || [ -z "${WAN2_PASS}" ]; then
            echo "ERROR: WAN2_USER / WAN2_PASS secrets are required."
            exit 1
          fi

          rm -rf files

          mkdir -p \
            files/etc/config \
            files/etc/uci-defaults \
            files/etc/apk/repositories.d

          cat > files/etc/config/network <<EOF
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'

          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 'auto'

          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 'auto'

          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'
          EOF

          cat > files/etc/config/dhcp <<'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'

          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'

          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          EOF

          cat > files/etc/uci-defaults/99-default-language <<'EOF'
          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-default-language

          echo "LAN IP: ${LAN_IP}"

      - name: Load third-party package list
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f shell/apk-custom-packages.sh ]; then
            echo "ERROR: shell/apk-custom-packages.sh not found."
            exit 1
          fi

          source shell/apk-custom-packages.sh

          if [ -z "${CUSTOM_PACKAGES:-}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty."
            exit 1
          fi

          CUSTOM_PACKAGES_ONE_LINE="$(
            printf '%s\n' "${CUSTOM_PACKAGES}" |
            tr '\n' ' ' |
            xargs
          )"

          if [ -z "${CUSTOM_PACKAGES_ONE_LINE}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty after normalization."
            exit 1
          fi

          printf 'CUSTOM_PACKAGES=%s\n' "${CUSTOM_PACKAGES_ONE_LINE}" >> "${GITHUB_ENV}"

          echo "=========================================="
          echo "Third-party APK packages"
          echo "=========================================="

          printf '%s\n' ${CUSTOM_PACKAGES_ONE_LINE}

      - name: Download third-party APK repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third-party-apk
          rm -rf extra-packages
          rm -rf packages

          mkdir -p \
            third-party-apk \
            extra-packages \
            packages

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk

          if [ ! -d third-party-apk/run/x86 ]; then
            echo "ERROR: third-party APK x86 directory not found."
            exit 1
          fi

          cp -a \
            third-party-apk/run/x86/. \
            extra-packages/

          echo "Third-party repository downloaded."

      - name: Extract third-party RUN packages
        shell: bash
        run: |
          set -euo pipefail

          TEMP_DIR="extra-packages/temp-unpack"

          rm -rf "${TEMP_DIR}"
          mkdir -p "${TEMP_DIR}"

          shopt -s nullglob

          RUN_FILES=(
            extra-packages/*.run
          )

          if [ "${#RUN_FILES[@]}" -eq 0 ]; then
            echo "No .run files found."
          fi

          for RUN_FILE in "${RUN_FILES[@]}"; do
            echo
            echo "=========================================="
            echo "Extracting: $(basename "${RUN_FILE}")"
            echo "=========================================="

            chmod +x "${RUN_FILE}"

            sh "${RUN_FILE}" \
              --target "${TEMP_DIR}" \
              --noexec
          done

          find "${TEMP_DIR}" \
            -type f \
            -name '*.apk' \
            -exec cp -f {} packages/ \;

          find extra-packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -exec cp -f {} packages/ \;

          find extra-packages \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name '*.apk' \
            -exec cp -f {} packages/ \;

          APK_COUNT="$(find packages -maxdepth 1 -type f -name '*.apk' | wc -l)"

          echo
          echo "Collected APK files: ${APK_COUNT}"

          if [ "${APK_COUNT}" -eq 0 ]; then
            echo "ERROR: No third-party APK files were collected."
            exit 1
          fi

          find packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' |
          sort

      - name: Generate fresh APK repository index
        shell: bash
        run: |
          set -euo pipefail

          APK="${GITHUB_WORKSPACE}/imagebuilder/staging_dir/host/bin/apk"

          if [ ! -x "${APK}" ]; then
            echo "ERROR: ImageBuilder host apk not found:"
            echo "${APK}"
            exit 1
          fi

          rm -f imagebuilder/packages/*.apk
          rm -f imagebuilder/packages/packages.adb

          cp \
            packages/*.apk \
            imagebuilder/packages/

          cd imagebuilder/packages

          "${APK}" mkndx \
            --allow-untrusted \
            --output packages.adb \
            *.apk

          if [ ! -s packages.adb ]; then
            echo "ERROR: packages.adb was not generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "Generated packages.adb"
          echo "=========================================="

          ls -lh packages.adb

          echo
          echo "Package index:"
          "${APK}" adbdump \
            --format json \
            packages.adb |
          head -c 5000

          echo

      - name: Verify requested third-party packages
        shell: bash
        run: |
          set -euo pipefail

          APK="${GITHUB_WORKSPACE}/imagebuilder/staging_dir/host/bin/apk"
          REPO="file://${GITHUB_WORKSPACE}/imagebuilder/packages/packages.adb"

          FAILED=0

          echo "=========================================="
          echo "Verifying requested third-party packages"
          echo "=========================================="

          for PACKAGE in ${CUSTOM_PACKAGES}; do
            if "${APK}" \
              --allow-untrusted \
              --repositories-file /dev/null \
              --repository "${REPO}" \
              search \
              "${PACKAGE}" |
              grep -q "^${PACKAGE}-"; then

              echo "OK: ${PACKAGE}"

            else

              echo "MISSING: ${PACKAGE}"
              FAILED=1

            fi
          done

          if [ "${FAILED}" -ne 0 ]; then
            echo
            echo "ERROR: Some requested third-party packages"
            echo "are missing from the generated APK repository."
            echo
            exit 1
          fi

      - name: Configure runtime third-party repositories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p files/etc/apk/repositories.d

          cat > files/etc/apk/repositories.d/passwall.list <<'EOF'
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/passwall_luci/packages.adb
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/passwall_packages/packages.adb
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/passwall2/packages.adb
          EOF

          echo "Runtime PassWall repositories configured."

      - name: Build OpenWrt image
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building OpenWrt ${OPENWRT_VERSION}"
          echo "=========================================="

          make image \
            PROFILE="generic" \
            PACKAGES="${CUSTOM_PACKAGES}" \
            FILES="${GITHUB_WORKSPACE}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            V=s

      - name: Set build timestamp
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DATE="$(date -u '+%Y%m%d')"
          BUILD_TIME="$(date -u '+%H%M%S')"

          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

      - name: Prepare release directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

      - name: Export BIOS EXT4
        if: github.event_name != 'workflow_dispatch' || inputs.bios
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined.img.gz' |
            head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: BIOS EXT4 image not found."
            exit 1
          fi

          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-BIOS-ext4.img.gz"

      - name: Export UEFI EXT4
        if: github.event_name != 'workflow_dispatch' || inputs.uefi
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI EXT4 image not found."
            exit 1
          fi

          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI-ext4.img.gz"

      - name: Prepare raw UEFI disk image
        if: github.event_name != 'workflow_dispatch' || inputs.qcow2 || inputs.vmdk || inputs.raw
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI EXT4 image not found."
            exit 1
          fi

          gzip -dc "${IMAGE}" > openwrt.raw

          ls -lh openwrt.raw

      - name: Create QCOW2
        if: github.event_name != 'workflow_dispatch' || inputs.qcow2
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O qcow2 \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.qcow2"

      - name: Create VMDK
        if: github.event_name == 'workflow_dispatch' && inputs.vmdk
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.vmdk"

      - name: Export RAW
        if: github.event_name == 'workflow_dispatch' && inputs.raw
        shell: bash
        run: |
          set -euo pipefail

          cp \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.raw"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum * > sha256sums

      - name: Create build information
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}
        shell: bash
        run: |
          set -euo pipefail

          LAN_IP="${INPUT_LAN_IP:-${DEFAULT_LAN_IP}}"

          cat > release/build-info.txt <<EOF
          OpenWrt Custom Image
          ====================

          OpenWrt version:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          Build system:
          Official OpenWrt ImageBuilder

          Package manager:
          APK

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME}


          Network
          =======

          eth0:
          WAN1 / PPPoE

          eth1:
          WAN2 / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          LAN IP:
          ${LAN_IP}

          IPv6:
          Enabled


          Filesystem
          ==========

          EXT4

          BIOS:
          Enabled

          UEFI:
          Enabled

          QCOW2:
          Enabled
          EOF

      - name: Show final files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Final release files"
          echo "=========================================="

          ls -lh release

          echo
          echo "SHA256:"
          cat release/sha256sums

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }}"
          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            基于 OpenWrt 官方 ImageBuilder 构建。

            ## 构建方式

            Official OpenWrt ImageBuilder。

            不进行 OpenWrt 源码编译。
            不进行 toolchain 编译。
            不进行 kernel 源码编译。

            ## OpenWrt

            - Version: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - Package manager: `APK`
            - RootFS: `${{ env.ROOTFS_SIZE }}`

            ## 网络

            - eth0 → WAN1 / PPPoE
            - eth1 → WAN2 / PPPoE
            - eth2 → LAN
            - eth3 → LAN
            - eth4 → LAN
            - eth5 → LAN
            - LAN → `${{ inputs.lan_ip }}`
            - IPv6 → Enabled

            ## 文件系统

            - BIOS EXT4
            - UEFI EXT4
            - QCOW2
            - VMDK / RAW 根据手动构建选项生成

            ## 第三方 APK

            使用 wukongdaily APK 仓库中的 x86 APK / RUN 包。

            构建过程中重新生成本地 `packages.adb`，
            不直接使用上游预生成的旧索引。

          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update openwrt-version
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.openwrt_version == '')
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=""

          if [ -f openwrt-version ]; then
            CURRENT_VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi

          if [ "${CURRENT_VERSION}" = "${OPENWRT_VERSION}" ]; then
            echo "openwrt-version already contains ${OPENWRT_VERSION}"
            exit 0
          fi

          printf '%s\n' "${OPENWRT_VERSION}" > openwrt-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add openwrt-version

          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi

          git commit \
            -m "Update OpenWrt version to ${OPENWRT_VERSION}"

          git push
