name: Build OpenWrt x86-64 ImageBuilder

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x，留空使用 openwrt-version"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "RootFS 大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

  repository_dispatch:
    types:
      - openwrt-release

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # Resolve OpenWrt version
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}
        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi

          if [ -z "${VERSION}" ] && [ -f openwrt-version ]; then
            VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -n 1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=$(date +%H%M%S)" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt : ${VERSION}"
          echo "Date    : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="


      # ==========================================================
      # RootFS size
      # ==========================================================

      - name: Configure RootFS
        shell: bash
        env:
          INPUT_SIZE: ${{ inputs.rootfs_size }}
        run: |
          set -euo pipefail

          SIZE="${INPUT_SIZE:-4G}"

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid RootFS size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"


      # ==========================================================
      # LAN
      # ==========================================================

      - name: Configure LAN
        shell: bash
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}
        run: |
          set -euo pipefail

          LAN_IP="${INPUT_LAN_IP:-192.168.1.2}"

          if ! printf '%s\n' "${LAN_IP}" | grep -Eq \
            '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            echo "ERROR: Invalid LAN IP: ${LAN_IP}"
            exit 1
          fi

          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"


      # ==========================================================
      # Dependencies
      # ==========================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            file \
            git \
            jq \
            qemu-utils \
            rsync \
            wget \
            zstd


      # ==========================================================
      # Download official ImageBuilder
      # ==========================================================

      - name: Download ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${ARCHIVE}"

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            "${URL}" \
            -O "${ARCHIVE}"

          rm -rf imagebuilder

          mkdir -p imagebuilder

          tar \
            --zstd \
            -xf "${ARCHIVE}" \
            --strip-components=1 \
            --no-same-owner \
            -C imagebuilder

          echo
          echo "ImageBuilder ready."
          ls -lah imagebuilder


      # ==========================================================
      # ImageBuilder info
      # ==========================================================

      - name: Check ImageBuilder
        working-directory: imagebuilder
        run: |
          set -euo pipefail

          make info


      # ==========================================================
      # PassWall repository
      # ==========================================================

      - name: Configure PassWall APK repository
        working-directory: imagebuilder
        run: |
          set -euo pipefail

          if [ ! -f repositories ]; then
            echo "ERROR: ImageBuilder repositories not found."
            exit 1
          fi

          PASSWALL_BASE="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64"

          cat >> repositories <<EOF

          ${PASSWALL_BASE}/passwall_luci/packages.adb
          ${PASSWALL_BASE}/passwall_packages/packages.adb
          ${PASSWALL_BASE}/passwall2/packages.adb
          EOF

          mkdir -p keys

          wget \
            --retry-connrefused \
            --tries=5 \
            https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub \
            -O keys/openwrt-passwall-build.pem

          echo
          echo "Repositories:"
          cat repositories


      # ==========================================================
      # wukongdaily APK
      #
      # 注意：
      #
      # x86-64 设备对应 wukongdaily/apk 的：
      #
      # run/x86/
      #
      # 而不是 run/x86-64/
      #
      # 这一点已经由你这次日志直接证明。
      # ==========================================================

      - name: Clone wukongdaily APK repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third-party-apk

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk

          if [ ! -d third-party-apk/run/x86 ]; then
            echo "ERROR: wukongdaily APK x86 directory not found."
            exit 1
          fi

          echo
          echo "Available x86 packages:"
          find third-party-apk/run/x86 \
            -type f \
            -name "*.apk" \
            -printf "%P\n" |
          sort |
          head -200


      # ==========================================================
      # Prepare wukongdaily packages
      # ==========================================================

      - name: Prepare wukongdaily x86 APK packages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf imagebuilder/packages

          mkdir -p imagebuilder/packages

          cat > /tmp/wkd-packages <<'EOF'
          luci-theme-aurora
          luci-app-aurora-config
          luci-i18n-aurora-config-zh-cn
          bandix
          luci-app-bandix
          luci-i18n-bandix-zh-cn
          luci-app-run
          EOF

          find_wkd_package() {
            local PACKAGE="$1"

            local MATCH

            MATCH="$(
              find third-party-apk/run/x86 \
                -type f \
                -name "${PACKAGE}-*.apk" \
                -print |
              sort -V |
              tail -n 1
            )"

            if [ -z "${MATCH}" ]; then
              echo
              echo "ERROR: wukongdaily x86 APK not found:"
              echo "${PACKAGE}"

              echo
              echo "Available matches:"
              find third-party-apk/run/x86 \
                -type f \
                -name "${PACKAGE}-*.apk" \
                -print || true

              return 1
            fi

            echo
            echo "Found ${PACKAGE}:"
            echo "${MATCH}"

            cp \
              "${MATCH}" \
              imagebuilder/packages/
          }

          FAILED=0

          while IFS= read -r PACKAGE; do
            if ! find_wkd_package "${PACKAGE}"; then
              FAILED=1
            fi
          done < /tmp/wkd-packages

          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi


      # ==========================================================
      # FileBrowser Go / VLMCSd / Autoreboot
      #
      # 来源：
      # sbwml/openwrt_pkgs
      #
      # 该仓库目前明确包含：
      # luci-app-filebrowser-go
      # luci-app-vlmcsd
      # luci-app-autoreboot
      #
      # 但不能直接把源码仓库当 APK。
      #
      # 这里先下载仓库，寻找已发布 APK。
      # ==========================================================

      - name: Prepare sbwml packages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sbwml-packages

          git clone \
            --depth=1 \
            https://github.com/sbwml/openwrt_pkgs.git \
            sbwml-packages

          echo
          echo "sbwml packages:"
          find sbwml-packages \
            -maxdepth 2 \
            -type d \
            \( \
              -name "luci-app-filebrowser-go" \
              -o \
              -name "luci-app-vlmcsd" \
              -o \
              -name "luci-app-autoreboot" \
            \) \
            -print


      # ==========================================================
      # 检查 sbwml 是否有当前架构 APK
      #
      # 如果只有源码而没有 APK：
      # 不在 ImageBuilder job 中重新编译。
      #
      # 这避免重新掉回数小时源码编译模式。
      # ==========================================================

      - name: Locate sbwml APK artifacts
        shell: bash
        run: |
          set -euo pipefail

          FOUND=0

          for PACKAGE in \
            luci-app-filebrowser-go \
            luci-app-vlmcsd \
            luci-app-autoreboot
          do

            MATCH="$(
              find sbwml-packages \
                -type f \
                -name "${PACKAGE}-*.apk" \
                \( \
                  -path '*/x86_64/*' \
                  -o \
                  -path '*/x86-64/*' \
                  -o \
                  -path '*/x86/*' \
                  -o \
                  -path '*/all/*' \
                \) \
                -print |
              sort -V |
              tail -n 1
            )"

            if [ -n "${MATCH}" ]; then

              echo
              echo "Found ${PACKAGE}:"
              echo "${MATCH}"

              cp \
                "${MATCH}" \
                imagebuilder/packages/

              FOUND=$((FOUND + 1))

            else

              echo
              echo "No prebuilt APK found for:"
              echo "${PACKAGE}"

            fi

          done

          echo
          echo "Prebuilt sbwml APK count: ${FOUND}"


      # ==========================================================
      # OpenClash
      # ==========================================================

      - name: Prepare OpenClash APK
        shell: bash
        run: |
          set -euo pipefail

          if find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name 'luci-app-openclash-*.apk' |
            grep -q .; then

            echo "OpenClash APK found in local third-party packages."
            exit 0

          fi

          echo "Checking OpenClash GitHub release..."

          curl \
            -fsSL \
            https://api.github.com/repos/vernesong/OpenClash/releases/latest \
            -o /tmp/openclash.json

          URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".apk"))
              | select(.name | startswith("luci-app-openclash"))
              | select(
                  (.name | test("x86|all"; "i"))
                )
              | .browser_download_url
            ' /tmp/openclash.json |
            head -n 1
          )"

          if [ -z "${URL}" ]; then
            echo
            echo "ERROR: No suitable OpenClash APK found."
            jq -r '.assets[].name' /tmp/openclash.json
            exit 1
          fi

          wget \
            --retry-connrefused \
            --tries=5 \
            "${URL}" \
            -P imagebuilder/packages


      # ==========================================================
      # 显示所有第三方 APK
      # ==========================================================

      - name: Show third-party APKs
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Third-party APKs"
          echo "=========================================="

          find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" |
          sort


      # ==========================================================
      # 自定义 files
      # ==========================================================

      - name: Prepare custom files
        shell: bash
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |
          set -euo pipefail

          if [ -z "${WAN1_USER:-}" ] || [ -z "${WAN1_PASS:-}" ]; then
            echo "ERROR: WAN1_USER / WAN1_PASS is missing."
            exit 1
          fi

          if [ -z "${WAN2_USER:-}" ] || [ -z "${WAN2_PASS:-}" ]; then
            echo "ERROR: WAN2_USER / WAN2_PASS is missing."
            exit 1
          fi

          rm -rf imagebuilder/files

          mkdir -p imagebuilder/files

          if [ -d files ]; then
            rsync -a \
              files/ \
              imagebuilder/files/
          fi

          mkdir -p \
            imagebuilder/files/etc/config \
            imagebuilder/files/etc/uci-defaults


          # ------------------------------------------------------
          # network
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/config/network <<EOF
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'

          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 '1'

          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 '1'

          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'
          EOF


          # ------------------------------------------------------
          # DHCP / IPv6
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/config/dhcp <<'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'

          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'

          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          EOF


          # ------------------------------------------------------
          # 默认中文
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/uci-defaults/99-default-language <<'EOF'
          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0
          EOF

          chmod +x \
            imagebuilder/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # 软件包清单
      #
      # 这里不再把“没有来源”的包加入。
      # ==========================================================

      - name: Prepare final package list
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/packages <<'EOF'
          luci
          luci-i18n-base-zh-cn

          ppp
          ppp-mod-pppoe
          kmod-pppoe

          luci-proto-ppp
          luci-proto-ipv6

          ipv6
          odhcp6c
          odhcpd-ipv6only

          mwan3
          luci-app-mwan3
          luci-i18n-mwan3-zh-cn

          luci-app-ttyd
          luci-i18n-ttyd-zh-cn

          luci-app-upnp
          luci-i18n-upnp-zh-cn

          luci-theme-aurora
          luci-app-aurora-config
          luci-i18n-aurora-config-zh-cn

          bandix
          luci-app-bandix
          luci-i18n-bandix-zh-cn

          luci-app-run

          luci-app-openclash

          luci-app-passwall
          luci-i18n-passwall-zh-cn

          EOF


          # 只有实际已经找到的 sbwml APK 才加入

          for PACKAGE in \
            luci-app-filebrowser-go \
            luci-app-vlmcsd \
            luci-app-autoreboot
          do

            if find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name "${PACKAGE}-*.apk" |
              grep -q .; then

              echo "${PACKAGE}" >> /tmp/packages

            fi

          done


          sort -u \
            /tmp/packages |
          sed '/^[[:space:]]*$/d' \
            > selected-packages.txt


          echo
          echo "=========================================="
          echo "Final package list"
          echo "=========================================="

          cat selected-packages.txt


      # ==========================================================
      # 直接构建
      #
      # 不再：
      #   make package_list
      #   make manifest
      #
      # 让 ImageBuilder 自己初始化 APK。
      # ==========================================================

      - name: Build UEFI
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          PACKAGES="$(
            tr '\n' ' ' \
              < "${GITHUB_WORKSPACE}/selected-packages.txt"
          )

          mkdir -p "${GITHUB_WORKSPACE}/output"

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            BIN_DIR="${GITHUB_WORKSPACE}/output" \
            EXTRA_IMAGE_NAME="${ROOTFS_SIZE}-${BUILD_DATE}"


      # ==========================================================
      # 找到 UEFI
      # ==========================================================

      - name: Prepare UEFI image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find output \
              -type f \
              -name '*combined-efi.img.gz' |
            head -n 1
          )

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI image not found."

            find output \
              -type f \
              -print

            exit 1
          fi

          TARGET="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          mv \
            "${IMAGE}" \
            "${TARGET}"

          echo "UEFI_IMAGE=${TARGET}" >> "${GITHUB_ENV}"

          ls -lh "${TARGET}"


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        shell: bash
        run: |
          set -euo pipefail

          RAW="/tmp/openwrt.raw"

          QCOW2="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"

          gzip -dc \
            "${UEFI_IMAGE}" \
            > "${RAW}"

          qemu-img convert \
            -p \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            "${RAW}" \
            "${QCOW2}"

          rm -f "${RAW}"

          test -s "${QCOW2}"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: output
        run: |
          set -euo pipefail

          sha256sum \
            *.img.gz \
            *.qcow2 \
            > sha256sums.txt

          cat sha256sums.txt


      # ==========================================================
      # build info
      # ==========================================================

      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/build-info.txt <<EOF
          OpenWrt Custom ImageBuilder Build

          OpenWrt:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME}

          LAN:
          ${LAN_IP}

          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          IPv6:
          Enabled

          Images:
          UEFI
          QCOW2
          EOF


      # ==========================================================
      # 保存包清单
      # ==========================================================

      - name: Save package list
        run: |
          set -euo pipefail

          cp \
            selected-packages.txt \
            output/selected-packages.txt


      # ==========================================================
      # 最终检查
      # ==========================================================

      - name: Verify output
        run: |
          set -euo pipefail

          UEFI_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          QCOW2_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"

          test -s "${UEFI_FILE}"
          test -s "${QCOW2_FILE}"
          test -s output/sha256sums.txt
          test -s output/build-info.txt
          test -s output/selected-packages.txt

          echo
          echo "=========================================="
          echo "Final files"
          echo "=========================================="

          ls -lh output


      # ==========================================================
      # Release
      # ==========================================================

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          TAG="v${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${GITHUB_RUN_NUMBER}"

          TITLE="OpenWrt ${OPENWRT_VERSION} x86-64 ${ROOTFS_SIZE} ${BUILD_DATE}"

          cat > release-notes.md <<EOF
          # OpenWrt ${OPENWRT_VERSION} x86-64

          ## Build

          - OpenWrt: \`${OPENWRT_VERSION}\`
          - Target: \`x86-64\`
          - ImageBuilder: Official OpenWrt
          - RootFS: \`${ROOTFS_SIZE}\`
          - Build date: \`${BUILD_DATE}\`

          ## Network

          - \`eth0\` → WAN / PPPoE
          - \`eth1\` → WANB / PPPoE
          - \`eth2\` → LAN
          - \`eth3\` → LAN
          - \`eth4\` → LAN
          - \`eth5\` → LAN

          - LAN IP: \`${LAN_IP}\`
          - IPv6: Enabled

          ## Images

          - UEFI
          - QCOW2

          ## Packages

          See \`selected-packages.txt\`.

          EOF

          gh release create \
            "${TAG}" \
            output/*.img.gz \
            output/*.qcow2 \
            output/sha256sums.txt \
            output/build-info.txt \
            output/selected-packages.txt \
            --title "${TITLE}" \
            --notes-file release-notes.md
