name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件 RootFS 大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

      uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2 镜像"
        required: true
        default: true
        type: boolean

  repository_dispatch:
    types:
      - openwrt-release


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    env:
      TZ: Asia/Shanghai

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ==========================================================
      # Resolve OpenWrt version
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          COMMIT="$(
            git ls-remote \
              https://github.com/openwrt/openwrt.git \
              "refs/tags/v${VERSION}" |
            awk '{print $1}'
          )"

          if [ -z "${COMMIT}" ]; then
            echo "ERROR: Cannot find OpenWrt commit."
            exit 1
          fi

          BUILD_DATE="$(date +%Y%m%d)"
          BUILD_TIME="$(date +%H%M%S)"

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "OPENWRT_COMMIT=${COMMIT}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "OpenWrt commit  : ${COMMIT}"
          echo "Build date      : ${BUILD_DATE}"
          echo "Build time      : ${BUILD_TIME}"
          echo "=========================================="


      # ==========================================================
      # Resolve build options
      # ==========================================================

      - name: Resolve build options
        shell: bash
        env:
          ROOTFS_INPUT: ${{ inputs.rootfs_size }}
          LAN_IP_INPUT: ${{ inputs.lan_ip }}
          UEFI_INPUT: ${{ inputs.uefi }}
          QCOW2_INPUT: ${{ inputs.qcow2 }}

        run: |
          set -euo pipefail

          ROOTFS_SIZE="${ROOTFS_INPUT:-4G}"
          LAN_IP="${LAN_IP_INPUT:-192.168.1.2}"
          UEFI="${UEFI_INPUT:-true}"
          QCOW2="${QCOW2_INPUT:-true}"

          case "${ROOTFS_SIZE}" in
            1G)
              ROOTFS_PARTSIZE=1024
              ;;
            2G)
              ROOTFS_PARTSIZE=2048
              ;;
            3G)
              ROOTFS_PARTSIZE=3072
              ;;
            4G)
              ROOTFS_PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid RootFS size: ${ROOTFS_SIZE}"
              exit 1
              ;;
          esac

          if ! printf '%s\n' "${LAN_IP}" | grep -Eq \
            '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            echo "ERROR: Invalid LAN IP: ${LAN_IP}"
            exit 1
          fi

          echo "ROOTFS_SIZE=${ROOTFS_SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}" >> "${GITHUB_ENV}"
          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"
          echo "BUILD_UEFI=${UEFI}" >> "${GITHUB_ENV}"
          echo "BUILD_QCOW2=${QCOW2}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "Build options"
          echo "=========================================="
          echo "RootFS : ${ROOTFS_SIZE}"
          echo "LAN IP : ${LAN_IP}"
          echo "UEFI   : ${UEFI}"
          echo "QCOW2  : ${QCOW2}"
          echo "=========================================="


      # ==========================================================
      # Install dependencies
      # ==========================================================

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar \
            ccache


      # ==========================================================
      # Clone OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "v${OPENWRT_VERSION}" \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          git fetch --depth 1 origin \
            "refs/tags/v${OPENWRT_VERSION}"

          git checkout \
            "${OPENWRT_COMMIT}"

          echo
          echo "OpenWrt source:"
          git describe --always --tags


      # ==========================================================
      # Configure PassWall feeds
      # ==========================================================

      - name: Configure third-party feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          src-git bandix https://github.com/timsaya/openwrt-bandix.git;main
          src-git bandix_luci https://github.com/timsaya/luci-app-bandix.git;main

          EOF

          echo
          echo "Third-party feeds configured:"
          tail -10 feeds.conf.default


      # ==========================================================
      # Update feeds
      # ==========================================================

      - name: Update feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          ./scripts/feeds update -a


      # ==========================================================
      # Install feeds
      # ==========================================================

      - name: Install feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          ./scripts/feeds install -a

          # PassWall 的依赖包优先使用 PassWall feed
          ./scripts/feeds install -a -f -p passwall_packages

          # PassWall LuCI
          ./scripts/feeds install luci-app-passwall

          # Bandix backend/frontend
          ./scripts/feeds install bandix
          ./scripts/feeds install luci-app-bandix


      # ==========================================================
      # Add Aurora
      # ==========================================================

      - name: Add Aurora
        working-directory: openwrt
        run: |
          set -euo pipefail

          rm -rf /tmp/aurora

          git clone \
            --depth 1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            /tmp/aurora

          mkdir -p package/custom

          echo
          echo "Aurora package structure:"
          find /tmp/aurora \
            -maxdepth 3 \
            -name Makefile \
            -print

          FOUND=0

          while IFS= read -r MAKEFILE; do

            PKG_NAME="$(
              awk -F ':=' \
                '/^[[:space:]]*PKG_NAME[[:space:]]*:=/ {
                  print $2
                  exit
                }' \
                "${MAKEFILE}" |
              tr -d '[:space:]'
            )"

            if [ -z "${PKG_NAME}" ]; then
              continue
            fi

            PACKAGE_DIR="$(dirname "${MAKEFILE}")"

            case "${PKG_NAME}" in
              luci-theme-aurora|luci-app-aurora-config)

                echo "Installing Aurora package: ${PKG_NAME}"

                rm -rf \
                  "package/custom/${PKG_NAME}"

                cp -a \
                  "${PACKAGE_DIR}" \
                  "package/custom/${PKG_NAME}"

                FOUND=1
                ;;
            esac

          done < <(
            find /tmp/aurora \
              -type f \
              -name Makefile
          )

          if [ "${FOUND}" -eq 0 ]; then
            echo
            echo "ERROR: Aurora packages were not found."
            exit 1
          fi


      # ==========================================================
      # Add OpenClash
      # ==========================================================

      - name: Add OpenClash
        working-directory: openwrt
        run: |
          set -euo pipefail

          rm -rf /tmp/openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/openclash

          if [ ! -f \
            /tmp/openclash/luci-app-openclash/Makefile ]; then

            echo
            echo "ERROR:"
            echo "OpenClash luci-app-openclash Makefile not found."

            exit 1
          fi

          mkdir -p package/custom

          rm -rf \
            package/custom/luci-app-openclash

          cp -a \
            /tmp/openclash/luci-app-openclash \
            package/custom/luci-app-openclash

          echo
          echo "OpenClash package installed."

          find \
            package/custom/luci-app-openclash \
            -maxdepth 2 \
            -name Makefile \
            -print


      # ==========================================================
      # Add luci-app-run
      # ==========================================================

      - name: Add luci-app-run
        working-directory: openwrt
        run: |
          set -euo pipefail

          rm -rf /tmp/luci-app-run

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/wukongdaily/luci-app-run.git \
            /tmp/luci-app-run

          mkdir -p package/custom

          FOUND=0

          while IFS= read -r MAKEFILE; do

            PKG_NAME="$(
              awk -F ':=' \
                '/^[[:space:]]*PKG_NAME[[:space:]]*:=/ {
                  print $2
                  exit
                }' \
                "${MAKEFILE}" |
              tr -d '[:space:]'
            )"

            if [ -z "${PKG_NAME}" ]; then
              continue
            fi

            if [ "${PKG_NAME}" = "luci-app-run" ]; then

              PACKAGE_DIR="$(dirname "${MAKEFILE}")"

              rm -rf \
                package/custom/luci-app-run

              cp -a \
                "${PACKAGE_DIR}" \
                package/custom/luci-app-run

              FOUND=1

            fi

          done < <(
            find /tmp/luci-app-run \
              -type f \
              -name Makefile
          )

          # 当前仓库就是一个直接可作为 package 使用的目录。
          if [ "${FOUND}" -eq 0 ] && \
             [ -f /tmp/luci-app-run/Makefile ]; then

            mkdir -p \
              package/custom/luci-app-run

            cp -a \
              /tmp/luci-app-run/. \
              package/custom/luci-app-run/

            FOUND=1
          fi

          if [ "${FOUND}" -eq 0 ]; then
            echo
            echo "ERROR: luci-app-run package not found."
            exit 1
          fi

          echo
          echo "luci-app-run installed."


      # ==========================================================
      # Build OpenClash po2lmo
      # ==========================================================

      - name: Build OpenClash po2lmo
        working-directory: openwrt
        run: |
          set -euo pipefail

          TOOL_DIR="package/custom/luci-app-openclash/tools/po2lmo"

          if [ ! -d "${TOOL_DIR}" ]; then
            echo
            echo "ERROR:"
            echo "OpenClash po2lmo source not found."

            exit 1
          fi

          cd "${TOOL_DIR}"

          make -j"$(nproc)"

          if [ ! -f src/po2lmo ]; then
            echo
            echo "ERROR:"
            echo "src/po2lmo was not built."

            find . \
              -maxdepth 3 \
              -type f \
              -name po2lmo \
              -print

            exit 1
          fi

          sudo install \
            -m 0755 \
            src/po2lmo \
            /usr/local/bin/po2lmo

          command -v po2lmo

          echo
          echo "po2lmo installed successfully."


      # ==========================================================
      # Generate base configuration
      # ==========================================================

      - name: Generate OpenWrt configuration
        working-directory: openwrt
        run: |
          set -euo pipefail

          cat > .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}

          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_luci-proto-ipv6=y

          CONFIG_PACKAGE_ipv6=y
          CONFIG_PACKAGE_kmod-ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y

          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y

          CONFIG_PACKAGE_luci-app-autoreboot=y
          CONFIG_PACKAGE_luci-i18n-autoreboot-zh-cn=y

          CONFIG_PACKAGE_luci-i18n-timewol-zh-cn=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y
          CONFIG_PACKAGE_luci-i18n-aurora-config-zh-cn=y

          CONFIG_PACKAGE_bandix=y
          CONFIG_PACKAGE_luci-app-bandix=y
          CONFIG_PACKAGE_luci-i18n-bandix-zh-cn=y

          CONFIG_PACKAGE_luci-app-run=y

          CONFIG_PACKAGE_luci-app-filebrowser-go=y
          CONFIG_PACKAGE_luci-i18n-filebrowser-go-zh-cn=y
          EOF

          make defconfig

          echo
          echo "Configuration generated."


      # ==========================================================
      # Verify important packages after defconfig
      # ==========================================================

      - name: Verify package selection
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Selected package status"
          echo "=========================================="

          PACKAGES="
          luci
          luci-ssl
          ppp
          ppp-mod-pppoe
          kmod-pppoe
          luci-proto-ppp
          luci-proto-ipv6
          ipv6
          odhcp6c
          odhcpd-ipv6only
          mwan3
          luci-app-mwan3
          luci-app-upnp
          luci-app-ttyd
          luci-app-vlmcsd
          luci-app-autoreboot
          luci-app-passwall
          luci-app-openclash
          luci-theme-aurora
          luci-app-aurora-config
          bandix
          luci-app-bandix
          luci-app-run
          luci-app-filebrowser-go
          "

          MISSING=0

          : > selected-packages.txt
          : > missing-packages.txt

          for PACKAGE in ${PACKAGES}; do

            if grep -qx \
              "CONFIG_PACKAGE_${PACKAGE}=y" \
              .config; then

              echo "OK: ${PACKAGE}"
              echo "${PACKAGE}" >> selected-packages.txt

            else

              echo "MISSING: ${PACKAGE}"
              echo "${PACKAGE}" >> missing-packages.txt
              MISSING=1

            fi

          done

          echo
          echo "=========================================="
          echo "Selected packages"
          echo "=========================================="

          cat selected-packages.txt

          echo
          echo "=========================================="
          echo "Missing packages"
          echo "=========================================="

          if [ -s missing-packages.txt ]; then
            cat missing-packages.txt
          else
            echo "None"
          fi

          # 这里只对核心第三方包做失败判断。
          # 某些 LuCI 中文翻译包可能由 LuCI feed 动态生成，
          # 不因为翻译包名称变化而误判整个构建。
          CORE_PACKAGES="
          luci
          luci-app-passwall
          luci-app-openclash
          luci-theme-aurora
          luci-app-aurora-config
          bandix
          luci-app-bandix
          luci-app-run
          luci-app-filebrowser-go
          "

          CORE_MISSING=0

          for PACKAGE in ${CORE_PACKAGES}; do

            if ! grep -qx \
              "CONFIG_PACKAGE_${PACKAGE}=y" \
              .config; then

              echo "ERROR: Core package not selected: ${PACKAGE}"
              CORE_MISSING=1

            fi

          done

          if [ "${CORE_MISSING}" -ne 0 ]; then
            echo
            echo "ERROR: One or more core packages are unavailable."
            exit 1
          fi


      # ==========================================================
      # Generate network configuration
      # ==========================================================

      - name: Generate network configuration
        working-directory: openwrt
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |
          set -euo pipefail

          if [ -z "${WAN1_USER}" ] || \
             [ -z "${WAN1_PASS}" ]; then

            echo
            echo "ERROR:"
            echo "WAN1_USER / WAN1_PASS GitHub Secrets are missing."

            exit 1
          fi

          if [ -z "${WAN2_USER}" ] || \
             [ -z "${WAN2_PASS}" ]; then

            echo
            echo "ERROR:"
            echo "WAN2_USER / WAN2_PASS GitHub Secrets are missing."

            exit 1
          fi

          mkdir -p files/etc/config

          cat > files/etc/config/network <<EOF
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config globals 'globals'
              option ula_prefix 'auto'

          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'

          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 'auto'

          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 'auto'

          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'
          EOF


      # ==========================================================
      # Generate DHCP / IPv6 configuration
      # ==========================================================

      - name: Generate DHCP configuration
        working-directory: openwrt
        run: |
          set -euo pipefail

          mkdir -p files/etc/config

          cat > files/etc/config/dhcp <<'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'

          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'

          config dhcp 'wan6'
              option interface 'wan6'
              option ignore '1'

          config dhcp 'wanb6'
              option interface 'wanb6'
              option ignore '1'

          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          EOF


      # ==========================================================
      # Default language
      # ==========================================================

      - name: Set default language
        working-directory: openwrt
        run: |
          set -euo pipefail

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-default-language <<'EOF'
          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0
          EOF

          chmod +x \
            files/etc/uci-defaults/99-default-language


      # ==========================================================
      # Create build information
      # ==========================================================

      - name: Create build information
        working-directory: openwrt
        run: |
          set -euo pipefail

          mkdir -p \
            files/etc/openwrt-custom

          cat > files/etc/openwrt-custom/build-info <<EOF
          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          OpenWrt Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME}

          LAN:
          ${LAN_IP}

          eth0:
          WAN / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          Enabled
          EOF


      # ==========================================================
      # Show repository configuration
      #
      # 注意：
      # 不再读取 repositories.conf
      # ==========================================================

      - name: Show configured feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Configured feeds"
          echo "=========================================="

          cat feeds.conf.default


      # ==========================================================
      # Download source packages
      # ==========================================================

      - name: Download packages
        working-directory: openwrt
        run: |
          set -euo pipefail

          make download \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # Build OpenWrt
      # ==========================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          set -euo pipefail

          make \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # Prepare release
      # ==========================================================

      - name: Prepare release directory
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          echo
          echo "OpenWrt images:"

          find openwrt/bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -print


      # ==========================================================
      # Copy UEFI image
      # ==========================================================

      - name: Copy UEFI image
        if: env.BUILD_UEFI == 'true'
        run: |
          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' |
            head -1
          )"

          if [ -z "${IMAGE}" ]; then
            echo
            echo "ERROR: UEFI image not found."

            echo
            echo "Available images:"
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          OUTPUT="release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          cp \
            "${IMAGE}" \
            "${OUTPUT}"

          test -s "${OUTPUT}"

          echo
          echo "UEFI image:"
          ls -lh "${OUTPUT}"


      # ==========================================================
      # Create raw temporary image for QCOW2 conversion
      # ==========================================================

      - name: Prepare QCOW2 source
        if: env.BUILD_QCOW2 == 'true'
        run: |
          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' |
            head -1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI image not found for QCOW2."
            exit 1
          fi

          gzip -dc \
            "${IMAGE}" \
            > openwrt-uefi.raw

          test -s openwrt-uefi.raw

          echo
          echo "Raw source image:"
          ls -lh openwrt-uefi.raw


      # ==========================================================
      # Create QCOW2
      # ==========================================================

      - name: Create QCOW2
        if: env.BUILD_QCOW2 == 'true'
        run: |
          set -euo pipefail

          OUTPUT="release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"

          qemu-img convert \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            openwrt-uefi.raw \
            "${OUTPUT}"

          test -s "${OUTPUT}"

          echo
          echo "QCOW2 image:"
          ls -lh "${OUTPUT}"


      # ==========================================================
      # Remove temporary raw image
      # ==========================================================

      - name: Remove temporary files
        run: |
          set -euo pipefail

          rm -f openwrt-uefi.raw


      # ==========================================================
      # Verify release files
      # ==========================================================

      - name: Verify release files
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          if [ ! -d release ]; then
            echo "ERROR: release directory does not exist."
            exit 1
          fi

          FILE_COUNT=0

          for FILE in release/*; do

            if [ ! -f "${FILE}" ]; then
              continue
            fi

            SIZE="$(stat -c '%s' "${FILE}")"

            if [ "${SIZE}" -le 0 ]; then
              echo "ERROR: Empty file:"
              echo "${FILE}"
              exit 1
            fi

            echo
            echo "OK:"
            ls -lh "${FILE}"

            FILE_COUNT=$((FILE_COUNT + 1))

          done

          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "ERROR: No release files were generated."
            exit 1
          fi


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: release
        run: |
          set -euo pipefail

          sha256sum \
            *.img.gz \
            *.qcow2 \
            > sha256sums

          test -s sha256sums

          cat sha256sums


      # ==========================================================
      # Release information
      # ==========================================================

      - name: Create release information
        run: |
          set -euo pipefail

          cat > release/build-info.txt <<EOF
          ==========================================
          OpenWrt Custom Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          OpenWrt commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME}

          LAN:
          ${LAN_IP}

          Network:

          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          IPv6:
          Enabled

          Image formats:

          UEFI
          QCOW2

          ==========================================
          EOF


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"
          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN
            - LAN IP: `${{ env.LAN_IP }}`
            - IPv6: Enabled

            ## Images

            - UEFI
            - QCOW2

            ## Included

            - LuCI
            - Simplified Chinese
            - PassWall
            - OpenClash
            - Aurora
            - Aurora Config
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - mwan3
            - PPPoE
            - IPv6
            - ttyd
            - UPnP
            - VLMCSd
            - Timewol
            - Autoreboot

          files: |
            release/*.img.gz
            release/*.qcow2
            release/sha256sums
            release/build-info.txt
            release/selected-packages.txt
            release/missing-packages.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
