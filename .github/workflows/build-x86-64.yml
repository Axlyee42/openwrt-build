name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:

      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

      uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2 镜像"
        required: true
        default: true
        type: boolean

  repository_dispatch:
    types:
      - openwrt-release


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 确定 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          COMMIT="$(
            git ls-remote \
              https://github.com/openwrt/openwrt.git \
              "refs/tags/v${VERSION}" |
            awk '{print $1}'
          )"

          if [ -z "${COMMIT}" ]; then
            echo "ERROR: Cannot find OpenWrt commit."
            exit 1
          fi

          BUILD_DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          BUILD_TIME="$(TZ=Asia/Shanghai date +%H%M%S)"

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "OPENWRT_COMMIT=${COMMIT}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "OpenWrt commit  : ${COMMIT}"
          echo "Build date      : ${BUILD_DATE}"
          echo "Build time      : ${BUILD_TIME}"
          echo "=========================================="


      # ==========================================================
      # RootFS 大小
      # ==========================================================

      - name: Configure RootFS
        shell: bash
        run: |
          set -euo pipefail

          SIZE="${{ inputs.rootfs_size }}"

          if [ -z "${SIZE}" ]; then
            SIZE="4G"
          fi

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid RootFS size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS size: ${SIZE}"
          echo "RootFS partition: ${PARTSIZE} MB"


      # ==========================================================
      # LAN IP
      # ==========================================================

      - name: Configure LAN IP
        shell: bash
        run: |
          set -euo pipefail

          LAN_IP="${{ inputs.lan_ip }}"

          if [ -z "${LAN_IP}" ]; then
            LAN_IP="192.168.1.2"
          fi

          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"

          echo "LAN IP: ${LAN_IP}"


      # ==========================================================
      # 安装编译依赖
      # ==========================================================

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar


      # ==========================================================
      # Clone OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          git fetch \
            --depth=1 \
            origin \
            "refs/tags/v${OPENWRT_VERSION}"

          git checkout \
            "v${OPENWRT_VERSION}"

          echo
          echo "OpenWrt source:"
          git describe --tags --always


      # ==========================================================
      # PassWall feeds
      # ==========================================================

      - name: Configure PassWall feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          EOF


      # ==========================================================
      # Bandix feeds
      # ==========================================================

      - name: Configure Bandix feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          cat >> feeds.conf.default <<'EOF'

          src-git bandix https://github.com/timsaya/openwrt-bandix.git;main
          src-git bandix_luci https://github.com/timsaya/luci-app-bandix.git;main

          EOF


      # ==========================================================
      # Update feeds
      # ==========================================================

      - name: Update feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          ./scripts/feeds update -a


      # ==========================================================
      # Install feeds
      # ==========================================================

      - name: Install feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          ./scripts/feeds install -a


      # ==========================================================
      # 添加 Aurora
      #
      # 注意：
      # luci-theme-aurora 本身就是完整 package 仓库
      # 根目录 Makefile 即 package Makefile
      #
      # luci-app-aurora-config 是独立仓库
      # ==========================================================

      - name: Add Aurora packages
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Adding Aurora packages"
          echo "=========================================="

          rm -rf \
            package/luci-theme-aurora \
            package/luci-app-aurora-config

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            package/luci-theme-aurora

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-app-aurora-config.git \
            package/luci-app-aurora-config

          echo
          echo "Aurora theme:"
          test -f package/luci-theme-aurora/Makefile
          echo "OK"

          echo
          echo "Aurora config:"
          test -f package/luci-app-aurora-config/Makefile
          echo "OK"


      # ==========================================================
      # OpenClash
      # ==========================================================

      - name: Add OpenClash
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Adding OpenClash"
          echo "=========================================="

          rm -rf package/luci-app-openclash

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            package/luci-app-openclash

          test -d package/luci-app-openclash

          echo "OpenClash source added."


      # ==========================================================
      # luci-app-run
      # ==========================================================

      - name: Add luci-app-run
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Adding luci-app-run"
          echo "=========================================="

          rm -rf package/luci-app-run

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/luci-app-run.git \
            package/luci-app-run

          test -d package/luci-app-run

          echo "luci-app-run source added."


      # ==========================================================
      # Refresh package metadata
      # ==========================================================

      - name: Refresh package metadata
        working-directory: openwrt
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ==========================================================
      # 生成基础配置
      # ==========================================================

      - name: Generate OpenWrt configuration
        working-directory: openwrt
        run: |
          set -euo pipefail

          cat > .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_ipv6=y
          CONFIG_PACKAGE_kmod-ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y

          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y

          CONFIG_PACKAGE_luci-app-autoreboot=y
          CONFIG_PACKAGE_luci-i18n-autoreboot-zh-cn=y

          CONFIG_PACKAGE_luci-app-filebrowser-go=y
          CONFIG_PACKAGE_luci-i18n-filebrowser-go-zh-cn=y

          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y
          CONFIG_PACKAGE_luci-i18n-aurora-config-zh-cn=y

          CONFIG_PACKAGE_bandix=y
          CONFIG_PACKAGE_luci-app-bandix=y
          CONFIG_PACKAGE_luci-i18n-bandix-zh-cn=y

          CONFIG_PACKAGE_luci-app-run=y

          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          CONFIG_PACKAGE_luci-i18n-timewol-zh-cn=y
          EOF

          make defconfig


      # ==========================================================
      # 检查关键包
      #
      # 不再使用 grep "define Package/xxx"
      # 因为 feeds / package 的 Makefile 结构不同
      #
      # 直接检查最终 .config
      # ==========================================================

      - name: Verify selected packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Verifying selected packages"
          echo "=========================================="

          check_config() {
            PACKAGE="$1"

            if grep -qx "CONFIG_PACKAGE_${PACKAGE}=y" .config; then
              echo "OK: ${PACKAGE}"
            else
              echo "ERROR: ${PACKAGE} was not selected."
              return 1
            fi
          }

          check_config luci
          check_config luci-ssl
          check_config ppp
          check_config ppp-mod-pppoe
          check_config kmod-pppoe
          check_config luci-proto-ipv6
          check_config odhcp6c
          check_config mwan3
          check_config luci-app-mwan3
          check_config luci-app-upnp
          check_config luci-app-ttyd
          check_config luci-app-vlmcsd
          check_config luci-app-autoreboot
          check_config luci-app-filebrowser-go
          check_config luci-theme-aurora
          check_config luci-app-aurora-config
          check_config bandix
          check_config luci-app-bandix
          check_config luci-app-run
          check_config luci-app-openclash
          check_config luci-app-passwall


      # ==========================================================
      # 网络配置
      # ==========================================================

      - name: Generate network configuration
        working-directory: openwrt
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |
          set -euo pipefail

          if [ -z "${WAN1_USER}" ]; then
            echo "ERROR: WAN1_USER is empty."
            exit 1
          fi

          if [ -z "${WAN1_PASS}" ]; then
            echo "ERROR: WAN1_PASS is empty."
            exit 1
          fi

          if [ -z "${WAN2_USER}" ]; then
            echo "ERROR: WAN2_USER is empty."
            exit 1
          fi

          if [ -z "${WAN2_PASS}" ]; then
            echo "ERROR: WAN2_PASS is empty."
            exit 1
          fi

          mkdir -p files/etc/config

          cat > files/etc/config/network <<EOF
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'

          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 '1'

          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 '1'

          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'
          EOF


      # ==========================================================
      # DHCP / IPv6 RA
      # ==========================================================

      - name: Generate DHCP configuration
        working-directory: openwrt
        run: |
          set -euo pipefail

          mkdir -p files/etc/config

          cat > files/etc/config/dhcp <<'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'

          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'

          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          EOF


      # ==========================================================
      # 默认简体中文
      # ==========================================================

      - name: Set default language
        working-directory: openwrt
        run: |
          set -euo pipefail

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-default-language <<'EOF'
          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-default-language


      # ==========================================================
      # 设置 Aurora 为默认主题
      # ==========================================================

      - name: Set Aurora as default theme
        working-directory: openwrt
        run: |
          set -euo pipefail

          cat > files/etc/uci-defaults/98-default-theme <<'EOF'
          #!/bin/sh

          uci -q set luci.main.mediaurlbase='/luci-static/aurora'
          uci -q commit luci

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/98-default-theme


      # ==========================================================
      # 固件信息
      # ==========================================================

      - name: Create build information
        working-directory: openwrt
        run: |
          set -euo pipefail

          mkdir -p files/etc/openwrt-custom

          cat > files/etc/openwrt-custom/build-info <<EOF
          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          OpenWrt Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME}

          LAN:
          ${LAN_IP}

          eth0:
          WAN / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          Enabled
          EOF


      # ==========================================================
      # 下载源码包
      # ==========================================================

      - name: Download packages
        working-directory: openwrt
        run: |
          set -euo pipefail

          make download \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 编译
      # ==========================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          set -euo pipefail

          make \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 准备 Release
      # ==========================================================

      - name: Prepare release
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          IMAGE_DIR="openwrt/bin/targets/x86/64"

          echo
          echo "Available images:"
          find "${IMAGE_DIR}" \
            -maxdepth 1 \
            -type f \
            -print


      # ==========================================================
      # UEFI
      # ==========================================================

      - name: Copy UEFI image
        if: inputs.uefi
        run: |
          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI image not found."

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        if: inputs.qcow2
        run: |
          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI image not found."
            exit 1
          fi

          gzip -dc \
            "${IMAGE}" \
            > openwrt.raw

          qemu-img convert \
            -f raw \
            -O qcow2 \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        run: |
          set -euo pipefail

          cd release

          sha256sum * > sha256sums


      # ==========================================================
      # Release 信息
      # ==========================================================

      - name: Create release information
        run: |
          set -euo pipefail

          cat > release/build-info.txt <<EOF
          ==========================================
          OpenWrt Custom Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          OpenWrt commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME}

          LAN:
          ${LAN_IP}

          Network:

          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          IPv6:
          Enabled

          Output:

          UEFI
          QCOW2

          ==========================================
          EOF


      # ==========================================================
      # 已选择的软件包
      # ==========================================================

      - name: Create package list
        working-directory: openwrt
        run: |
          set -euo pipefail

          grep '^CONFIG_PACKAGE_.*=y$' .config \
            | sed 's/^CONFIG_PACKAGE_//' \
            | sed 's/=y$//' \
            | sort \
            > ../release/selected-packages.txt


      # ==========================================================
      # 显示 Release 文件
      # ==========================================================

      - name: Show release files
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ env.LAN_IP }}`
            - IPv6: Enabled

            ## Images

            - UEFI
            - QCOW2

            ## Included

            - LuCI
            - Simplified Chinese
            - PassWall
            - OpenClash
            - Aurora
            - Aurora Config
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - mwan3
            - PPPoE
            - IPv6
            - ttyd
            - UPnP
            - VLMCSd
            - Timewol
            - Autoreboot

          files: |
            release/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
