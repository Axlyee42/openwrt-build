name: Build OpenWrt x86-64 ImageBuilder

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x，留空使用 openwrt-version"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "RootFS 大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

  repository_dispatch:
    types:
      - openwrt-release


permissions:
  contents: write


env:
  TZ: Asia/Shanghai


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # 确定 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi

          if [ -z "${VERSION}" ] && [ -f openwrt-version ]; then
            VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -n 1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          echo "BUILD_DATE=$(date +%Y%m%d)" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=$(date +%H%M%S)" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "Build date      : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="


      # ==========================================================
      # RootFS
      # ==========================================================

      - name: Configure RootFS
        shell: bash
        env:
          INPUT_SIZE: ${{ inputs.rootfs_size }}

        run: |
          set -euo pipefail

          SIZE="${INPUT_SIZE:-4G}"

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid RootFS size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS: ${SIZE}"
          echo "Partition: ${PARTSIZE} MB"


      # ==========================================================
      # LAN
      # ==========================================================

      - name: Configure LAN
        shell: bash
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}

        run: |
          set -euo pipefail

          LAN_IP="${INPUT_LAN_IP:-192.168.1.2}"

          if ! printf '%s\n' "${LAN_IP}" | grep -Eq \
            '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then

            echo "ERROR: Invalid LAN IP: ${LAN_IP}"
            exit 1
          fi

          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"

          echo "LAN IP: ${LAN_IP}"


      # ==========================================================
      # 安装依赖
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            file \
            gawk \
            gettext \
            git \
            jq \
            qemu-utils \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd


      # ==========================================================
      # 下载官方 ImageBuilder
      # ==========================================================

      - name: Download OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${ARCHIVE}"

          echo
          echo "=========================================="
          echo "Downloading ImageBuilder"
          echo "=========================================="

          echo "${URL}"

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            "${URL}" \
            -O "${ARCHIVE}"

          rm -rf imagebuilder

          mkdir -p imagebuilder

          tar \
            --zstd \
            -xf "${ARCHIVE}" \
            --strip-components=1 \
            --no-same-owner \
            -C imagebuilder

          echo
          echo "ImageBuilder ready:"
          ls -lah imagebuilder


      # ==========================================================
      # ImageBuilder 信息
      # ==========================================================

      - name: Check ImageBuilder
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "ImageBuilder"
          echo "=========================================="

          make info


      # ==========================================================
      # 添加 PassWall APK 仓库
      # ==========================================================

      - name: Configure PassWall APK repository
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f repositories ]; then
            echo "ERROR: ImageBuilder repositories file not found."
            exit 1
          fi

          PASSWALL_BASE="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64"

          cat >> repositories <<EOF

          ${PASSWALL_BASE}/passwall_luci/packages.adb
          ${PASSWALL_BASE}/passwall_packages/packages.adb
          ${PASSWALL_BASE}/passwall2/packages.adb
          EOF

          echo
          echo "Repositories:"
          cat repositories


      # ==========================================================
      # PassWall key
      # ==========================================================

      - name: Install PassWall key
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p keys

          wget \
            --retry-connrefused \
            --tries=5 \
            https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub \
            -O keys/openwrt-passwall-build.pem

          echo "PassWall key installed."


      # ==========================================================
      # 下载 wukongdaily APK 仓库
      #
      # 这里是解决你当前报错的关键。
      #
      # 我们不再只下载几个 GitHub release。
      # 直接获取 wukongdaily/apk：
      #
      # run/
      #   x86-64/
      #   arm64-a53/
      #   ...
      #
      # 然后只选择 x86-64 / x86_64 / all。
      #
      # 这样不会再把 arm64-a53 APK 放进 x86-64 固件。
      # ==========================================================

      - name: Download wukongdaily APK repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third-party-apk

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk

          echo
          echo "wukongdaily APK repository:"
          find third-party-apk/run \
            -maxdepth 2 \
            -type d \
            -print |
          sort |
          head -100


      # ==========================================================
      # 准备第三方 APK
      #
      # 所有这些之前缺失的包：
      #
      # Aurora
      # FileBrowser Go
      # luci-app-run
      # VLMCSd
      # TimeWOL
      # AutoReboot
      # Bandix translation
      #
      # 都优先从 wukongdaily/apk 的正确架构目录寻找。
      # ==========================================================

      - name: Prepare third-party APK packages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf imagebuilder/packages

          mkdir -p imagebuilder/packages


          # ------------------------------------------------------
          # 需要的第三方 APK
          # ------------------------------------------------------

          cat > /tmp/third-party-packages.txt <<'EOF'
          luci-theme-aurora
          luci-app-aurora-config
          luci-i18n-aurora-config-zh-cn

          bandix
          luci-app-bandix
          luci-i18n-bandix-zh-cn

          luci-app-run

          luci-app-filebrowser-go
          luci-i18n-filebrowser-go-zh-cn

          luci-app-vlmcsd
          luci-i18n-vlmcsd-zh-cn

          luci-app-timewol
          luci-i18n-timewol-zh-cn

          luci-app-autoreboot
          luci-i18n-autoreboot-zh-cn
          EOF


          # ------------------------------------------------------
          # 删除空行
          # ------------------------------------------------------

          sed \
            -i \
            '/^[[:space:]]*$/d' \
            /tmp/third-party-packages.txt


          # ------------------------------------------------------
          # 查找包
          #
          # 优先：
          #   x86-64
          #   x86_64
          #
          # 其次：
          #   all
          #
          # 严格禁止：
          #   arm64-a53
          #   aarch64
          #   arm
          # ------------------------------------------------------

          find_package() {

            PACKAGE="$1"

            echo
            echo "Searching:"
            echo "${PACKAGE}"


            MATCH=""


            # x86-64
            MATCH="$(
              find third-party-apk/run \
                -type f \
                -name "${PACKAGE}-*.apk" \
                \( \
                  -path '*/x86-64/*' \
                  -o \
                  -path '*/x86_64/*' \
                \) \
                -print \
              2>/dev/null |
              sort -V |
              tail -1
            )"


            # all / noarch
            if [ -z "${MATCH}" ]; then

              MATCH="$(
                find third-party-apk/run \
                  -type f \
                  -name "${PACKAGE}-*.apk" \
                  \( \
                    -path '*/all/*' \
                    -o \
                    -path '*/noarch/*' \
                  \) \
                  -print \
                2>/dev/null |
                sort -V |
                tail -1
              )"

            fi


            if [ -z "${MATCH}" ]; then

              echo
              echo "ERROR:"
              echo "Cannot find x86-64 APK:"
              echo "${PACKAGE}"

              echo
              echo "Available matches:"

              find third-party-apk/run \
                -type f \
                -name "${PACKAGE}-*.apk" \
                -print \
              2>/dev/null |
              sort -V |
              tail -20


              return 1

            fi


            echo "Found:"
            echo "${MATCH}"


            cp \
              "${MATCH}" \
              imagebuilder/packages/


            return 0
          }


          FAILED=0


          while IFS= read -r PACKAGE; do

            if ! find_package "${PACKAGE}"; then
              FAILED=1
            fi

          done < /tmp/third-party-packages.txt


          if [ "${FAILED}" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "ERROR: Third-party APK preparation failed."
            echo "=========================================="

            exit 1

          fi


          echo
          echo "=========================================="
          echo "Third-party APK packages"
          echo "=========================================="


          find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' |
          sort


      # ==========================================================
      # Aurora 额外处理
      #
      # Aurora 官方也提供自己的 APK feed。
      # 但本次优先使用 wukongdaily/apk 的 25.12 APK。
      # ==========================================================

      - name: Verify Aurora packages
        shell: bash
        run: |
          set -euo pipefail

          for PACKAGE in \
            luci-theme-aurora \
            luci-app-aurora-config \
            luci-i18n-aurora-config-zh-cn
          do

            if ! find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name "${PACKAGE}-*.apk" |
              grep -q .; then

              echo "ERROR: Missing Aurora APK:"
              echo "${PACKAGE}"

              exit 1

            fi

            echo "OK: ${PACKAGE}"

          done


      # ==========================================================
      # OpenClash
      #
      # wukongdaily APK 仓库优先。
      # 如果仓库没有当前版本，则直接从 OpenClash
      # GitHub Release 查找 x86_64/all APK。
      # ==========================================================

      - name: Prepare OpenClash APK
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="luci-app-openclash"


          if find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name "${PACKAGE}-*.apk" |
            grep -q .; then

            echo "OpenClash APK already exists in wukongdaily/apk."

            exit 0

          fi


          echo "OpenClash not found in wukongdaily/apk."

          echo "Checking official OpenClash release..."


          curl \
            -fsSL \
            https://api.github.com/repos/vernesong/OpenClash/releases/latest \
            > /tmp/openclash-release.json


          URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".apk"))
              | select(.name | startswith("luci-app-openclash"))
              | select(
                  (.name | test("x86_64|x86-64|all"; "i"))
                )
              | .browser_download_url
            ' /tmp/openclash-release.json |
            head -1
          )"


          if [ -z "${URL}" ]; then

            echo
            echo "ERROR: x86_64 OpenClash APK not found."

            echo
            echo "Available APK:"
            jq -r '
              .assets[]
              | select(.name | endswith(".apk"))
              | .name
            ' /tmp/openclash-release.json

            exit 1

          fi


          wget \
            --retry-connrefused \
            --tries=5 \
            "${URL}" \
            -P imagebuilder/packages


      # ==========================================================
      # 最终第三方 APK 清单
      # ==========================================================

      - name: Show final third-party APK list
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Final third-party APK list"
          echo "=========================================="

          find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' |
          sort


          echo
          echo "Total:"

          find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' |
          wc -l


      # ==========================================================
      # 安装 files
      # ==========================================================

      - name: Prepare custom files
        shell: bash
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |
          set -euo pipefail


          if [ -z "${WAN1_USER:-}" ] || [ -z "${WAN1_PASS:-}" ]; then

            echo "ERROR: WAN1_USER / WAN1_PASS are missing."

            exit 1

          fi


          if [ -z "${WAN2_USER:-}" ] || [ -z "${WAN2_PASS:-}" ]; then

            echo "ERROR: WAN2_USER / WAN2_PASS are missing."

            exit 1

          fi


          rm -rf imagebuilder/files

          mkdir -p imagebuilder/files


          # 复制仓库里的其它 files
          if [ -d files ]; then

            rsync \
              -a \
              files/ \
              imagebuilder/files/

          fi


          mkdir -p \
            imagebuilder/files/etc/config \
            imagebuilder/files/etc/uci-defaults


          # ======================================================
          # network
          # ======================================================

          cat > imagebuilder/files/etc/config/network <<EOF

          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'


          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'


          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'


          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 '1'


          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'


          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 '1'


          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          EOF


          # ======================================================
          # DHCP
          # ======================================================

          cat > imagebuilder/files/etc/config/dhcp <<'EOF'

          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'


          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'


          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'


          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'

          EOF


          # ======================================================
          # 默认中文
          # ======================================================

          cat > imagebuilder/files/etc/uci-defaults/99-default-language <<'EOF'

          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0

          EOF


          chmod +x \
            imagebuilder/files/etc/uci-defaults/99-default-language


          echo
          echo "Custom files:"

          find imagebuilder/files \
            -type f \
            -print


      # ==========================================================
      # 最终软件包列表
      # ==========================================================

      - name: Prepare final package list
        shell: bash
        run: |
          set -euo pipefail


          # 官方包
          cat > /tmp/package-list <<'EOF'

          luci
          luci-i18n-base-zh-cn

          ppp
          ppp-mod-pppoe
          kmod-pppoe

          luci-proto-ppp
          luci-proto-ipv6

          ipv6
          odhcp6c
          odhcpd-ipv6only

          mwan3
          luci-app-mwan3
          luci-i18n-mwan3-zh-cn

          luci-app-ttyd
          luci-i18n-ttyd-zh-cn

          luci-app-upnp
          luci-i18n-upnp-zh-cn

          EOF


          # 第三方包
          cat >> /tmp/package-list <<'EOF'

          luci-theme-aurora
          luci-app-aurora-config
          luci-i18n-aurora-config-zh-cn

          bandix
          luci-app-bandix
          luci-i18n-bandix-zh-cn

          luci-app-run

          luci-app-filebrowser-go
          luci-i18n-filebrowser-go-zh-cn

          luci-app-vlmcsd
          luci-i18n-vlmcsd-zh-cn

          luci-app-timewol
          luci-i18n-timewol-zh-cn

          luci-app-autoreboot
          luci-i18n-autoreboot-zh-cn

          luci-app-openclash

          luci-app-passwall
          luci-i18n-passwall-zh-cn

          EOF


          # 兼容用户自定义清单
          if [ -f shell/apk-custom-packages.sh ]; then

            source shell/apk-custom-packages.sh

            printf '%s\n' "${CUSTOM_PACKAGES}" \
              | tr ' ' '\n' \
              >> /tmp/package-list

          fi


          sort -u \
            /tmp/package-list |
          sed '/^[[:space:]]*$/d' \
            > selected-packages.txt


          echo
          echo "=========================================="
          echo "Final package list"
          echo "=========================================="


          cat selected-packages.txt


          echo
          echo "Package count:"

          wc -l selected-packages.txt


      # ==========================================================
      # 重要：
      #
      # 不再：
      #   make package_list
      #   make manifest
      #
      # 直接 make image。
      #
      # ImageBuilder 会自己建立 APK database/index。
      # ==========================================================

      - name: Build OpenWrt UEFI image
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail


          PACKAGES="$(
            tr '\n' ' ' \
              < "${GITHUB_WORKSPACE}/selected-packages.txt"
          )"


          echo
          echo "=========================================="
          echo "Building OpenWrt"
          echo "=========================================="


          echo
          echo "OpenWrt:"
          echo "${OPENWRT_VERSION}"


          echo
          echo "RootFS:"
          echo "${ROOTFS_PARTSIZE} MB"


          echo
          echo "Packages:"
          echo "${PACKAGES}"


          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            BIN_DIR="${GITHUB_WORKSPACE}/output" \
            EXTRA_IMAGE_NAME="${ROOTFS_SIZE}-${BUILD_DATE}"


      # ==========================================================
      # 查找 UEFI
      # ==========================================================

      - name: Prepare UEFI image
        shell: bash
        run: |
          set -euo pipefail


          echo
          echo "=========================================="
          echo "ImageBuilder output"
          echo "=========================================="


          find output \
            -type f \
            -maxdepth 3 \
            -print


          IMAGE="$(
            find output \
              -type f \
              -name '*combined-efi.img.gz' |
            head -n 1
          )"


          if [ -z "${IMAGE}" ]; then

            echo
            echo "ERROR: UEFI image not found."

            echo
            echo "All generated files:"

            find output \
              -type f \
              -print

            exit 1

          fi


          FINAL_IMAGE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


          mv \
            "${IMAGE}" \
            "${FINAL_IMAGE}"


          echo "UEFI_IMAGE=${FINAL_IMAGE}" >> "${GITHUB_ENV}"


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        shell: bash
        run: |
          set -euo pipefail


          RAW="/tmp/openwrt.raw"


          QCOW2="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


          gzip \
            -dc \
            "${UEFI_IMAGE}" \
            > "${RAW}"


          qemu-img convert \
            -p \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            "${RAW}" \
            "${QCOW2}"


          rm -f "${RAW}"


          test -s "${QCOW2}"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: output
        shell: bash
        run: |
          set -euo pipefail


          sha256sum \
            *.img.gz \
            *.qcow2 \
            > sha256sums.txt


          cat sha256sums.txt


      # ==========================================================
      # Build 信息
      # ==========================================================

      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail


          cat > output/build-info.txt <<EOF

          ==========================================
          OpenWrt Custom ImageBuilder Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          ImageBuilder:
          Official OpenWrt

          RootFS:
          ${ROOTFS_SIZE}

          Partition:
          ${ROOTFS_PARTSIZE} MB

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME}

          LAN:
          ${LAN_IP}

          Network:

          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          IPv6:
          Enabled

          Images:

          UEFI
          QCOW2

          ==========================================

          EOF


      # ==========================================================
      # 保存软件包列表
      # ==========================================================

      - name: Save package list
        run: |
          set -euo pipefail

          cp \
            selected-packages.txt \
            output/selected-packages.txt


      # ==========================================================
      # 最终检查
      # ==========================================================

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail


          UEFI_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          QCOW2_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


          test -s "${UEFI_FILE}"
          test -s "${QCOW2_FILE}"
          test -s output/sha256sums.txt
          test -s output/build-info.txt
          test -s output/selected-packages.txt


          echo
          echo "=========================================="
          echo "Final files"
          echo "=========================================="


          ls -lh output


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail


          TAG="v${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${GITHUB_RUN_NUMBER}"


          TITLE="OpenWrt ${OPENWRT_VERSION} x86-64 ${ROOTFS_SIZE} ${BUILD_DATE}"


          cat > release-notes.md <<EOF

          # OpenWrt ${OPENWRT_VERSION} x86-64

          ## Build

          - OpenWrt: \`${OPENWRT_VERSION}\`
          - Target: \`x86-64\`
          - ImageBuilder: Official OpenWrt
          - RootFS: \`${ROOTFS_SIZE}\`
          - Build date: \`${BUILD_DATE}\`

          ## Network

          - \`eth0\` → WAN / PPPoE
          - \`eth1\` → WANB / PPPoE
          - \`eth2\` → LAN
          - \`eth3\` → LAN
          - \`eth4\` → LAN
          - \`eth5\` → LAN

          - LAN IP: \`${LAN_IP}\`
          - IPv6: Enabled

          ## Images

          - UEFI
          - QCOW2

          ## Packages

          See \`selected-packages.txt\`.

          EOF


          gh release create \
            "${TAG}" \
            output/*.img.gz \
            output/*.qcow2 \
            output/sha256sums.txt \
            output/build-info.txt \
            output/selected-packages.txt \
            --title "${TITLE}" \
            --notes-file release-notes.md


          echo
          echo "=========================================="
          echo "Release created"
          echo "=========================================="


          echo "${TAG}"
