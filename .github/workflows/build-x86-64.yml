name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x，留空使用 openwrt-version"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "RootFS 大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

  repository_dispatch:
    types:
      - openwrt-release


permissions:
  contents: write


env:
  TZ: Asia/Shanghai


jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5

        with:
          fetch-depth: 1


      # ==========================================================
      # Resolve OpenWrt version
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash

        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"


          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi


          if [ -z "${VERSION}" ] && [ -f openwrt-version ]; then
            VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi


          if [ -z "${VERSION}" ]; then

            echo "Detecting latest OpenWrt 25.12.x..."


            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -n 1
            )"

          fi


          if ! printf '%s\n' "${VERSION}" |
            grep -Eq '^25\.12\.[0-9]+$'
          then

            echo "ERROR: Invalid OpenWrt version: ${VERSION}"

            exit 1

          fi


          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          echo "BUILD_DATE=$(date +%Y%m%d)" >> "${GITHUB_ENV}"

          echo "BUILD_TIME=$(date +%H%M%S)" >> "${GITHUB_ENV}"


          echo
          echo "=========================================="
          echo "OpenWrt : ${VERSION}"
          echo "Date    : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="


      # ==========================================================
      # RootFS
      # ==========================================================

      - name: Configure RootFS
        shell: bash

        env:
          INPUT_SIZE: ${{ inputs.rootfs_size }}

        run: |
          set -euo pipefail

          SIZE="${INPUT_SIZE:-4G}"


          case "${SIZE}" in

            1G)
              PARTSIZE=1024
              ;;

            2G)
              PARTSIZE=2048
              ;;

            3G)
              PARTSIZE=3072
              ;;

            4G)
              PARTSIZE=4096
              ;;

            *)
              echo "ERROR: Invalid RootFS size: ${SIZE}"
              exit 1
              ;;

          esac


          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"

          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"


      # ==========================================================
      # LAN
      # ==========================================================

      - name: Configure LAN
        shell: bash

        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}

        run: |
          set -euo pipefail

          LAN_IP="${INPUT_LAN_IP:-192.168.1.2}"


          if ! printf '%s\n' "${LAN_IP}" |
            grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
          then

            echo "ERROR: Invalid LAN IP: ${LAN_IP}"

            exit 1

          fi


          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"


      # ==========================================================
      # PPPoE secrets
      # ==========================================================

      - name: Validate PPPoE secrets
        shell: bash

        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |
          set -euo pipefail


          for NAME in \
            WAN1_USER \
            WAN1_PASS \
            WAN2_USER \
            WAN2_PASS
          do

            if [ -z "${!NAME:-}" ]; then

              echo "ERROR: GitHub Secret ${NAME} is missing."

              exit 1

            fi

          done


      # ==========================================================
      # Dependencies
      # ==========================================================

      - name: Install dependencies
        shell: bash

        run: |
          set -euo pipefail


          sudo apt-get update


          sudo apt-get install -y \
            bash \
            curl \
            file \
            gawk \
            gettext \
            git \
            jq \
            libncurses-dev \
            libssl-dev \
            make \
            qemu-utils \
            rsync \
            unzip \
            wget \
            zstd


      # ==========================================================
      # Official ImageBuilder
      # ==========================================================

      - name: Download official ImageBuilder
        shell: bash

        run: |
          set -euo pipefail


          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"

          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"


          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            "${BASE_URL}/${ARCHIVE}" \
            -O "${ARCHIVE}"


          rm -rf imagebuilder


          mkdir -p imagebuilder


          tar \
            --zstd \
            -xf "${ARCHIVE}" \
            --strip-components=1 \
            --no-same-owner \
            -C imagebuilder


          echo
          echo "ImageBuilder ready."


      # ==========================================================
      # ImageBuilder info
      # ==========================================================

      - name: Check ImageBuilder
        working-directory: imagebuilder

        shell: bash

        run: |
          set -euo pipefail

          make info


      # ==========================================================
      # PassWall
      # ==========================================================

      - name: Configure PassWall repository
        working-directory: imagebuilder

        shell: bash

        run: |
          set -euo pipefail


          if [ ! -f repositories ]; then

            echo "ERROR: ImageBuilder repositories file not found."

            exit 1

          fi


          PASSWALL_BASE="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64"


          for REPO in \
            "${PASSWALL_BASE}/passwall_luci/packages.adb" \
            "${PASSWALL_BASE}/passwall_packages/packages.adb" \
            "${PASSWALL_BASE}/passwall2/packages.adb"
          do

            grep -qxF "${REPO}" repositories ||
              printf '%s\n' "${REPO}" >> repositories

          done


          mkdir -p keys


          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub \
            -O keys/openwrt-passwall-build.pem


      # ==========================================================
      # wukongdaily APK
      # ==========================================================

      - name: Download wukongdaily APK repository
        shell: bash

        run: |
          set -euo pipefail


          rm -rf third-party-apk


          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk


          if [ ! -d third-party-apk/run/x86 ]; then

            echo "ERROR: third-party-apk/run/x86 not found."

            exit 1

          fi


      # ==========================================================
      # Prepare wukongdaily APK
      # ==========================================================

      - name: Prepare wukongdaily APK
        shell: bash

        run: |
          set -euo pipefail


          rm -rf imagebuilder/packages


          mkdir -p imagebuilder/packages


          find third-party-apk/run/x86 \
            -type f \
            -name "*.apk" \
            -exec cp -v {} imagebuilder/packages/ \;


          COUNT="$(
            find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name "*.apk" |
            wc -l
          )"


          echo "wukongdaily APK count: ${COUNT}"


          if [ "${COUNT}" -eq 0 ]; then

            echo "ERROR: No wukongdaily APK."

            exit 1

          fi


      # ==========================================================
      # OpenClash
      # ==========================================================

      - name: Prepare OpenClash APK
        shell: bash

        run: |
          set -euo pipefail


          LOCAL="$(
            find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name 'luci-app-openclash-*.apk' \
              -print |
            sort -V |
            tail -n 1
          )"


          if [ -n "${LOCAL}" ]; then

            echo "OpenClash already exists."

            exit 0

          fi


          curl \
            -fsSL \
            https://api.github.com/repos/vernesong/OpenClash/releases/latest \
            -o /tmp/openclash.json


          URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".apk"))
              | select(.name | startswith("luci-app-openclash-"))
              | .browser_download_url
            ' /tmp/openclash.json |
            head -n 1
          )"


          if [ -z "${URL}" ]; then

            echo "ERROR: OpenClash APK not found."

            exit 1

          fi


          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            "${URL}" \
            -P imagebuilder/packages


      # ==========================================================
      # Official SDK
      # ==========================================================

      - name: Download official OpenWrt SDK
        shell: bash

        run: |
          set -euo pipefail


          SDK_BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"


          SDK_ARCHIVE="$(
            curl \
              -fsSL \
              "${SDK_BASE}/" |
            grep -oE \
              "openwrt-sdk-${OPENWRT_VERSION}-x86-64[^\"']*\.tar\.zst" |
            sort -V |
            tail -n 1
          )"


          if [ -z "${SDK_ARCHIVE}" ]; then

            echo "ERROR: OpenWrt SDK not found."

            exit 1

          fi


          echo "SDK:"
          echo "${SDK_ARCHIVE}"


          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            "${SDK_BASE}/${SDK_ARCHIVE}" \
            -O openwrt-sdk.tar.zst


          rm -rf sdk


          mkdir -p sdk


          tar \
            --zstd \
            -xf openwrt-sdk.tar.zst \
            --strip-components=1 \
            --no-same-owner \
            -C sdk


      # ==========================================================
      # Official feeds
      # ==========================================================

      - name: Update SDK feeds
        working-directory: sdk

        shell: bash

        run: |
          set -euo pipefail


          ./scripts/feeds update -a


          ./scripts/feeds install -a


      # ==========================================================
      # Kiddin9 25.12 source
      # ==========================================================

      - name: Download Kiddin9 Kwrt 25.12
        shell: bash

        run: |
          set -euo pipefail


          rm -rf kiddin9-kwrt


          git clone \
            --depth=1 \
            --branch 25.12 \
            https://github.com/kiddin9/Kwrt.git \
            kiddin9-kwrt


          echo
          echo "Kiddin9 commit:"

          git \
            -C kiddin9-kwrt \
            log \
            -1 \
            --oneline


      # ==========================================================
      # Fallback sources
      # ==========================================================

      - name: Download fallback package sources
        shell: bash

        run: |
          set -euo pipefail


          rm -rf sbwml-pkgs


          git clone \
            --depth=1 \
            https://github.com/sbwml/openwrt_pkgs.git \
            sbwml-pkgs


          rm -rf timewol-pkg


          git clone \
            --depth=1 \
            https://github.com/kiddin9/luci-app-timewol.git \
            timewol-pkg


      # ==========================================================
      # Prepare backend + LuCI sources
      #
      # 非 LuCI：
      #   sdk/package/third-party
      #
      # LuCI：
      #   sdk/feeds/luci/applications
      #
      # 这是这次最重要的修正。
      # ==========================================================

      - name: Prepare third-party sources
        shell: bash

        run: |
          set -euo pipefail


          rm -rf \
            sdk/package/third-party


          mkdir -p \
            sdk/package/third-party


          mkdir -p \
            sdk/feeds/luci/applications


          # ------------------------------------------------------
          # Find source
          # ------------------------------------------------------

          find_package_dir() {

            local ROOT="$1"
            local NAME="$2"


            find "${ROOT}" \
              -type f \
              -name Makefile \
              -print |
            while IFS= read -r MAKEFILE; do

              DIR="$(dirname "${MAKEFILE}")"


              if [ "$(basename "${DIR}")" = "${NAME}" ]; then

                printf '%s\n' "${DIR}"

                return 0

              fi

            done

          }


          resolve_package() {

            local NAME="$1"

            local SRC=""


            # ----------------------------------------------------
            # 1. Kiddin9
            # ----------------------------------------------------

            SRC="$(
              find_package_dir \
                kiddin9-kwrt \
                "${NAME}" |
              head -n 1
            )"


            if [ -n "${SRC}" ]; then

              printf '%s\n' "${SRC}"

              return 0

            fi


            # ----------------------------------------------------
            # 2. sbwml
            # ----------------------------------------------------

            SRC="$(
              find_package_dir \
                sbwml-pkgs \
                "${NAME}" |
              head -n 1
            )"


            if [ -n "${SRC}" ]; then

              printf '%s\n' "${SRC}"

              return 0

            fi


            # ----------------------------------------------------
            # 3. TimeWOL
            # ----------------------------------------------------

            if [ "${NAME}" = "luci-app-timewol" ] &&
              [ -f timewol-pkg/Makefile ]
            then

              (
                cd timewol-pkg
                pwd
              )

              return 0

            fi


            return 1

          }


          copy_backend() {

            local NAME="$1"

            local SRC=""


            if ! SRC="$(resolve_package "${NAME}")"; then

              echo
              echo "ERROR: Backend package not found:"
              echo "${NAME}"

              exit 1

            fi


            echo
            echo "Backend:"
            echo "${NAME}"

            echo "Source:"
            echo "${SRC}"


            rm -rf \
              "sdk/package/third-party/${NAME}"


            cp -a \
              "${SRC}" \
              "sdk/package/third-party/${NAME}"

          }


          copy_luci() {

            local NAME="$1"

            local SRC=""


            if ! SRC="$(resolve_package "${NAME}")"; then

              echo
              echo "ERROR: LuCI package not found:"
              echo "${NAME}"

              exit 1

            fi


            echo
            echo "LuCI:"
            echo "${NAME}"

            echo "Source:"
            echo "${SRC}"


            rm -rf \
              "sdk/feeds/luci/applications/${NAME}"


            cp -a \
              "${SRC}" \
              "sdk/feeds/luci/applications/${NAME}"

          }


          # ------------------------------------------------------
          # Backend
          # ------------------------------------------------------

          copy_backend filebrowser

          copy_backend vlmcsd


          # ------------------------------------------------------
          # LuCI
          #
          # 必须放在 feeds/luci/applications。
          # ------------------------------------------------------

          copy_luci luci-app-filebrowser-go

          copy_luci luci-app-vlmcsd

          copy_luci luci-app-autoreboot

          copy_luci luci-app-timewol


          echo
          echo "=========================================="
          echo "Backend sources"
          echo "=========================================="


          find sdk/package/third-party \
            -maxdepth 2 \
            -type f \
            -name Makefile \
            -print |
          sort


          echo
          echo "=========================================="
          echo "LuCI sources"
          echo "=========================================="


          find sdk/feeds/luci/applications \
            -maxdepth 2 \
            -type f \
            -name Makefile \
            -print |
          grep -E \
            'luci-app-(filebrowser-go|vlmcsd|autoreboot|timewol)' ||
            true


      # ==========================================================
      # Verify source structure
      # ==========================================================

      - name: Verify third-party source layout
        shell: bash

        run: |
          set -euo pipefail


          for PACKAGE in \
            filebrowser \
            vlmcsd
          do

            if [ ! -f \
              "sdk/package/third-party/${PACKAGE}/Makefile"
            ]; then

              echo "ERROR: Backend Makefile missing:"
              echo "${PACKAGE}"

              exit 1

            fi

          done


          for PACKAGE in \
            luci-app-filebrowser-go \
            luci-app-vlmcsd \
            luci-app-autoreboot \
            luci-app-timewol
          do

            if [ ! -f \
              "sdk/feeds/luci/applications/${PACKAGE}/Makefile"
            ]; then

              echo "ERROR: LuCI Makefile missing:"
              echo "${PACKAGE}"

              exit 1

            fi

          done


          echo
          echo "Source layout OK."


      # ==========================================================
      # Reinstall LuCI feed packages
      #
      # 注意：
      # 我们在 feeds/luci/applications 放入第三方 LuCI 源码后，
      # 重新执行 feeds install，让 package/feeds/luci/
      # 建立正确的链接。
      # ==========================================================

      - name: Install LuCI package definitions
        working-directory: sdk

        shell: bash

        run: |
          set -euo pipefail


          ./scripts/feeds install -a


          echo
          echo "Checking LuCI package links:"


          for PACKAGE in \
            luci-app-filebrowser-go \
            luci-app-vlmcsd \
            luci-app-autoreboot \
            luci-app-timewol
          do

            if [ -e \
              "package/feeds/luci/${PACKAGE}"
            ]; then

              echo "OK: ${PACKAGE}"

            else

              echo "ERROR: LuCI feed link missing:"
              echo "${PACKAGE}"

              exit 1

            fi

          done


      # ==========================================================
      # SDK config
      # ==========================================================

      - name: Configure SDK
        working-directory: sdk

        shell: bash

        run: |
          set -euo pipefail


          printf '%s\n' \
            "CONFIG_LUCI_LANG_zh_Hans=y" \
            "CONFIG_PACKAGE_filebrowser=m" \
            "CONFIG_PACKAGE_vlmcsd=m" \
            "CONFIG_PACKAGE_luci-app-filebrowser-go=m" \
            "CONFIG_PACKAGE_luci-app-vlmcsd=m" \
            "CONFIG_PACKAGE_luci-app-autoreboot=m" \
            "CONFIG_PACKAGE_luci-app-timewol=m" \
            "CONFIG_PACKAGE_etherwake=m" \
            >> .config


          make defconfig


      # ==========================================================
      # Build FileBrowser
      # ==========================================================

      - name: Build FileBrowser
        working-directory: sdk

        shell: bash

        run: |
          set -euo pipefail


          make \
            package/third-party/filebrowser/compile \
            package/feeds/luci/luci-app-filebrowser-go/compile \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # Build VLMCSd
      # ==========================================================

      - name: Build VLMCSd
        working-directory: sdk

        shell: bash

        run: |
          set -euo pipefail


          make \
            package/third-party/vlmcsd/compile \
            package/feeds/luci/luci-app-vlmcsd/compile \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # Build AutoReboot
      # ==========================================================

      - name: Build AutoReboot
        working-directory: sdk

        shell: bash

        run: |
          set -euo pipefail


          make \
            package/feeds/luci/luci-app-autoreboot/compile \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # Build TimeWOL
      # ==========================================================

      - name: Build TimeWOL
        working-directory: sdk

        shell: bash

        run: |
          set -euo pipefail


          make \
            package/feeds/luci/luci-app-timewol/compile \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # Collect SDK APK
      # ==========================================================

      - name: Collect SDK APK
        shell: bash

        run: |
          set -euo pipefail


          echo
          echo "=========================================="
          echo "SDK generated APK"
          echo "=========================================="


          find sdk/bin/packages \
            -type f \
            -name "*.apk" \
            -printf "%p\n" |
          sort


          COUNT="$(
            find sdk/bin/packages \
              -type f \
              -name "*.apk" |
            wc -l
          )"


          echo
          echo "SDK APK count: ${COUNT}"


          if [ "${COUNT}" -eq 0 ]; then

            echo "ERROR: SDK produced zero APK."

            exit 1

          fi


          # ------------------------------------------------------
          # Remove stale copies
          # ------------------------------------------------------

          for PACKAGE in \
            filebrowser \
            luci-app-filebrowser-go \
            luci-i18n-filebrowser-go-zh-cn \
            vlmcsd \
            luci-app-vlmcsd \
            luci-i18n-vlmcsd-zh-cn \
            luci-app-autoreboot \
            luci-i18n-autoreboot-zh-cn \
            luci-app-timewol \
            luci-i18n-timewol-zh-cn
          do

            find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name "${PACKAGE}-*.apk" \
              -delete

          done


          # ------------------------------------------------------
          # Copy all SDK APK
          # ------------------------------------------------------

          find sdk/bin/packages \
            -type f \
            -name "*.apk" \
            -exec cp -v {} imagebuilder/packages/ \;


      # ==========================================================
      # Verify rebuilt packages
      # ==========================================================

      - name: Verify rebuilt packages
        shell: bash

        run: |
          set -euo pipefail


          FAILED=0


          for PACKAGE in \
            luci-app-filebrowser-go \
            luci-i18n-filebrowser-go-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-vlmcsd-zh-cn \
            luci-app-autoreboot \
            luci-i18n-autoreboot-zh-cn \
            luci-app-timewol \
            luci-i18n-timewol-zh-cn
          do

            MATCH="$(
              find imagebuilder/packages \
                -maxdepth 1 \
                -type f \
                -name "${PACKAGE}-*.apk" \
                -print |
              sort -V |
              tail -n 1
            )"


            if [ -n "${MATCH}" ]; then

              echo "OK: ${PACKAGE}"

              echo "    ${MATCH}"

            else

              echo "ERROR: Missing APK: ${PACKAGE}"

              FAILED=1

            fi

          done


          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi


      # ==========================================================
      # Custom files
      # ==========================================================

      - name: Prepare custom files
        shell: bash

        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |
          set -euo pipefail


          if [ -z "${WAN1_USER:-}" ] ||
             [ -z "${WAN1_PASS:-}" ] ||
             [ -z "${WAN2_USER:-}" ] ||
             [ -z "${WAN2_PASS:-}" ]
          then

            echo "ERROR: PPPoE secrets are incomplete."

            exit 1

          fi


          mkdir -p \
            imagebuilder/files/etc/config \
            imagebuilder/files/etc/uci-defaults


          if [ -d files ]; then

            rsync \
              -a \
              files/ \
              imagebuilder/files/

          fi


          # ------------------------------------------------------
          # network
          # ------------------------------------------------------

          printf '%s\n' \
            "config interface 'loopback'" \
            "    option device 'lo'" \
            "    option proto 'static'" \
            "    option ipaddr '127.0.0.1'" \
            "    option netmask '255.0.0.0'" \
            "" \
            "config device" \
            "    option name 'br-lan'" \
            "    option type 'bridge'" \
            "    list ports 'eth2'" \
            "    list ports 'eth3'" \
            "    list ports 'eth4'" \
            "    list ports 'eth5'" \
            "" \
            "config interface 'lan'" \
            "    option device 'br-lan'" \
            "    option proto 'static'" \
            "    option ipaddr '${LAN_IP}'" \
            "    option netmask '255.255.255.0'" \
            "    option ip6assign '64'" \
            "" \
            "config interface 'wan'" \
            "    option device 'eth0'" \
            "    option proto 'pppoe'" \
            "    option username '${WAN1_USER}'" \
            "    option password '${WAN1_PASS}'" \
            "    option ipv6 '1'" \
            "" \
            "config interface 'wan6'" \
            "    option device '@wan'" \
            "    option proto 'dhcpv6'" \
            "    option reqaddress 'try'" \
            "    option reqprefix 'auto'" \
            "" \
            "config interface 'wanb'" \
            "    option device 'eth1'" \
            "    option proto 'pppoe'" \
            "    option username '${WAN2_USER}'" \
            "    option password '${WAN2_PASS}'" \
            "    option ipv6 '1'" \
            "" \
            "config interface 'wanb6'" \
            "    option device '@wanb'" \
            "    option proto 'dhcpv6'" \
            "    option reqaddress 'try'" \
            "    option reqprefix 'auto'" \
            > imagebuilder/files/etc/config/network


          # ------------------------------------------------------
          # DHCP / IPv6
          # ------------------------------------------------------

          printf '%s\n' \
            "config dnsmasq" \
            "    option domainneeded '1'" \
            "    option boguspriv '1'" \
            "    option localise_queries '1'" \
            "    option rebind_protection '1'" \
            "    option local '/lan/'" \
            "    option domain 'lan'" \
            "    option expandhosts '1'" \
            "    option authoritative '1'" \
            "    option readethers '1'" \
            "    option leasefile '/tmp/dhcp.leases'" \
            "    option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'" \
            "" \
            "config dhcp 'lan'" \
            "    option interface 'lan'" \
            "    option start '100'" \
            "    option limit '150'" \
            "    option leasetime '12h'" \
            "    option dhcpv4 'server'" \
            "    option dhcpv6 'server'" \
            "    option ra 'server'" \
            "    option ra_management '1'" \
            "" \
            "config dhcp 'wan'" \
            "    option interface 'wan'" \
            "    option ignore '1'" \
            "" \
            "config dhcp 'wanb'" \
            "    option interface 'wanb'" \
            "    option ignore '1'" \
            "" \
            "config odhcpd 'odhcpd'" \
            "    option maindhcp '0'" \
            "    option leasefile '/tmp/hosts/odhcpd'" \
            "    option leasetrigger '/usr/sbin/odhcpd-update'" \
            "    option loglevel '4'" \
            > imagebuilder/files/etc/config/dhcp


          # ------------------------------------------------------
          # Default Chinese
          # ------------------------------------------------------

          printf '%s\n' \
            '#!/bin/sh' \
            "" \
            "uci -q set luci.main.lang='zh_cn'" \
            "uci -q commit luci" \
            "" \
            "exit 0" \
            > imagebuilder/files/etc/uci-defaults/99-default-language


          chmod +x \
            imagebuilder/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # User package list
      # ==========================================================

      - name: Load custom package list
        shell: bash

        run: |
          set -euo pipefail


          if [ ! -f shell/apk-custom-packages.sh ]; then

            echo "ERROR: shell/apk-custom-packages.sh not found."

            exit 1

          fi


          source shell/apk-custom-packages.sh


          printf '%s\n' "${CUSTOM_PACKAGES:-}" |
            tr ' ' '\n' |
            sed '/^[[:space:]]*$/d' \
            > /tmp/custom-packages


      # ==========================================================
      # Final package list
      # ==========================================================

      - name: Build final package list
        shell: bash

        run: |
          set -euo pipefail


          rm -f selected-packages.txt


          printf '%s\n' \
            "luci" \
            "luci-i18n-base-zh-cn" \
            "ppp" \
            "ppp-mod-pppoe" \
            "kmod-pppoe" \
            "luci-proto-ppp" \
            "luci-proto-ipv6" \
            "odhcp6c" \
            "odhcpd-ipv6only" \
            "mwan3" \
            "luci-app-mwan3" \
            "luci-i18n-mwan3-zh-cn" \
            "luci-app-ttyd" \
            "luci-i18n-ttyd-zh-cn" \
            "luci-app-upnp" \
            "luci-i18n-upnp-zh-cn" \
            "luci-app-openclash" \
            "luci-app-passwall" \
            "luci-i18n-passwall-zh-cn" \
            "luci-app-filebrowser-go" \
            "luci-i18n-filebrowser-go-zh-cn" \
            "luci-app-vlmcsd" \
            "luci-i18n-vlmcsd-zh-cn" \
            "luci-app-autoreboot" \
            "luci-i18n-autoreboot-zh-cn" \
            "luci-app-timewol" \
            "luci-i18n-timewol-zh-cn" \
            >> selected-packages.txt


          while IFS= read -r PACKAGE; do

            [ -z "${PACKAGE}" ] && continue


            case "${PACKAGE}" in

              ipv6|kmod-ipv6)

                echo "Ignoring unavailable package: ${PACKAGE}"

                ;;

              *)

                printf '%s\n' "${PACKAGE}" \
                  >> selected-packages.txt

                ;;

            esac

          done < /tmp/custom-packages


          sort -u \
            selected-packages.txt \
            -o selected-packages.txt


          echo
          echo "=========================================="
          echo "Final package list"
          echo "=========================================="


          cat selected-packages.txt


      # ==========================================================
      # Verify all important APK
      # ==========================================================

      - name: Verify required APK packages
        shell: bash

        run: |
          set -euo pipefail


          FAILED=0


          for PACKAGE in \
            luci-theme-aurora \
            luci-app-aurora-config \
            luci-i18n-aurora-config-zh-cn \
            bandix \
            luci-app-bandix \
            luci-i18n-bandix-zh-cn \
            luci-app-run \
            luci-app-openclash \
            luci-app-filebrowser-go \
            luci-i18n-filebrowser-go-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-vlmcsd-zh-cn \
            luci-app-autoreboot \
            luci-i18n-autoreboot-zh-cn \
            luci-app-timewol \
            luci-i18n-timewol-zh-cn
          do


            MATCH="$(
              find imagebuilder/packages \
                -maxdepth 1 \
                -type f \
                -name "${PACKAGE}-*.apk" \
                -print |
              sort -V |
              tail -n 1
            )"


            if [ -n "${MATCH}" ]; then

              echo "OK: ${PACKAGE}"

            else

              echo "ERROR: Missing APK: ${PACKAGE}"

              FAILED=1

            fi

          done


          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi


      # ==========================================================
      # Build image
      # ==========================================================

      - name: Build UEFI image
        working-directory: imagebuilder

        shell: bash

        run: |
          set -euo pipefail


          mkdir -p \
            "${GITHUB_WORKSPACE}/output"


          PACKAGES="$(
            tr '\n' ' ' \
              < "${GITHUB_WORKSPACE}/selected-packages.txt"
          )"


          echo
          echo "=========================================="
          echo "Building OpenWrt"
          echo "=========================================="


          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            BIN_DIR="${GITHUB_WORKSPACE}/output" \
            EXTRA_IMAGE_NAME="${ROOTFS_SIZE}-${BUILD_DATE}"


      # ==========================================================
      # UEFI
      # ==========================================================

      - name: Prepare UEFI image
        shell: bash

        run: |
          set -euo pipefail


          IMAGE="$(
            find output \
              -type f \
              -name '*combined-efi.img.gz' |
            head -n 1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI image not found."


            find output \
              -type f \
              -print


            exit 1

          fi


          FINAL="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


          mv \
            "${IMAGE}" \
            "${FINAL}"


          echo "UEFI_IMAGE=${FINAL}" \
            >> "${GITHUB_ENV}"


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        shell: bash

        run: |
          set -euo pipefail


          QCOW2="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


          gzip \
            -dc \
            "${UEFI_IMAGE}" \
            > /tmp/openwrt.raw


          qemu-img convert \
            -p \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            /tmp/openwrt.raw \
            "${QCOW2}"


          rm -f /tmp/openwrt.raw


          test -s "${QCOW2}"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: output

        shell: bash

        run: |
          set -euo pipefail


          sha256sum \
            *.img.gz \
            *.qcow2 \
            > sha256sums.txt


          cat sha256sums.txt


      # ==========================================================
      # Build info
      # ==========================================================

      - name: Create build information
        shell: bash

        run: |
          set -euo pipefail


          printf '%s\n' \
            "OpenWrt Custom ImageBuilder Build" \
            "" \
            "OpenWrt: ${OPENWRT_VERSION}" \
            "Target: x86-64" \
            "ImageBuilder: Official OpenWrt" \
            "SDK: Official OpenWrt SDK" \
            "Primary third-party source: Kiddin9 Kwrt 25.12" \
            "RootFS: ${ROOTFS_SIZE}" \
            "RootFS partition: ${ROOTFS_PARTSIZE} MB" \
            "Build date: ${BUILD_DATE}" \
            "Build time: ${BUILD_TIME}" \
            "LAN: ${LAN_IP}" \
            "" \
            "Network:" \
            "eth0 = WAN / PPPoE" \
            "eth1 = WANB / PPPoE" \
            "eth2 = LAN" \
            "eth3 = LAN" \
            "eth4 = LAN" \
            "eth5 = LAN" \
            "" \
            "IPv6: Enabled" \
            "" \
            "Images:" \
            "UEFI" \
            "QCOW2" \
            > output/build-info.txt


      # ==========================================================
      # Save package list
      # ==========================================================

      - name: Save package list
        shell: bash

        run: |
          set -euo pipefail


          cp \
            selected-packages.txt \
            output/selected-packages.txt


      # ==========================================================
      # Verify output
      # ==========================================================

      - name: Verify output
        shell: bash

        run: |
          set -euo pipefail


          UEFI_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          QCOW2_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


          test -s "${UEFI_FILE}"

          test -s "${QCOW2_FILE}"

          test -s output/sha256sums.txt

          test -s output/build-info.txt

          test -s output/selected-packages.txt


          echo
          echo "=========================================="
          echo "Final output"
          echo "=========================================="


          ls -lh output


      # ==========================================================
      # Release
      # ==========================================================

      - name: Create GitHub Release
        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail


          TAG="v${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${GITHUB_RUN_NUMBER}"

          TITLE="OpenWrt ${OPENWRT_VERSION} x86-64 ${ROOTFS_SIZE} ${BUILD_DATE}"


          printf '%s\n' \
            "# OpenWrt ${OPENWRT_VERSION} x86-64" \
            "" \
            "## Build" \
            "" \
            "- OpenWrt: \`${OPENWRT_VERSION}\`" \
            "- Target: \`x86-64\`" \
            "- ImageBuilder: Official OpenWrt" \
            "- SDK: Official OpenWrt" \
            "- Primary third-party source: Kiddin9/Kwrt 25.12" \
            "- RootFS: \`${ROOTFS_SIZE}\`" \
            "- Build date: \`${BUILD_DATE}\`" \
            "" \
            "## Network" \
            "" \
            "- \`eth0\` → WAN / PPPoE" \
            "- \`eth1\` → WANB / PPPoE" \
            "- \`eth2\` → LAN" \
            "- \`eth3\` → LAN" \
            "- \`eth4\` → LAN" \
            "- \`eth5\` → LAN" \
            "- LAN IP: \`${LAN_IP}\`" \
            "- IPv6: Enabled" \
            "" \
            "## Images" \
            "" \
            "- UEFI" \
            "- QCOW2" \
            "" \
            "## SDK packages" \
            "" \
            "- FileBrowser Go" \
            "- VLMCSd" \
            "- AutoReboot" \
            "- TimeWOL" \
            > release-notes.md


          gh release create \
            "${TAG}" \
            output/*.img.gz \
            output/*.qcow2 \
            output/sha256sums.txt \
            output/build-info.txt \
            output/selected-packages.txt \
            --title "${TITLE}" \
            --notes-file release-notes.md
