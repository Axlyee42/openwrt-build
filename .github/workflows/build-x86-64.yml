name: Build OpenWrt x86-64 ImageBuilder

on:
  workflow_dispatch:
    inputs:

      openwrt_version:
        description: "OpenWrt version"
        required: true
        default: "25.12.5"

      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.1.2"

      rootfs_size:
        description: "Firmware disk/rootfs size"
        required: true
        type: choice
        default: "4G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      filesystem:
        description: "Filesystem format"
        required: true
        type: choice
        default: "ext4"
        options:
          - "ext4"
          - "squashfs"

      uefi:
        description: "Build UEFI image"
        required: true
        type: boolean
        default: true

      qcow2:
        description: "Build QCOW2 image"
        required: true
        type: boolean
        default: true


jobs:

  build:

    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      LAN_IP: ${{ inputs.lan_ip }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
      BUILD_UEFI: ${{ inputs.uefi }}
      FILESYSTEM: ${{ inputs.filesystem }}
      BUILD_QCOW2: ${{ inputs.qcow2 }}


    steps:

      #######################################################################
      # Checkout
      #######################################################################

      - name: Checkout
        uses: actions/checkout@v4


      #######################################################################
      # Install tools
      #######################################################################

      - name: Install ImageBuilder tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            qemu-utils \
            zstd \
            xz-utils \
            gzip \
            tar \
            wget \
            curl \
            git \
            rsync


      #######################################################################
      # Download OpenWrt ImageBuilder
      #######################################################################

      - name: Download OpenWrt x86-64 ImageBuilder
        shell: bash
        run: |
          set -euxo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"

          IB="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          mkdir -p "${RUNNER_TEMP}/imagebuilder"

          cd "${RUNNER_TEMP}/imagebuilder"

          wget \
            -q \
            --show-progress \
            "${BASE_URL}/${IB}"

          tar \
            --zstd \
            -xf "${IB}"

          IMAGEBUILDER_DIR="$(
            find . \
              -maxdepth 1 \
              -type d \
              -name 'openwrt-imagebuilder-*' \
              | head -n1
          )"

          test -n "${IMAGEBUILDER_DIR}"

          IMAGEBUILDER_DIR="$(
            cd "${IMAGEBUILDER_DIR}" &&
            pwd
          )"

          echo "IMAGEBUILDER_DIR=${IMAGEBUILDER_DIR}" \
            >> "${GITHUB_ENV}"

          echo
          echo "ImageBuilder:"
          echo "${IMAGEBUILDER_DIR}"


      #######################################################################
      # Prepare third-party APK packages
      #######################################################################

      - name: Prepare third-party APK repository
        shell: bash
        run: |
          set -euxo pipefail

          test -f scripts/apk-custom-packages.sh

          chmod +x \
            scripts/apk-custom-packages.sh

          IMAGEBUILDER_DIR="${IMAGEBUILDER_DIR}" \
            scripts/apk-custom-packages.sh

          test -n "${CUSTOM_PACKAGES:-}"

          ###################################################################
          # IMPORTANT
          #
          # CUSTOM_PACKAGES MUST remain one whitespace-separated line.
          #
          # This prevents multiline values from being passed into the
          # nested make/shell invocation inside OpenWrt ImageBuilder.
          ###################################################################

          CUSTOM_PACKAGES="$(
            printf '%s\n' "${CUSTOM_PACKAGES:-}" |
              tr '[:space:]' ' ' |
              awk '{$1=$1; print}'
          )"

          test -n "${CUSTOM_PACKAGES}"

          echo \
            "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" \
            >> "${GITHUB_ENV}"

          echo
          echo "Selected third-party packages:"
          printf '%s\n' "${CUSTOM_PACKAGES}" |
            tr ' ' '\n'


      #######################################################################
      # Prepare custom files
      #######################################################################

      - name: Prepare custom files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults"

          cp \
            files/etc/uci-defaults/99-custom.sh \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

          sed -i \
            "s/__LAN_IP__/${LAN_IP}/g" \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

          chmod +x \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"


      #######################################################################
      # Build OpenWrt image
      #######################################################################

      - name: Build OpenWrt image
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"


          ###################################################################
          # Root filesystem size
          ###################################################################

          case "${ROOTFS_SIZE}" in

            1G)
              ROOTFS_PARTSIZE=1024
              ;;

            2G)
              ROOTFS_PARTSIZE=2048
              ;;

            3G)
              ROOTFS_PARTSIZE=3072
              ;;

            4G)
              ROOTFS_PARTSIZE=4096
              ;;

            *)
              echo \
                "Invalid ROOTFS_SIZE=${ROOTFS_SIZE}" \
                >&2

              exit 1
              ;;

          esac


          ###################################################################
          # Filesystem
          #
          # ImageBuilder does NOT use the GitHub Actions variable
          # FILESYSTEM automatically.
          #
          # Therefore explicitly modify .config.
          ###################################################################

          case "${FILESYSTEM}" in

            ext4)

              sed -i \
                -e '/^CONFIG_TARGET_ROOTFS_SQUASHFS=/d' \
                -e '/^# CONFIG_TARGET_ROOTFS_SQUASHFS is not set$/d' \
                -e '/^CONFIG_TARGET_ROOTFS_EXT4FS=/d' \
                -e '/^# CONFIG_TARGET_ROOTFS_EXT4FS is not set$/d' \
                .config

              printf '%s\n' \
                'CONFIG_TARGET_ROOTFS_SQUASHFS=n' \
                'CONFIG_TARGET_ROOTFS_EXT4FS=y' \
                >> .config

              ;;

            squashfs)

              sed -i \
                -e '/^CONFIG_TARGET_ROOTFS_SQUASHFS=/d' \
                -e '/^# CONFIG_TARGET_ROOTFS_SQUASHFS is not set$/d' \
                -e '/^CONFIG_TARGET_ROOTFS_EXT4FS=/d' \
                -e '/^# CONFIG_TARGET_ROOTFS_EXT4FS is not set$/d' \
                .config

              printf '%s\n' \
                'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
                'CONFIG_TARGET_ROOTFS_EXT4FS=n' \
                >> .config

              ;;

            *)

              echo \
                "Invalid FILESYSTEM=${FILESYSTEM}" \
                >&2

              exit 1
              ;;

          esac


          ###################################################################
          # Image formats
          #
          # User requirement:
          #
          # KEEP:
          #   UEFI
          #   QCOW2
          #
          # REMOVE:
          #   BIOS
          #   VDI
          #   VMDK
          #   VHDX
          #   ISO
          #
          # QCOW2 is generated afterwards by qemu-img from the UEFI RAW
          # image. RAW is therefore only an intermediate file and is NOT
          # uploaded as a final artifact.
          ###################################################################

          sed -i \
            -e '/^CONFIG_GRUB_IMAGES=/d' \
            -e '/^# CONFIG_GRUB_IMAGES is not set$/d' \
            -e '/^CONFIG_GRUB_EFI_IMAGES=/d' \
            -e '/^# CONFIG_GRUB_EFI_IMAGES is not set$/d' \
            -e '/^CONFIG_VDI_IMAGES=/d' \
            -e '/^# CONFIG_VDI_IMAGES is not set$/d' \
            -e '/^CONFIG_VMDK_IMAGES=/d' \
            -e '/^# CONFIG_VMDK_IMAGES is not set$/d' \
            -e '/^CONFIG_VHDX_IMAGES=/d' \
            -e '/^# CONFIG_VHDX_IMAGES is not set$/d' \
            -e '/^CONFIG_ISO_IMAGES=/d' \
            -e '/^# CONFIG_ISO_IMAGES is not set$/d' \
            .config

          printf '%s\n' \
            'CONFIG_GRUB_IMAGES=n' \
            'CONFIG_GRUB_EFI_IMAGES=y' \
            'CONFIG_VDI_IMAGES=n' \
            'CONFIG_VMDK_IMAGES=n' \
            'CONFIG_VHDX_IMAGES=n' \
            'CONFIG_ISO_IMAGES=n' \
            >> .config


          ###################################################################
          # Base packages
          ###################################################################

          BASE_PACKAGES="curl
          luci-i18n-firewall-zh-cn
          luci-theme-argon
          luci-app-argon-config
          luci-i18n-argon-config-zh-cn
          luci-i18n-package-manager-zh-cn
          luci-i18n-ttyd-zh-cn
          openssh-sftp-server"


          ###################################################################
          # IMPORTANT:
          #
          # Convert EVERYTHING into a single whitespace-separated line.
          #
          # DO NOT use:
          #
          # PACKAGES="
          #   xxx
          #   yyy
          # "
          #
          # OpenWrt 25.12.5 ImageBuilder internally does:
          #
          #   USER_PACKAGES="$(PACKAGES)"
          #
          # through another make/shell layer.
          #
          # A multiline value can therefore cause:
          #
          #   bash: -c: unexpected EOF while looking for matching '"'
          ###################################################################

          PACKAGES="$(
            printf '%s\n' \
              "${BASE_PACKAGES}" \
              "${CUSTOM_PACKAGES:-}" |
              tr '[:space:]' '\n' |
              awk 'NF && !seen[$0]++' |
              paste -sd ' ' -
          )"

          test -n "${PACKAGES}"


          ###################################################################
          # Display build information
          ###################################################################

          echo
          echo "============================================================"
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "Target          : x86/64"
          echo "LAN IP          : ${LAN_IP}"
          echo "Firmware size   : ${ROOTFS_SIZE}"
          echo "Filesystem      : ${FILESYSTEM}"
          echo "QCOW2           : ${BUILD_QCOW2}"
          echo "UEFI            : ${BUILD_UEFI}"
          echo "Rootfs partsize : ${ROOTFS_PARTSIZE} MiB"
          echo "============================================================"

          echo
          echo "Filesystem configuration:"

          grep \
            -E \
            '^CONFIG_TARGET_ROOTFS_(SQUASHFS|EXT4FS)=' \
            .config

          echo
          echo "Image configuration:"

          grep \
            -E \
            '^(CONFIG_GRUB_IMAGES|CONFIG_GRUB_EFI_IMAGES|CONFIG_VDI_IMAGES|CONFIG_VMDK_IMAGES|CONFIG_VHDX_IMAGES|CONFIG_ISO_IMAGES)=' \
            .config

          echo
          echo "Normalized packages:"

          printf '%s\n' "${PACKAGES}" |
            tr ' ' '\n'


          ###################################################################
          # Build
          ###################################################################

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="${IMAGEBUILDER_DIR}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}"


      #######################################################################
      # Collect requested image formats
      #######################################################################

      - name: Collect requested image formats
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_DIR="${IMAGEBUILDER_DIR}/bin/targets/x86/64"

          OUT="${GITHUB_WORKSPACE}/release"

          rm -rf "${OUT}"

          mkdir -p "${OUT}"

          shopt -s nullglob


          ###################################################################
          # UEFI
          ###################################################################

          if [[ "${BUILD_UEFI}" == "true" ]]; then

            if [[ "${FILESYSTEM}" == "ext4" ]]; then

              candidates=(
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img
              )

            else

              candidates=(
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img
              )

            fi


            if [[ "${#candidates[@]}" -eq 0 ]]; then

              echo
              echo "ERROR: UEFI ${FILESYSTEM} image not found."

              echo
              echo "Available files:"

              find \
                "${BUILD_DIR}" \
                -maxdepth 1 \
                -type f \
                -printf '%f\n' |
                sort

              exit 1

            fi


            SRC="${candidates[0]}"

            UEFI_IMG="${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.img"


            case "${SRC}" in

              *.gz)

                gzip \
                  -dc \
                  "${SRC}" \
                  > "${UEFI_IMG}"

                ;;

              *)

                cp \
                  "${SRC}" \
                  "${UEFI_IMG}"

                ;;

            esac


            #################################################################
            # QCOW2
            #################################################################

            if [[ "${BUILD_QCOW2}" == "true" ]]; then

              qemu-img convert \
                -p \
                -f raw \
                -O qcow2 \
                "${UEFI_IMG}" \
                "${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2"

            fi

          fi


          ###################################################################
          # Final output
          ###################################################################

          echo
          echo "============================================================"
          echo "Generated images:"
          echo "============================================================"

          find \
            "${OUT}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          echo "============================================================"


      #######################################################################
      # Generate checksums
      #######################################################################

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail

          cd release

          sha256sum \
            * \
            > sha256sums.txt


      #######################################################################
      # Upload artifacts
      #######################################################################

      - name: Upload artifacts
        uses: actions/upload-artifact@v4

        with:

          name: openwrt-x86-64-${{ inputs.openwrt_version }}-${{ inputs.filesystem }}

          path: release/*

          if-no-files-found: error
