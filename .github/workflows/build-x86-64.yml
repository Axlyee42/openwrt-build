name: Build OpenWrt x86-64

'on':
workflow_dispatch:
inputs:
rootfs_size:
description: RootFS size in MB
required: true
default: "4096"
type: string
lan_ip:
description: LAN IP address
required: true
default: "192.168.1.2"
type: string

env:
TZ: Asia/Shanghai
OPENWRT_VERSION: "25.12.5"

jobs:
build:
runs-on: ubuntu-24.04

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Test YAML and inputs
    shell: bash
    env:
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
      LAN_IP: ${{ inputs.lan_ip }}
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "Workflow is valid"
      echo "=========================================="
      echo "OpenWrt: ${OPENWRT_VERSION}"
      echo "RootFS: ${ROOTFS_SIZE} MB"
      echo "LAN IP: ${LAN_IP}"

      case "${ROOTFS_SIZE}" in
        1024|2048|4096|8192|16384)
          echo "RootFS size is valid."
          ;;
        *)
          echo "ERROR: Invalid RootFS size."
          exit 1
          ;;
      esac

  - name: Checkout OpenWrt
    shell: bash
    run: |
      set -euo pipefail

      git clone \
        --depth=1 \
        --branch "v${OPENWRT_VERSION}" \
        https://github.com/openwrt/openwrt.git \
        openwrt

      cd openwrt

      git describe --tags --always

  - name: Test complete
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "Basic workflow test completed."
      echo "=========================================="
```
