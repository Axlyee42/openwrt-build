name: Build OpenWrt 25.12.x x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 版本，留空使用最新 25.12.x"
        required: false
        default: ""
        type: string

      lan_ip:
        description: "LAN 管理地址"
        required: true
        default: "192.168.1.2"
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      bios:
        description: "生成 BIOS EXT4 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI EXT4 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2 虚拟机镜像"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK VMware 镜像"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW 镜像"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

env:
  DEFAULT_OPENWRT_BRANCH: "25.12"
  DEFAULT_LAN_IP: "192.168.1.2"
  DEFAULT_ROOTFS_SIZE: "4G"

jobs:

  # ==========================================================
  # 检查 OpenWrt 最新 25.12.x
  # ==========================================================

  check-update:
    name: Check OpenWrt version
    runs-on: ubuntu-24.04

    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check latest OpenWrt 25.12.x
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking latest OpenWrt 25.12.x"
          echo "=========================================="

          LATEST_VERSION="$(
            git ls-remote \
              --tags \
              --refs \
              https://github.com/openwrt/openwrt.git |
            sed -n \
              -E \
              's#.*refs/tags/v(25\.12\.[0-9]+)$#\1#p' |
            sort -V |
            tail -n 1
          )"

          if [ -z "${LATEST_VERSION}" ]; then
            echo "ERROR: Cannot determine latest OpenWrt 25.12.x"
            exit 1
          fi

          echo "Latest version: ${LATEST_VERSION}"

          LAST_VERSION=""

          if [ -f openwrt-version ]; then
            LAST_VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi

          echo "Last built version: ${LAST_VERSION:-NONE}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            SHOULD_BUILD="true"
          elif [ -z "${LAST_VERSION}" ]; then
            SHOULD_BUILD="true"
          elif [ "${LATEST_VERSION}" != "${LAST_VERSION}" ]; then
            SHOULD_BUILD="true"
          else
            SHOULD_BUILD="false"
          fi

          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"
          echo "version=${LATEST_VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Should build: ${SHOULD_BUILD}"


  # ==========================================================
  # ImageBuilder
  # ==========================================================

  build:
    name: Build OpenWrt ImageBuilder

    needs:
      - check-update

    if: needs.check-update.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 设置 OpenWrt 版本
      # ======================================================

      - name: Set OpenWrt version
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          LATEST_VERSION: ${{ needs.check-update.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${LATEST_VERSION}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
             [ -n "${MANUAL_VERSION}" ]; then
            VERSION="${MANUAL_VERSION}"
          fi

          if ! printf '%s\n' "${VERSION}" |
            grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          echo "OpenWrt version: ${VERSION}"


      # ======================================================
      # 设置固件大小
      # ======================================================

      - name: Set rootfs size
        env:
          INPUT_SIZE: ${{ inputs.rootfs_size }}
        shell: bash
        run: |
          set -euo pipefail

          SIZE="${DEFAULT_ROOTFS_SIZE}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
             [ -n "${INPUT_SIZE}" ]; then
            SIZE="${INPUT_SIZE}"
          fi

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid rootfs size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS size: ${SIZE}"
          echo "Partition size: ${PARTSIZE} MB"


      # ======================================================
      # 安装工具
      # ======================================================

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            git \
            zstd \
            xz-utils \
            gzip \
            tar \
            unzip \
            qemu-utils \
            file


      # ======================================================
      # 下载官方 OpenWrt ImageBuilder
      # ======================================================

      - name: Download OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          IMAGEBUILDER="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${IMAGEBUILDER}"

          echo "=========================================="
          echo "Downloading ImageBuilder"
          echo "=========================================="

          echo "${URL}"

          wget \
            --progress=bar:force \
            -O "${IMAGEBUILDER}" \
            "${URL}"

          rm -rf imagebuilder

          mkdir -p imagebuilder

          tar \
            --use-compress-program=unzstd \
            -xf "${IMAGEBUILDER}" \
            -C imagebuilder \
            --strip-components=1

          echo "ImageBuilder ready."


      # ======================================================
      # ImageBuilder 信息
      # ======================================================

      - name: Show ImageBuilder information
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          make info


      # ======================================================
      # 配置第三方 APK 软件源
      #
      # 这里不再创建本地 packages.adb
      #
      # 统一使用已经签名的 APK repository
      # ======================================================

      - name: Configure third-party APK repositories
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Configuring third-party APK repositories"
          echo "=========================================="

          mkdir -p keys

          # --------------------------------------------------
          # PassWall 官方二进制仓库
          # --------------------------------------------------

          PASSWALL_KEY_URL="https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub"

          wget \
            -q \
            -O keys/openwrt-passwall-build.pem \
            "${PASSWALL_KEY_URL}"

          PASSWALL_BASE="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64"

          cat >> repositories <<EOF
${PASSWALL_BASE}/passwall_luci/packages.adb
${PASSWALL_BASE}/passwall_packages/packages.adb
${PASSWALL_BASE}/passwall2/packages.adb
EOF

          # --------------------------------------------------
          # ImmortalWrt 25.12 x86_64 LuCI APK 仓库
          #
          # 用于提供：
          # Aurora
          # Bandix
          # FileManager
          # FileBrowser Go
          # Timewol
          # VLMCSd
          # AutoReboot
          # OpenClash 等第三方 LuCI 包
          # --------------------------------------------------

          IMMORTAL_LUCI="https://downloads.immortalwrt.org/releases/25.12/packages/x86_64/luci/packages.adb"

          cat >> repositories <<EOF
${IMMORTAL_LUCI}
EOF

          echo
          echo "Repositories:"
          cat repositories

          echo
          echo "Keys:"
          find keys -maxdepth 1 -type f -printf '%f\n'


      # ======================================================
      # 准备 custom files
      # ======================================================

      - name: Prepare custom files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf files

          mkdir -p \
            files/etc/config \
            files/etc/uci-defaults \
            files/etc/apk/repositories.d \
            files/etc/apk/keys


      # ======================================================
      # 写入运行时第三方 APK 仓库
      # ======================================================

      - name: Configure runtime APK repositories
        shell: bash
        run: |
          set -euo pipefail

          PASSWALL_BASE="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64"

          IMMORTAL_LUCI="https://downloads.immortalwrt.org/releases/25.12/packages/x86_64/luci/packages.adb"

          cat > files/etc/apk/repositories.d/customfeeds.list <<EOF
${PASSWALL_BASE}/passwall_luci/packages.adb
${PASSWALL_BASE}/passwall_packages/packages.adb
${PASSWALL_BASE}/passwall2/packages.adb
${IMMORTAL_LUCI}
EOF

          wget \
            -q \
            -O files/etc/apk/keys/openwrt-passwall-build.pem \
            https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub

          echo
          echo "Runtime repositories:"
          cat files/etc/apk/repositories.d/customfeeds.list


      # ======================================================
      # 网络配置
      #
      # eth0 = WAN1
      # eth1 = WAN2
      # eth2 = LAN
      # eth3 = LAN
      # eth4 = LAN
      # eth5 = LAN
      # ======================================================

      - name: Generate network configuration
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}
          INPUT_LAN_IP: ${{ inputs.lan_ip }}
        shell: bash
        run: |
          set -euo pipefail

          LAN_IP="${DEFAULT_LAN_IP}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
             [ -n "${INPUT_LAN_IP}" ]; then
            LAN_IP="${INPUT_LAN_IP}"
          fi

          if [ -z "${WAN1_USER}" ] ||
             [ -z "${WAN1_PASS}" ] ||
             [ -z "${WAN2_USER}" ] ||
             [ -z "${WAN2_PASS}" ]; then

            echo "WARNING: PPPoE secrets are not configured."
            echo "WAN1/WAN2 will remain unconfigured."
            echo "Create WAN1_USER/WAN1_PASS/WAN2_USER/WAN2_PASS"
            echo "if you want PPPoE credentials embedded."
          fi

          cat > files/etc/config/network <<EOF
config interface 'loopback'
    option device 'lo'
    option proto 'static'
    option ipaddr '127.0.0.1'
    option netmask '255.0.0.0'

config device
    option name 'br-lan'
    option type 'bridge'
    list ports 'eth2'
    list ports 'eth3'
    list ports 'eth4'
    list ports 'eth5'

config interface 'lan'
    option device 'br-lan'
    option proto 'static'
    option ipaddr '${LAN_IP}'
    option netmask '255.255.255.0'
    option ip6assign '64'

config interface 'wan'
    option device 'eth0'
    option proto 'pppoe'
EOF

          if [ -n "${WAN1_USER}" ] && [ -n "${WAN1_PASS}" ]; then
            cat >> files/etc/config/network <<EOF
    option username '${WAN1_USER}'
    option password '${WAN1_PASS}'
EOF
          fi

          cat >> files/etc/config/network <<'EOF'
    option ipv6 'auto'

config interface 'wan6'
    option device '@wan'
    option proto 'dhcpv6'
    option reqaddress 'try'
    option reqprefix 'auto'

config interface 'wanb'
    option device 'eth1'
    option proto 'pppoe'
EOF

          if [ -n "${WAN2_USER}" ] && [ -n "${WAN2_PASS}" ]; then
            cat >> files/etc/config/network <<EOF
    option username '${WAN2_USER}'
    option password '${WAN2_PASS}'
EOF
          fi

          cat >> files/etc/config/network <<'EOF'
    option ipv6 'auto'

config interface 'wanb6'
    option device '@wanb'
    option proto 'dhcpv6'
    option reqaddress 'try'
    option reqprefix 'auto'
EOF


      # ======================================================
      # DHCP + IPv6
      # ======================================================

      - name: Generate DHCP configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > files/etc/config/dhcp <<'EOF'
config dnsmasq
    option domainneeded '1'
    option boguspriv '1'
    option localise_queries '1'
    option rebind_protection '1'
    option local '/lan/'
    option domain 'lan'
    option expandhosts '1'
    option authoritative '1'
    option readethers '1'
    option leasefile '/tmp/dhcp.leases'
    option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

config dhcp 'lan'
    option interface 'lan'
    option start '100'
    option limit '150'
    option leasetime '12h'
    option dhcpv4 'server'
    option dhcpv6 'server'
    option ra 'server'
    option ra_management '1'

config dhcp 'wan'
    option interface 'wan'
    option ignore '1'

config dhcp 'wanb'
    option interface 'wanb'
    option ignore '1'

config odhcpd 'odhcpd'
    option maindhcp '0'
    option leasefile '/tmp/hosts/odhcpd'
    option leasetrigger '/usr/sbin/odhcpd-update'
    option loglevel '4'
EOF


      # ======================================================
      # 默认中文
      # ======================================================

      - name: Set default Chinese language
        shell: bash
        run: |
          set -euo pipefail

          cat > files/etc/uci-defaults/99-default-language <<'EOF'
#!/bin/sh

uci -q set luci.main.lang='zh_cn'
uci -q commit luci

exit 0
EOF

          chmod +x files/etc/uci-defaults/99-default-language


      # ======================================================
      # 官方 OpenWrt 软件包
      # ======================================================

      - name: Prepare official package list
        shell: bash
        run: |
          set -euo pipefail

          OFFICIAL_PACKAGES="
          luci
          luci-ssl
          luci-i18n-base-zh-cn

          luci-app-package-manager
          luci-i18n-package-manager-zh-cn

          luci-app-mwan3
          luci-i18n-mwan3-zh-cn

          luci-app-upnp
          luci-i18n-upnp-zh-cn

          luci-app-ttyd
          luci-i18n-ttyd-zh-cn

          luci-proto-ipv6
          luci-proto-ppp

          ppp
          ppp-mod-pppoe
          kmod-pppoe

          odhcp6c
          odhcpd-ipv6only

          luci-compat

          kmod-tun
          kmod-inet-diag
          kmod-nft-socket
          kmod-nft-tproxy

          bash
          curl
          ca-bundle
          ip-full
          unzip
          "

          OFFICIAL_PACKAGES="$(printf '%s\n' ${OFFICIAL_PACKAGES} | awk 'NF && !seen[$0]++' | tr '\n' ' ')"

          echo "OFFICIAL_PACKAGES=${OFFICIAL_PACKAGES}" >> "${GITHUB_ENV}"

          echo
          echo "Official packages:"
          printf '%s\n' ${OFFICIAL_PACKAGES} | sort


      # ======================================================
      # 第三方 APK
      #
      # 只 source，不写 GITHUB_ENV
      # ======================================================

      - name: Load third-party package list
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f shell/apk-custom-packages.sh ]; then
            echo "ERROR: shell/apk-custom-packages.sh not found."
            exit 1
          fi

          source shell/apk-custom-packages.sh

          if [ -z "${CUSTOM_PACKAGES:-}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "Third-party APK packages"
          echo "=========================================="

          printf '%s\n' ${CUSTOM_PACKAGES} |
            awk 'NF && !seen[$0]++' |
            sort


      # ======================================================
      # 检查第三方 APK 仓库
      #
      # 不再检查本地 packages/*.apk
      #
      # 直接让 apk 查询远程签名仓库。
      # ======================================================

      - name: Verify APK repositories
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Updating APK repository indexes"
          echo "=========================================="

          ./staging_dir/host/bin/apk update \
            --repositories-file repositories \
            --keys-dir keys

          echo
          echo "APK repository update completed."


      # ======================================================
      # 构造最终包列表
      #
      # 注意：
      # CUSTOM_PACKAGES 不进入 GITHUB_ENV
      # 直接在本步骤 source。
      # ======================================================

      - name: Prepare final package list
        shell: bash
        run: |
          set -euo pipefail

          source shell/apk-custom-packages.sh

          if [ -z "${CUSTOM_PACKAGES:-}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty."
            exit 1
          fi

          ALL_PACKAGES="${OFFICIAL_PACKAGES}"

          for PACKAGE in ${CUSTOM_PACKAGES}; do
            ALL_PACKAGES="${ALL_PACKAGES} ${PACKAGE}"
          done

          ALL_PACKAGES="$(
            printf '%s\n' ${ALL_PACKAGES} |
            awk 'NF && !seen[$0]++' |
            tr '\n' ' '
          )"

          ALL_PACKAGES="$(echo "${ALL_PACKAGES}" | xargs)"

          echo "FINAL_PACKAGES=${ALL_PACKAGES}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "Final package list"
          echo "=========================================="

          printf '%s\n' ${ALL_PACKAGES} | sort


      # ======================================================
      # 最终检查
      #
      # 使用 apk search，而不是检查文件名。
      # ======================================================

      - name: Verify requested packages
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          source "${GITHUB_WORKSPACE}/shell/apk-custom-packages.sh"

          FAILED=0

          echo
          echo "=========================================="
          echo "Checking requested third-party packages"
          echo "=========================================="

          for PACKAGE in ${CUSTOM_PACKAGES}; do

            if ./staging_dir/host/bin/apk search \
              --repositories-file repositories \
              --keys-dir keys \
              --no-network \
              "${PACKAGE}" |
              grep -Fxq "${PACKAGE}"; then

              echo "OK: ${PACKAGE}"

            else

              echo "WARNING: ${PACKAGE} not found."

              FAILED=1

            fi

          done

          if [ "${FAILED}" -ne 0 ]; then
            echo
            echo "ERROR: Some requested packages are unavailable."
            echo
            echo "The configured APK repositories do not provide"
            echo "all packages requested by shell/apk-custom-packages.sh."
            echo
            exit 1
          fi


      # ======================================================
      # 构建 Image
      # ======================================================

      - name: Build OpenWrt image
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Building OpenWrt Image"
          echo "=========================================="

          echo "Version:"
          echo "${OPENWRT_VERSION}"

          echo
          echo "RootFS:"
          echo "${ROOTFS_SIZE}"

          echo
          echo "Packages:"
          echo "${FINAL_PACKAGES}"

          make image \
            PROFILE="generic" \
            PACKAGES="${FINAL_PACKAGES}" \
            FILES="${GITHUB_WORKSPACE}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            V=s


      # ======================================================
      # 设置时间
      # ======================================================

      - name: Set build timestamp
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DATE="$(date -u '+%Y%m%d')"
          BUILD_TIME="$(date -u '+%H%M%S')"

          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"


      # ======================================================
      # Release 目录
      # ======================================================

      - name: Prepare release directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release

          mkdir -p release


      # ======================================================
      # BIOS EXT4
      # ======================================================

      - name: Export BIOS EXT4
        if: github.event_name != 'workflow_dispatch' || inputs.bios
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined.img.gz' |
            head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: BIOS EXT4 image not found."
            echo
            ls -lah imagebuilder/bin/targets/x86/64/
            exit 1
          fi

          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-BIOS-ext4.img.gz"


      # ======================================================
      # UEFI EXT4
      # ======================================================

      - name: Export UEFI EXT4
        if: github.event_name != 'workflow_dispatch' || inputs.uefi
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI EXT4 image not found."
            echo
            ls -lah imagebuilder/bin/targets/x86/64/
            exit 1
          fi

          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI-ext4.img.gz"


      # ======================================================
      # 准备 RAW
      # ======================================================

      - name: Prepare raw disk image
        if: github.event_name != 'workflow_dispatch' || inputs.qcow2 || inputs.vmdk || inputs.raw
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI EXT4 image not found."
            exit 1
          fi

          gzip -dc "${IMAGE}" > openwrt.raw

          file openwrt.raw


      # ======================================================
      # QCOW2
      # ======================================================

      - name: Create QCOW2
        if: github.event_name != 'workflow_dispatch' || inputs.qcow2
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O qcow2 \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.qcow2"


      # ======================================================
      # VMDK
      # ======================================================

      - name: Create VMDK
        if: github.event_name == 'workflow_dispatch' && inputs.vmdk
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.vmdk"


      # ======================================================
      # RAW
      # ======================================================

      - name: Export RAW
        if: github.event_name == 'workflow_dispatch' && inputs.raw
        shell: bash
        run: |
          set -euo pipefail

          cp \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.raw"


      # ======================================================
      # SHA256
      # ======================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum * > sha256sums


      # ======================================================
      # Build info
      # ======================================================

      - name: Create build info
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}
        shell: bash
        run: |
          set -euo pipefail

          LAN_IP="${DEFAULT_LAN_IP}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
             [ -n "${INPUT_LAN_IP}" ]; then
            LAN_IP="${INPUT_LAN_IP}"
          fi

          cat > release/build-info.txt <<EOF
OpenWrt Custom Image
====================

OpenWrt version:
${OPENWRT_VERSION}

Target:
x86-64

Build method:
Official OpenWrt ImageBuilder

RootFS:
${ROOTFS_SIZE}

Build date:
${BUILD_DATE}

Build time:
${BUILD_TIME}


Network
=======

eth0:
WAN1 / PPPoE

eth1:
WAN2 / PPPoE

eth2:
LAN

eth3:
LAN

eth4:
LAN

eth5:
LAN

LAN IP:
${LAN_IP}

IPv6:
Enabled


Filesystem
==========

EXT4

BIOS:
Supported

UEFI:
Supported

QCOW2:
Supported


Package manager
===============

APK


Third-party repositories
========================

PassWall:
openwrt-passwall-build

LuCI third-party packages:
ImmortalWrt 25.12 x86_64 LuCI APK repository
EOF


      # ======================================================
      # 显示最终文件
      # ======================================================

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release


      # ======================================================
      # 发布 GitHub Release
      # ======================================================

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }}"
          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            基于 OpenWrt 官方 ImageBuilder 构建。

            ## 基本信息

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`
            - Build time: `${{ env.BUILD_TIME }}`

            ## 网络

            - eth0 → WAN1 / PPPoE
            - eth1 → WAN2 / PPPoE
            - eth2 → LAN
            - eth3 → LAN
            - eth4 → LAN
            - eth5 → LAN
            - LAN → 192.168.1.2
            - IPv6 → Enabled

            ## 文件系统

            - BIOS EXT4
            - UEFI EXT4
            - QCOW2
            - VMDK / RAW 按手动构建选项生成

            ## 构建方式

            Official OpenWrt ImageBuilder。

            不进行 OpenWrt 源码编译。
            不进行 toolchain 编译。
            不进行 kernel 源码编译。

            ## 软件包系统

            OpenWrt 25.12 APK。

          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # 更新 openwrt-version
      # ======================================================

      - name: Update openwrt-version
        shell: bash
        run: |
          set -euo pipefail

          echo "${OPENWRT_VERSION}" > openwrt-version

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add openwrt-version

          if git diff --cached --quiet; then
            echo "openwrt-version already up to date."
            exit 0
          fi

          git commit \
            -m "Update OpenWrt version to ${OPENWRT_VERSION}"

          git push
