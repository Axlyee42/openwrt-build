name: Build OpenWrt x86-64

on:
  workflow_dispatch:

  schedule:
    - cron: "0 18 * * *"

  push:
    paths:
      - ".github/workflows/build-x86-64.yml"
      - "scripts/**"
      - "configs/**"
      - "files/**"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  FORCE_UNSAFE_CONFIGURE: 1

  OPENWRT_ROOT: ${{ github.workspace }}/openwrt

  # ---------------------------------------------------------------------------
  # OpenWrt
  # ---------------------------------------------------------------------------
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: main

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  TARGET: x86
  SUBTARGET: 64

  JOBS: 2

  # ---------------------------------------------------------------------------
  # 第三方 APK
  # ---------------------------------------------------------------------------
  THIRD_PARTY_DIR: package/third-party

jobs:

  build:

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    steps:

      # =======================================================================
      # 1. Checkout 当前配置仓库
      # =======================================================================

      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =======================================================================
      # 2. 基础依赖
      # =======================================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc \
            g++ \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            jq \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lld \
            llvm \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-distutils \
            python3-pip \
            python3-setuptools \
            python3-venv \
            qemu-utils \
            rsync \
            swig \
            tar \
            texinfo \
            uglifyjs \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev

      # =======================================================================
      # 3. Clone OpenWrt
      # =======================================================================

      - name: Clone OpenWrt
        shell: bash
        run: |
          set -eux

          rm -rf "${OPENWRT_ROOT}"

          git clone \
            --depth=1 \
            --single-branch \
            --branch="${OPENWRT_BRANCH}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_ROOT}"

          cd "${OPENWRT_ROOT}"

          echo "OpenWrt commit:"
          git log -1 --oneline

      # =======================================================================
      # 4. 复制配置
      #
      # 支持：
      #
      # configs/x86-64.config
      #
      # 如果你的仓库没有这个文件，则跳过。
      # =======================================================================

      - name: Apply custom OpenWrt config
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          if [[ -f "${GITHUB_WORKSPACE}/configs/x86-64.config" ]]; then

            cp \
              "${GITHUB_WORKSPACE}/configs/x86-64.config" \
              .config

          elif [[ -f "${GITHUB_WORKSPACE}/.config" ]]; then

            cp \
              "${GITHUB_WORKSPACE}/.config" \
              .config

          else

            echo "No custom config found."

            make defconfig

          fi

      # =======================================================================
      # 5. 更新官方 feeds
      #
      # 注意：
      # 第三方 package 不在这里处理。
      # =======================================================================

      - name: Update OpenWrt feeds
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          ./scripts/feeds update -a

          ./scripts/feeds install -a

      # =======================================================================
      # 6. 准备第三方源码
      #
      # apk-custom-packages.sh 只负责：
      #
      #   third-party source
      #        ↓
      #   package/third-party
      #
      # 不负责编译。
      # =======================================================================

      - name: Prepare third-party package sources
        shell: bash
        run: |
          set -eux

          chmod +x \
            "${GITHUB_WORKSPACE}/scripts/apk-custom-packages.sh"

          OPENWRT_ROOT="${OPENWRT_ROOT}" \
            "${GITHUB_WORKSPACE}/scripts/apk-custom-packages.sh"

      # =======================================================================
      # 7. 检查第三方 Makefile
      # =======================================================================

      - name: List third-party package definitions
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          echo
          echo "============================================================"
          echo " Third-party package Makefiles"
          echo "============================================================"

          find \
            package/third-party \
            -type f \
            -name Makefile \
            -print \
            | sort

          echo
          echo "============================================================"

      # =======================================================================
      # 8. 清理旧的第三方编译结果
      #
      # 非常重要：
      #
      # 你的日志已经出现：
      #
      #   hysteria 2.9.2
      #   hysteria 2.9.3
      #
      #   daed r1
      #   daed r7
      #
      #   v2ray-geoip 多个版本
      #
      # 这说明旧 APK 被保留下来了。
      #
      # GitHub Runner 是全新环境，但同一个工作目录的不同 build step
      # 仍然可能产生旧 package output。
      # =======================================================================

      - name: Clean third-party package output
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          rm -rf \
            bin/packages/x86_64/third-party \
            bin/packages/x86_64/Third-party \
            bin/packages/x86_64/custom \
            bin/packages/x86_64/custom-packages

          mkdir -p \
            bin/packages/x86_64

      # =======================================================================
      # 9. 重新生成配置
      # =======================================================================

      - name: Refresh OpenWrt configuration
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          make defconfig

      # =======================================================================
      # 10. 下载源码
      #
      # 不直接 make world。
      # 先 download，可以更早发现第三方源码问题。
      # =======================================================================

      - name: Download package sources
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          make download \
            -j"${JOBS}" \
            V=s

      # =======================================================================
      # 11. 编译第三方 APK
      #
      # 这里不再自己根据目录名猜 package。
      #
      # OpenWrt package Makefile 自己决定 Package/<name>。
      #
      # 采用 package compile 目标。
      # =======================================================================

      - name: Build third-party APK packages
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          echo
          echo "============================================================"
          echo " Building third-party packages"
          echo "============================================================"

          make \
            package/third-party/compile \
            -j"${JOBS}" \
            V=s

      # =======================================================================
      # 12. 显示实际生成的 APK
      # =======================================================================

      - name: List generated third-party APK packages
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          echo
          echo "============================================================"
          echo " Generated APK packages"
          echo "============================================================"

          find \
            bin/packages/x86_64 \
            -type f \
            -name '*.apk' \
            -printf '%p\n' \
            | sort

      # =======================================================================
      # 13. 第三方 APK 验证
      #
      # 只检查：
      #
      #   package-name-*.apk
      #
      # 不检查版本。
      #
      # 注意：
      # REQUIRED_PACKAGES 只放“固件必须存在”的核心包。
      #
      # 其它包即使没生成，也不阻止整个构建。
      # =======================================================================

      - name: Verify third-party APK packages
        shell: bash
        run: |
          set -eux

          chmod +x \
            "${GITHUB_WORKSPACE}/scripts/apk-package-list.sh"

          OPENWRT_ROOT="${OPENWRT_ROOT}" \
          APK_ROOT="${OPENWRT_ROOT}/bin/packages/x86_64" \
            "${GITHUB_WORKSPACE}/scripts/apk-package-list.sh"

      # =======================================================================
      # 14. 重新执行 defconfig
      #
      # 确保第三方 package 被纳入最终 package dependency。
      # =======================================================================

      - name: Finalize package configuration
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          make defconfig

      # =======================================================================
      # 15. 检查最终 .config
      # =======================================================================

      - name: Show selected third-party packages
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          echo
          echo "============================================================"
          echo " Selected third-party packages"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-|luci-theme-|bandix|geoview|xray|sing-box|hysteria|mosdns|nikki|clashoo|dae|daed|lucky|quickfile|quickstart|rtp2httpd)' \
            .config \
            || true

      # =======================================================================
      # 16. 编译 OpenWrt 固件
      # =======================================================================

      - name: Build OpenWrt firmware
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          make \
            -j"${JOBS}" \
            V=s

      # =======================================================================
      # 17. 整理固件
      # =======================================================================

      - name: Collect firmware
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          mkdir -p \
            "${GITHUB_WORKSPACE}/release"

          find \
            bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.img.gz' \
              -o -name '*.img' \
              -o -name '*.vmdk' \
              -o -name '*.vdi' \
              -o -name '*.qcow2' \
              -o -name '*.tar.gz' \
              -o -name '*.manifest' \
              -o -name '*.json' \
              -o -name 'sha256sums' \
            \) \
            -exec cp -f {} \
              "${GITHUB_WORKSPACE}/release/" \;

          echo
          echo "Firmware artifacts:"
          ls -lah \
            "${GITHUB_WORKSPACE}/release"

      # =======================================================================
      # 18. 收集第三方 APK
      # =======================================================================

      - name: Collect third-party APK packages
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          mkdir -p \
            "${GITHUB_WORKSPACE}/release/apk"

          find \
            bin/packages/x86_64 \
            -type f \
            -name '*.apk' \
            -exec cp -f {} \
              "${GITHUB_WORKSPACE}/release/apk/" \;

          echo
          echo "Third-party APK artifacts:"
          ls -lah \
            "${GITHUB_WORKSPACE}/release/apk"

      # =======================================================================
      # 19. 生成 APK 清单
      # =======================================================================

      - name: Generate APK manifest
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}"

          find \
            release/apk \
            -type f \
            -name '*.apk' \
            -printf '%f\n' \
            | sort -u \
            > release/third-party-apk-list.txt

          cat \
            release/third-party-apk-list.txt

      # =======================================================================
      # 20. 上传 GitHub Actions Artifact
      # =======================================================================

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64
          path: |
            release/
          if-no-files-found: error
          retention-days: 7

      # =======================================================================
      # 21. 输出构建信息
      # =======================================================================

      - name: Build summary
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          echo
          echo "============================================================"
          echo " OpenWrt build completed"
          echo "============================================================"
          echo

          echo "OpenWrt commit:"
          git log -1 --oneline

          echo
          echo "Target:"
          echo "  x86/64"

          echo
          echo "Firmware:"
          ls -lh \
            "${GITHUB_WORKSPACE}/release" \
            || true

          echo
          echo "Third-party APK count:"
          find \
            "${GITHUB_WORKSPACE}/release/apk" \
            -type f \
            -name '*.apk' \
            | wc -l
