      # ========================================================
      # 显示 Release 文件
      # ========================================================

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release


      # ========================================================
      # 创建 GitHub Release
      # ========================================================

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }}"
          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            基于 OpenWrt 官方 ImageBuilder 构建。

            ## 基本信息

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`
            - Build time: `${{ env.BUILD_TIME }}`

            ## 网络

            - eth0 → WAN1 / PPPoE
            - eth1 → WAN2 / PPPoE
            - eth2 → LAN
            - eth3 → LAN
            - eth4 → LAN
            - eth5 → LAN
            - LAN → 192.168.1.2
            - IPv6 → Enabled

            ## 文件系统

            - BIOS EXT4
            - UEFI EXT4

            ## 虚拟机镜像

            - QCOW2
            - VMDK / RAW 根据手动构建选项生成

            ## 主要软件

            - LuCI
            - PassWall
            - OpenClash
            - Aurora
            - Bandix
            - FileManager
            - FileBrowser-Go
            - Timewol
            - VLMCSd
            - Autoreboot
            - ttyd
            - mwan3
            - UPnP

            ## 构建方式

            Official OpenWrt ImageBuilder。

            不进行 OpenWrt 源码编译。
            不进行 toolchain 编译。
            不进行 kernel 源码编译。

          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================
      # 更新 openwrt-version
      # ========================================================

      - name: Update openwrt-version
        shell: bash
        run: |
          set -euo pipefail

          echo "${OPENWRT_VERSION}" > openwrt-version

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add openwrt-version

          if git diff --cached --quiet; then
            echo "openwrt-version already up to date."
            exit 0
          fi

          git commit \
            -m "Update OpenWrt version to ${OPENWRT_VERSION}"

          git push
