name: Build OpenWrt x86-64

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt version (auto = latest stable)
        required: false
        default: auto
      rootfs_size:
        description: Root partition size
        required: true
        type: choice
        default: 4G
        options: [1G, 2G, 3G, 4G]
      filesystem:
        description: Filesystem
        required: true
        type: choice
        default: ext4
        options: [ext4, squashfs]
      qcow2:
        description: Build QCOW2
        required: true
        type: boolean
        default: true
      publish:
        description: Publish GitHub Release
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: openwrt-x86-64-${{ github.ref }}
  cancel-in-progress: false

env:
  LAN_IP: 192.168.1.2

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve OpenWrt version
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.openwrt_version }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_VERSION:-}" && "${REQUESTED_VERSION}" != "auto" ]]; then
            version="${REQUESTED_VERSION}"
            should_build=true
          else
            tag="$(curl -fsSL --retry 3 https://api.github.com/repos/openwrt/openwrt/releases/latest | jq -r .tag_name)"
            version="${tag#v}"
            test -n "$version" && test "$version" != null
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
              should_build=true
            elif curl -fsSL --retry 3 'https://api.github.com/repos/Axlyee42/openwrt-build/releases?per_page=100' | jq -e --arg p "openwrt-${version}-x86-64-" '.[] | select(.tag_name | startswith($p))' >/dev/null; then
              should_build=false
            else
              should_build=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    env:
      OPENWRT_VERSION: ${{ needs.resolve.outputs.version }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size || '4G' }}
      FILESYSTEM: ${{ inputs.filesystem || 'ext4' }}
      BUILD_QCOW2: ${{ inputs.qcow2 == '' && 'true' || inputs.qcow2 }}
      PUBLISH: ${{ inputs.publish == '' && 'true' || inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl git jq qemu-utils zstd xz-utils wget gzip tar

      - name: Download ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          archive="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"
          mkdir -p "$RUNNER_TEMP/ib"
          cd "$RUNNER_TEMP/ib"
          wget -q --show-progress --tries=3 --timeout=30 "$base/$archive"
          tar --zstd -xf "$archive"
          dir="$(find . -mindepth 1 -maxdepth 1 -type d -name 'openwrt-imagebuilder-*' -print -quit)"
          test -f "$dir/Makefile"
          echo "IMAGEBUILDER_DIR=$(cd "$dir" && pwd)" >> "$GITHUB_ENV"

      - name: Prepare third-party APKs
        shell: bash
        run: |
          set -euo pipefail
          source scripts/apk-custom-packages.sh
          repo="$RUNNER_TEMP/wukongdaily-apk"
          src="$RUNNER_TEMP/extra-apks"
          dst="$RUNNER_TEMP/prepared-apks"
          rm -rf "$repo" "$src" "$dst"
          mkdir -p "$src" "$dst"
          git clone --depth=1 --branch master https://github.com/wukongdaily/apk.git "$repo"
          test -d "$repo/run/x86"
          cp -a "$repo/run/x86/." "$src/"
          chmod +x scripts/apk-prepare-packages.sh
          BASE_DIR="$src" TARGET_DIR="$dst" scripts/apk-prepare-packages.sh
          mkdir -p "$IMAGEBUILDER_DIR/packages"
          : > "$RUNNER_TEMP/third-party-apks.txt"
          for pkg in $CUSTOM_PACKAGES; do
            mapfile -t m < <(find "$dst" -maxdepth 1 -type f -name "${pkg}-*.apk" -print | sort -V)
            if [[ ${#m[@]} -eq 0 ]]; then echo "ERROR: requested APK not prepared: $pkg" >&2; exit 1; fi
            cp -f "${m[-1]}" "$IMAGEBUILDER_DIR/packages/"
            basename "${m[-1]}" >> "$RUNNER_TEMP/third-party-apks.txt"
          done

      - name: Download OpenClash and proxy core files
        shell: bash
        run: |
          set -euo pipefail
          cd "$IMAGEBUILDER_DIR"
          mkdir -p packages files/etc/openclash/core files/usr/bin
          url="$(curl -fsSL --retry 3 https://api.github.com/repos/vernesong/OpenClash/releases/latest | jq -r '[.assets[]? | select(.name | endswith(".apk")) | .browser_download_url][0]')"
          test -n "$url" && test "$url" != null
          wget -q --tries=3 "$url" -P packages/
          wget -qO- --tries=3 'https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64-v1.tar.gz' | tar xOvz > files/etc/openclash/core/clash_meta
          chmod +x files/etc/openclash/core/clash_meta
          wget -q --tries=3 https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat -O files/etc/openclash/GeoIP.dat
          wget -q --tries=3 https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat -O files/etc/openclash/GeoSite.dat
          wget -qO- --tries=3 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.24/mihomo-linux-amd64-compatible-v1.19.24.gz' | gzip -dc > files/usr/bin/mihomo
          chmod +x files/usr/bin/mihomo

      - name: Add PassWall APK feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$IMAGEBUILDER_DIR/files/etc/apk/keys"
          mkdir -p "$IMAGEBUILDER_DIR/files/etc/apk/repositories.d"
          wget -O "$IMAGEBUILDER_DIR/files/etc/apk/keys/openwrt-passwall-build.pem" \
            https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub
          cat > "$IMAGEBUILDER_DIR/files/etc/apk/repositories.d/passwall.list" <<'EOF'
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/passwall_luci/packages.adb
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/passwall_packages/packages.adb
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/passwall2/packages.adb
          EOF

      - name: Configure single WAN and LAN
        shell: bash
        run: |
          set -euo pipefail
          d="$IMAGEBUILDER_DIR/files/etc/uci-defaults"
          r="$IMAGEBUILDER_DIR/files/root"
          mkdir -p "$d" "$r"
          cat > "$d/98-network.sh" <<'EOF'
          #!/bin/sh
          set -eu

          uci -q delete network.wan || true
          uci set network.wan='interface'
          uci set network.wan.device='eth0'
          uci set network.wan.proto='dhcp'
          uci set network.wan.auto='1'

          uci -q delete network.wanb || true

          uci -q delete network.br_lan || true
          uci set network.br_lan='device'
          uci set network.br_lan.type='bridge'
          uci add_list network.br_lan.ports='eth1'
          uci add_list network.br_lan.ports='eth2'
          uci add_list network.br_lan.ports='eth3'
          uci add_list network.br_lan.ports='eth4'
          uci add_list network.br_lan.ports='eth5'

          uci -q delete network.lan || true
          uci set network.lan='interface'
          uci set network.lan.device='br-lan'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.1.2'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.ip6assign='64'

          uci commit network
          exit 0
          EOF
          chmod +x "$d/98-network.sh"
          cat > "$r/README-FIRST-BOOT.txt" <<'EOF'
          OpenWrt x86-64 first-boot network setup

          WAN:
          eth0
          Default protocol: DHCP
          Configure PPPoE, DHCP or Static IP manually in LuCI.

          LAN:
          eth1, eth2, eth3, eth4, eth5
          Bridge: br-lan
          LAN IP: 192.168.1.2/24

          No WAN username or password is stored in this firmware.
          Dual WAN and mwan3 are not included.
          EOF

      - name: Build OpenWrt image
        shell: bash
        run: |
          set -euo pipefail
          cd "$IMAGEBUILDER_DIR"
          case "$ROOTFS_SIZE" in
            1G) part=1024 ;;
            2G) part=2048 ;;
            3G) part=3072 ;;
            4G) part=4096 ;;
            *) echo "Unsupported ROOTFS_SIZE: $ROOTFS_SIZE" >&2; exit 1 ;;
          esac
          source "$GITHUB_WORKSPACE/scripts/apk-custom-packages.sh"
          official='luci-compat kmod-tun kmod-inet-diag kmod-nft-tproxy kmod-nft-socket bash curl ip-full unzip'
          packages="$CUSTOM_PACKAGES $official luci-app-openclash"
          make image PROFILE=generic FILESYSTEM="$FILESYSTEM" ROOTFS_PARTSIZE="$part" PACKAGES="$packages"

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/apk-custom-packages.sh"
          official='luci-compat kmod-tun kmod-inet-diag kmod-nft-tproxy kmod-nft-socket bash curl ip-full unzip'
          packages="$CUSTOM_PACKAGES $official luci-app-openclash"
          out="$GITHUB_WORKSPACE/release"
          raw="$RUNNER_TEMP/openwrt-x86-64-${FILESYSTEM}.raw"
          rm -rf "$out" "$raw"
          mkdir -p "$out"
          img="$(find "$IMAGEBUILDER_DIR/bin/targets/x86/64" -maxdepth 1 -type f -name '*combined-efi.img.gz' -print -quit)"
          test -n "$img"
          cp "$img" "$out/openwrt-x86-64-uefi-${FILESYSTEM}.img.gz"
          if [[ "$BUILD_QCOW2" == 'true' ]]; then
            gunzip -c "$img" > "$raw"
            qemu-img convert -p -f raw -O qcow2 "$raw" "$out/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2"
            rm -f "$raw"
          fi
          manifest="$(find "$IMAGEBUILDER_DIR/bin/targets/x86/64" -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          [[ -n "$manifest" ]] && cp "$manifest" "$out/openwrt-${OPENWRT_VERSION}-x86-64.manifest" || true
          build_date="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          package_count="$(printf '%s\n' $packages | sort -u | sed '/^$/d' | wc -l | tr -d ' ')"
          {
            echo '# OpenWrt x86-64 详细构建信息'; echo
            echo '## 基本信息';
            echo "- 编译日期：$build_date";
            echo "- OpenWrt 版本：$OPENWRT_VERSION";
            echo "- 架构：x86-64 (generic)";
            echo "- 文件系统：$FILESYSTEM";
            echo "- Rootfs 分区：$ROOTFS_SIZE";
            echo "- 包数量：$package_count";
            echo
            echo '## 网络配置';
            echo '- WAN：eth0';
            echo '- WAN 默认协议：DHCP';
            echo '- LAN 网桥：br-lan';
            echo '- LAN 物理口：eth1、eth2、eth3、eth4、eth5';
            echo '- LAN 地址：192.168.1.2/24';
            echo '- PPPoE 账号密码：首次启动后通过 LuCI 手动配置，不写入固件，不写入 GitHub Secrets';
            echo '- Dual WAN：Disabled';
            echo '- mwan3：Not included';
            echo
            echo '## 镜像文件';
            echo '- UEFI：openwrt-x86-64-uefi-'"$FILESYSTEM"'.img.gz';
            [[ "$BUILD_QCOW2" == 'true' ]] && echo '- QCOW2：openwrt-x86-64-uefi-'"$FILESYSTEM"'.qcow2';
            echo
            echo '## Included APK packages';
            printf '%s\n' $packages | sort -u | sed 's/^/- /'
            echo
            echo '## PassWall APK feeds';
            echo '- passwall_luci';
            echo '- passwall_packages';
            echo '- passwall2';
          } > "$out/BUILD-INFO.md"
          cp "$out/BUILD-INFO.md" "$out/RELEASE-NOTES.md"
          sha256sum "$out"/* > "$out/SHA256SUMS"
          test ! -e "$out/openwrt-x86-64-uefi-${FILESYSTEM}.img"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.FILESYSTEM }}
          path: release/

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="openwrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${FILESYSTEM}"
          assets=(
            "release/openwrt-x86-64-uefi-${FILESYSTEM}.img.gz"
            "release/openwrt-${OPENWRT_VERSION}-x86-64.manifest"
            "release/BUILD-INFO.md"
            "release/RELEASE-NOTES.md"
            "release/SHA256SUMS"
          )
          if [[ "$BUILD_QCOW2" == 'true' ]]; then
            assets+=("release/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2")
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "OpenWrt ${OPENWRT_VERSION} x86-64 ${ROOTFS_SIZE} ${FILESYSTEM}" --notes-file release/RELEASE-NOTES.md
