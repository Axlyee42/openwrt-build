name: Build OpenWrt 25.12.x x86-64

'on':
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string
      lan_ip:
        description: "LAN 管理地址"
        required: true
        default: "192.168.1.2"
        type: string
      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"
      bios:
        description: "生成 BIOS EXT4 镜像"
        required: true
        default: true
        type: boolean
      uefi:
        description: "生成 UEFI EXT4 镜像"
        required: true
        default: true
        type: boolean
      qcow2:
        description: "生成 QCOW2 虚拟机镜像"
        required: true
        default: true
        type: boolean
      vmdk:
        description: "生成 VMDK 镜像"
        required: true
        default: false
        type: boolean
      raw:
        description: "生成 RAW 镜像"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check latest OpenWrt 25.12.x
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest="$(
            git ls-remote --tags --refs \
              https://github.com/openwrt/openwrt.git \
              'refs/tags/v25.12.*' |
            sed 's#.*refs/tags/v##' |
            grep -E '^25\.12\.[0-9]+$' |
            sort -V |
            tail -n 1
          )"

          if [ -z "${latest}" ]; then
            echo "ERROR: Cannot detect latest OpenWrt 25.12.x."
            exit 1
          fi

          recorded=""
          if [ -f openwrt-version ]; then
            recorded="$(tr -d '[:space:]' < openwrt-version)"
          fi

          should_build="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            should_build="true"
          elif [ -z "${recorded}" ]; then
            should_build="true"
          elif [ "${latest}" != "${recorded}" ]; then
            should_build="true"
          fi

          echo "version=${latest}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"

          echo "Latest   : ${latest}"
          echo "Recorded : ${recorded:-NONE}"
          echo "Build    : ${should_build}"

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve build settings
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          LATEST_VERSION: ${{ needs.check-update.outputs.version }}
          INPUT_SIZE: ${{ inputs.rootfs_size }}
          INPUT_LAN_IP: ${{ inputs.lan_ip }}
        run: |
          set -euo pipefail

          version="${MANUAL_VERSION}"
          [ -n "${version}" ] || version="${LATEST_VERSION}"

          if ! printf '%s\n' "${version}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${version}"
            exit 1
          fi

          size="${INPUT_SIZE}"
          [ -n "${size}" ] || size="4G"

          case "${size}" in
            1G) partsize=1024 ;;
            2G) partsize=2048 ;;
            3G) partsize=3072 ;;
            4G) partsize=4096 ;;
            *)
              echo "ERROR: Invalid RootFS size."
              exit 1
              ;;
          esac

          lan_ip="${INPUT_LAN_IP}"
          [ -n "${lan_ip}" ] || lan_ip="192.168.1.2"

          echo "OPENWRT_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "ROOTFS_SIZE=${size}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${partsize}" >> "${GITHUB_ENV}"
          echo "LAN_IP=${lan_ip}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=$(date -u +%H%M%S)" >> "${GITHUB_ENV}"

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget zstd qemu-utils gzip git curl file

      - name: Download official OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          archive="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"
          url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${archive}"

          wget -q --show-progress -O "${archive}" "${url}"

          rm -rf imagebuilder
          mkdir imagebuilder

          tar --use-compress-program=unzstd \
            -xf "${archive}" \
            -C imagebuilder \
            --strip-components=1

      - name: Download third-party APK repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf thirdparty-apk extra-packages packages
          mkdir -p extra-packages packages

          git clone --depth=1 \
            https://github.com/wukongdaily/apk.git \
            thirdparty-apk

          cp -a thirdparty-apk/run/x86/. extra-packages/

          for run_file in extra-packages/*.run; do
            [ -e "${run_file}" ] || continue
            chmod +x "${run_file}"
            echo "Extracting ${run_file}"
            sh "${run_file}" \
              --target "${PWD}/extra-packages/temp-unpack" \
              --noexec || true
          done

          find extra-packages \
            -type f \
            -name '*.apk' \
            -exec cp -f {} packages/ \;

          find thirdparty-apk/run/x86 \
            -type f \
            -name '*.apk' \
            -exec cp -f {} packages/ \;

          echo "Third-party APKs:"
          find packages -maxdepth 1 -type f -name '*.apk' \
            -printf '%f\n' | sort

      - name: Download shadcn latest APK
        shell: bash
        run: |
          set -euo pipefail

          url="$(
            curl -fsSL \
              https://api.github.com/repos/eamonxg/luci-theme-shadcn/releases/latest |
            grep '"browser_download_url":.*\.apk"' |
            head -n 1 |
            sed -E 's/.*"browser_download_url": "([^"]+)".*/\1/'
          )"

          if [ -z "${url}" ]; then
            echo "ERROR: Cannot find shadcn APK."
            exit 1
          fi

          wget -q -O packages/luci-theme-shadcn.apk "${url}"

      - name: Create local APK index
        shell: bash
        run: |
          set -euo pipefail

          apk_bin=""

          for candidate in \
            imagebuilder/staging_dir/host/bin/apk \
            imagebuilder/staging_dir/host/bin/apk.static \
            imagebuilder/bin/apk
          do
            if [ -x "${candidate}" ]; then
              apk_bin="${candidate}"
              break
            fi
          done

          if [ -z "${apk_bin}" ]; then
            echo "ERROR: ImageBuilder apk tool not found."
            find imagebuilder -type f \
              \( -name apk -o -name apk.static \) \
              -print | head -20
            exit 1
          fi

          rm -f imagebuilder/packages/*.apk
          cp -f packages/*.apk imagebuilder/packages/

          "${apk_bin}" mkndx \
            --allow-untrusted \
            --output imagebuilder/packages/packages.adb \
            imagebuilder/packages/*.apk

      - name: Configure runtime software sources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p files/etc/apk/repositories.d
          mkdir -p files/etc/apk/keys

          cat > files/etc/apk/repositories.d/passwall.list <<'EOF'
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/passwall_luci/packages.adb
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/passwall_packages/packages.adb
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/passwall2/packages.adb
          EOF

          wget -q \
            -O files/etc/apk/keys/openwrt-passwall-build.pem \
            https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub

      - name: Prepare network configuration
        shell: bash
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}
        run: |
          set -euo pipefail

          if [ -z "${WAN1_USER}" ] || [ -z "${WAN1_PASS}" ]; then
            echo "ERROR: WAN1_USER/WAN1_PASS secrets are missing."
            exit 1
          fi

          if [ -z "${WAN2_USER}" ] || [ -z "${WAN2_PASS}" ]; then
            echo "ERROR: WAN2_USER/WAN2_PASS secrets are missing."
            exit 1
          fi

          mkdir -p files/etc/config

          cat > files/etc/config/network <<EOF
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'

          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 '1'

          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 '1'

          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'
          EOF

          cat > files/etc/config/dhcp <<'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'

          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'

          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          EOF

      - name: Set default Chinese language and Aurora
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-default-language <<'EOF'
          #!/bin/sh
          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci
          exit 0
          EOF

          cat > files/etc/uci-defaults/98-default-theme <<'EOF'
          #!/bin/sh
          if uci -q get luci.themes.Aurora >/dev/null 2>&1; then
              uci -q set luci.main.mediaurlbase='/luci-static/aurora'
              uci -q commit luci
          fi
          exit 0
          EOF

          cat > files/etc/uci-defaults/97-aurora-feed <<'EOF'
          #!/bin/sh
          if command -v wget >/dev/null 2>&1; then
              wget -qO- https://openwrt.eamonxg.fun/install.sh | sh || true
          elif command -v uclient-fetch >/dev/null 2>&1; then
              uclient-fetch -qO- https://openwrt.eamonxg.fun/install.sh | sh || true
          fi
          exit 0
          EOF

          chmod +x files/etc/uci-defaults/97-aurora-feed
          chmod +x files/etc/uci-defaults/98-default-theme
          chmod +x files/etc/uci-defaults/99-default-language

      - name: Prepare package list
        shell: bash
        run: |
          set -euo pipefail

          cat > package-list.txt <<'EOF'
          luci
          luci-ssl
          luci-i18n-base-zh-cn
          luci-app-package-manager
          luci-i18n-package-manager-zh-cn
          luci-app-mwan3
          luci-i18n-mwan3-zh-cn
          luci-app-upnp
          luci-i18n-upnp-zh-cn
          luci-app-ttyd
          luci-i18n-ttyd-zh-cn
          luci-proto-ipv6
          luci-proto-ppp
          ppp
          ppp-mod-pppoe
          kmod-pppoe
          odhcp6c
          odhcpd-ipv6only
          luci-app-passwall
          luci-i18n-passwall-zh-cn
          geoview
          xray-core
          sing-box
          hysteria
          v2ray-geoip
          v2ray-geosite
          luci-app-openclash
          luci-compat
          kmod-tun
          kmod-inet-diag
          kmod-nft-socket
          kmod-nft-tproxy
          bash
          curl
          ip-full
          unzip
          luci-theme-aurora
          luci-theme-shadcn
          luci-app-aurora-config
          luci-i18n-aurora-config-zh-cn
          bandix
          luci-app-bandix
          luci-i18n-bandix-zh-cn
          luci-app-run
          luci-app-filemanager
          luci-i18n-filemanager-zh-cn
          luci-app-filebrowser-go
          luci-i18n-filebrowser-go-zh-cn
          luci-app-timewol
          luci-i18n-timewol-zh-cn
          luci-app-vlmcsd
          luci-i18n-vlmcsd-zh-cn
          luci-app-autoreboot
          luci-i18n-autoreboot-zh-cn
          EOF

          echo "PACKAGES=$(tr '\n' ' ' < package-list.txt)" >> "${GITHUB_ENV}"

      - name: Build with official ImageBuilder
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="${GITHUB_WORKSPACE}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            V=s

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          bios="$(find imagebuilder/bin/targets/x86/64 \
            -maxdepth 1 -type f \
            -name '*generic-ext4-combined.img.gz' |
            head -n 1)"

          uefi="$(find imagebuilder/bin/targets/x86/64 \
            -maxdepth 1 -type f \
            -name '*generic-ext4-combined-efi.img.gz' |
            head -n 1)"

          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || [ "${{ inputs.bios }}" = "true" ]; then
            [ -n "${bios}" ] || { echo "ERROR: BIOS EXT4 image not found."; exit 1; }
            cp "${bios}" \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-BIOS-ext4.img.gz"
          fi

          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || [ "${{ inputs.uefi }}" = "true" ]; then
            [ -n "${uefi}" ] || { echo "ERROR: UEFI EXT4 image not found."; exit 1; }
            cp "${uefi}" \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI-ext4.img.gz"
          fi

          need_raw="false"

          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            need_raw="true"
          elif [ "${{ inputs.qcow2 }}" = "true" ] || \
               [ "${{ inputs.vmdk }}" = "true" ] || \
               [ "${{ inputs.raw }}" = "true" ]; then
            need_raw="true"
          fi

          if [ "${need_raw}" = "true" ]; then
            [ -n "${uefi}" ] || { echo "ERROR: UEFI image required."; exit 1; }
            gzip -dc "${uefi}" > openwrt.raw
          fi

          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || [ "${{ inputs.qcow2 }}" = "true" ]; then
            qemu-img convert -f raw -O qcow2 openwrt.raw \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.qcow2"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.vmdk }}" = "true" ]; then
            qemu-img convert -f raw -O vmdk openwrt.raw \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.vmdk"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.raw }}" = "true" ]; then
            cp openwrt.raw \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.raw"
          fi

          cd release
          sha256sum * > sha256sums

          cat > build-info.txt <<EOF
          OpenWrt Custom ImageBuilder Build

          OpenWrt: ${OPENWRT_VERSION}
          Target: x86-64
          RootFS: ${ROOTFS_SIZE}
          Build date: ${BUILD_DATE}
          Build time: ${BUILD_TIME} UTC

          Network:
            eth0 = WAN / PPPoE
            eth1 = WANB / PPPoE
            eth2-eth5 = LAN
            LAN IP = ${LAN_IP}
            IPv6 = enabled

          Build mode:
            Official OpenWrt ImageBuilder
            No full source compilation
          EOF

      - name: Show release files
        run: ls -lh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"
          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            基于官方 OpenWrt ImageBuilder 构建。

            - LAN: `${{ env.LAN_IP }}`
            - eth0: WAN / PPPoE
            - eth1: WANB / PPPoE
            - eth2-eth5: LAN
            - IPv6: enabled
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update openwrt-version
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "${OPENWRT_VERSION}" > openwrt-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add openwrt-version

          if git diff --cached --quiet; then
            echo "openwrt-version already up to date."
            exit 0
          fi

          git commit -m "Update OpenWrt version to ${OPENWRT_VERSION}"
          git push
