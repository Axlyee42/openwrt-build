name: Build OpenWrt 25.12.x x86-64 ImageBuilder

on:

  workflow_dispatch:

    inputs:

      openwrt_version:
        description: "OpenWrt 版本，留空自动选择最新 25.12.x"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理地址"
        required: true
        default: "192.168.1.2"
        type: string

      build_bios:
        description: "生成 BIOS 镜像"
        required: true
        default: true
        type: boolean

      build_uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      build_qcow2:
        description: "生成 QCOW2 虚拟机镜像"
        required: true
        default: true
        type: boolean

      build_vmdk:
        description: "生成 VMDK 虚拟机镜像"
        required: true
        default: false
        type: boolean

      build_raw:
        description: "生成 RAW 镜像"
        required: true
        default: false
        type: boolean


permissions:

  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ========================================================
      # 安装依赖
      # ========================================================

      - name: Install dependencies

        shell: bash

        run: |

          set -euo pipefail


          sudo apt-get update


          sudo apt-get install -y \
            curl \
            wget \
            git \
            zstd \
            qemu-utils \
            gzip \
            tar \
            xz-utils \
            jq


      # ========================================================
      # 获取 OpenWrt 最新 25.12.x
      # ========================================================

      - name: Resolve OpenWrt version

        shell: bash

        env:

          INPUT_VERSION: ${{ inputs.openwrt_version }}

        run: |

          set -euo pipefail


          VERSION="${INPUT_VERSION}"


          if [ -z "${VERSION}" ]; then

            echo
            echo "Detecting latest OpenWrt 25.12.x..."
            echo


            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"

          fi


          if ! echo "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then

            echo
            echo "ERROR: Invalid OpenWrt version:"
            echo "${VERSION}"
            echo

            exit 1

          fi


          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"


          echo
          echo "=========================================="
          echo "OpenWrt version: ${VERSION}"
          echo "=========================================="
          echo


      # ========================================================
      # 固件大小
      # ========================================================

      - name: Configure rootfs size

        shell: bash

        run: |

          set -euo pipefail


          case "${{ inputs.rootfs_size }}" in

            1G)

              ROOTFS_PARTSIZE=1024

              ;;

            2G)

              ROOTFS_PARTSIZE=2048

              ;;

            3G)

              ROOTFS_PARTSIZE=3072

              ;;

            4G)

              ROOTFS_PARTSIZE=4096

              ;;

            *)

              echo "Invalid rootfs size."

              exit 1

              ;;

          esac


          echo "ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}" >> "${GITHUB_ENV}"

          echo "ROOTFS_SIZE=${{ inputs.rootfs_size }}" >> "${GITHUB_ENV}"


          echo
          echo "RootFS size:"
          echo "${{ inputs.rootfs_size }}"

          echo
          echo "RootFS partition:"
          echo "${ROOTFS_PARTSIZE} MB"


      # ========================================================
      # 下载官方 OpenWrt ImageBuilder
      # ========================================================

      - name: Download OpenWrt ImageBuilder

        shell: bash

        run: |

          set -euo pipefail


          IMAGEBUILDER="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"


          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${IMAGEBUILDER}"


          echo
          echo "=========================================="
          echo "Downloading ImageBuilder"
          echo "=========================================="
          echo

          echo "${URL}"

          echo


          wget \
            --progress=bar:force \
            -O "${IMAGEBUILDER}" \
            "${URL}"


          mkdir -p imagebuilder


          tar \
            --use-compress-program=unzstd \
            -xf "${IMAGEBUILDER}" \
            -C imagebuilder \
            --strip-components=1


          echo
          echo "ImageBuilder ready."


      # ========================================================
      # 准备第三方 APK
      # ========================================================

      - name: Prepare third-party APK packages

        shell: bash

        run: |

          set -euo pipefail


          chmod +x \
            shell/apk-custom-packages.sh


          source \
            shell/apk-custom-packages.sh


          echo
          echo "=========================================="
          echo "Selected custom packages"
          echo "=========================================="
          echo


          printf '%s\n' "${CUSTOM_PACKAGES}"


          echo


      # ========================================================
      # 下载 wukongdaily APK 仓库
      #
      # 这里不是源码编译。
      #
      # 只是获取已经编译好的 APK。
      # ========================================================

      - name: Download third-party APK repository

        shell: bash

        run: |

          set -euo pipefail


          rm -rf third-party-apk


          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk


          echo
          echo "=========================================="
          echo "Third-party APK repository"
          echo "=========================================="
          echo


          find third-party-apk \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.run" \
            \) \
            | head -100


      # ========================================================
      # 准备 APK 仓库
      # ========================================================

      - name: Prepare APK repository

        shell: bash

        run: |

          set -euo pipefail


          mkdir -p \
            local-apk


          # ----------------------------------------------------
          # 复制 APK
          # ----------------------------------------------------

          find third-party-apk/run/x86 \
            -type f \
            -name "*.apk" \
            -exec cp -f {} local-apk/ \; \
            || true


          # ----------------------------------------------------
          # 如果仓库存在 run 文件
          # 解包其中的 APK
          # ----------------------------------------------------

          mkdir -p \
            run-unpack


          for RUN in third-party-apk/run/x86/*.run; do

            if [ ! -f "${RUN}" ]; then

              continue

            fi


            echo
            echo "Unpacking:"
            echo "${RUN}"


            sh "${RUN}" \
              --target run-unpack \
              --noexec \
              || true

          done


          find run-unpack \
            -type f \
            -name "*.apk" \
            -exec cp -f {} local-apk/ \; \
            || true


          echo
          echo "=========================================="
          echo "Local APK files"
          echo "=========================================="
          echo


          find local-apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf '%f\n' \
            | sort


      # ========================================================
      # 检查第三方包
      # ========================================================

      - name: Verify custom packages

        shell: bash

        run: |

          set -euo pipefail


          source \
            shell/apk-custom-packages.sh


          FAILED=0


          echo
          echo "=========================================="
          echo "Checking requested packages"
          echo "=========================================="
          echo


          for PACKAGE in ${CUSTOM_PACKAGES}; do

            FOUND="$(
              find local-apk \
                -maxdepth 1 \
                -type f \
                -name "${PACKAGE}-*.apk" \
                -print \
                | head -1
            )"


            if [ -n "${FOUND}" ]; then

              echo "OK: ${PACKAGE}"

            else

              echo "WARNING: ${PACKAGE} not found in third-party APK repository."

              FAILED=1

            fi

          done


          echo


          if [ "${FAILED}" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "Some requested third-party packages"
            echo "were not found."
            echo "=========================================="
            echo


            echo "Available matching packages:"


            find local-apk \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -printf '%f\n' |
            sort


            exit 1

          fi


      # ========================================================
      # 准备 files
      # ========================================================

      - name: Prepare OpenWrt files

        shell: bash

        run: |

          set -euo pipefail


          rm -rf files


          mkdir -p \
            files/etc/config \
            files/etc/uci-defaults


      # ========================================================
      # 网络配置
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2+ = LAN
      #
      # PPPoE账号密码从 GitHub Secrets 获取
      #
      # Secrets:
      #
      # WAN1_USER
      # WAN1_PASS
      # WAN2_USER
      # WAN2_PASS
      # ========================================================

      - name: Generate network configuration

        shell: bash

        env:

          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |

          set -euo pipefail


          if [ -z "${WAN1_USER}" ]; then

            echo "ERROR: WAN1_USER secret is missing."

            exit 1

          fi


          if [ -z "${WAN1_PASS}" ]; then

            echo "ERROR: WAN1_PASS secret is missing."

            exit 1

          fi


          if [ -z "${WAN2_USER}" ]; then

            echo "ERROR: WAN2_USER secret is missing."

            exit 1

          fi


          if [ -z "${WAN2_PASS}" ]; then

            echo "ERROR: WAN2_PASS secret is missing."

            exit 1

          fi


          LAN_IP="${{ inputs.lan_ip }}"


          cat > files/etc/config/network <<EOF

          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'


          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'


          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'


          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 'auto'


          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'


          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 'auto'


          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          EOF


      # ========================================================
      # DHCP / IPv6
      # ========================================================

      - name: Generate DHCP configuration

        shell: bash

        run: |

          set -euo pipefail


          cat > files/etc/config/dhcp <<'EOF'

          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'


          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'


          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'


          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'

          EOF


      # ========================================================
      # 默认简体中文
      # ========================================================

      - name: Set default language

        shell: bash

        run: |

          set -euo pipefail


          cat > files/etc/uci-defaults/99-default-language <<'EOF'

          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'

          uci -q commit luci

          exit 0

          EOF


          chmod +x \
            files/etc/uci-defaults/99-default-language


      # ========================================================
      # Build 信息
      # ========================================================

      - name: Create build information

        shell: bash

        run: |

          set -euo pipefail


          cat > files/etc/openwrt-build-info <<EOF

          OpenWrt Custom ImageBuilder

          Version:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          $(date -u +%Y%m%d)

          LAN:
          ${{ inputs.lan_ip }}

          eth0:
          WAN / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          Enabled

          EOF


      # ========================================================
      # 组装第三方 APK
      # ========================================================

      - name: Copy third-party packages to ImageBuilder

        shell: bash

        run: |

          set -euo pipefail


          mkdir -p \
            imagebuilder/packages/custom


          cp \
            local-apk/*.apk \
            imagebuilder/packages/custom/


          echo
          echo "Third-party packages copied."


      # ========================================================
      # 生成 ImageBuilder 本地 APK 仓库索引
      # ========================================================

      - name: Create local APK repository index

        working-directory: imagebuilder

        shell: bash

        run: |

          set -euo pipefail


          echo
          echo "Creating local APK repository..."
          echo


          if command -v apk >/dev/null 2>&1; then

            apk index \
              -o packages/custom/APKINDEX.tar.gz \
              packages/custom/*.apk

          else

            echo "Host apk command not available."

            echo "The ImageBuilder will use its package environment."

          fi


      # ========================================================
      # 修改 ImageBuilder repositories.conf
      # ========================================================

      - name: Configure package repositories

        working-directory: imagebuilder

        shell: bash

        run: |

          set -euo pipefail


          echo
          echo "=========================================="
          echo "ImageBuilder repositories"
          echo "=========================================="
          echo


          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "repositories.conf" \
              -o \
              -name "repositories" \
            \) \
            -print


          if [ -f repositories.conf ]; then

            cat repositories.conf

          fi


      # ========================================================
      # Build ImageBuilder
      #
      # 这里是整个流程的核心：
      #
      # make image
      #
      # 没有：
      #
      # make -j
      # make toolchain
      # make kernel
      # make package/xxx/compile
      #
      # ========================================================

      - name: Build OpenWrt image

        working-directory: imagebuilder

        shell: bash

        env:

          LAN_IP: ${{ inputs.lan_ip }}

        run: |

          set -euo pipefail


          source \
            ../shell/apk-custom-packages.sh


          PACKAGES=""


          # ====================================================
          # 官方 OpenWrt packages
          # ====================================================

          PACKAGES="${PACKAGES} luci"

          PACKAGES="${PACKAGES} luci-ssl"

          PACKAGES="${PACKAGES} luci-i18n-base-zh-cn"

          PACKAGES="${PACKAGES} luci-app-package-manager"

          PACKAGES="${PACKAGES} luci-i18n-package-manager-zh-cn"

          PACKAGES="${PACKAGES} luci-app-mwan3"

          PACKAGES="${PACKAGES} luci-app-upnp"

          PACKAGES="${PACKAGES} luci-i18n-upnp-zh-cn"

          PACKAGES="${PACKAGES} luci-app-ttyd"

          PACKAGES="${PACKAGES} luci-i18n-ttyd-zh-cn"

          PACKAGES="${PACKAGES} luci-proto-ppp"

          PACKAGES="${PACKAGES} luci-proto-ipv6"

          PACKAGES="${PACKAGES} ppp"

          PACKAGES="${PACKAGES} ppp-mod-pppoe"

          PACKAGES="${PACKAGES} odhcp6c"

          PACKAGES="${PACKAGES} odhcpd-ipv6only"


          # ====================================================
          # 第三方 packages
          # ====================================================

          PACKAGES="${PACKAGES} ${CUSTOM_PACKAGES}"


          # ====================================================
          # 删除重复空格
          # ====================================================

          PACKAGES="$(
            echo "${PACKAGES}" |
            xargs
          )"


          echo
          echo "=========================================="
          echo "Final package list"
          echo "=========================================="
          echo


          echo "${PACKAGES}"


          echo
          echo "=========================================="
          echo "Building ImageBuilder image"
          echo "=========================================="
          echo


          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="${GITHUB_WORKSPACE}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            V=s


      # ========================================================
      # 查看生成文件
      # ========================================================

      - name: List generated images

        working-directory: imagebuilder

        run: |

          echo
          echo "=========================================="
          echo "Generated images"
          echo "=========================================="
          echo


          find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
          sort


      # ========================================================
      # 创建 Release 目录
      # ========================================================

      - name: Prepare release

        shell: bash

        run: |

          set -euo pipefail


          rm -rf release


          mkdir -p release


          BUILD_DATE="$(date -u +%Y%m%d)"


          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"


      # ========================================================
      # BIOS
      # ========================================================

      - name: Export BIOS image

        if: inputs.build_bios

        shell: bash

        run: |

          set -euo pipefail


          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: BIOS ext4 image not found."

            exit 1

          fi


          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-BIOS.img.gz"


      # ========================================================
      # UEFI
      # ========================================================

      - name: Export UEFI image

        if: inputs.build_uefi

        shell: bash

        run: |

          set -euo pipefail


          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI ext4 image not found."

            exit 1

          fi


          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


      # ========================================================
      # 解压 UEFI RAW
      # ========================================================

      - name: Prepare raw image

        if: inputs.build_qcow2 || inputs.build_vmdk || inputs.build_raw

        shell: bash

        run: |

          set -euo pipefail


          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -1
          )


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI image not found."

            exit 1

          fi


          gzip -dc \
            "${IMAGE}" \
            > openwrt.raw


      # ========================================================
      # QCOW2
      # ========================================================

      - name: Create QCOW2

        if: inputs.build_qcow2

        shell: bash

        run: |

          set -euo pipefail


          qemu-img convert \
            -f raw \
            -O qcow2 \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


      # ========================================================
      # VMDK
      # ========================================================

      - name: Create VMDK

        if: inputs.build_vmdk

        shell: bash

        run: |

          set -euo pipefail


          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.vmdk"


      # ========================================================
      # RAW
      # ========================================================

      - name: Create RAW

        if: inputs.build_raw

        shell: bash

        run: |

          set -euo pipefail


          cp \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.raw"


      # ========================================================
      # SHA256
      # ========================================================

      - name: Generate SHA256

        shell: bash

        run: |

          set -euo pipefail


          cd release


          sha256sum * \
            > sha256sums


      # ========================================================
      # Release 信息
      # ========================================================

      - name: Create release information

        shell: bash

        run: |

          cat > release/build-info.txt <<EOF

          ==========================================
          OpenWrt Custom ImageBuilder
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}


          ==========================================
          Network
          ==========================================

          eth0 = WAN / PPPoE

          eth1 = WANB / PPPoE

          eth2 = LAN

          eth3 = LAN

          eth4 = LAN

          eth5 = LAN


          LAN IP:
          ${{ inputs.lan_ip }}


          IPv6:
          Enabled


          ==========================================
          Included packages
          ==========================================

          LuCI
          LuCI SSL
          Simplified Chinese
          LuCI Package Manager
          mwan3
          UPnP
          ttyd

          PassWall
          xray-core
          sing-box
          hysteria
          geoview

          OpenClash

          Aurora
          Aurora Config
          Shadcn

          Bandix

          luci-app-run

          FileBrowser Go

          VLMCSd

          Timewol

          Autoreboot


          ==========================================

          EOF


      # ========================================================
      # 显示最终文件
      # ========================================================

      - name: Show release files

        run: |

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="
          echo


          ls -lh release


      # ========================================================
      # GitHub Release
      # ========================================================

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: "OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build

            - Version: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ inputs.lan_ip }}`
            - IPv6: Enabled

            ## Packages

            - LuCI
            - Simplified Chinese
            - Package Manager
            - mwan3
            - UPnP
            - ttyd
            - PassWall
            - OpenClash
            - Aurora
            - Shadcn
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - VLMCSd
            - Timewol
            - Autoreboot

          files: |
            release/*

          token: ${{ secrets.GITHUB_TOKEN }}
