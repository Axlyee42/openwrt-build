name: Build OpenWrt 25.12.x x86-64 ImageBuilder

on:

  workflow_dispatch:

    inputs:

      openwrt_version:
        description: "OpenWrt 版本，留空自动使用最新 25.12.x"
        required: false
        default: ""
        type: string

      lan_ip:
        description: "LAN 管理地址"
        required: true
        default: "192.168.1.2"
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      bios:
        description: "生成 BIOS 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2 虚拟机镜像"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK 虚拟机镜像"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW 镜像"
        required: true
        default: false
        type: boolean


permissions:

  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4


      # ======================================================
      # 安装工具
      # ======================================================

      - name: Install dependencies

        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            git \
            zstd \
            qemu-utils \
            gzip \
            tar \
            xz-utils \
            jq


      # ======================================================
      # 自动获取最新 OpenWrt 25.12.x
      # ======================================================

      - name: Resolve OpenWrt version

        env:

          INPUT_VERSION: ${{ inputs.openwrt_version }}

        run: |

          set -e

          VERSION="${INPUT_VERSION}"

          if [ -z "${VERSION}" ]; then

            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git |
              sed -n 's#.*refs/tags/v\(25\.12\.[0-9]\+\)$#\1#p' |
              sort -V |
              tail -1
            )

          fi

          if ! echo "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then

            echo "Invalid OpenWrt version: ${VERSION}"

            exit 1

          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt ${VERSION}"
          echo "=========================================="
          echo


      # ======================================================
      # 固件大小
      # ======================================================

      - name: Set rootfs size

        run: |

          set -e

          case "${{ inputs.rootfs_size }}" in

            1G)
              SIZE=1024
              ;;

            2G)
              SIZE=2048
              ;;

            3G)
              SIZE=3072
              ;;

            4G)
              SIZE=4096
              ;;

            *)
              echo "Invalid rootfs size."
              exit 1
              ;;

          esac

          echo "ROOTFS_PARTSIZE=${SIZE}" >> "${GITHUB_ENV}"

          echo "ROOTFS_SIZE=${{ inputs.rootfs_size }}" >> "${GITHUB_ENV}"


      # ======================================================
      # 下载 OpenWrt 官方 ImageBuilder
      # ======================================================

      - name: Download ImageBuilder

        run: |

          set -e

          FILE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${FILE}"

          echo "${URL}"

          wget \
            --progress=bar:force \
            -O "${FILE}" \
            "${URL}"

          mkdir imagebuilder

          tar \
            --use-compress-program=unzstd \
            -xf "${FILE}" \
            -C imagebuilder \
            --strip-components=1

          echo
          echo "ImageBuilder ready."


      # ======================================================
      # 查看 ImageBuilder
      # ======================================================

      - name: ImageBuilder information

        working-directory: imagebuilder

        run: |

          set -e

          make info


      # ======================================================
      # 下载第三方 APK 仓库
      # ======================================================

      - name: Download third-party APK repository

        run: |

          set -e

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk


      # ======================================================
      # 准备第三方 APK
      #
      # 完全参考 wukongdaily 的 apk-prepare-packages.sh：
      #
      # run/*.run
      #        ↓
      # 解包
      #        ↓
      # packages/*.apk
      #
      # 同时复制已有 APK。
      # ======================================================

      - name: Prepare third-party packages

        run: |

          set -e

          rm -rf custom-packages

          mkdir -p custom-packages
          mkdir -p custom-packages/unpack


          # --------------------------------------------------
          # 复制 APK
          # --------------------------------------------------

          find third-party-apk/run/x86 \
            -type f \
            -name "*.apk" \
            -exec cp -f {} custom-packages/ \; \
            || true


          # --------------------------------------------------
          # 解包 RUN
          # --------------------------------------------------

          for RUN in third-party-apk/run/x86/*.run; do

            [ -f "${RUN}" ] || continue

            echo
            echo "Unpacking ${RUN}"

            sh "${RUN}" \
              --target custom-packages/unpack \
              --noexec \
              || true

          done


          # --------------------------------------------------
          # 收集 RUN 内 APK
          # --------------------------------------------------

          find custom-packages/unpack \
            -type f \
            -name "*.apk" \
            -exec cp -f {} custom-packages/ \; \
            || true


          echo
          echo "=========================================="
          echo "Third-party APK files"
          echo "=========================================="
          echo


          find custom-packages \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" |
          sort


      # ======================================================
      # 检查第三方包
      #
      # 注意：
      # 不是所有 wukongdaily 清单中的语言包都一定存在于
      # 当前 APK 仓库。
      #
      # 存在 -> 加入
      # 不存在 -> 自动跳过
      #
      # 这样不会因为一个可选插件消失导致整个固件失败。
      # ======================================================

      - name: Build available custom package list

        run: |

          set -e

          source shell/apk-custom-packages.sh


          FINAL_CUSTOM_PACKAGES=""


          for PACKAGE in ${CUSTOM_PACKAGES}; do

            FILE="$(
              find custom-packages \
                -maxdepth 1 \
                -type f \
                -name "${PACKAGE}-*.apk" |
              head -1
            )"


            if [ -n "${FILE}" ]; then

              echo "FOUND: ${PACKAGE}"

              FINAL_CUSTOM_PACKAGES="${FINAL_CUSTOM_PACKAGES} ${PACKAGE}"

            else

              echo "SKIP: ${PACKAGE}"

            fi

          done


          FINAL_CUSTOM_PACKAGES="$(
            echo "${FINAL_CUSTOM_PACKAGES}" |
            xargs
          )"


          echo
          echo "=========================================="
          echo "Final third-party packages"
          echo "=========================================="
          echo

          echo "${FINAL_CUSTOM_PACKAGES}"


          echo \
            "CUSTOM_PACKAGES=${FINAL_CUSTOM_PACKAGES}" \
            >> "${GITHUB_ENV}"


      # ======================================================
      # 把 APK 放入 ImageBuilder
      # ======================================================

      - name: Install local APK repository

        working-directory: imagebuilder

        run: |

          set -e

          mkdir -p packages/custom


          cp \
            "${GITHUB_WORKSPACE}"/custom-packages/*.apk \
            packages/custom/ \
            || true


          echo
          echo "Custom APK:"
          echo


          find packages/custom \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" |
          sort


      # ======================================================
      # 生成 APKINDEX
      #
      # 25.12 已经使用 apk。
      # ======================================================

      - name: Create APK index

        working-directory: imagebuilder

        run: |

          set -e

          if [ -x "staging_dir/host/bin/apk" ]; then

            staging_dir/host/bin/apk \
              mkndx \
              --allow-untrusted \
              packages/custom

          elif command -v apk >/dev/null 2>&1; then

            apk \
              mkndx \
              --allow-untrusted \
              packages/custom

          else

            echo "No apk index tool available."

            exit 1

          fi


      # ======================================================
      # 配置本地仓库
      #
      # 25.12 APK ImageBuilder 使用 repositories。
      # ======================================================

      - name: Configure local APK repository

        working-directory: imagebuilder

        run: |

          set -e

          echo
          echo "=========================================="
          echo "Current repositories"
          echo "=========================================="
          echo

          if [ -f repositories ]; then

            cat repositories

          elif [ -f repositories.conf ]; then

            cat repositories.conf

          fi


          # --------------------------------------------------
          # 新增本地 custom repository
          # --------------------------------------------------

          if [ -f repositories ]; then

            if ! grep -q "packages/custom" repositories; then

              echo \
                "file:///builder/packages/custom" \
                >> repositories

            fi

          elif [ -f repositories.conf ]; then

            if ! grep -q "packages/custom" repositories.conf; then

              echo \
                "src custom file:packages/custom" \
                >> repositories.conf

            fi

          fi


      # ======================================================
      # 生成 files
      # ======================================================

      - name: Prepare files

        run: |

          set -e

          rm -rf files

          mkdir -p \
            files/etc/config \
            files/etc/uci-defaults \
            files/etc/apk/repositories.d


      # ======================================================
      # Network
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2~eth5 = LAN
      #
      # IPv6 开启
      # ======================================================

      - name: Generate network configuration

        env:

          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |

          set -e


          if [ -z "${WAN1_USER}" ] ||
             [ -z "${WAN1_PASS}" ] ||
             [ -z "${WAN2_USER}" ] ||
             [ -z "${WAN2_PASS}" ]; then

            echo
            echo "ERROR:"
            echo "Please create these GitHub Actions secrets:"
            echo
            echo "WAN1_USER"
            echo "WAN1_PASS"
            echo "WAN2_USER"
            echo "WAN2_PASS"
            echo

            exit 1

          fi


          cat > files/etc/config/network <<EOF

          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'


          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'


          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${{ inputs.lan_ip }}'
              option netmask '255.255.255.0'
              option ip6assign '64'


          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 'auto'


          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'


          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 'auto'


          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          EOF


      # ======================================================
      # DHCP + IPv6 RA
      # ======================================================

      - name: Generate DHCP configuration

        run: |

          set -e

          cat > files/etc/config/dhcp <<'EOF'

          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'


          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'


          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'


          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'

          EOF


      # ======================================================
      # 默认简体中文
      # ======================================================

      - name: Set default Chinese language

        run: |

          set -e

          cat > files/etc/uci-defaults/99-default-language <<'EOF'

          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'

          uci -q commit luci

          exit 0

          EOF


          chmod +x \
            files/etc/uci-defaults/99-default-language


      # ======================================================
      # 把第三方软件源写入系统
      #
      # 方便系统运行后继续安装/更新第三方 APK。
      # ======================================================

      - name: Configure third-party software source

        run: |

          set -e


          cat > files/etc/apk/repositories.d/99-custom.list <<'EOF'

          # wukongdaily third-party APK source
          # https://github.com/wukongdaily/apk

          EOF


      # ======================================================
      # 构建 Package 列表
      # ======================================================

      - name: Prepare final package list

        run: |

          set -e


          PACKAGES=""


          # --------------------------------------------------
          # LuCI
          # --------------------------------------------------

          PACKAGES="${PACKAGES} luci"

          PACKAGES="${PACKAGES} luci-ssl"

          PACKAGES="${PACKAGES} luci-app-package-manager"

          PACKAGES="${PACKAGES} luci-i18n-package-manager-zh-cn"


          # --------------------------------------------------
          # 网络
          # --------------------------------------------------

          PACKAGES="${PACKAGES} luci-app-mwan3"

          PACKAGES="${PACKAGES} luci-app-upnp"

          PACKAGES="${PACKAGES} luci-i18n-upnp-zh-cn"

          PACKAGES="${PACKAGES} luci-app-ttyd"

          PACKAGES="${PACKAGES} luci-i18n-ttyd-zh-cn"


          # --------------------------------------------------
          # PPPoE / IPv6
          # --------------------------------------------------

          PACKAGES="${PACKAGES} ppp"

          PACKAGES="${PACKAGES} ppp-mod-pppoe"

          PACKAGES="${PACKAGES} kmod-pppoe"

          PACKAGES="${PACKAGES} luci-proto-ppp"

          PACKAGES="${PACKAGES} luci-proto-ipv6"

          PACKAGES="${PACKAGES} odhcp6c"

          PACKAGES="${PACKAGES} odhcpd-ipv6only"


          # --------------------------------------------------
          # PassWall / OpenClash / 第三方
          # --------------------------------------------------

          PACKAGES="${PACKAGES} ${CUSTOM_PACKAGES}"


          PACKAGES="$(
            echo "${PACKAGES}" |
            xargs
          )"


          echo
          echo "=========================================="
          echo "FINAL PACKAGES"
          echo "=========================================="
          echo

          echo "${PACKAGES}"


          echo \
            "FINAL_PACKAGES=${PACKAGES}" \
            >> "${GITHUB_ENV}"


      # ======================================================
      # ImageBuilder 构建
      #
      # 注意：
      #
      # 这里只执行 make image。
      #
      # 不会：
      #
      # make
      # make -j
      # 编译 toolchain
      # 编译 kernel
      # 编译 xray
      # 编译 sing-box
      #
      # ======================================================

      - name: Build image

        working-directory: imagebuilder

        run: |

          set -e


          echo
          echo "=========================================="
          echo "Building OpenWrt ImageBuilder"
          echo "=========================================="
          echo


          make image \
            PROFILE="generic" \
            PACKAGES="${FINAL_PACKAGES}" \
            FILES="${GITHUB_WORKSPACE}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            V=s


      # ======================================================
      # 查看固件
      # ======================================================

      - name: List images

        working-directory: imagebuilder

        run: |

          find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" |
          sort


      # ======================================================
      # 创建 Release
      # ======================================================

      - name: Prepare release

        run: |

          set -e

          mkdir -p release


          BUILD_DATE="$(date -u +%Y%m%d)"

          BUILD_TIME="$(date -u +%H%M%S)"


          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"

          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"


      # ======================================================
      # BIOS
      # ======================================================

      - name: Export BIOS

        if: inputs.bios

        run: |

          set -e


          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "BIOS image not found."

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-BIOS.img.gz"


      # ======================================================
      # UEFI
      # ======================================================

      - name: Export UEFI

        if: inputs.uefi

        run: |

          set -e


          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -1
          )


          if [ -z "${IMAGE}" ]; then

            echo "UEFI image not found."

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.img.gz"


      # ======================================================
      # RAW
      # ======================================================

      - name: Prepare RAW

        if: inputs.qcow2 || inputs.vmdk || inputs.raw

        run: |

          set -e


          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -1
          )


          if [ -z "${IMAGE}" ]; then

            echo "UEFI image not found."

            exit 1

          fi


          gzip -dc \
            "${IMAGE}" \
            > openwrt.raw


      # ======================================================
      # QCOW2
      # ======================================================

      - name: Create QCOW2

        if: inputs.qcow2

        run: |

          set -e


          qemu-img convert \
            -f raw \
            -O qcow2 \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.qcow2"


      # ======================================================
      # VMDK
      # ======================================================

      - name: Create VMDK

        if: inputs.vmdk

        run: |

          set -e


          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.vmdk"


      # ======================================================
      # RAW
      # ======================================================

      - name: Export RAW

        if: inputs.raw

        run: |

          set -e


          cp openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.raw"


      # ======================================================
      # SHA256
      # ======================================================

      - name: Generate SHA256

        run: |

          set -e

          cd release

          sha256sum * \
            > sha256sums


      # ======================================================
      # Build information
      # ======================================================

      - name: Create build information

        run: |

          cat > release/build-info.txt <<EOF

          ==========================================
          OpenWrt Custom ImageBuilder
          ==========================================

          OpenWrt version:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME}


          ==========================================
          Network
          ==========================================

          eth0 = WAN
          PPPoE

          eth1 = WANB
          PPPoE

          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN


          LAN:
          ${{ inputs.lan_ip }}


          IPv6:
          Enabled


          ==========================================
          Packages
          ==========================================

          LuCI
          LuCI SSL
          LuCI Package Manager
          Simplified Chinese

          mwan3
          UPnP
          ttyd

          PassWall components
          OpenClash

          Aurora
          Shadcn
          Bandix

          luci-app-run
          FileBrowser Go language pack
          VLMCSd language pack
          Timewol language pack
          Autoreboot language pack


          ==========================================

          EOF


      # ======================================================
      # 显示结果
      # ======================================================

      - name: Show release files

        run: |

          echo

          echo "=========================================="

          echo "Release files"

          echo "=========================================="

          echo

          ls -lh release


      # ======================================================
      # GitHub Release
      # ======================================================

      - name: Publish Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: "OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Architecture: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`
            - Build time: `${{ env.BUILD_TIME }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ inputs.lan_ip }}`
            - IPv6: Enabled

            ## Included

            - LuCI
            - LuCI SSL
            - Simplified Chinese
            - Package Manager
            - mwan3
            - UPnP
            - ttyd
            - PassWall components
            - OpenClash
            - Aurora
            - Shadcn
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - VLMCSd
            - Timewol
            - Autoreboot

          files: |
            release/*

          token: ${{ secrets.GITHUB_TOKEN }}
