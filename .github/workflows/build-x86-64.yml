name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        required: true
        default: "25.12.5"

      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.1.2"

      rootfs_size:
        description: "Firmware/rootfs size"
        required: true
        type: choice
        default: "1G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      filesystem:
        description: "Filesystem"
        required: true
        type: choice
        default: "ext4"
        options:
          - "ext4"
          - "squashfs"

      build_uefi:
        description: "Build UEFI image"
        required: true
        type: boolean
        default: true

      build_qcow2:
        description: "Build QCOW2 image"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      LAN_IP: ${{ inputs.lan_ip }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
      FILESYSTEM: ${{ inputs.filesystem }}
      BUILD_UEFI: ${{ inputs.build_uefi }}
      BUILD_QCOW2: ${{ inputs.build_qcow2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            gzip \
            qemu-utils \
            wget \
            xz-utils \
            zstd

      - name: Download OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euxo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          mkdir -p "${RUNNER_TEMP}/imagebuilder"
          cd "${RUNNER_TEMP}/imagebuilder"

          wget -q --show-progress "${BASE_URL}/${ARCHIVE}"
          tar --zstd -xf "${ARCHIVE}"

          IMAGEBUILDER_DIR="$(
            find . -mindepth 1 -maxdepth 1 -type d \
              -name "openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64" \
              -print -quit
          )"

          test -n "${IMAGEBUILDER_DIR}"

          IMAGEBUILDER_DIR="$(
            cd "${IMAGEBUILDER_DIR}" && pwd
          )"

          echo "IMAGEBUILDER_DIR=${IMAGEBUILDER_DIR}" >> "${GITHUB_ENV}"

          echo "ImageBuilder: ${IMAGEBUILDER_DIR}"

      - name: Load third-party APK manifest
        shell: bash
        run: |
          set -euxo pipefail

          test -f scripts/apk-custom-packages.sh

          # IMPORTANT:
          # apk-custom-packages.sh is a manifest, not an executable installer.
          # source it so CUSTOM_PACKAGES exists in THIS shell.
          source scripts/apk-custom-packages.sh

          CUSTOM_PACKAGES="$(
            printf '%s\n' "${CUSTOM_PACKAGES:-}" |
              tr '[:space:]' '\n' |
              awk 'NF && !seen[$0]++' |
              paste -sd ' ' -
          )"

          test -n "${CUSTOM_PACKAGES}"

          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "${GITHUB_ENV}"

          echo
          echo "Selected third-party packages:"
          printf '%s\n' "${CUSTOM_PACKAGES}" | tr ' ' '\n'

      - name: Prepare third-party APK repository
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"

          THIRD_PARTY_REPO="${RUNNER_TEMP}/wukongdaily-apk"

          rm -rf "${THIRD_PARTY_REPO}"

          git clone --depth=1 \
            https://github.com/wukongdaily/apk.git \
            "${THIRD_PARTY_REPO}"

          mkdir -p packages

          echo
          echo "Searching third-party APK repository..."

          # Copy only APKs explicitly selected by CUSTOM_PACKAGES.
          # For packages with multiple revisions, choose the highest version
          # according to sort -V.
          for pkg in ${CUSTOM_PACKAGES}; do
            mapfile -t matches < <(
              find "${THIRD_PARTY_REPO}" \
                -type f \
                -name "${pkg}-*.apk" \
                -print |
                sort -V
            )

            if [[ "${#matches[@]}" -eq 0 ]]; then
              echo
              echo "ERROR: APK not found in wukongdaily/apk: ${pkg}"
              echo
              echo "Available matching files:"
              find "${THIRD_PARTY_REPO}" \
                -type f \
                -name "${pkg}*.apk" \
                -printf '%p\n' |
                sort || true
              exit 1
            fi

            src="${matches[${#matches[@]}-1]}"
            cp -f "${src}" packages/

            echo "  ${pkg} <- $(basename "${src}")"
          done

          echo
          echo "Local APK files:"
          find packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' |
            sort

          test -n "$(find packages -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Prepare ImageBuilder configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"

          case "${ROOTFS_SIZE}" in
            1G) ROOTFS_PARTSIZE=1024 ;;
            2G) ROOTFS_PARTSIZE=2048 ;;
            3G) ROOTFS_PARTSIZE=3072 ;;
            4G) ROOTFS_PARTSIZE=4096 ;;
            *)
              echo "Invalid ROOTFS_SIZE=${ROOTFS_SIZE}" >&2
              exit 1
              ;;
          esac

          echo "ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}" >> "${GITHUB_ENV}"

          # Only the requested filesystem is enabled.
          sed -i \
            -e '/^CONFIG_TARGET_ROOTFS_SQUASHFS=/d' \
            -e '/^# CONFIG_TARGET_ROOTFS_SQUASHFS is not set$/d' \
            -e '/^CONFIG_TARGET_ROOTFS_EXT4FS=/d' \
            -e '/^# CONFIG_TARGET_ROOTFS_EXT4FS is not set$/d' \
            .config

          case "${FILESYSTEM}" in
            ext4)
              printf '%s\n' \
                'CONFIG_TARGET_ROOTFS_SQUASHFS=n' \
                'CONFIG_TARGET_ROOTFS_EXT4FS=y' \
                >> .config
              ;;
            squashfs)
              printf '%s\n' \
                'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
                'CONFIG_TARGET_ROOTFS_EXT4FS=n' \
                >> .config
              ;;
            *)
              echo "Invalid FILESYSTEM=${FILESYSTEM}" >&2
              exit 1
              ;;
          esac

          # UEFI only. BIOS/VDI/VMDK/VHDX/ISO are disabled.
          sed -i \
            -e '/^CONFIG_GRUB_IMAGES=/d' \
            -e '/^# CONFIG_GRUB_IMAGES is not set$/d' \
            -e '/^CONFIG_GRUB_EFI_IMAGES=/d' \
            -e '/^# CONFIG_GRUB_EFI_IMAGES is not set$/d' \
            -e '/^CONFIG_VDI_IMAGES=/d' \
            -e '/^# CONFIG_VDI_IMAGES is not set$/d' \
            -e '/^CONFIG_VMDK_IMAGES=/d' \
            -e '/^# CONFIG_VMDK_IMAGES is not set$/d' \
            -e '/^CONFIG_VHDX_IMAGES=/d' \
            -e '/^# CONFIG_VHDX_IMAGES is not set$/d' \
            -e '/^CONFIG_ISO_IMAGES=/d' \
            -e '/^# CONFIG_ISO_IMAGES is not set$/d' \
            .config

          if [[ "${BUILD_UEFI}" == "true" ]]; then
            printf '%s\n' \
              'CONFIG_GRUB_IMAGES=n' \
              'CONFIG_GRUB_EFI_IMAGES=y' \
              'CONFIG_VDI_IMAGES=n' \
              'CONFIG_VMDK_IMAGES=n' \
              'CONFIG_VHDX_IMAGES=n' \
              'CONFIG_ISO_IMAGES=n' \
              >> .config
          else
            printf '%s\n' \
              'CONFIG_GRUB_IMAGES=n' \
              'CONFIG_GRUB_EFI_IMAGES=n' \
              'CONFIG_VDI_IMAGES=n' \
              'CONFIG_VMDK_IMAGES=n' \
              'CONFIG_VHDX_IMAGES=n' \
              'CONFIG_ISO_IMAGES=n' \
              >> .config
          fi

          echo
          echo "Filesystem:"
          grep -E '^CONFIG_TARGET_ROOTFS_(SQUASHFS|EXT4FS)=' .config || true

          echo
          echo "Image formats:"
          grep -E '^(CONFIG_GRUB_IMAGES|CONFIG_GRUB_EFI_IMAGES|CONFIG_VDI_IMAGES|CONFIG_VMDK_IMAGES|CONFIG_VHDX_IMAGES|CONFIG_ISO_IMAGES)=' .config || true

      - name: Prepare custom files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${IMAGEBUILDER_DIR}/files/etc/uci-defaults"

          cp \
            files/etc/uci-defaults/99-custom.sh \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

          chmod +x \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

          sed -i \
            "s/__LAN_IP__/${LAN_IP}/g" \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

      - name: Build OpenWrt image
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"

          BASE_PACKAGES="curl luci-i18n-firewall-zh-cn luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn luci-i18n-package-manager-zh-cn luci-i18n-ttyd-zh-cn openssh-sftp-server"

          # PACKAGES is intentionally ONE LINE.
          PACKAGES="$(
            printf '%s\n' \
              "${BASE_PACKAGES}" \
              "${CUSTOM_PACKAGES:-}" |
              tr '[:space:]' '\n' |
              awk 'NF && !seen[$0]++' |
              paste -sd ' ' -
          )"

          test -n "${PACKAGES}"

          echo
          echo "============================================================"
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "Target          : x86/64"
          echo "LAN IP          : ${LAN_IP}"
          echo "Firmware size   : ${ROOTFS_SIZE}"
          echo "Filesystem      : ${FILESYSTEM}"
          echo "UEFI            : ${BUILD_UEFI}"
          echo "QCOW2           : ${BUILD_QCOW2}"
          echo "Rootfs partsize : ${ROOTFS_PARTSIZE} MiB"
          echo "============================================================"
          echo
          echo "Packages:"
          printf '%s\n' "${PACKAGES}" | tr ' ' '\n'

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="${IMAGEBUILDER_DIR}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}"

      - name: Collect images
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_DIR="${IMAGEBUILDER_DIR}/bin/targets/x86/64"
          OUT="${GITHUB_WORKSPACE}/release"

          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          shopt -s nullglob

          if [[ "${BUILD_UEFI}" == "true" ]]; then
            if [[ "${FILESYSTEM}" == "ext4" ]]; then
              candidates=(
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img
              )
            else
              candidates=(
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img
              )
            fi

            if [[ "${#candidates[@]}" -eq 0 ]]; then
              echo "ERROR: UEFI ${FILESYSTEM} image not found." >&2
              find "${BUILD_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort
              exit 1
            fi

            src="${candidates[0]}"
            uefi_img="${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.img"

            case "${src}" in
              *.gz)
                gzip -dc "${src}" > "${uefi_img}"
                ;;
              *)
                cp -f "${src}" "${uefi_img}"
                ;;
            esac

            if [[ "${BUILD_QCOW2}" == "true" ]]; then
              qemu-img convert \
                -p \
                -f raw \
                -O qcow2 \
                "${uefi_img}" \
                "${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2"
            fi

            # RAW is an intermediate format only.
            # It is intentionally removed from the final artifact set.
            rm -f "${uefi_img}"
          fi

          echo
          echo "Final artifacts:"
          find "${OUT}" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate SHA256
        shell: bash
        run: |
          set -euxo pipefail
          cd release
          sha256sum * > sha256sums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ inputs.openwrt_version }}-${{ inputs.filesystem }}
          path: release/*
          if-no-files-found: error
