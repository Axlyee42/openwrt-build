name: Build OpenWrt x86-64

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/build-x86-64.yml"
      - "scripts/**"
      - "configs/**"
      - "files/**"

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  FORCE_UNSAFE_CONFIGURE: 1

  OPENWRT_ROOT: ${{ github.workspace }}/openwrt
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: main

  TARGET: x86
  SUBTARGET: 64

  JOBS: 2

  THIRD_PARTY_DIR: package/third-party

jobs:

  build:

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    steps:

      # ======================================================================
      # 1. Checkout
      # ======================================================================

      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================================
      # 2. 安装 Ubuntu 24.04 构建依赖
      #
      # 注意：
      # Ubuntu 24.04 已经没有 python3-distutils
      #
      # libgmp3-dev 也改为 libgmp-dev
      # ======================================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc \
            g++ \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            jq \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lld \
            llvm \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            qemu-utils \
            rsync \
            swig \
            tar \
            texinfo \
            uglifyjs \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev

      # ======================================================================
      # 3. 检查工具链环境
      # ======================================================================

      - name: Check build environment
        shell: bash
        run: |
          set -eux

          echo "Ubuntu:"
          lsb_release -a || true

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Git:"
          git --version

      # ======================================================================
      # 4. Clone OpenWrt
      # ======================================================================

      - name: Clone OpenWrt
        shell: bash
        run: |
          set -eux

          rm -rf "${OPENWRT_ROOT}"

          git clone \
            --depth=1 \
            --single-branch \
            --branch="${OPENWRT_BRANCH}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_ROOT}"

          cd "${OPENWRT_ROOT}"

          echo
          echo "OpenWrt commit:"
          git log -1 --oneline

      # ======================================================================
      # 5. 准备 feeds.conf
      #
      # 如果仓库本身有 feeds.conf / feeds.conf.default，
      # OpenWrt 使用其默认配置。
      # ======================================================================

      - name: Show OpenWrt feeds configuration
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          echo
          echo "============================================================"
          echo " feeds.conf"
          echo "============================================================"

          if [[ -f feeds.conf ]]; then
            cat feeds.conf
          elif [[ -f feeds.conf.default ]]; then
            cat feeds.conf.default
          else
            echo "No feeds.conf or feeds.conf.default found."
          fi

      # ======================================================================
      # 6. 更新官方 feeds
      # ======================================================================

      - name: Update OpenWrt feeds
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          ./scripts/feeds update -a

      # ======================================================================
      # 7. 安装官方 feeds
      #
      # 这里只安装官方 feed。
      # 第三方包由 apk-custom-packages.sh 单独放入
      # package/third-party。
      # ======================================================================

      - name: Install OpenWrt feeds
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          ./scripts/feeds install -a

      # ======================================================================
      # 8. 应用基础配置
      #
      # 支持：
      #
      # configs/x86-64.config
      #
      # 或：
      #
      # .config
      # ======================================================================

      - name: Apply base OpenWrt configuration
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          if [[ -f "${GITHUB_WORKSPACE}/configs/x86-64.config" ]]; then

            echo "Using configs/x86-64.config"

            cp \
              "${GITHUB_WORKSPACE}/configs/x86-64.config" \
              .config

          elif [[ -f "${GITHUB_WORKSPACE}/.config" ]]; then

            echo "Using repository .config"

            cp \
              "${GITHUB_WORKSPACE}/.config" \
              .config

          else

            echo "No custom config found."

            touch .config

          fi

      # ======================================================================
      # 9. 准备第三方源码
      #
      # 这个脚本：
      #
      #   只负责下载 / 整理第三方 package
      #
      # 不负责：
      #
      #   make
      #   defconfig
      #   APK 检查
      # ======================================================================

      - name: Prepare third-party package sources
        shell: bash
        run: |
          set -eux

          chmod +x \
            "${GITHUB_WORKSPACE}/scripts/apk-custom-packages.sh"

          OPENWRT_ROOT="${OPENWRT_ROOT}" \
          THIRD_PARTY_DIR="${THIRD_PARTY_DIR}" \
            "${GITHUB_WORKSPACE}/scripts/apk-custom-packages.sh"

      # ======================================================================
      # 10. 显示第三方 package
      # ======================================================================

      - name: Inspect third-party packages
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          echo
          echo "============================================================"
          echo " Third-party package Makefiles"
          echo "============================================================"

          if [[ -d "${THIRD_PARTY_DIR}" ]]; then

            find \
              "${THIRD_PARTY_DIR}" \
              -type f \
              -name Makefile \
              -print \
              | sort

          else

            echo "Third-party directory does not exist."

          fi

      # ======================================================================
      # 11. 从第三方 Makefile 提取真实 Package 名称
      #
      # 关键：
      #
      # 不再手工猜：
      #
      #   luci-app-xxx
      #
      # 而是从：
      #
      #   define Package/xxx
      #
      # 自动读取。
      # ======================================================================

      - name: Detect third-party package names
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          rm -f /tmp/third-party-packages.txt

          touch /tmp/third-party-packages.txt

          if [[ -d "${THIRD_PARTY_DIR}" ]]; then

            while IFS= read -r makefile; do

              awk '
                /^define Package\// {
                  name=$0
                  sub(/^define Package\//, "", name)
                  print name
                }
              ' "${makefile}" \
              >> /tmp/third-party-packages.txt

            done < <(
              find \
                "${THIRD_PARTY_DIR}" \
                -type f \
                -name Makefile \
                -print \
                | sort
            )

          fi

          sort -u \
            /tmp/third-party-packages.txt \
            -o /tmp/third-party-packages.txt

          echo
          echo "============================================================"
          echo " Detected third-party packages"
          echo "============================================================"

          cat /tmp/third-party-packages.txt

          if [[ ! -s /tmp/third-party-packages.txt ]]; then
            echo
            echo "ERROR: No third-party packages detected."
            exit 1
          fi

      # ======================================================================
      # 12. 将第三方 package 自动加入 .config
      #
      # 这里不写死 package 名称。
      #
      # 所有实际 Makefile 中存在的 Package/<name>
      # 都自动设置为：
      #
      #   CONFIG_PACKAGE_<name>=y
      #
      # 这样 OpenWrt 后面的 make world 会真正把它们编译进去。
      # ======================================================================

      - name: Enable detected third-party packages
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          while IFS= read -r package; do

            [[ -z "${package}" ]] && continue

            echo "Enabling: ${package}"

            ./scripts/config \
              --enable \
              "CONFIG_PACKAGE_${package}"

          done < /tmp/third-party-packages.txt

      # ======================================================================
      # 13. 处理目标平台
      # ======================================================================

      - name: Configure x86-64 target
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          ./scripts/config \
            --set-val \
            CONFIG_TARGET_x86 \
            y

          ./scripts/config \
            --set-val \
            CONFIG_TARGET_x86_64 \
            y

      # ======================================================================
      # 14. defconfig
      #
      # 现在第三方 package 已经进入 .config。
      # ======================================================================

      - name: Run OpenWrt defconfig
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          make defconfig

      # ======================================================================
      # 15. 显示第三方配置
      # ======================================================================

      - name: Verify selected third-party packages
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          echo
          echo "============================================================"
          echo " Selected third-party packages"
          echo "============================================================"

          while IFS= read -r package; do

            [[ -z "${package}" ]] && continue

            if grep -q "^CONFIG_PACKAGE_${package}=y" .config; then

              echo "OK: ${package}"

            else

              echo "MISSING FROM CONFIG: ${package}"

            fi

          done < /tmp/third-party-packages.txt

      # ======================================================================
      # 16. 下载所有源码
      # ======================================================================

      - name: Download OpenWrt sources
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          make download \
            -j"${JOBS}" \
            V=s

      # ======================================================================
      # 17. 清理旧 package 编译结果
      #
      # 防止出现：
      #
      #   hysteria 2.9.2
      #   hysteria 2.9.3
      #
      #   daed r1
      #   daed r7
      #
      # 等旧版本混杂。
      # ======================================================================

      - name: Clean package build output
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          rm -rf \
            bin/packages \
            bin/targets

          mkdir -p bin

      # ======================================================================
      # 18. 重新生成配置
      # ======================================================================

      - name: Refresh final configuration
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          make defconfig

      # ======================================================================
      # 19. 编译整个 OpenWrt
      #
      # 不再：
      #
      #   make package/third-party/compile
      #
      # 因为 package/third-party 不是一个合法的统一 package target。
      #
      # 现在所有 CONFIG_PACKAGE_xxx=y 的 package
      # 由 OpenWrt Buildroot 自动处理。
      # ======================================================================

      - name: Build OpenWrt x86-64
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          make \
            -j"${JOBS}" \
            V=s

      # ======================================================================
      # 20. 显示所有生成 APK
      # ======================================================================

      - name: List generated APK packages
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          echo
          echo "============================================================"
          echo " Generated APK packages"
          echo "============================================================"

          find \
            bin/packages \
            -type f \
            -name '*.apk' \
            -printf '%p\n' \
            | sort

      # ======================================================================
      # 21. 验证第三方 APK
      #
      # 注意：
      #
      # apk-package-list.sh 如果使用上一版：
      #
      #   REQUIRED_PACKAGES
      #
      # 那些包名会按照：
      #
      #   package-name-*.apk
      #
      # 判断。
      #
      # 不检查版本号。
      # ======================================================================

      - name: Verify third-party APK packages
        shell: bash
        run: |
          set -eux

          chmod +x \
            "${GITHUB_WORKSPACE}/scripts/apk-package-list.sh"

          OPENWRT_ROOT="${OPENWRT_ROOT}" \
          APK_ROOT="${OPENWRT_ROOT}/bin/packages" \
            "${GITHUB_WORKSPACE}/scripts/apk-package-list.sh"

      # ======================================================================
      # 22. 收集固件
      # ======================================================================

      - name: Collect firmware
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          rm -rf \
            "${GITHUB_WORKSPACE}/release"

          mkdir -p \
            "${GITHUB_WORKSPACE}/release"

          find \
            bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.img.gz' \
              -o -name '*.img' \
              -o -name '*.vmdk' \
              -o -name '*.vdi' \
              -o -name '*.qcow2' \
              -o -name '*.tar.gz' \
              -o -name '*.manifest' \
              -o -name '*.json' \
              -o -name 'sha256sums' \
            \) \
            -exec cp -f {} \
              "${GITHUB_WORKSPACE}/release/" \;

          echo
          echo "============================================================"
          echo " Firmware artifacts"
          echo "============================================================"

          ls -lah \
            "${GITHUB_WORKSPACE}/release"

      # ======================================================================
      # 23. 收集 APK
      # ======================================================================

      - name: Collect APK packages
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          mkdir -p \
            "${GITHUB_WORKSPACE}/release/apk"

          find \
            bin/packages \
            -type f \
            -name '*.apk' \
            -exec cp -f {} \
              "${GITHUB_WORKSPACE}/release/apk/" \;

          echo
          echo "============================================================"
          echo " APK artifacts"
          echo "============================================================"

          find \
            "${GITHUB_WORKSPACE}/release/apk" \
            -type f \
            -name '*.apk' \
            -printf '%f\n' \
            | sort

      # ======================================================================
      # 24. 生成 APK 清单
      # ======================================================================

      - name: Generate APK manifest
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}"

          find \
            release/apk \
            -type f \
            -name '*.apk' \
            -printf '%f\n' \
            | sort -u \
            > release/third-party-apk-list.txt

          echo
          echo "============================================================"
          echo " Third-party APK manifest"
          echo "============================================================"

          cat \
            release/third-party-apk-list.txt

      # ======================================================================
      # 25. 生成构建信息
      # ======================================================================

      - name: Generate build information
        shell: bash
        run: |
          set -eux

          cd "${OPENWRT_ROOT}"

          {
            echo "OpenWrt build information"
            echo
            echo "Commit:"
            git log -1 --oneline
            echo
            echo "Branch:"
            git branch --show-current
            echo
            echo "Target:"
            echo "x86/64"
            echo
            echo "Date:"
            date -u
            echo
            echo "Third-party packages:"
            cat /tmp/third-party-packages.txt
          } > \
            "${GITHUB_WORKSPACE}/release/build-info.txt"

      # ======================================================================
      # 26. 上传最终 Artifact
      # ======================================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64
          path: |
            release/
          if-no-files-found: error
          retention-days: 14

      # ======================================================================
      # 27. 最终摘要
      # ======================================================================

      - name: Build summary
        shell: bash
        run: |
          set -eux

          echo
          echo "============================================================"
          echo " OpenWrt x86-64 build completed"
          echo "============================================================"
          echo

          echo "Firmware files:"
          find \
            "${GITHUB_WORKSPACE}/release" \
            -maxdepth 1 \
            -type f \
            -printf '  %f\n' \
            | sort

          echo
          echo "APK count:"

          find \
            "${GITHUB_WORKSPACE}/release/apk" \
            -type f \
            -name '*.apk' \
            | wc -l

          echo
          echo "Build finished successfully."
