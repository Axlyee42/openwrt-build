name: Build OpenWrt x86-64 ImageBuilder

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x，留空自动使用 openwrt-version"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "RootFS 大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

  repository_dispatch:
    types:
      - openwrt-release

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # 解析 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}
        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi

          if [ -z "${VERSION}" ] && [ -f openwrt-version ]; then
            VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -n 1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=$(date +%H%M%S)" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "Build date      : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="


      # ==========================================================
      # RootFS
      # ==========================================================

      - name: Configure rootfs size
        shell: bash
        env:
          INPUT_ROOTFS_SIZE: ${{ inputs.rootfs_size }}
        run: |
          set -euo pipefail

          SIZE="${INPUT_ROOTFS_SIZE:-4G}"

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid RootFS size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS: ${SIZE}"
          echo "Partition: ${PARTSIZE} MB"


      # ==========================================================
      # LAN IP
      # ==========================================================

      - name: Configure LAN IP
        shell: bash
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}
        run: |
          set -euo pipefail

          LAN_IP="${INPUT_LAN_IP:-192.168.1.2}"

          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"

          echo "LAN IP: ${LAN_IP}"


      # ==========================================================
      # 安装 ImageBuilder 所需依赖
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bash \
            build-essential \
            curl \
            file \
            gawk \
            gettext \
            git \
            jq \
            libncurses-dev \
            libssl-dev \
            qemu-utils \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd


      # ==========================================================
      # 下载 OpenWrt 官方 ImageBuilder
      # ==========================================================

      - name: Download ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${ARCHIVE}"

          echo
          echo "=========================================="
          echo "OpenWrt ImageBuilder"
          echo "=========================================="
          echo "${URL}"

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            "${URL}" \
            -O "${ARCHIVE}"

          rm -rf imagebuilder

          mkdir -p imagebuilder

          tar \
            --zstd \
            -xf "${ARCHIVE}" \
            --strip-components=1 \
            --no-same-owner \
            -C imagebuilder

          echo
          echo "ImageBuilder contents:"
          ls -lah imagebuilder


      # ==========================================================
      # 检查 ImageBuilder
      # ==========================================================

      - name: Check ImageBuilder
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "ImageBuilder information"
          echo "=========================================="

          make info


      # ==========================================================
      # 关闭第三方 APK 签名强制检查
      #
      # 官方包仍然来自官方仓库；
      # 第三方 Aurora/Bandix/OpenClash 可能使用各自签名。
      #
      # ImageBuilder 的 APK 调用会依据 CONFIG_SIGNATURE_CHECK
      # 决定是否增加 --allow-untrusted。
      # ==========================================================

      - name: Configure APK signature handling
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .config ]; then
            sed -i \
              's/^CONFIG_SIGNATURE_CHECK=y/# CONFIG_SIGNATURE_CHECK is not set/' \
              .config
          fi

          if grep -q '^CONFIG_SIGNATURE_CHECK=y$' .config 2>/dev/null; then
            echo "WARNING: APK signature checking is still enabled."
          else
            echo "APK signature enforcement disabled for custom packages."
          fi


      # ==========================================================
      # 配置 PassWall APK 仓库
      #
      # PassWall 官方二进制仓库提供：
      # passwall_luci
      # passwall_packages
      # passwall2
      #
      # 25.12 + x86_64
      # ==========================================================

      - name: Add PassWall APK repositories
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f repositories ]; then
            echo "ERROR: ImageBuilder repositories file not found."
            exit 1
          fi

          PASSWALL_BASE="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64"

          cat >> repositories <<EOF

          ${PASSWALL_BASE}/passwall_luci/packages.adb
          ${PASSWALL_BASE}/passwall_packages/packages.adb
          ${PASSWALL_BASE}/passwall2/packages.adb
          EOF

          echo
          echo "Final repositories:"
          cat repositories


      # ==========================================================
      # PassWall key
      # ==========================================================

      - name: Add PassWall key
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p keys

          wget \
            --retry-connrefused \
            --tries=5 \
            https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub \
            -O keys/openwrt-passwall-build.pem

          echo "PassWall key:"
          ls -lh keys/openwrt-passwall-build.pem


      # ==========================================================
      # 本地 APK 目录
      #
      # ImageBuilder 25.12 会在 make image 时自动生成
      # packages/packages.adb。
      #
      # 不再提前调用：
      # make package_list
      #
      # 这是解决你当前错误的关键。
      # ==========================================================

      - name: Prepare local APK directory
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p packages

          echo
          echo "Local APK directory ready."

          ls -lah packages


      # ==========================================================
      # Aurora APK
      #
      # Aurora 官方 release 提供 OpenWrt 25.12+ APK。
      # ==========================================================

      - name: Download Aurora APK
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/eamonxg/luci-theme-aurora/releases/latest"

          curl \
            -fsSL \
            "${API}" \
            -o /tmp/aurora.json

          echo
          echo "Aurora release:"
          jq -r '.tag_name' /tmp/aurora.json

          jq -r '
            .assets[]
            | select(.name | endswith(".apk"))
            | .browser_download_url
          ' /tmp/aurora.json \
            > /tmp/aurora-urls

          if [ ! -s /tmp/aurora-urls ]; then
            echo "ERROR: No Aurora APK assets found."
            jq -r '.assets[].name' /tmp/aurora.json
            exit 1
          fi

          while IFS= read -r URL; do
            echo "Downloading: ${URL}"

            wget \
              --retry-connrefused \
              --tries=5 \
              "${URL}" \
              -P packages
          done < /tmp/aurora-urls


      # ==========================================================
      # Bandix backend
      # ==========================================================

      - name: Download Bandix APK
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/timsaya/openwrt-bandix/releases/latest"

          curl \
            -fsSL \
            "${API}" \
            -o /tmp/bandix.json

          echo
          echo "Bandix release:"
          jq -r '.tag_name' /tmp/bandix.json

          URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".apk"))
              | select(
                  (.name | test("x86_64|x86-64"; "i"))
                )
              | .browser_download_url
            ' /tmp/bandix.json |
            head -1
          )"

          if [ -z "${URL}" ]; then
            echo "ERROR: x86_64 Bandix APK not found."

            echo
            echo "Available assets:"
            jq -r '.assets[].name' /tmp/bandix.json

            exit 1
          fi

          wget \
            --retry-connrefused \
            --tries=5 \
            "${URL}" \
            -P packages


      # ==========================================================
      # Bandix LuCI
      # ==========================================================

      - name: Download Bandix LuCI APK
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/timsaya/luci-app-bandix/releases/latest"

          curl \
            -fsSL \
            "${API}" \
            -o /tmp/bandix-luci.json

          echo
          echo "Bandix LuCI release:"
          jq -r '.tag_name' /tmp/bandix-luci.json

          URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".apk"))
              | select(.name | startswith("luci-app-bandix"))
              | .browser_download_url
            ' /tmp/bandix-luci.json |
            head -1
          )"

          if [ -z "${URL}" ]; then
            echo "ERROR: luci-app-bandix APK not found."

            echo
            jq -r '.assets[].name' /tmp/bandix-luci.json

            exit 1
          fi

          wget \
            --retry-connrefused \
            --tries=5 \
            "${URL}" \
            -P packages


      # ==========================================================
      # OpenClash APK
      #
      # 官方 workflow 当前确实生成 APK。
      # ==========================================================

      - name: Download OpenClash APK
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/vernesong/OpenClash/releases/latest"

          curl \
            -fsSL \
            "${API}" \
            -o /tmp/openclash.json

          echo
          echo "OpenClash release:"
          jq -r '.tag_name' /tmp/openclash.json

          URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".apk"))
              | select(.name | startswith("luci-app-openclash"))
              | .browser_download_url
            ' /tmp/openclash.json |
            head -1
          )"

          if [ -z "${URL}" ]; then
            echo "ERROR: OpenClash APK not found."

            echo
            jq -r '.assets[].name' /tmp/openclash.json

            exit 1
          fi

          wget \
            --retry-connrefused \
            --tries=5 \
            "${URL}" \
            -P packages


      # ==========================================================
      # 检查本地 APK
      # ==========================================================

      - name: Show local APK packages
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Local APK packages"
          echo "=========================================="

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" |
            sort

          COUNT="$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name "*.apk" |
            wc -l
          )"

          echo
          echo "Local APK count: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "ERROR: No local APK files."
            exit 1
          fi


      # ==========================================================
      # 自定义 files
      # ==========================================================

      - name: Install custom files
        shell: bash
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}
        run: |
          set -euo pipefail

          if [ -z "${WAN1_USER:-}" ] || [ -z "${WAN1_PASS:-}" ]; then
            echo "ERROR: WAN1_USER / WAN1_PASS is missing."
            exit 1
          fi

          if [ -z "${WAN2_USER:-}" ] || [ -z "${WAN2_PASS:-}" ]; then
            echo "ERROR: WAN2_USER / WAN2_PASS is missing."
            exit 1
          fi

          rm -rf imagebuilder/files

          mkdir -p imagebuilder/files

          rsync -a \
            files/ \
            imagebuilder/files/

          mkdir -p \
            imagebuilder/files/etc/config \
            imagebuilder/files/etc/uci-defaults


          # ------------------------------------------------------
          # network
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/config/network <<EOF
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'

          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 '1'

          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 '1'

          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'
          EOF


          # ------------------------------------------------------
          # DHCP + IPv6
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/config/dhcp <<'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'

          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'

          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          EOF


          # ------------------------------------------------------
          # 默认中文
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/uci-defaults/99-default-language <<'EOF'
          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0
          EOF

          chmod +x \
            imagebuilder/files/etc/uci-defaults/99-default-language


          echo
          echo "Custom files:"
          find imagebuilder/files \
            -type f \
            -print


      # ==========================================================
      # 读取软件包列表
      # ==========================================================

      - name: Load custom package list
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f shell/apk-custom-packages.sh ]; then
            echo "ERROR: shell/apk-custom-packages.sh not found."
            exit 1
          fi

          source shell/apk-custom-packages.sh

          if [ -z "${CUSTOM_PACKAGES:-}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty."
            exit 1
          fi

          printf '%s\n' "${CUSTOM_PACKAGES}" \
            | tr ' ' '\n' \
            | sed '/^[[:space:]]*$/d' \
            | sort -u \
            > selected-packages.txt

          echo
          echo "=========================================="
          echo "Requested packages"
          echo "=========================================="

          cat selected-packages.txt


      # ==========================================================
      # 关键：
      #
      # 不再调用：
      #   make package_list
      #
      # ImageBuilder 在 make image 时自己：
      #
      #   初始化 APK
      #   检查 packages.adb
      #   生成 package index
      #   更新 repository
      #   解析依赖
      #
      # ==========================================================

      - name: Build UEFI image
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          PACKAGES="$(
            tr '\n' ' ' < "${GITHUB_WORKSPACE}/selected-packages.txt"
          )"

          echo
          echo "=========================================="
          echo "Building OpenWrt UEFI"
          echo "=========================================="

          echo
          echo "Packages:"
          echo "${PACKAGES}"

          echo
          echo "RootFS:"
          echo "${ROOTFS_PARTSIZE} MB"

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            BIN_DIR="${GITHUB_WORKSPACE}/output" \
            EXTRA_IMAGE_NAME="${ROOTFS_SIZE}-${BUILD_DATE}"


      # ==========================================================
      # 查找 UEFI 镜像
      # ==========================================================

      - name: Locate UEFI image
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Generated images"
          echo "=========================================="

          find output \
            -type f \
            -maxdepth 3 \
            -print


          IMAGE="$(
            find output \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -n 1
          )"


          if [ -z "${IMAGE}" ]; then
            echo
            echo "ERROR: UEFI image not found."

            find output \
              -type f \
              -print

            exit 1
          fi


          FINAL_IMAGE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


          mv \
            "${IMAGE}" \
            "${FINAL_IMAGE}"


          echo "UEFI_IMAGE=${FINAL_IMAGE}" >> "${GITHUB_ENV}"


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        shell: bash
        run: |
          set -euo pipefail

          RAW="/tmp/openwrt-uefi.raw"

          QCOW2="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


          gzip \
            -dc \
            "${UEFI_IMAGE}" \
            > "${RAW}"


          qemu-img convert \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            "${RAW}" \
            "${QCOW2}"


          rm -f "${RAW}"


          test -s "${QCOW2}"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: output
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            *.img.gz \
            *.qcow2 \
            > sha256sums.txt

          test -s sha256sums.txt

          cat sha256sums.txt


      # ==========================================================
      # Build information
      # ==========================================================

      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/build-info.txt <<EOF
          ==========================================
          OpenWrt Custom ImageBuilder Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          ImageBuilder:
          Official OpenWrt

          RootFS:
          ${ROOTFS_SIZE}

          RootFS partition:
          ${ROOTFS_PARTSIZE} MB

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME}

          LAN:
          ${LAN_IP}

          Network:
          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          IPv6:
          Enabled

          Images:
          UEFI
          QCOW2
          EOF


      # ==========================================================
      # 包清单
      # ==========================================================

      - name: Save package list
        run: |
          set -euo pipefail

          cp \
            selected-packages.txt \
            output/selected-packages.txt


      # ==========================================================
      # 最终检查
      # ==========================================================

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Final output"
          echo "=========================================="

          ls -lh output


          UEFI_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          QCOW2_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


          test -s "${UEFI_FILE}"
          test -s "${QCOW2_FILE}"
          test -s output/sha256sums.txt
          test -s output/build-info.txt
          test -s output/selected-packages.txt


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          TAG="v${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${GITHUB_RUN_NUMBER}"

          TITLE="OpenWrt ${OPENWRT_VERSION} x86-64 ${ROOTFS_SIZE} ${BUILD_DATE}"


          cat > release-notes.md <<EOF
          # OpenWrt ${OPENWRT_VERSION} x86-64

          ## Build

          - OpenWrt: \`${OPENWRT_VERSION}\`
          - Target: \`x86-64\`
          - ImageBuilder: Official OpenWrt
          - RootFS: \`${ROOTFS_SIZE}\`
          - Build date: \`${BUILD_DATE}\`

          ## Network

          - \`eth0\` → WAN / PPPoE
          - \`eth1\` → WANB / PPPoE
          - \`eth2\` → LAN
          - \`eth3\` → LAN
          - \`eth4\` → LAN
          - \`eth5\` → LAN

          - LAN IP: \`${LAN_IP}\`
          - IPv6: Enabled

          ## Images

          - UEFI
          - QCOW2

          ## Packages

          See \`selected-packages.txt\`.

          EOF


          gh release create \
            "${TAG}" \
            output/*.img.gz \
            output/*.qcow2 \
            output/sha256sums.txt \
            output/build-info.txt \
            output/selected-packages.txt \
            --title "${TITLE}" \
