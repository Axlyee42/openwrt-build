name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x，留空使用 openwrt-version"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "RootFS 大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

  repository_dispatch:
    types:
      - openwrt-release

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # ==========================================================
      # Resolve OpenWrt version
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}
        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi

          if [ -z "${VERSION}" ] && [ -f openwrt-version ]; then
            VERSION="$(tr -d '[:space:]' < openwrt-version)"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -n 1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" |
            grep -Eq '^25\.12\.[0-9]+$'
          then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=$(date +%H%M%S)" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt : ${VERSION}"
          echo "Date    : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="


      # ==========================================================
      # RootFS
      # ==========================================================

      - name: Configure RootFS
        shell: bash
        env:
          INPUT_SIZE: ${{ inputs.rootfs_size }}
        run: |
          set -euo pipefail

          SIZE="${INPUT_SIZE:-4G}"

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid RootFS size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS: ${SIZE}"
          echo "Partition: ${PARTSIZE} MB"


      # ==========================================================
      # LAN
      # ==========================================================

      - name: Configure LAN
        shell: bash
        env:
          INPUT_LAN_IP: ${{ inputs.lan_ip }}
        run: |
          set -euo pipefail

          LAN_IP="${INPUT_LAN_IP:-192.168.1.2}"

          if ! printf '%s\n' "${LAN_IP}" |
            grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
          then
            echo "ERROR: Invalid LAN IP: ${LAN_IP}"
            exit 1
          fi

          echo "LAN_IP=${LAN_IP}" >> "${GITHUB_ENV}"

          echo "LAN IP: ${LAN_IP}"


      # ==========================================================
      # PPPoE Secrets
      # ==========================================================

      - name: Validate PPPoE secrets
        shell: bash
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}
        run: |
          set -euo pipefail

          for NAME in \
            WAN1_USER \
            WAN1_PASS \
            WAN2_USER \
            WAN2_PASS
          do
            if [ -z "${!NAME:-}" ]; then
              echo "ERROR: GitHub Secret ${NAME} is missing."
              exit 1
            fi
          done

          echo "PPPoE secrets are configured."


      # ==========================================================
      # Dependencies
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            file \
            git \
            jq \
            qemu-utils \
            rsync \
            wget \
            zstd


      # ==========================================================
      # Download official ImageBuilder
      # ==========================================================

      - name: Download official ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${ARCHIVE}"

          echo
          echo "=========================================="
          echo "Downloading ImageBuilder"
          echo "=========================================="

          echo "${URL}"

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            "${URL}" \
            -O "${ARCHIVE}"

          rm -rf imagebuilder

          mkdir -p imagebuilder

          tar \
            --zstd \
            -xf "${ARCHIVE}" \
            --strip-components=1 \
            --no-same-owner \
            -C imagebuilder

          echo
          echo "ImageBuilder ready:"
          ls -lah imagebuilder


      # ==========================================================
      # ImageBuilder info
      # ==========================================================

      - name: Check ImageBuilder
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          make info


      # ==========================================================
      # PassWall repository
      # ==========================================================

      - name: Configure PassWall repository
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f repositories ]; then
            echo "ERROR: ImageBuilder repositories file not found."
            exit 1
          fi

          PASSWALL_BASE="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64"

          printf '%s\n' \
            "${PASSWALL_BASE}/passwall_luci/packages.adb" \
            "${PASSWALL_BASE}/passwall_packages/packages.adb" \
            "${PASSWALL_BASE}/passwall2/packages.adb" \
            >> repositories

          mkdir -p keys

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            https://master.dl.sourceforge.net/project/openwrt-passwall-build/apk.pub \
            -O keys/openwrt-passwall-build.pem

          echo
          echo "PassWall repositories:"
          tail -n 10 repositories


      # ==========================================================
      # wukongdaily APK
      # ==========================================================

      - name: Download wukongdaily APK repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third-party-apk

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk

          if [ ! -d third-party-apk/run/x86 ]; then
            echo "ERROR: third-party-apk/run/x86 not found."
            exit 1
          fi

          echo
          echo "Available wukongdaily x86 APK:"
          find third-party-apk/run/x86 \
            -type f \
            -name "*.apk" \
            -printf "%P\n" |
          sort


      # ==========================================================
      # Prepare wukongdaily packages
      # ==========================================================

      - name: Prepare wukongdaily x86 APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf imagebuilder/packages

          mkdir -p imagebuilder/packages

          find third-party-apk/run/x86 \
            -type f \
            -name "*.apk" \
            -exec cp -v {} imagebuilder/packages/ \;

          APK_COUNT="$(
            find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name "*.apk" |
            wc -l
          )"

          echo
          echo "Local APK count: ${APK_COUNT}"

          if [ "${APK_COUNT}" -eq 0 ]; then
            echo "ERROR: No local APK packages prepared."
            exit 1
          fi

          echo
          echo "Prepared APK packages:"
          find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" |
          sort


      # ==========================================================
      # OpenClash
      # ==========================================================

      - name: Prepare OpenClash APK
        shell: bash
        run: |
          set -euo pipefail

          LOCAL="$(
            find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name 'luci-app-openclash-*.apk' \
              -print |
            sort -V |
            tail -n 1
          )"

          if [ -n "${LOCAL}" ]; then
            echo "OpenClash APK already exists:"
            echo "${LOCAL}"
            exit 0
          fi

          echo "Downloading OpenClash official APK..."

          curl \
            -fsSL \
            https://api.github.com/repos/vernesong/OpenClash/releases/latest \
            -o /tmp/openclash.json

          URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".apk"))
              | select(.name | startswith("luci-app-openclash-"))
              | .browser_download_url
            ' /tmp/openclash.json |
            head -n 1
          )"

          if [ -z "${URL}" ]; then
            echo "ERROR: OpenClash APK not found."

            echo
            echo "Available APK/IPK:"
            jq -r '
              .assets[]
              | select(
                  (.name | endswith(".apk"))
                  or
                  (.name | endswith(".ipk"))
                )
              | .name
            ' /tmp/openclash.json

            exit 1
          fi

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            "${URL}" \
            -P imagebuilder/packages

          ls -lh imagebuilder/packages/luci-app-openclash-*.apk


      # ==========================================================
      # Prepare custom files
      # ==========================================================

      - name: Prepare custom files
        shell: bash
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}
        run: |
          set -euo pipefail

          if [ -z "${WAN1_USER:-}" ] ||
             [ -z "${WAN1_PASS:-}" ] ||
             [ -z "${WAN2_USER:-}" ] ||
             [ -z "${WAN2_PASS:-}" ]
          then
            echo "ERROR: PPPoE secrets are incomplete."
            exit 1
          fi

          mkdir -p \
            imagebuilder/files/etc/config \
            imagebuilder/files/etc/uci-defaults

          if [ -d files ]; then
            rsync -a \
              files/ \
              imagebuilder/files/
          fi


          # ------------------------------------------------------
          # network
          # ------------------------------------------------------

          printf '%s\n' \
            "config interface 'loopback'" \
            "    option device 'lo'" \
            "    option proto 'static'" \
            "    option ipaddr '127.0.0.1'" \
            "    option netmask '255.0.0.0'" \
            "" \
            "config device" \
            "    option name 'br-lan'" \
            "    option type 'bridge'" \
            "    list ports 'eth2'" \
            "    list ports 'eth3'" \
            "    list ports 'eth4'" \
            "    list ports 'eth5'" \
            "" \
            "config interface 'lan'" \
            "    option device 'br-lan'" \
            "    option proto 'static'" \
            "    option ipaddr '${LAN_IP}'" \
            "    option netmask '255.255.255.0'" \
            "    option ip6assign '64'" \
            "" \
            "config interface 'wan'" \
            "    option device 'eth0'" \
            "    option proto 'pppoe'" \
            "    option username '${WAN1_USER}'" \
            "    option password '${WAN1_PASS}'" \
            "    option ipv6 '1'" \
            "" \
            "config interface 'wan6'" \
            "    option device '@wan'" \
            "    option proto 'dhcpv6'" \
            "    option reqaddress 'try'" \
            "    option reqprefix 'auto'" \
            "" \
            "config interface 'wanb'" \
            "    option device 'eth1'" \
            "    option proto 'pppoe'" \
            "    option username '${WAN2_USER}'" \
            "    option password '${WAN2_PASS}'" \
            "    option ipv6 '1'" \
            "" \
            "config interface 'wanb6'" \
            "    option device '@wanb'" \
            "    option proto 'dhcpv6'" \
            "    option reqaddress 'try'" \
            "    option reqprefix 'auto'" \
            > imagebuilder/files/etc/config/network


          # ------------------------------------------------------
          # dhcp
          # ------------------------------------------------------

          printf '%s\n' \
            "config dnsmasq" \
            "    option domainneeded '1'" \
            "    option boguspriv '1'" \
            "    option localise_queries '1'" \
            "    option rebind_protection '1'" \
            "    option local '/lan/'" \
            "    option domain 'lan'" \
            "    option expandhosts '1'" \
            "    option authoritative '1'" \
            "    option readethers '1'" \
            "    option leasefile '/tmp/dhcp.leases'" \
            "    option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'" \
            "" \
            "config dhcp 'lan'" \
            "    option interface 'lan'" \
            "    option start '100'" \
            "    option limit '150'" \
            "    option leasetime '12h'" \
            "    option dhcpv4 'server'" \
            "    option dhcpv6 'server'" \
            "    option ra 'server'" \
            "    option ra_management '1'" \
            "" \
            "config dhcp 'wan'" \
            "    option interface 'wan'" \
            "    option ignore '1'" \
            "" \
            "config dhcp 'wanb'" \
            "    option interface 'wanb'" \
            "    option ignore '1'" \
            "" \
            "config odhcpd 'odhcpd'" \
            "    option maindhcp '0'" \
            "    option leasefile '/tmp/hosts/odhcpd'" \
            "    option leasetrigger '/usr/sbin/odhcpd-update'" \
            "    option loglevel '4'" \
            > imagebuilder/files/etc/config/dhcp


          # ------------------------------------------------------
          # 默认中文
          # ------------------------------------------------------

          printf '%s\n' \
            '#!/bin/sh' \
            "" \
            "uci -q set luci.main.lang='zh_cn'" \
            "uci -q commit luci" \
            "" \
            "exit 0" \
            > imagebuilder/files/etc/uci-defaults/99-default-language

          chmod +x \
            imagebuilder/files/etc/uci-defaults/99-default-language


          echo
          echo "Custom files:"
          find imagebuilder/files \
            -type f \
            -print


      # ==========================================================
      # Load custom package list
      # ==========================================================

      - name: Load custom package list
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f shell/apk-custom-packages.sh ]; then
            echo "ERROR: shell/apk-custom-packages.sh not found."
            exit 1
          fi

          source shell/apk-custom-packages.sh

          printf '%s\n' "${CUSTOM_PACKAGES:-}" |
            tr ' ' '\n' |
            sed '/^[[:space:]]*$/d' \
            > /tmp/custom-packages

          echo
          echo "Custom package list:"
          cat /tmp/custom-packages


      # ==========================================================
      # Final package list
      # ==========================================================

      - name: Build final package list
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            selected-packages.txt \
            missing-packages.txt

          touch \
            selected-packages.txt \
            missing-packages.txt


          # 官方 OpenWrt 包
          printf '%s\n' \
            "luci" \
            "luci-i18n-base-zh-cn" \
            "ppp" \
            "ppp-mod-pppoe" \
            "kmod-pppoe" \
            "luci-proto-ppp" \
            "luci-proto-ipv6" \
            "odhcp6c" \
            "odhcpd-ipv6only" \
            "mwan3" \
            "luci-app-mwan3" \
            "luci-i18n-mwan3-zh-cn" \
            "luci-app-ttyd" \
            "luci-i18n-ttyd-zh-cn" \
            "luci-app-upnp" \
            "luci-i18n-upnp-zh-cn" \
            "luci-app-openclash" \
            "luci-app-passwall" \
            "luci-i18n-passwall-zh-cn" \
            >> selected-packages.txt


          # 用户清单
          while IFS= read -r PACKAGE; do
            [ -z "${PACKAGE}" ] && continue

            case "${PACKAGE}" in
              ipv6|kmod-ipv6)
                echo "Ignoring invalid package: ${PACKAGE}"
                echo "${PACKAGE}" >> missing-packages.txt
                ;;
              *)
                printf '%s\n' "${PACKAGE}" >> selected-packages.txt
                ;;
            esac
          done < /tmp/custom-packages


          sort -u \
            selected-packages.txt \
            -o selected-packages.txt


          # ------------------------------------------------------
          # 当前没有本地 APK 的可选包
          # ------------------------------------------------------

          OPTIONAL_PACKAGES="
luci-app-filebrowser-go
luci-i18n-filebrowser-go-zh-cn
luci-app-vlmcsd
luci-i18n-vlmcsd-zh-cn
luci-app-autoreboot
luci-i18n-autoreboot-zh-cn
luci-i18n-timewol-zh-cn
"


          for PACKAGE in ${OPTIONAL_PACKAGES}; do

            if ! grep -Fxq "${PACKAGE}" selected-packages.txt; then
              continue
            fi

            if find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name "${PACKAGE}-*.apk" \
              -print \
              -quit |
              grep -q .
            then
              echo "Found local APK: ${PACKAGE}"
              continue
            fi

            TMP_FILE="$(mktemp)"

            grep -Fxv \
              "${PACKAGE}" \
              selected-packages.txt \
              > "${TMP_FILE}" ||
              true

            mv \
              "${TMP_FILE}" \
              selected-packages.txt

            echo "${PACKAGE}" \
              >> missing-packages.txt

          done


          sort -u \
            missing-packages.txt \
            -o missing-packages.txt


          echo
          echo "=========================================="
          echo "Selected packages"
          echo "=========================================="

          cat selected-packages.txt


          echo
          echo "=========================================="
          echo "Missing packages"
          echo "=========================================="

          if [ -s missing-packages.txt ]; then
            cat missing-packages.txt
          else
            echo "None"
          fi


      # ==========================================================
      # Verify required third-party APKs
      # ==========================================================

      - name: Verify required third-party APKs
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_PACKAGES="
luci-theme-aurora
luci-app-aurora-config
luci-i18n-aurora-config-zh-cn
bandix
luci-app-bandix
luci-i18n-bandix-zh-cn
luci-app-run
luci-app-openclash
"


          FAILED=0

          for PACKAGE in ${REQUIRED_PACKAGES}; do
            if find imagebuilder/packages \
              -maxdepth 1 \
              -type f \
              -name "${PACKAGE}-*.apk" \
              -print \
              -quit |
              grep -q .
            then
              echo "OK: ${PACKAGE}"
            else
              echo "ERROR: Required APK missing: ${PACKAGE}"
              FAILED=1
            fi
          done

          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi


      # ==========================================================
      # Build
      # ==========================================================

      - name: Build UEFI image
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "${GITHUB_WORKSPACE}/output"

          PACKAGES="$(
            tr '\n' ' ' \
              < "${GITHUB_WORKSPACE}/selected-packages.txt"
          )"

          echo
          echo "=========================================="
          echo "Building OpenWrt"
          echo "=========================================="

          echo "OpenWrt: ${OPENWRT_VERSION}"
          echo "RootFS: ${ROOTFS_PARTSIZE} MB"

          echo
          echo "Packages:"
          echo "${PACKAGES}"

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            BIN_DIR="${GITHUB_WORKSPACE}/output" \
            EXTRA_IMAGE_NAME="${ROOTFS_SIZE}-${BUILD_DATE}"


      # ==========================================================
      # UEFI
      # ==========================================================

      - name: Prepare UEFI image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find output \
              -type f \
              -name '*combined-efi.img.gz' |
            head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI image not found."

            find output \
              -type f \
              -print

            exit 1
          fi

          FINAL="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          mv \
            "${IMAGE}" \
            "${FINAL}"

          echo "UEFI_IMAGE=${FINAL}" >> "${GITHUB_ENV}"

          ls -lh "${FINAL}"


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        shell: bash
        run: |
          set -euo pipefail

          QCOW2="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"

          gzip \
            -dc \
            "${UEFI_IMAGE}" \
            > /tmp/openwrt.raw

          qemu-img convert \
            -p \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            /tmp/openwrt.raw \
            "${QCOW2}"

          rm -f /tmp/openwrt.raw

          test -s "${QCOW2}"

          ls -lh "${QCOW2}"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: output
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            *.img.gz \
            *.qcow2 \
            > sha256sums.txt

          cat sha256sums.txt


      # ==========================================================
      # Build info
      # ==========================================================

      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            "OpenWrt Custom ImageBuilder Build" \
            "" \
            "OpenWrt: ${OPENWRT_VERSION}" \
            "Target: x86-64" \
            "ImageBuilder: Official OpenWrt" \
            "RootFS: ${ROOTFS_SIZE}" \
            "RootFS partition: ${ROOTFS_PARTSIZE} MB" \
            "Build date: ${BUILD_DATE}" \
            "Build time: ${BUILD_TIME}" \
            "LAN: ${LAN_IP}" \
            "" \
            "Network:" \
            "eth0 = WAN / PPPoE" \
            "eth1 = WANB / PPPoE" \
            "eth2 = LAN" \
            "eth3 = LAN" \
            "eth4 = LAN" \
            "eth5 = LAN" \
            "" \
            "IPv6: Enabled" \
            "" \
            "Images:" \
            "UEFI" \
            "QCOW2" \
            > output/build-info.txt


      # ==========================================================
      # Package lists
      # ==========================================================

      - name: Save package lists
        shell: bash
        run: |
          set -euo pipefail

          cp \
            selected-packages.txt \
            output/selected-packages.txt

          cp \
            missing-packages.txt \
            output/missing-packages.txt


      # ==========================================================
      # Verify output
      # ==========================================================

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail

          UEFI_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          QCOW2_FILE="output/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"

          test -s "${UEFI_FILE}"
          test -s "${QCOW2_FILE}"
          test -s output/sha256sums.txt
          test -s output/build-info.txt
          test -s output/selected-packages.txt
          test -s output/missing-packages.txt

          echo
          echo "=========================================="
          echo "Final files"
          echo "=========================================="

          ls -lh output


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="v${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${GITHUB_RUN_NUMBER}"

          TITLE="OpenWrt ${OPENWRT_VERSION} x86-64 ${ROOTFS_SIZE} ${BUILD_DATE}"

          printf '%s\n' \
            "# OpenWrt ${OPENWRT_VERSION} x86-64" \
            "" \
            "## Build" \
            "" \
            "- OpenWrt: \`${OPENWRT_VERSION}\`" \
            "- Target: \`x86-64\`" \
            "- ImageBuilder: Official OpenWrt" \
            "- RootFS: \`${ROOTFS_SIZE}\`" \
            "- Build date: \`${BUILD_DATE}\`" \
            "" \
            "## Network" \
            "" \
            "- \`eth0\` → WAN / PPPoE" \
            "- \`eth1\` → WANB / PPPoE" \
            "- \`eth2\` → LAN" \
            "- \`eth3\` → LAN" \
            "- \`eth4\` → LAN" \
            "- \`eth5\` → LAN" \
            "- LAN IP: \`${LAN_IP}\`" \
            "- IPv6: Enabled" \
            "" \
            "## Images" \
            "" \
            "- UEFI" \
            "- QCOW2" \
            "" \
            "See selected-packages.txt and missing-packages.txt for package status." \
            > release-notes.md

          gh release create \
            "${TAG}" \
            output/*.img.gz \
            output/*.qcow2 \
            output/sha256sums.txt \
            output/build-info.txt \
            output/selected-packages.txt \
            output/missing-packages.txt \
            --title "${TITLE}" \
            --notes-file release-notes.md
