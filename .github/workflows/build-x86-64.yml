name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本（留空使用 latest-version.txt）'
        required: false
        default: ''
        type: string
      rootfs_size:
        description: '根文件系统大小'
        required: true
        default: '1G'
        type: choice
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
  workflow_call:
    inputs:
      openwrt_version:
        required: false
        type: string
      rootfs_size:
        required: false
        type: string
        default: '1G'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve OpenWrt version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.openwrt_version || github.event.inputs.openwrt_version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(cat latest-version.txt)"
          fi
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download official OpenWrt ImageBuilder
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$url" -o imagebuilder.tar.zst
          mkdir imagebuilder
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1

      - name: Prepare PassWall and DAED feeds
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x shell/prepare-feeds.sh
          shell/prepare-feeds.sh "$VERSION" "imagebuilder/files"

      - name: Prepare default system settings
        run: |
          set -euo pipefail
          mkdir -p imagebuilder/files/etc/config imagebuilder/files/etc/uci-defaults
          cat > imagebuilder/files/etc/config/system <<'EOF'
config system
        option hostname 'OpenWrt'
        option timezone 'CST-8'
        option zonename 'Asia/Shanghai'
EOF
          cat > imagebuilder/files/etc/uci-defaults/99-default-locale <<'EOF'
#!/bin/sh
uci -q set luci.main.lang='zh_cn'
uci -q commit luci
exit 0
EOF
          chmod 0755 imagebuilder/files/etc/uci-defaults/99-default-locale

      - name: Resolve selected APK packages
        run: |
          set -euo pipefail
          chmod +x shell/apk-custom-packages.sh
          PACKAGES="$(shell/apk-custom-packages.sh)"
          printf '%s\n' "$PACKAGES" > selected-packages.txt
          echo "Selected packages:"
          echo "$PACKAGES"

      - name: Build UEFI EXT4 image
        env:
          ROOTFS_SIZE: ${{ inputs.rootfs_size || github.event.inputs.rootfs_size }}
        run: |
          set -euo pipefail
          case "${ROOTFS_SIZE:-1G}" in
            1G) size=1024 ;;
            2G) size=2048 ;;
            3G) size=3072 ;;
            4G) size=4096 ;;
            *) echo 'Invalid rootfs size'; exit 1 ;;
          esac
          cd imagebuilder
          make image \
            PROFILE='generic' \
            PACKAGES="$(cat ../selected-packages.txt)" \
            FILES='files' \
            ROOTFS_PARTSIZE="$size"

      - name: Create QCOW2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y qemu-utils
          img=$(find imagebuilder/bin/targets/x86/64 -type f -name '*ext4-combined-efi.img.gz' | head -1)
          test -n "$img"
          gzip -dc "$img" > openwrt-x86-64-ext4-uefi.img
          qemu-img convert -f raw -O qcow2 -c \
            openwrt-x86-64-ext4-uefi.img openwrt-x86-64.qcow2

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ROOTFS_SIZE: ${{ inputs.rootfs_size || github.event.inputs.rootfs_size }}
        run: |
          set -euo pipefail
          {
            echo "# OpenWrt ${VERSION} x86-64"
            echo
            echo "- 官方 OpenWrt ImageBuilder"
            echo "- x86-64 / UEFI / EXT4"
            echo "- QCOW2"
            echo "- 根文件系统：${ROOTFS_SIZE:-1G}"
            echo "- 默认语言：简体中文"
            echo "- 默认时区：Asia/Shanghai"
            echo "- 软件选择：shell/apk-custom-packages.sh"
            echo "- PassWall APK 源：已加入"
            echo "- DAE/DAED APK 源：已加入"
            echo
            echo "## 本次选择的软件包"
            echo
            sed 's/^/- `/' selected-packages.txt | sed 's/$/`/'
          } > release-notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-${{ steps.version.outputs.version }}
          name: OpenWrt ${{ steps.version.outputs.version }} x86-64
          body_path: release-notes.md
          files: |
            imagebuilder/bin/targets/x86/64/*ext4-combined-efi.img.gz
            openwrt-x86-64-ext4-uefi.img
            openwrt-x86-64.qcow2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
