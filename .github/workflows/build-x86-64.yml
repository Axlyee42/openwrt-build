name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        required: true
        default: "25.12.5"
      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.1.2"
      rootfs_size:
        description: "Firmware size"
        required: true
        type: choice
        default: "1G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"
      filesystem:
        description: "Filesystem"
        required: true
        type: choice
        default: "ext4"
        options:
          - "ext4"
          - "squashfs"
      qcow2:
        description: "Build QCOW2"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version || '25.12.5' }}
      LAN_IP: ${{ inputs.lan_ip || '192.168.1.2' }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size || '1G' }}
      FILESYSTEM: ${{ inputs.filesystem || 'ext4' }}
      BUILD_QCOW2: ${{ inputs.qcow2 == '' && 'true' || inputs.qcow2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          required_cmds=(curl git gzip jq qemu-img tar wget xz zstd)
          missing=()
          for cmd in "${required_cmds[@]}"; do
            if ! command -v "${cmd}" >/dev/null 2>&1; then
              missing+=("${cmd}")
            fi
          done

          echo "Runner: $(uname -a)"
          echo "Missing host tools: ${missing[*]:-none}"

          if ((${#missing[@]})); then
            packages=()
            for cmd in "${missing[@]}"; do
              case "${cmd}" in
                qemu-img) packages+=(qemu-utils) ;;
                xz) packages+=(xz-utils) ;;
                *) packages+=("${cmd}") ;;
              esac
            done
            mapfile -t packages < <(printf '%s\n' "${packages[@]}" | awk 'NF && !seen[$0]++')
            echo "Installing only missing packages: ${packages[*]}"
            timeout 180s sudo apt-get update -o Acquire::Retries=2
            timeout 180s sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi

          for cmd in "${required_cmds[@]}"; do
            command -v "${cmd}" >/dev/null 2>&1 || { echo "ERROR: missing command: ${cmd}" >&2; exit 1; }
          done
          echo "Host tools ready."
          qemu-img --version | head -n 1
          zstd --version | head -n 1

      - name: Download OpenWrt x86-64 ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"
          WORK="${RUNNER_TEMP}/imagebuilder"
          rm -rf "${WORK}"
          mkdir -p "${WORK}"
          cd "${WORK}"
          wget -q --show-progress --timeout=30 --tries=3 "${BASE_URL}/${ARCHIVE}"
          tar --zstd -xf "${ARCHIVE}"
          IMAGEBUILDER_DIR="$(find "${WORK}" -mindepth 1 -maxdepth 1 -type d -name 'openwrt-imagebuilder-*' -print -quit)"
          test -n "${IMAGEBUILDER_DIR}"
          test -f "${IMAGEBUILDER_DIR}/Makefile"
          IMAGEBUILDER_DIR="$(cd "${IMAGEBUILDER_DIR}" && pwd)"
          echo "IMAGEBUILDER_DIR=${IMAGEBUILDER_DIR}" >> "${GITHUB_ENV}"
          echo "ImageBuilder: ${IMAGEBUILDER_DIR}"

      - name: Load third-party APK package list
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/apk-custom-packages.sh
          source scripts/apk-custom-packages.sh
          CUSTOM_PACKAGES="$(printf '%s\n' "${CUSTOM_PACKAGES:-}" | tr '[:space:]' '\n' | awk 'NF && !seen[$0]++' | paste -sd ' ' -)"
          test -n "${CUSTOM_PACKAGES}"
          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "${GITHUB_ENV}"
          echo "Third-party APK package list:"
          printf '%s\n' "${CUSTOM_PACKAGES}" | tr ' ' '\n'

      - name: Download and prepare third-party APK repository
        shell: bash
        run: |
          set -euo pipefail
          REPO_DIR="${RUNNER_TEMP}/wukongdaily-apk"
          EXTRA_DIR="${RUNNER_TEMP}/extra-packages"
          PACKAGE_DIR="${RUNNER_TEMP}/prepared-apk"
          rm -rf "${REPO_DIR}" "${EXTRA_DIR}" "${PACKAGE_DIR}"
          mkdir -p "${EXTRA_DIR}" "${PACKAGE_DIR}"
          git clone --depth=1 --branch master https://github.com/wukongdaily/apk.git "${REPO_DIR}"
          test -d "${REPO_DIR}/run/x86"
          cp -a "${REPO_DIR}/run/x86/." "${EXTRA_DIR}/"
          test -f "${GITHUB_WORKSPACE}/scripts/apk-prepare-packages.sh"
          chmod +x "${GITHUB_WORKSPACE}/scripts/apk-prepare-packages.sh"
          BASE_DIR="${EXTRA_DIR}" TARGET_DIR="${PACKAGE_DIR}" "${GITHUB_WORKSPACE}/scripts/apk-prepare-packages.sh"
          rm -rf "${IMAGEBUILDER_DIR}/packages"
          mkdir -p "${IMAGEBUILDER_DIR}/packages"
          cp -f "${PACKAGE_DIR}"/*.apk "${IMAGEBUILDER_DIR}/packages/"

          for pkg in ${CUSTOM_PACKAGES}; do
            mapfile -t matches < <(find "${PACKAGE_DIR}" -maxdepth 1 -type f -name "${pkg}-*.apk" -printf '%p\n' | sort -V)
            if [[ ${#matches[@]} -eq 0 ]]; then
              echo "ERROR: requested third-party APK was not prepared: ${pkg}" >&2
              find "${PACKAGE_DIR}" -maxdepth 1 -type f -name "${pkg}*.apk" -printf '%f\n' | sort >&2 || true
              exit 1
            fi
          done
          echo "Prepared APKs:"
          find "${IMAGEBUILDER_DIR}/packages" -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort

      - name: Prepare custom files
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${IMAGEBUILDER_DIR}/files/etc/uci-defaults"
          mkdir -p "${TARGET}"
          cp files/etc/uci-defaults/99-custom.sh "${TARGET}/99-custom.sh"
          ESCAPED_LAN_IP="$(printf '%s' "${LAN_IP}" | sed 's/[&|\\]/\\&/g')"
          sed -i "s|__LAN_IP__|${ESCAPED_LAN_IP}|g" "${TARGET}/99-custom.sh"
          chmod +x "${TARGET}/99-custom.sh"

      - name: Configure filesystem
        shell: bash
        run: |
          set -euo pipefail
          cd "${IMAGEBUILDER_DIR}"
          case "${FILESYSTEM}" in
            ext4)
              sed -i -e '/^CONFIG_TARGET_ROOTFS_SQUASHFS=/d' -e '/^# CONFIG_TARGET_ROOTFS_SQUASHFS is not set$/d' .config
              sed -i -e '/^CONFIG_TARGET_ROOTFS_EXT4FS=/d' -e '/^# CONFIG_TARGET_ROOTFS_EXT4FS is not set$/d' .config
              printf '%s\n' 'CONFIG_TARGET_ROOTFS_SQUASHFS=n' 'CONFIG_TARGET_ROOTFS_EXT4FS=y' >> .config
              ;;
            squashfs)
              sed -i -e '/^CONFIG_TARGET_ROOTFS_SQUASHFS=/d' -e '/^# CONFIG_TARGET_ROOTFS_SQUASHFS is not set$/d' .config
              sed -i -e '/^CONFIG_TARGET_ROOTFS_EXT4FS=/d' -e '/^# CONFIG_TARGET_ROOTFS_EXT4FS is not set$/d' .config
              printf '%s\n' 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' 'CONFIG_TARGET_ROOTFS_EXT4FS=n' >> .config
              ;;
            *) echo "Unsupported filesystem: ${FILESYSTEM}" >&2; exit 1 ;;
          esac
          grep -E '^CONFIG_TARGET_ROOTFS_(EXT4FS|SQUASHFS)=' .config || true

      - name: Prepare proxy cores
        shell: bash
        run: |
          set -euo pipefail
          cd "${IMAGEBUILDER_DIR}"
          mkdir -p files/etc/openclash/core files/usr/bin
          META_URL="https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64-v1.tar.gz"
          wget -qO- --timeout=30 --tries=3 "${META_URL}" | tar xOvz > files/etc/openclash/core/clash_meta
          chmod +x files/etc/openclash/core/clash_meta
          wget -q --timeout=30 --tries=3 https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat -O files/etc/openclash/GeoIP.dat
          wget -q --timeout=30 --tries=3 https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat -O files/etc/openclash/GeoSite.dat
          OPENCLASH_API="https://api.github.com/repos/vernesong/OpenClash/releases/latest"
          OPENCLASH_APK_URL="$(curl -fsSL --retry 3 --retry-delay 2 "${OPENCLASH_API}" | jq -r '.assets[]? | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)"
          if [[ -z "${OPENCLASH_APK_URL}" || "${OPENCLASH_APK_URL}" == "null" ]]; then
            echo "ERROR: no OpenClash APK asset found" >&2
            exit 1
          fi
          wget -q --show-progress --timeout=30 --tries=3 "${OPENCLASH_APK_URL}" -P "${IMAGEBUILDER_DIR}/packages/"
          MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.24/mihomo-linux-amd64-compatible-v1.19.24.gz"
          wget -qO- --timeout=30 --tries=3 "${MIHOMO_URL}" | gzip -dc > files/usr/bin/mihomo
          chmod +x files/usr/bin/mihomo

      - name: Build OpenWrt image
        shell: bash
        run: |
          set -euo pipefail
          cd "${IMAGEBUILDER_DIR}"
          case "${ROOTFS_SIZE}" in
            1G) ROOTFS_PARTSIZE=1024 ;;
            2G) ROOTFS_PARTSIZE=2048 ;;
            3G) ROOTFS_PARTSIZE=3072 ;;
            4G) ROOTFS_PARTSIZE=4096 ;;
            *) echo "Invalid ROOTFS_SIZE=${ROOTFS_SIZE}" >&2; exit 1 ;;
          esac
          BASE_PACKAGES="curl bash luci-i18n-firewall-zh-cn luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn luci-i18n-package-manager-zh-cn luci-i18n-ttyd-zh-cn openssh-sftp-server"
          PACKAGES="$(printf '%s\n' "${BASE_PACKAGES}" "${CUSTOM_PACKAGES}" | tr '[:space:]' '\n' | awk 'NF && !seen[$0]++' | paste -sd ' ' -)"
          test -n "${PACKAGES}"
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "Target          : x86/64"
          echo "LAN IP          : ${LAN_IP}"
          echo "Firmware size   : ${ROOTFS_SIZE}"
          echo "Filesystem      : ${FILESYSTEM}"
          echo "QCOW2           : ${BUILD_QCOW2}"
          echo "Rootfs partsize : ${ROOTFS_PARTSIZE} MiB"
          echo "Normalized packages:"
          printf '%s\n' "${PACKAGES}" | tr ' ' '\n'
          make image PROFILE="generic" PACKAGES="${PACKAGES}" FILES="${IMAGEBUILDER_DIR}/files" ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}"

      - name: Collect images and release metadata
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${IMAGEBUILDER_DIR}/bin/targets/x86/64"
          OUT="${GITHUB_WORKSPACE}/release"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"
          shopt -s nullglob
          case "${FILESYSTEM}" in
            ext4) candidates=("${BUILD_DIR}"/*generic-ext4-combined-efi.img.gz "${BUILD_DIR}"/*generic-ext4-combined-efi.img) ;;
            squashfs) candidates=("${BUILD_DIR}"/*generic-squashfs-combined-efi.img.gz "${BUILD_DIR}"/*generic-squashfs-combined-efi.img) ;;
          esac
          if (( ${#candidates[@]} == 0 )); then
            echo "ERROR: no ${FILESYSTEM} UEFI image was generated." >&2
            find "${BUILD_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi
          SRC="${candidates[0]}"
          IMG="${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.img"
          case "${SRC}" in *.gz) gzip -dc "${SRC}" > "${IMG}" ;; *) cp "${SRC}" "${IMG}" ;; esac
          test -s "${IMG}"
          if [[ "${BUILD_QCOW2}" == "true" ]]; then
            qemu-img convert -f raw -O qcow2 "${IMG}" "${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2"
          fi
          cp -f "${BUILD_DIR}"/*.manifest "${OUT}/" 2>/dev/null || true
          cp -f "${BUILD_DIR}"/*.buildinfo "${OUT}/" 2>/dev/null || true

          BUILD_DATE_UTC="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          {
            echo "# OpenWrt x86-64 Build"
            echo
            echo "## 基本信息"
            echo
            echo "| 项目 | 信息 |"
            echo "|---|---|"
            echo "| OpenWrt | ${OPENWRT_VERSION} |"
            echo "| Target | x86/64 |"
            echo "| Profile | generic |"
            echo "| Filesystem | ${FILESYSTEM} |"
            echo "| Rootfs size | ${ROOTFS_SIZE} |"
            echo "| LAN IP | ${LAN_IP} |"
            echo "| QCOW2 | ${BUILD_QCOW2} |"
            echo "| 编译日期 | ${BUILD_DATE_UTC} |"
            echo "| Git commit | ${GITHUB_SHA} |"
            echo "| Workflow run | ${GITHUB_RUN_NUMBER} |"
            echo
            echo "## 包含的第三方 APK"
            echo
            printf '%s\n' "${CUSTOM_PACKAGES}" | tr ' ' '\n' | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/'
            echo
            echo "## 固件文件"
            echo
            find "${OUT}" -maxdepth 1 -type f -printf '%f\n' | sort | sed 's/^/- `/' | sed 's/$/`/'
          } > "${OUT}/RELEASE.md"

          cd "${OUT}"
          sha256sum * > sha256sums.txt
          cat RELEASE.md
          echo "SHA256:"
          cat sha256sums.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ env.OPENWRT_VERSION }}-${{ env.FILESYSTEM }}-${{ env.ROOTFS_SIZE }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ success() && github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-${{ env.OPENWRT_VERSION }}-x86-64-build-${{ github.run_number }}
          name: OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 Build ${{ github.run_number }}
          body_path: release/RELEASE.md
          files: |
            release/*.img
            release/*.qcow2
            release/*.manifest
            release/*.buildinfo
            release/sha256sums.txt
            release/RELEASE.md
          draft: false
          prerelease: false
          generate_release_notes: false
