name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        required: true
        default: "25.12.5"

      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.1.2"

      rootfs_size:
        description: "Firmware size"
        required: true
        type: choice
        default: "4G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      filesystem:
        description: "Filesystem"
        required: true
        type: choice
        default: "ext4"
        options:
          - "ext4"
          - "squashfs"

      qcow2:
        description: "Build QCOW2"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      LAN_IP: ${{ inputs.lan_ip }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
      FILESYSTEM: ${{ inputs.filesystem }}
      BUILD_QCOW2: ${{ inputs.qcow2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            gzip \
            qemu-utils \
            tar \
            wget \
            xz-utils \
            zstd

      - name: Download OpenWrt x86-64 ImageBuilder
        shell: bash
        run: |
          set -euxo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          ARCHIVE="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          WORK="${RUNNER_TEMP}/imagebuilder"
          rm -rf "${WORK}"
          mkdir -p "${WORK}"

          cd "${WORK}"
          wget -q --show-progress "${BASE_URL}/${ARCHIVE}"
          tar --zstd -xf "${ARCHIVE}"

          IMAGEBUILDER_DIR="$(
            find "${WORK}" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name 'openwrt-imagebuilder-*' \
              -print \
              | head -n 1
          )"

          test -n "${IMAGEBUILDER_DIR}"
          test -f "${IMAGEBUILDER_DIR}/Makefile"

          echo "IMAGEBUILDER_DIR=${IMAGEBUILDER_DIR}" >> "${GITHUB_ENV}"

      - name: Load third-party APK package list
        shell: bash
        run: |
          set -euxo pipefail

          test -f scripts/apk-custom-packages.sh

          # This file intentionally only defines CUSTOM_PACKAGES.
          # It does not clone repositories and does not build packages.
          source scripts/apk-custom-packages.sh

          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "${GITHUB_ENV}"

          echo "Third-party APK package list:"
          printf '%s\n' "${CUSTOM_PACKAGES}"

      - name: Download and prepare third-party APK repository
        if: ${{ env.CUSTOM_PACKAGES != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          test -f scripts/apk-prepare-packages.sh
          chmod +x scripts/apk-prepare-packages.sh

          REPO_DIR="${RUNNER_TEMP}/wukongdaily-apk"
          EXTRA_DIR="${IMAGEBUILDER_DIR}/extra-packages"
          PACKAGE_DIR="${IMAGEBUILDER_DIR}/packages"

          rm -rf "${REPO_DIR}" "${EXTRA_DIR}"
          mkdir -p "${EXTRA_DIR}"

          git clone --depth=1 \
            https://github.com/wukongdaily/apk.git \
            "${REPO_DIR}"

          test -d "${REPO_DIR}/run/x86"

          # Exactly the same source model used by the upstream project:
          # copy x86 .run files and direct .apk files into extra-packages.
          cp -a "${REPO_DIR}/run/x86/." "${EXTRA_DIR}/"

          cd "${IMAGEBUILDER_DIR}"

          sh "${GITHUB_WORKSPACE}/scripts/apk-prepare-packages.sh"

          echo
          echo "Prepared APK files:"
          find "${PACKAGE_DIR}" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' \
            | sort

          test -n "$(
            find "${PACKAGE_DIR}" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

      - name: Prepare custom files
        shell: bash
        run: |
          set -euxo pipefail

          TARGET="${IMAGEBUILDER_DIR}/files/etc/uci-defaults"
          mkdir -p "${TARGET}"

          cp \
            files/etc/uci-defaults/99-custom.sh \
            "${TARGET}/99-custom.sh"

          sed -i \
            "s/__LAN_IP__/${LAN_IP}/g" \
            "${TARGET}/99-custom.sh"

          chmod +x "${TARGET}/99-custom.sh"

      - name: Configure filesystem
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"
          test -f .config

          case "${FILESYSTEM}" in
            ext4)
              sed -i \
                's/^CONFIG_TARGET_ROOTFS_SQUASHFS=.*/# CONFIG_TARGET_ROOTFS_SQUASHFS is not set/' \
                .config || true

              if grep -q '^CONFIG_TARGET_ROOTFS_EXT4FS=' .config; then
                sed -i \
                  's/^CONFIG_TARGET_ROOTFS_EXT4FS=.*/CONFIG_TARGET_ROOTFS_EXT4FS=y/' \
                  .config
              else
                printf '%s\n' 'CONFIG_TARGET_ROOTFS_EXT4FS=y' >> .config
              fi
              ;;

            squashfs)
              sed -i \
                's/^CONFIG_TARGET_ROOTFS_EXT4FS=.*/# CONFIG_TARGET_ROOTFS_EXT4FS is not set/' \
                .config || true

              if grep -q '^CONFIG_TARGET_ROOTFS_SQUASHFS=' .config; then
                sed -i \
                  's/^CONFIG_TARGET_ROOTFS_SQUASHFS=.*/CONFIG_TARGET_ROOTFS_SQUASHFS=y/' \
                  .config
              else
                printf '%s\n' 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' >> .config
              fi
              ;;

            *)
              echo "Unsupported filesystem: ${FILESYSTEM}"
              exit 1
              ;;
          esac

          # Do not run defconfig here: ImageBuilder's shipped .config is
          # already generated. We only change the requested rootfs selector.

          echo "Filesystem configuration:"
          grep -E \
            '^CONFIG_TARGET_ROOTFS_(EXT4FS|SQUASHFS)=' \
            .config \
            || true

      - name: Build OpenWrt image
        shell: bash
        run: |
          set -euxo pipefail

          cd "${IMAGEBUILDER_DIR}"

          case "${ROOTFS_SIZE}" in
            1G) ROOTFS_PARTSIZE=1024 ;;
            2G) ROOTFS_PARTSIZE=2048 ;;
            3G) ROOTFS_PARTSIZE=3072 ;;
            4G) ROOTFS_PARTSIZE=4096 ;;
            *) echo "Invalid ROOTFS_SIZE=${ROOTFS_SIZE}"; exit 1 ;;
          esac

          BASE_PACKAGES="
            curl
            luci-i18n-firewall-zh-cn
            luci-theme-argon
            luci-app-argon-config
            luci-i18n-argon-config-zh-cn
            luci-i18n-package-manager-zh-cn
            luci-i18n-ttyd-zh-cn
            openssh-sftp-server
          "

          PACKAGES="${BASE_PACKAGES} ${CUSTOM_PACKAGES}"

          echo "============================================================"
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "Target          : x86/64"
          echo "LAN IP          : ${LAN_IP}"
          echo "Firmware size   : ${ROOTFS_SIZE}"
          echo "Filesystem      : ${FILESYSTEM}"
          echo "QCOW2           : ${BUILD_QCOW2}"
          echo "Rootfs partsize : ${ROOTFS_PARTSIZE} MiB"
          echo "============================================================"
          echo
          echo "Packages:"
          printf '%s\n' "${PACKAGES}"

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="${IMAGEBUILDER_DIR}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}"

      - name: Collect UEFI image
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_DIR="${IMAGEBUILDER_DIR}/bin/targets/x86/64"
          OUT="${GITHUB_WORKSPACE}/release"

          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          shopt -s nullglob

          case "${FILESYSTEM}" in
            ext4)
              candidates=(
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img
              )
              ;;
            squashfs)
              candidates=(
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img
              )
              ;;
          esac

          if (( ${#candidates[@]} == 0 )); then
            echo "ERROR: no ${FILESYSTEM} UEFI image was generated."
            find "${BUILD_DIR}" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
            exit 1
          fi

          SRC="${candidates[0]}"
          IMG="${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.img"

          case "${SRC}" in
            *.gz) gzip -dc "${SRC}" > "${IMG}" ;;
            *) cp "${SRC}" "${IMG}" ;;
          esac

          test -s "${IMG}"
          ls -lh "${IMG}"

      - name: Build QCOW2
        if: ${{ inputs.qcow2 }}
        shell: bash
        run: |
          set -euxo pipefail

          IMG="${GITHUB_WORKSPACE}/release/openwrt-x86-64-uefi-${FILESYSTEM}.img"
          QCOW2="${GITHUB_WORKSPACE}/release/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2"

          qemu-img convert \
            -p \
            -f raw \
            -O qcow2 \
            "${IMG}" \
            "${QCOW2}"

          qemu-img info "${QCOW2}"

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}/release"
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ inputs.openwrt_version }}-${{ inputs.filesystem }}-${{ inputs.rootfs_size }}
          path: release/*
          if-no-files-found: error
