name: Build OpenWrt 25.12.x x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 版本，留空使用最新 25.12.x"
        required: false
        default: ""
        type: string

      lan_ip:
        description: "LAN 管理地址"
        required: true
        default: "192.168.1.2"
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      bios:
        description: "生成 BIOS EXT4 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI EXT4 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2 镜像"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK 镜像"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW 镜像"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:

  check-update:
    name: Check OpenWrt 25.12.x update
    runs-on: ubuntu-24.04

    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check latest OpenWrt 25.12.x
        id: check
        shell: bash
        run: |
          set -euo pipefail

          latest="$(
            git ls-remote \
              --tags \
              --refs \
              https://github.com/openwrt/openwrt.git |
            sed -n 's#.*refs/tags/v\(25\.12\.[0-9][0-9]*\)$#\1#p' |
            sort -V |
            tail -n 1
          )

          if [ -z "$latest" ]; then
            echo "ERROR: Cannot determine latest OpenWrt 25.12.x"
            exit 1
          fi

          last=""

          if [ -f openwrt-version ]; then
            last="$(tr -d '[:space:]' < openwrt-version)"
          fi

          should_build="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            should_build="true"
          elif [ -z "$last" ]; then
            should_build="true"
          elif [ "$latest" != "$last" ]; then
            should_build="true"
          fi

          version="$latest"

          manual="${{ inputs.openwrt_version }}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
             [ -n "$manual" ]; then
            version="$manual"
          fi

          if ! printf '%s' "$version" |
            grep -Eq '^25\.12\.[0-9]+$'; then

            echo "ERROR: Invalid OpenWrt version: $version"
            exit 1
          fi

          echo "=========================================="
          echo "Latest OpenWrt: $latest"
          echo "Last built:     ${last:-NONE}"
          echo "Selected:       $version"
          echo "Should build:   $should_build"
          echo "=========================================="

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"


  build:
    name: Build OpenWrt ImageBuilder
    needs: check-update

    if: needs.check-update.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set OpenWrt version
        env:
          SELECTED_VERSION: ${{ needs.check-update.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          echo "OPENWRT_VERSION=$SELECTED_VERSION" >> "$GITHUB_ENV"

          echo "OpenWrt version:"
          echo "$SELECTED_VERSION"


      - name: Set build options
        shell: bash
        run: |
          set -euo pipefail

          lan_ip="${{ inputs.lan_ip }}"
          size="${{ inputs.rootfs_size }}"

          if [ -z "$lan_ip" ]; then
            lan_ip="192.168.1.2"
          fi

          if [ -z "$size" ]; then
            size="4G"
          fi

          case "$size" in
            1G)
              partsize=1024
              ;;
            2G)
              partsize=2048
              ;;
            3G)
              partsize=3072
              ;;
            4G)
              partsize=4096
              ;;
            *)
              echo "ERROR: Invalid rootfs size: $size"
              exit 1
              ;;
          esac

          echo "LAN_IP=$lan_ip" >> "$GITHUB_ENV"
          echo "ROOTFS_SIZE=$size" >> "$GITHUB_ENV"
          echo "ROOTFS_PARTSIZE=$partsize" >> "$GITHUB_ENV"

          echo "LAN IP: $lan_ip"
          echo "RootFS: $size"
          echo "RootFS partition: ${partsize} MB"


      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            git \
            zstd \
            xz-utils \
            gzip \
            tar \
            unzip \
            qemu-utils \
            file


      - name: Download official OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          archive="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/${archive}"

          echo "Downloading:"
          echo "$url"

          wget \
            --progress=bar:force \
            -O "$archive" \
            "$url"

          rm -rf imagebuilder

          mkdir -p imagebuilder

          tar \
            --use-compress-program=unzstd \
            -xf "$archive" \
            -C imagebuilder \
            --strip-components=1

          if [ ! -f imagebuilder/Makefile ]; then
            echo "ERROR: ImageBuilder Makefile not found."

            echo "ImageBuilder directory:"
            find imagebuilder \
              -maxdepth 2 \
              -type f |
            head -100

            exit 1
          fi

          echo "ImageBuilder successfully extracted."


      - name: Show ImageBuilder information
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ./Makefile ]; then
            echo "ERROR: ImageBuilder Makefile not found."
            exit 1
          fi

          echo "=========================================="
          echo "ImageBuilder information"
          echo "=========================================="

          make info


      - name: Download third-party APK source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third-party-apk
          rm -rf packages

          mkdir -p packages

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk

          if [ ! -d third-party-apk/run/x86 ]; then
            echo "ERROR: wukongdaily x86 APK repository not found."
            exit 1
          fi

          find third-party-apk/run/x86 \
            -type f \
            -name '*.apk' \
            -exec cp -f {} packages/ \;

          shopt -s nullglob

          mkdir -p third-party-apk/tmp

          for runfile in third-party-apk/run/x86/*.run; do

            echo
            echo "=========================================="
            echo "Extracting: $(basename "$runfile")"
            echo "=========================================="

            chmod +x "$runfile"

            rm -rf third-party-apk/tmp/*

            (
              cd third-party-apk/tmp

              sh \
                "$GITHUB_WORKSPACE/$runfile" \
                --target "$PWD" \
                --noexec
            ) || true

            find third-party-apk/tmp \
              -type f \
              -name '*.apk' \
              -exec cp -f {} packages/ \;

          done

          echo
          echo "Local third-party APK files:"
          echo "=========================================="

          find packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' |
          sort


      - name: Download missing third-party APKs from ImmortalWrt 25.12
        shell: bash
        run: |
          set -euo pipefail

          source shell/apk-custom-packages.sh

          if [ -z "${CUSTOM_PACKAGES:-}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty."
            exit 1
          fi

          base="https://downloads.immortalwrt.org/releases/packages-25.12/x86_64"

          feeds="
          base
          luci
          packages
          routing
          telephony
          video
          "

          for pkg in $CUSTOM_PACKAGES; do

            if find packages \
              -maxdepth 1 \
              -type f \
              -name "${pkg}-*.apk" \
              -print -quit |
              grep -q .; then

              echo "Already available: $pkg"
              continue

            fi

            found=""

            for feed in $feeds; do

              echo "Searching $pkg in $feed ..."

              html="$(
                curl \
                  -fsSL \
                  "$base/$feed/" \
                  2>/dev/null ||
                true
              )"

              file="$(
                printf '%s' "$html" |
                grep \
                  -oE \
                  "href=\"${pkg}-[^\"]+\.apk\"" |
                head -n 1 |
                sed -E \
                  's/^href="//; s/"$//'
              )"

              if [ -n "$file" ]; then

                url="$base/$feed/$file"

                echo "Downloading:"
                echo "$url"

                curl \
                  -fsSL \
                  -o "packages/$file" \
                  "$url"

                found="$file"

                break

              fi

            done

            if [ -z "$found" ]; then

              echo
              echo "ERROR: Cannot find APK:"
              echo "$pkg"
              echo
              exit 1

            fi

          done

          echo
          echo "Final local APK list:"
          echo "=========================================="

          find packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' |
          sort


      - name: Install local APKs into ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          rm -f imagebuilder/packages/*.apk
          rm -f imagebuilder/packages/packages.adb

          cp \
            -f \
            packages/*.apk \
            imagebuilder/packages/

          if ! compgen \
            -G 'imagebuilder/packages/*.apk' \
            > /dev/null; then

            echo "ERROR: No local APK packages found."
            exit 1

          fi

          echo
          echo "ImageBuilder local packages:"
          echo "=========================================="

          find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' |
          sort


      - name: Prepare runtime APK repositories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p files/etc/apk/repositories.d
          mkdir -p files/etc/apk/keys

          cat > files/etc/apk/repositories.d/immortalwrt-25.12.list <<'EOF'
https://downloads.immortalwrt.org/releases/packages-25.12/x86_64/base/packages.adb
https://downloads.immortalwrt.org/releases/packages-25.12/x86_64/luci/packages.adb
https://downloads.immortalwrt.org/releases/packages-25.12/x86_64/packages/packages.adb
https://downloads.immortalwrt.org/releases/packages-25.12/x86_64/routing/packages.adb
https://downloads.immortalwrt.org/releases/packages-25.12/x86_64/telephony/packages.adb
https://downloads.immortalwrt.org/releases/packages-25.12/x86_64/video/packages.adb
EOF

          cat > files/etc/apk/keys/immortalwrt-25.12.pem <<'EOF'
untrusted comment: ImmortalWrt 25.12 repository key
-----BEGIN PUBLIC KEY-----
MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE4gEuRXAk4+ArZvB5VKgE/o9zrxif
a+38TgvDUZuoAp4x2rya/uVUJvSCkTHxR5gjqstI9W60dRnWErT44Uu0nw==
-----END PUBLIC KEY-----
EOF


      - name: Prepare custom files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p files/etc/config
          mkdir -p files/etc/uci-defaults
          mkdir -p files/etc/apk/repositories.d
          mkdir -p files/etc/apk/keys

          cat > files/etc/config/network <<EOF
config interface 'loopback'
    option device 'lo'
    option proto 'static'
    option ipaddr '127.0.0.1'
    option netmask '255.0.0.0'

config device
    option name 'br-lan'
    option type 'bridge'
    list ports 'eth2'
    list ports 'eth3'
    list ports 'eth4'
    list ports 'eth5'

config interface 'lan'
    option device 'br-lan'
    option proto 'static'
    option ipaddr '${LAN_IP}'
    option netmask '255.255.255.0'
    option ip6assign '64'

config interface 'wan'
    option device 'eth0'
    option proto 'pppoe'
    option username '${{ secrets.WAN1_USER }}'
    option password '${{ secrets.WAN1_PASS }}'
    option ipv6 'auto'

config interface 'wan6'
    option device '@wan'
    option proto 'dhcpv6'
    option reqaddress 'try'
    option reqprefix 'auto'

config interface 'wanb'
    option device 'eth1'
    option proto 'pppoe'
    option username '${{ secrets.WAN2_USER }}'
    option password '${{ secrets.WAN2_PASS }}'
    option ipv6 'auto'

config interface 'wanb6'
    option device '@wanb'
    option proto 'dhcpv6'
    option reqaddress 'try'
    option reqprefix 'auto'
EOF

          cat > files/etc/config/dhcp <<'EOF'
config dnsmasq
    option domainneeded '1'
    option boguspriv '1'
    option localise_queries '1'
    option rebind_protection '1'
    option local '/lan/'
    option domain 'lan'
    option expandhosts '1'
    option authoritative '1'
    option readethers '1'
    option leasefile '/tmp/dhcp.leases'
    option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

config dhcp 'lan'
    option interface 'lan'
    option start '100'
    option limit '150'
    option leasetime '12h'
    option dhcpv4 'server'
    option dhcpv6 'server'
    option ra 'server'
    option ra_management '1'

config dhcp 'wan'
    option interface 'wan'
    option ignore '1'

config dhcp 'wanb'
    option interface 'wanb'
    option ignore '1'

config odhcpd 'odhcpd'
    option maindhcp '0'
    option leasefile '/tmp/hosts/odhcpd'
    option leasetrigger '/usr/sbin/odhcpd-update'
    option loglevel '4'
EOF

          cat > files/etc/uci-defaults/99-default-language <<'EOF'
#!/bin/sh

uci -q set luci.main.lang='zh_cn'
uci -q commit luci

exit 0
EOF

          chmod +x files/etc/uci-defaults/99-default-language


      - name: Prepare package list
        shell: bash
        run: |
          set -euo pipefail

          source shell/apk-custom-packages.sh

          OFFICIAL_PACKAGES="
          luci
          luci-ssl
          luci-i18n-base-zh-cn
          luci-app-package-manager
          luci-i18n-package-manager-zh-cn
          luci-app-mwan3
          luci-i18n-mwan3-zh-cn
          luci-app-upnp
          luci-i18n-upnp-zh-cn
          luci-app-ttyd
          luci-i18n-ttyd-zh-cn
          luci-proto-ppp
          luci-proto-ipv6
          ppp
          ppp-mod-pppoe
          kmod-pppoe
          ipv6
          odhcp6c
          odhcpd-ipv6only
          luci-compat
          kmod-tun
          kmod-inet-diag
          kmod-nft-socket
          kmod-nft-tproxy
          bash
          curl
          ca-bundle
          ip-full
          unzip
          dnsmasq-full
          ruby
          ruby-yaml
          ipset
          "

          third_party="$(
            printf '%s\n' "$CUSTOM_PACKAGES" |
            xargs
          )"

          FINAL_PACKAGES="$(
            printf '%s\n%s\n' \
              "$OFFICIAL_PACKAGES" \
              "$third_party" |
            tr ' ' '\n' |
            sed '/^$/d' |
            awk '!seen[$0]++' |
            xargs
          )"

          echo "FINAL_PACKAGES=$FINAL_PACKAGES" >> "$GITHUB_ENV"

          echo
          echo "Final package list:"
          echo "=========================================="

          printf '%s\n' $FINAL_PACKAGES | sort


      - name: Verify all requested APK packages
        shell: bash
        run: |
          set -euo pipefail

          source shell/apk-custom-packages.sh

          failed=0

          for pkg in $CUSTOM_PACKAGES; do

            if find packages \
              -maxdepth 1 \
              -type f \
              -name "${pkg}-*.apk" \
              -print -quit |
              grep -q .; then

              echo "OK: $pkg"

            else

              echo "MISSING: $pkg"

              failed=1

            fi

          done

          if [ "$failed" -ne 0 ]; then

            echo
            echo "ERROR:"
            echo "One or more requested third-party APKs are missing."

            exit 1

          fi


      - name: Build firmware with ImageBuilder
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Official OpenWrt ImageBuilder"
          echo "=========================================="

          echo "OpenWrt: ${OPENWRT_VERSION}"
          echo "Target: x86-64"
          echo "RootFS: ${ROOTFS_PARTSIZE} MB"

          echo
          echo "This is ImageBuilder."
          echo "No OpenWrt source compilation."
          echo "No toolchain compilation."
          echo "No kernel source compilation."

          echo
          echo "=========================================="

          make image \
            PROFILE="generic" \
            PACKAGES="${FINAL_PACKAGES}" \
            FILES="${GITHUB_WORKSPACE}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            V=s


      - name: Set build timestamp
        shell: bash
        run: |
          set -euo pipefail

          echo "BUILD_DATE=$(date -u '+%Y%m%d')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u '+%H%M%S')" >> "$GITHUB_ENV"


      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release


      - name: Export BIOS EXT4
        if: github.event_name != 'workflow_dispatch' || inputs.bios
        shell: bash
        run: |
          set -euo pipefail

          image="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined.img.gz' |
            head -n 1
          )"

          if [ -z "$image" ]; then
            echo "ERROR: BIOS EXT4 image not found."
            exit 1
          fi

          cp "$image" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-BIOS-ext4.img.gz"


      - name: Export UEFI EXT4
        if: github.event_name != 'workflow_dispatch' || inputs.uefi
        shell: bash
        run: |
          set -euo pipefail

          image="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -n 1
          )"

          if [ -z "$image" ]; then
            echo "ERROR: UEFI EXT4 image not found."
            exit 1
          fi

          cp "$image" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI-ext4.img.gz"


      - name: Prepare raw image
        if: github.event_name != 'workflow_dispatch' || inputs.qcow2 || inputs.vmdk || inputs.raw
        shell: bash
        run: |
          set -euo pipefail

          image="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*generic-ext4-combined-efi.img.gz' |
            head -n 1
          )"

          if [ -z "$image" ]; then
            echo "ERROR: UEFI EXT4 image not found."
            exit 1
          fi

          gzip -dc "$image" > openwrt.raw


      - name: Create QCOW2
        if: github.event_name != 'workflow_dispatch' || inputs.qcow2
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O qcow2 \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.qcow2"


      - name: Create VMDK
        if: github.event_name == 'workflow_dispatch' && inputs.vmdk
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.vmdk"


      - name: Export RAW
        if: github.event_name == 'workflow_dispatch' && inputs.raw
        shell: bash
        run: |
          set -euo pipefail

          cp \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${BUILD_TIME}-UEFI.raw"


      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum * > sha256sums


      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          cat > release/build-info.txt <<EOF
OpenWrt Custom Image
====================

OpenWrt version:
${OPENWRT_VERSION}

Target:
x86-64

Build method:
Official OpenWrt ImageBuilder

RootFS size:
${ROOTFS_SIZE}

Build date:
${BUILD_DATE}

Build time:
${BUILD_TIME}


Network
=======

eth0 = WAN1 / PPPoE
eth1 = WAN2 / PPPoE

eth2 = LAN
eth3 = LAN
eth4 = LAN
eth5 = LAN

LAN IP:
${LAN_IP}

IPv6:
Enabled


Filesystem
==========

BIOS EXT4
UEFI EXT4
QCOW2
VMDK / RAW when manually selected
EOF


      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release


      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            基于官方 OpenWrt ImageBuilder 构建。

            **不会编译 OpenWrt 源码。**

            ## 基本信息

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - LAN: `${{ env.LAN_IP }}`

            ## 网络

            - eth0 → WAN1 / PPPoE
            - eth1 → WAN2 / PPPoE
            - eth2 → LAN
            - eth3 → LAN
            - eth4 → LAN
            - eth5 → LAN
            - IPv6 → Enabled

            ## 固件

            - BIOS EXT4
            - UEFI EXT4
            - QCOW2
            - VMDK / RAW（手动选择）

            ## 构建方式

            Official OpenWrt ImageBuilder。

            不进行：
            - OpenWrt 源码编译
            - Toolchain 编译
            - Kernel 源码编译

          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Update openwrt-version
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            "$OPENWRT_VERSION" \
            > openwrt-version

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add openwrt-version

          if git diff --cached --quiet; then
            echo "openwrt-version already up to date."
            exit 0
          fi

          git commit \
            -m \
            "Update OpenWrt version to ${OPENWRT_VERSION}"

          git push
