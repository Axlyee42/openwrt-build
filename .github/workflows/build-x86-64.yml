name: Build OpenWrt x86-64 ImageBuilder

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        required: true
        default: "25.12.5"

      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.1.2"

      rootfs_size:
        description: "Firmware disk/rootfs size"
        required: true
        type: choice
        default: "4G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      filesystem:
        description: "Filesystem format"
        required: true
        type: choice
        default: "ext4"
        options:
          - "ext4"
          - "squashfs"


      uefi:
        description: "Build UEFI image"
        required: true
        type: boolean
        default: true


      qcow2:
        description: "Build QCOW2 image"
        required: true
        type: boolean
        default: true


jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      LAN_IP: ${{ inputs.lan_ip }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
      BUILD_UEFI: ${{ inputs.uefi }}
      FILESYSTEM: ${{ inputs.filesystem }}
      BUILD_QCOW2: ${{ inputs.qcow2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageBuilder tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-utils \
            zstd \
            xz-utils \
            gzip \
            tar \
            wget \
            curl \
            git \
            rsync

      - name: Download OpenWrt x86-64 ImageBuilder
        shell: bash
        run: |
          set -euxo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          IB="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          mkdir -p "$RUNNER_TEMP/ib"
          cd "$RUNNER_TEMP/ib"

          wget -q --show-progress "${BASE_URL}/${IB}"
          tar --zstd -xf "$IB"

          IMAGEBUILDER_DIR="$(find . -maxdepth 1 -type d -name 'openwrt-imagebuilder-*' | head -n1)"
          test -n "$IMAGEBUILDER_DIR"

          echo "IMAGEBUILDER_DIR=$PWD/$IMAGEBUILDER_DIR" >> "$GITHUB_ENV"

      - name: Prepare third-party APK repository
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/apk-custom-packages.sh

          IMAGEBUILDER_DIR="${IMAGEBUILDER_DIR}" \
          scripts/apk-custom-packages.sh

          # Persist the package list for the following GitHub Actions step.
          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "$GITHUB_ENV"

      - name: Prepare custom files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${IMAGEBUILDER_DIR}/files/etc/uci-defaults"

          cp files/etc/uci-defaults/99-custom.sh \
             "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

          sed -i "s/__LAN_IP__/${LAN_IP}/g" \
             "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

          chmod +x \
             "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

      - name: Build OpenWrt image
        shell: bash
        run: |
          set -euxo pipefail
          cd "${IMAGEBUILDER_DIR}"

          PACKAGES="
            curl
            luci
            luci-i18n-base-zh-cn
            luci-i18n-firewall-zh-cn
            luci-theme-bootstrap
            luci-theme-argon
            luci-app-argon-config
            luci-i18n-argon-config-zh-cn
            openssh-sftp-server
            ${CUSTOM_PACKAGES:-}
          "

          echo "============================================================"
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "LAN IP          : ${LAN_IP}"
          echo "Rootfs size     : ${ROOTFS_SIZE}"
          echo "Packages        : ${PACKAGES}"
          echo "============================================================"

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="${IMAGEBUILDER_DIR}/files" \
            ROOTFS_PARTSIZE="$(( ${ROOTFS_SIZE%G} * 1024 ))"

      - name: Collect requested image formats
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_DIR="${IMAGEBUILDER_DIR}/bin/targets/x86/64"
          OUT="${GITHUB_WORKSPACE}/release"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          shopt -s nullglob

          if [[ "${BUILD_UEFI}" == "true" ]]; then
            if [[ "${FILESYSTEM}" == "ext4" ]]; then
              candidates=(
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-ext4-combined-efi.img
              )
            else
              candidates=(
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img.gz
                "${BUILD_DIR}"/*generic-squashfs-combined-efi.img
              )
            fi

            test "${#candidates[@]}" -gt 0 || {
              echo "UEFI ${FILESYSTEM} image not found."
              find "$BUILD_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
              exit 1
            }

            src="${candidates[0]}"

            case "$src" in
              *.gz)
                gzip -dc "$src" > "$OUT/openwrt-x86-64-uefi-${FILESYSTEM}.img"
                ;;
              *)
                cp "$src" "$OUT/openwrt-x86-64-uefi-${FILESYSTEM}.img"
                ;;
            esac

            if [[ "${BUILD_QCOW2}" == "true" ]]; then
              qemu-img convert -p -f raw -O qcow2 \
                "$OUT/openwrt-x86-64-uefi-${FILESYSTEM}.img" \
                "$OUT/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2"
            fi
          fi

          echo "============================================================"
          echo "Generated images:"
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort
          echo "============================================================"

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd release
          sha256sum * > sha256sums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ inputs.openwrt_version }}-${{ inputs.filesystem }}
          path: release/*
          if-no-files-found: error
