name: Build OpenWrt x86-64 ImageBuilder

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release"
        required: true
        default: "25.12.5"

      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.1.2"

      rootfs_size:
        description: "Firmware disk/rootfs size"
        required: true
        type: choice
        default: "4G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      filesystem:
        description: "Filesystem"
        required: true
        type: choice
        default: "ext4"
        options:
          - "ext4"
          - "squashfs"

      qcow2:
        description: "Also create QCOW2"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      LAN_IP: ${{ inputs.lan_ip }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
      FILESYSTEM: ${{ inputs.filesystem }}
      BUILD_QCOW2: ${{ inputs.qcow2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            git \
            gzip \
            qemu-utils \
            tar \
            wget \
            zstd

      - name: Download OpenWrt x86-64 ImageBuilder
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          IB="openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"

          rm -rf "${RUNNER_TEMP}/imagebuilder"
          mkdir -p "${RUNNER_TEMP}/imagebuilder"
          cd "${RUNNER_TEMP}/imagebuilder"

          echo "Downloading ${BASE_URL}/${IB}"
          wget --https-only -q --show-progress "${BASE_URL}/${IB}"

          tar --zstd -xf "${IB}"

          IMAGEBUILDER_DIR="$(find . -mindepth 1 -maxdepth 1 -type d \
            -name 'openwrt-imagebuilder-*' -print -quit)"

          test -n "${IMAGEBUILDER_DIR}"
          test -f "${IMAGEBUILDER_DIR}/Makefile"

          IMAGEBUILDER_DIR="$(realpath "${IMAGEBUILDER_DIR}")"
          echo "IMAGEBUILDER_DIR=${IMAGEBUILDER_DIR}" >> "${GITHUB_ENV}"

      - name: Prepare third-party APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x shell/apk-custom-packages.sh

          IMAGEBUILDER_DIR="${IMAGEBUILDER_DIR}" \
            shell/apk-custom-packages.sh

      - name: Prepare first-boot files
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "${IMAGEBUILDER_DIR}/files/etc/uci-defaults"

          cp files/etc/uci-defaults/99-custom.sh \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

          sed -i "s/__LAN_IP__/${LAN_IP}/g" \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

          chmod 0755 \
            "${IMAGEBUILDER_DIR}/files/etc/uci-defaults/99-custom.sh"

      - name: Build OpenWrt image
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${IMAGEBUILDER_DIR}"

          ROOTFS_PARTSIZE="$(( ${ROOTFS_SIZE%G} * 1024 ))"

          case "${FILESYSTEM}" in
            ext4)
              ROOTFS_CONFIG=(
                "CONFIG_TARGET_ROOTFS_EXT4FS=y"
                "CONFIG_TARGET_ROOTFS_SQUASHFS="
              )
              ;;
            squashfs)
              ROOTFS_CONFIG=(
                "CONFIG_TARGET_ROOTFS_EXT4FS="
                "CONFIG_TARGET_ROOTFS_SQUASHFS=y"
              )
              ;;
            *)
              echo "Unsupported filesystem: ${FILESYSTEM}"
              exit 1
              ;;
          esac

          # UEFI only. BIOS image generation is explicitly disabled.
          IMAGE_CONFIG=(
            "CONFIG_GRUB_EFI_IMAGES=y"
            "CONFIG_GRUB_IMAGES="
            "CONFIG_TARGET_IMAGES_GZIP=y"
          )

          PACKAGES="
            curl
            luci
            luci-i18n-base-zh-cn
            luci-i18n-firewall-zh-cn
            luci-i18n-package-manager-zh-cn
            luci-i18n-ttyd-zh-cn
            luci-theme-argon
            luci-app-argon-config
            luci-i18n-argon-config-zh-cn
            openssh-sftp-server
            ${CUSTOM_PACKAGES}
          "

          echo "============================================================"
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "LAN IP          : ${LAN_IP}"
          echo "Filesystem      : ${FILESYSTEM}"
          echo "Rootfs size     : ${ROOTFS_PARTSIZE} MB"
          echo "QCOW2           : ${BUILD_QCOW2}"
          echo "============================================================"

          make image \
            PROFILE="generic" \
            PACKAGES="${PACKAGES}" \
            FILES="${IMAGEBUILDER_DIR}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            "${ROOTFS_CONFIG[@]}" \
            "${IMAGE_CONFIG[@]}"

      - name: Collect UEFI image
        shell: bash
        run: |
          set -Eeuo pipefail

          BUILD_DIR="${IMAGEBUILDER_DIR}/bin/targets/x86/64"
          OUT="${GITHUB_WORKSPACE}/release"

          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          shopt -s nullglob

          candidates=(
            "${BUILD_DIR}"/*generic-"${FILESYSTEM}"-combined-efi.img.gz
            "${BUILD_DIR}"/*generic-"${FILESYSTEM}"-combined-efi.img
          )

          if (( ${#candidates[@]} == 0 )); then
            echo "ERROR: UEFI ${FILESYSTEM} image was not produced."
            echo
            echo "ImageBuilder output:"
            find "${BUILD_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          SRC="${candidates[0]}"
          IMG="${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.img"

          case "${SRC}" in
            *.gz)
              gzip -dc "${SRC}" > "${IMG}"
              ;;
            *)
              cp -f "${SRC}" "${IMG}"
              ;;
          esac

          test -s "${IMG}"

          if [[ "${BUILD_QCOW2}" == "true" ]]; then
            qemu-img convert \
              -p \
              -f raw \
              -O qcow2 \
              "${IMG}" \
              "${OUT}/openwrt-x86-64-uefi-${FILESYSTEM}.qcow2"
          fi

          echo
          echo "Generated images:"
          ls -lh "${OUT}"

      - name: Generate checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${GITHUB_WORKSPACE}/release"
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ inputs.openwrt_version }}-${{ inputs.filesystem }}
          path: release/*
          if-no-files-found: error
