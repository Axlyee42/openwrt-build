name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

      bios:
        description: "发布 BIOS 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "发布 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW"
        required: true
        default: false
        type: boolean

  workflow_call:
    inputs:
      openwrt_version:
        required: false
        type: string
        default: ""

      rootfs_size:
        required: false
        type: string
        default: "4G"

      lan_ip:
        required: false
        type: string
        default: "192.168.1.2"

      bios:
        required: false
        type: boolean
        default: true

      uefi:
        required: false
        type: boolean
        default: true

      qcow2:
        required: false
        type: boolean
        default: true

      vmdk:
        required: false
        type: boolean
        default: false

      raw:
        required: false
        type: boolean
        default: false


permissions:
  contents: write


concurrency:
  group: openwrt-x86-64-build
  cancel-in-progress: false


jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # ==========================================================
      # 基础环境
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            file \
            gawk \
            git \
            git-lfs \
            gettext \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            xsltproc \
            qemu-utils \
            zstd \
            xz-utils \
            ca-certificates

          git lfs install --skip-repo


      # ==========================================================
      # 确定 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION}"

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -n 1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          IMAGEBUILDER_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "IMAGEBUILDER_URL=${IMAGEBUILDER_URL}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "ImageBuilder    : ${IMAGEBUILDER_URL}"
          echo "=========================================="


      # ==========================================================
      # 固件大小
      # ==========================================================

      - name: Resolve rootfs size
        shell: bash
        run: |
          set -e

          SIZE="${{ inputs.rootfs_size }}"

          if [ -z "${SIZE}" ]; then
            SIZE="4G"
          fi

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid rootfs size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS: ${SIZE}"
          echo "Partition size: ${PARTSIZE} MB"


      # ==========================================================
      # 日期
      # ==========================================================

      - name: Set build information
        shell: bash
        run: |
          set -e

          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=$(date -u +%H%M%S)" >> "${GITHUB_ENV}"

          echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"


      # ==========================================================
      # 下载官方 OpenWrt ImageBuilder
      # ==========================================================

      - name: Download OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          wget \
            --progress=dot:giga \
            -O imagebuilder.tar.zst \
            "${IMAGEBUILDER_URL}"

          mkdir -p imagebuilder

          tar \
            --zstd \
            -xf imagebuilder.tar.zst \
            --strip-components=1 \
            -C imagebuilder

          echo
          echo "ImageBuilder:"
          ls -lah imagebuilder


      # ==========================================================
      # 检查 ImageBuilder
      # ==========================================================

      - name: Check ImageBuilder
        working-directory: imagebuilder
        shell: bash
        run: |
          set -e

          echo
          echo "=========================================="
          echo "ImageBuilder information"
          echo "=========================================="

          make info

          echo
          echo "=========================================="
          echo "ImageBuilder help"
          echo "=========================================="

          make help


      # ==========================================================
      # 获取第三方 APK
      #
      # 采用 wukongdaily/ImmortalWrt-ImageBuilder
      # 25.12.x 的同样思路
      #
      # wukongdaily/apk:
      # 第三方 OpenWrt 25.12 APK
      # ==========================================================

      - name: Download third-party APK repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third-party-apk

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/apk.git \
            third-party-apk

          cd third-party-apk

          git lfs pull || true

          echo
          echo "Third-party repository:"
          find . \
            -type f \
            -name '*.apk' \
            -print | head -100

          APK_COUNT="$(
            find . \
              -type f \
              -name '*.apk' |
            wc -l
          )"

          echo
          echo "APK count: ${APK_COUNT}"

          if [ "${APK_COUNT}" -eq 0 ]; then
            echo
            echo "ERROR: No APK files found in wukongdaily/apk."
            echo
            echo "The third-party APK repository may have changed."
            exit 1
          fi


      # ==========================================================
      # 复制第三方 APK 到 ImageBuilder
      #
      # OpenWrt ImageBuilder 官方支持 packages/ 目录
      # ==========================================================

      - name: Prepare third-party packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p imagebuilder/packages

          find third-party-apk \
            -type f \
            -name '*.apk' \
            -exec cp -f {} imagebuilder/packages/ \;

          echo
          echo "Packages copied to ImageBuilder:"
          find imagebuilder/packages \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' |
          sort


      # ==========================================================
      # 读取第三方包清单
      # ==========================================================

      - name: Load custom package list
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f shell/apk-custom-packages.sh ]; then
            echo "ERROR: shell/apk-custom-packages.sh not found."
            exit 1
          fi

          # shellcheck disable=SC1091
          source shell/apk-custom-packages.sh

          if [ -z "${CUSTOM_PACKAGES:-}" ]; then
            echo "ERROR: CUSTOM_PACKAGES is empty."
            exit 1
          fi

          printf '%s\n' "${CUSTOM_PACKAGES}" \
            > selected-packages.txt

          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "Selected packages"
          echo "=========================================="

          printf '%s\n' "${CUSTOM_PACKAGES}"


      # ==========================================================
      # 生成 files
      # ==========================================================

      - name: Prepare custom files
        shell: bash
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}
          LAN_IP: ${{ inputs.lan_ip }}
        run: |
          set -euo pipefail

          if [ -z "${WAN1_USER}" ] || [ -z "${WAN1_PASS}" ]; then
            echo "ERROR: WAN1_USER / WAN1_PASS are not configured."
            exit 1
          fi

          if [ -z "${WAN2_USER}" ] || [ -z "${WAN2_PASS}" ]; then
            echo "ERROR: WAN2_USER / WAN2_PASS are not configured."
            exit 1
          fi

          if [ -z "${LAN_IP}" ]; then
            LAN_IP="192.168.1.2"
          fi

          mkdir -p \
            imagebuilder/files/etc/config \
            imagebuilder/files/etc/uci-defaults

          # ------------------------------------------------------
          # network
          # ------------------------------------------------------

          cp \
            files/etc/config/network \
            imagebuilder/files/etc/config/network

          sed -i \
            "s|__WAN1_USER__|${WAN1_USER}|g" \
            imagebuilder/files/etc/config/network

          sed -i \
            "s|__WAN1_PASS__|${WAN1_PASS}|g" \
            imagebuilder/files/etc/config/network

          sed -i \
            "s|__WAN2_USER__|${WAN2_USER}|g" \
            imagebuilder/files/etc/config/network

          sed -i \
            "s|__WAN2_PASS__|${WAN2_PASS}|g" \
            imagebuilder/files/etc/config/network

          sed -i \
            "s|__LAN_IP__|${LAN_IP}|g" \
            imagebuilder/files/etc/config/network

          # ------------------------------------------------------
          # DHCP / IPv6
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/config/dhcp <<'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'

          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'

          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          EOF

          # ------------------------------------------------------
          # mwan3
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/config/mwan3 <<'EOF'
          config globals 'globals'
              option mmx_mask '0x3F00'

          config interface 'wan'
              option enabled '1'
              option family 'ipv4'
              list track_ip '1.1.1.1'
              list track_ip '8.8.8.8'
              option reliability '1'
              option count '1'
              option timeout '2'
              option interval '5'
              option down '3'
              option up '8'

          config interface 'wanb'
              option enabled '1'
              option family 'ipv4'
              list track_ip '1.1.1.1'
              list track_ip '8.8.8.8'
              option reliability '1'
              option count '1'
              option timeout '2'
              option interval '5'
              option down '3'
              option up '8'

          config member 'wan_m1_w1'
              option interface 'wan'
              option metric '1'
              option weight '1'

          config member 'wanb_m1_w1'
              option interface 'wanb'
              option metric '1'
              option weight '1'

          config policy 'balanced'
              list use_member 'wan_m1_w1'
              list use_member 'wanb_m1_w1'

          config policy 'wan_only'
              list use_member 'wan_m1_w1'

          config policy 'wanb_only'
              list use_member 'wanb_m1_w1'

          config rule 'default_rule_v4'
              option family 'ipv4'
              option dest_ip '0.0.0.0/0'
              option use_policy 'balanced'
              option sticky '0'
          EOF

          # ------------------------------------------------------
          # 默认简体中文
          # ------------------------------------------------------

          cat > imagebuilder/files/etc/uci-defaults/99-default-language <<'EOF'
          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0
          EOF

          chmod +x \
            imagebuilder/files/etc/uci-defaults/99-default-language

          # ------------------------------------------------------
          # Build info
          # ------------------------------------------------------

          mkdir -p imagebuilder/files/etc/openwrt-custom

          cat > imagebuilder/files/etc/openwrt-custom/build-info <<EOF
          OpenWrt Custom ImageBuilder Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC

          LAN:
          ${LAN_IP}

          eth0:
          WAN / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          Enabled

          mwan3:
          Enabled
          EOF

          echo
          echo "Custom files:"
          find imagebuilder/files -type f -print


      # ==========================================================
      # 构建 Image
      # ==========================================================

      - name: Build OpenWrt Image
        working-directory: imagebuilder
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Building OpenWrt Image"
          echo "=========================================="

          echo
          echo "OpenWrt:"
          echo "${OPENWRT_VERSION}"

          echo
          echo "RootFS:"
          echo "${ROOTFS_PARTSIZE} MB"

          echo
          echo "Packages:"
          echo "${CUSTOM_PACKAGES}"

          echo
          echo "Starting ImageBuilder..."

          make image \
            PROFILE="generic" \
            PACKAGES="${CUSTOM_PACKAGES}" \
            FILES="files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            V=s

          echo
          echo "=========================================="
          echo "Build finished"
          echo "=========================================="

          find bin \
            -type f \
            -maxdepth 5 \
            -print


      # ==========================================================
      # 读取 manifest
      # ==========================================================

      - name: Generate manifest
        working-directory: imagebuilder
        shell: bash
        run: |
          set -e

          make manifest \
            PROFILE="generic" \
            PACKAGES="${CUSTOM_PACKAGES}" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            STRIP_ABI=1 \
            > ../manifest.txt

          echo
          echo "Manifest:"
          cat ../manifest.txt


      # ==========================================================
      # 准备 Release
      # ==========================================================

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          IMAGE_DIR="imagebuilder/bin/targets/x86/64"

          echo
          echo "Available images:"
          find "${IMAGE_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
          sort


      # ==========================================================
      # BIOS
      # ==========================================================

      - name: Prepare BIOS image
        if: inputs.bios
        shell: bash
        run: |
          set -e

          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name 'openwrt-*-x86-64-generic-ext4-combined.img.gz' |
            head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: BIOS image not found."
            exit 1
          fi

          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-BIOS.img.gz"


      # ==========================================================
      # UEFI
      # ==========================================================

      - name: Prepare UEFI image
        if: inputs.uefi
        shell: bash
        run: |
          set -e

          IMAGE="$(
            find imagebuilder/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name 'openwrt-*-x86-64-generic-ext4-combined-efi.img.gz' |
            head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI image not found."
            exit 1
          fi

          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


      # ==========================================================
      # 为虚拟机转换准备 RAW
      # ==========================================================

      - name: Prepare virtual machine source image
        if: inputs.qcow2 || inputs.vmdk || inputs.raw
        shell: bash
        run: |
          set -e

          IMAGE=""

          if [ "${{ inputs.uefi }}" = "true" ]; then
            IMAGE="$(
              find imagebuilder/bin/targets/x86/64 \
                -maxdepth 1 \
                -type f \
                -name 'openwrt-*-x86-64-generic-ext4-combined-efi.img.gz' |
              head -n 1
            )"
          fi

          if [ -z "${IMAGE}" ]; then
            IMAGE="$(
              find imagebuilder/bin/targets/x86/64 \
                -maxdepth 1 \
                -type f \
                -name 'openwrt-*-x86-64-generic-ext4-combined.img.gz' |
              head -n 1
            )"
          fi

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: No VM source image found."
            exit 1
          fi

          echo "VM source:"
          echo "${IMAGE}"

          gzip -dc "${IMAGE}" > openwrt.raw

          ls -lh openwrt.raw


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        if: inputs.qcow2
        shell: bash
        run: |
          set -e

          qemu-img convert \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-VM.qcow2"


      # ==========================================================
      # VMDK
      # ==========================================================

      - name: Create VMDK
        if: inputs.vmdk
        shell: bash
        run: |
          set -e

          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-VM.vmdk"


      # ==========================================================
      # RAW
      # ==========================================================

      - name: Create RAW
        if: inputs.raw
        shell: bash
        run: |
          set -e

          cp \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-VM.raw"


      # ==========================================================
      # Release 信息
      # ==========================================================

      - name: Create release information
        shell: bash
        env:
          LAN_IP: ${{ inputs.lan_ip }}
        run: |
          set -e

          cp manifest.txt \
            release/manifest.txt

          cp selected-packages.txt \
            release/selected-packages.txt

          cat > release/build-info.txt <<EOF
          ==========================================
          OpenWrt Custom ImageBuilder
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC

          LAN:
          ${LAN_IP}

          Network:
          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          IPv6:
          Enabled

          mwan3:
          Enabled

          PPPoE credentials:
          Stored in GitHub Secrets and NOT included here.

          ==========================================
          EOF


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          cd release

          sha256sum \
            *.img.gz \
            *.qcow2 \
            *.vmdk \
            *.raw \
            2>/dev/null \
            > sha256sums || true

          if [ ! -s sha256sums ]; then
            echo "ERROR: No image files available for SHA256."
            exit 1
          fi


      # ==========================================================
      # 显示最终文件
      # ==========================================================

      - name: Show release files
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "Final release files"
          echo "=========================================="

          ls -lh release


      # ==========================================================
      # 创建 GitHub Release
      #
      # 不使用 softprops/action-gh-release
      # 避免 Node 20 警告及空文件上传问题
      # ==========================================================

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAN_IP: ${{ inputs.lan_ip }}
        run: |
          set -euo pipefail

          TAG="v${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}"

          TITLE="OpenWrt ${OPENWRT_VERSION} x86-64 ${ROOTFS_SIZE} ${BUILD_DATE}"

          cat > release-notes.md <<EOF
          # OpenWrt ${OPENWRT_VERSION} x86-64

          ## Build

          - OpenWrt: \`${OPENWRT_VERSION}\`
          - Target: \`x86-64\`
          - ImageBuilder: official OpenWrt
          - RootFS: \`${ROOTFS_SIZE}\`
          - Build date: \`${BUILD_DATE}\`

          ## Network

          - \`eth0\` → WAN / PPPoE
          - \`eth1\` → WANB / PPPoE
          - \`eth2\` → LAN
          - \`eth3\` → LAN
          - \`eth4\` → LAN
          - \`eth5\` → LAN

          - LAN IP: \`${LAN_IP}\`
          - IPv6: Enabled
          - mwan3: Enabled

          ## Included

          - LuCI
          - Simplified Chinese
          - PassWall
          - OpenClash
          - Aurora
          - Aurora Config
          - Bandix
          - luci-app-run
          - FileBrowser Go
          - mwan3
          - PPPoE
          - IPv6
          - ttyd
          - UPnP
          - VLMCSd
          - Timewol
          - Autoreboot

          ## Files

          See \`build-info.txt\`, \`manifest.txt\`,
          \`selected-packages.txt\` and \`sha256sums\`.

          PPPoE credentials are stored only in GitHub Secrets
          and are not included in this Release.
          EOF

          echo
          echo "Creating Release:"
          echo "${TAG}"

          gh release create \
            "${TAG}" \
            --title "${TITLE}" \
            --notes-file release-notes.md \
            release/*

          echo
          echo "=========================================="
          echo "Release created"
          echo "=========================================="

          gh release view "${TAG}"


      # ==========================================================
      # GitHub Actions Summary
      # ==========================================================

      - name: Summary
        shell: bash
        run: |
          {
            echo "## OpenWrt Build"
            echo
            echo "- Version: ${OPENWRT_VERSION}"
            echo "- Target: x86-64"
            echo "- RootFS: ${ROOTFS_SIZE}"
            echo "- Build date: ${BUILD_DATE}"
            echo
            echo "### Release files"
            echo
            ls -lh release
          } >> "${GITHUB_STEP_SUMMARY}"
