name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:

      openwrt_version:
        description: "OpenWrt 25.12.x，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件 RootFS 大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN IP"
        required: true
        default: "192.168.1.2"
        type: string

      bios:
        description: "生成 BIOS 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2 虚拟机镜像"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK 虚拟机镜像"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW 镜像"
        required: true
        default: false
        type: boolean

  repository_dispatch:
    types:
      - openwrt-release


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. 获取 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}
        run: |

          VERSION="${MANUAL_VERSION}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION}"
          fi

          if [ -z "${VERSION}" ]; then

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )

          fi


          if ! echo "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi


          COMMIT="$(
            git ls-remote \
              https://github.com/openwrt/openwrt.git \
              "refs/tags/v${VERSION}" |
            awk '{print $1}'
          )"


          if [ -z "${COMMIT}" ]; then
            echo "Cannot find OpenWrt commit."
            exit 1
          fi


          echo "OPENWRT_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "OPENWRT_COMMIT=${COMMIT}" >> "$GITHUB_ENV"

          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%H%M%S)" >> "$GITHUB_ENV"


          echo
          echo "=========================================="
          echo "OpenWrt : ${VERSION}"
          echo "Commit  : ${COMMIT}"
          echo "Date    : $(date -u)"
          echo "=========================================="


      # ==========================================================
      # 3. RootFS 大小
      # ==========================================================

      - name: Configure rootfs size
        shell: bash
        run: |

          SIZE="${{ inputs.rootfs_size }}"

          case "${SIZE}" in

            1G)
              PARTSIZE=1024
              ;;

            2G)
              PARTSIZE=2048
              ;;

            3G)
              PARTSIZE=3072
              ;;

            4G)
              PARTSIZE=4096
              ;;

            *)
              echo "Invalid RootFS size."
              exit 1
              ;;

          esac


          echo "ROOTFS_SIZE=${SIZE}" >> "$GITHUB_ENV"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "$GITHUB_ENV"


      # ==========================================================
      # 4. 编译依赖
      # ==========================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar \
            zstd


      # ==========================================================
      # 5. 下载 OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        run: |

          git clone \
            --depth=1 \
            --branch "v${OPENWRT_VERSION}" \
            https://github.com/openwrt/openwrt.git \
            openwrt


      # ==========================================================
      # 6. 添加 PassWall feeds
      #
      # 这是 PassWall 官方目前推荐的源码编译方式。
      # ==========================================================

      - name: Add PassWall feeds
        working-directory: openwrt
        run: |

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          EOF


      # ==========================================================
      # 7. 更新 feeds
      # ==========================================================

      - name: Update feeds
        working-directory: openwrt
        run: |

          ./scripts/feeds update -a


      # ==========================================================
      # 8. 安装官方 feeds
      # ==========================================================

      - name: Install feeds
        working-directory: openwrt
        run: |

          ./scripts/feeds install -a


      # ==========================================================
      # 9. 强制安装 PassWall packages
      # ==========================================================

      - name: Install PassWall packages
        working-directory: openwrt
        run: |

          ./scripts/feeds install -a -f -p passwall_packages


      # ==========================================================
      # 10. 安装 PassWall LuCI
      # ==========================================================

      - name: Install PassWall LuCI
        working-directory: openwrt
        run: |

          ./scripts/feeds install luci-app-passwall

          ./scripts/feeds install luci-base


      # ==========================================================
      # 11. 第三方软件
      #
      # 不放进 feeds，直接放到 package/custom
      # 避免影响官方 feeds update
      # ==========================================================

      - name: Add third-party packages
        working-directory: openwrt
        run: |

          mkdir -p package/custom


          # ------------------------------------------------------
          # OpenClash
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            package/custom/OpenClash


          # ------------------------------------------------------
          # Aurora
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            package/custom/luci-theme-aurora


          # ------------------------------------------------------
          # Bandix
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            https://github.com/timsaya/openwrt-bandix.git \
            package/custom/openwrt-bandix


          git clone \
            --depth=1 \
            https://github.com/timsaya/luci-app-bandix.git \
            package/custom/luci-app-bandix


          # ------------------------------------------------------
          # luci-app-run
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/luci-app-run.git \
            package/custom/luci-app-run


      # ==========================================================
      # 12. 读取你的自定义包列表
      # ==========================================================

      - name: Load custom package list
        shell: bash
        run: |

          if [ ! -f shell/apk-custom-packages.sh ]; then

            echo "ERROR:"
            echo "shell/apk-custom-packages.sh not found."

            exit 1

          fi


          source shell/apk-custom-packages.sh


          if [ -z "${CUSTOM_PACKAGES:-}" ]; then

            echo "ERROR:"
            echo "CUSTOM_PACKAGES is empty."

            exit 1

          fi


          echo "=========================================="
          echo "Custom packages"
          echo "=========================================="

          echo "${CUSTOM_PACKAGES}"


          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "$GITHUB_ENV"


      # ==========================================================
      # 13. 生成基础配置
      # ==========================================================

      - name: Generate OpenWrt config
        working-directory: openwrt
        run: |

          cat > .config <<EOF

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_ipv6=y
          CONFIG_PACKAGE_kmod-ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y

          CONFIG_PACKAGE_luci-app-passwall=y

          CONFIG_PACKAGE_luci-app-openclash=y

          EOF


          if [ "${{ inputs.bios }}" = "true" ]; then
            echo "CONFIG_GRUB_IMAGES=y" >> .config
          fi


          if [ "${{ inputs.uefi }}" = "true" ]; then
            echo "CONFIG_GRUB_EFI_IMAGES=y" >> .config
          fi


      # ==========================================================
      # 14. 加入自定义包
      # ==========================================================

      - name: Enable custom packages
        working-directory: openwrt
        shell: bash
        run: |

          for package in ${CUSTOM_PACKAGES}; do

            echo "CONFIG_PACKAGE_${package}=y" >> .config

          done


          make defconfig


      # ==========================================================
      # 15. 网络配置
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2~eth5 = LAN
      #
      # PPPoE 密码来自 GitHub Secrets
      # ==========================================================

      - name: Generate network configuration
        env:

          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |

          if [ -z "${WAN1_USER}" ] || [ -z "${WAN1_PASS}" ]; then
            echo "WAN1 PPPoE credentials are missing."
            exit 1
          fi


          if [ -z "${WAN2_USER}" ] || [ -z "${WAN2_PASS}" ]; then
            echo "WAN2 PPPoE credentials are missing."
            exit 1
          fi


          LAN_IP="${{ inputs.lan_ip }}"


          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/network <<EOF

          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'


          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'


          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'


          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 'auto'


          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'


          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 'auto'


          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          EOF


      # ==========================================================
      # 16. DHCP / IPv6
      # ==========================================================

      - name: Generate DHCP configuration
        run: |

          cat > openwrt/files/etc/config/dhcp <<'EOF'

          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'


          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'


          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'


          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'

          EOF


      # ==========================================================
      # 17. 默认简体中文
      # ==========================================================

      - name: Set default language
        run: |

          mkdir -p \
            openwrt/files/etc/uci-defaults


          cat > openwrt/files/etc/uci-defaults/99-default-language <<'EOF'

          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0

          EOF


          chmod +x \
            openwrt/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # 18. 编译信息
      # ==========================================================

      - name: Add build information
        run: |

          mkdir -p \
            openwrt/files/etc/openwrt-custom


          cat > openwrt/files/etc/openwrt-custom/build-info <<EOF

          OpenWrt Custom Build

          Version:
          ${OPENWRT_VERSION}

          Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC

          LAN:
          ${{ inputs.lan_ip }}

          eth0:
          WAN / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          Enabled

          EOF


      # ==========================================================
      # 19. 最终配置
      # ==========================================================

      - name: Finalize config
        working-directory: openwrt
        run: |

          make defconfig


          echo
          echo "=========================================="
          echo "Selected packages"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_' .config | grep '=y' | head -100 || true


      # ==========================================================
      # 20. 下载源码
      # ==========================================================

      - name: Download sources
        working-directory: openwrt
        run: |

          make download \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 21. 编译
      # ==========================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |

          make \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 22. 准备 Release
      # ==========================================================

      - name: Prepare release
        run: |

          rm -rf release

          mkdir -p release


      # ==========================================================
      # 23. BIOS
      # ==========================================================

      - name: Copy BIOS image
        if: inputs.bios
        run: |

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined.img.gz' |
            grep -v 'efi' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "BIOS image not found."

            find openwrt/bin/targets/x86/64 -maxdepth 1 -type f

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-BIOS.img.gz"


      # ==========================================================
      # 24. UEFI
      # ==========================================================

      - name: Copy UEFI image
        if: inputs.uefi
        run: |

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "UEFI image not found."

            find openwrt/bin/targets/x86/64 -maxdepth 1 -type f

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


      # ==========================================================
      # 25. 解压 RAW
      # ==========================================================

      - name: Prepare raw image
        if: inputs.qcow2 || inputs.vmdk || inputs.raw
        run: |

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )


          if [ -z "${IMAGE}" ]; then
            echo "UEFI image not found."
            exit 1
          fi


          gzip -dc "${IMAGE}" > openwrt.raw


      # ==========================================================
      # 26. QCOW2
      # ==========================================================

      - name: Create QCOW2
        if: inputs.qcow2
        run: |

          qemu-img convert \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


      # ==========================================================
      # 27. VMDK
      # ==========================================================

      - name: Create VMDK
        if: inputs.vmdk
        run: |

          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.vmdk"


      # ==========================================================
      # 28. RAW
      # ==========================================================

      - name: Create RAW
        if: inputs.raw
        run: |

          cp openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.raw"


      # ==========================================================
      # 29. SHA256
      # ==========================================================

      - name: Generate SHA256
        run: |

          cd release

          sha256sum * > sha256sums


      # ==========================================================
      # 30. Release 信息
      # ==========================================================

      - name: Create release info
        run: |

          cat > release/build-info.txt <<EOF

          ==========================================
          OpenWrt Custom Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC


          Network:

          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN


          LAN IP:

          ${{ inputs.lan_ip }}


          IPv6:

          Enabled

          ==========================================

          EOF


      # ==========================================================
      # 31. 查看最终文件
      # ==========================================================

      - name: Show release files
        run: |

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release


      # ==========================================================
      # 32. GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ inputs.lan_ip }}`
            - IPv6: Enabled

            ## Included

            - LuCI
            - Simplified Chinese
            - PassWall
            - OpenClash
            - Aurora
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - mwan3
            - PPPoE
            - IPv6
            - ttyd
            - UPnP
            - VLMCSd
            - Timewol
            - Autoreboot

          files: |
            release/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}