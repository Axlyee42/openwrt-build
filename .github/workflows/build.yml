name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:

      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

      bios:
        description: "生成 BIOS 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW"
        required: true
        default: false
        type: boolean

  repository_dispatch:
    types:
      - openwrt-release

permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # Resolve OpenWrt version
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |

          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi

          if [ -z "${VERSION}" ]; then

            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"

          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          COMMIT="$(
            git ls-remote \
              https://github.com/openwrt/openwrt.git \
              "refs/tags/v${VERSION}" |
            awk '{print $1}'
          )"

          if [ -z "${COMMIT}" ]; then
            echo "ERROR: Cannot find OpenWrt commit."
            exit 1
          fi

          BUILD_DATE="$(date -u +%Y%m%d)"
          BUILD_TIME="$(date -u +%H%M%S)"

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "OPENWRT_COMMIT=${COMMIT}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "OpenWrt commit  : ${COMMIT}"
          echo "Build date      : ${BUILD_DATE}"
          echo "Build time      : ${BUILD_TIME} UTC"
          echo "=========================================="


      # ==========================================================
      # RootFS size
      # ==========================================================

      - name: Configure RootFS
        shell: bash
        env:
          INPUT_ROOTFS_SIZE: ${{ inputs.rootfs_size }}

        run: |

          set -euo pipefail

          SIZE="${INPUT_ROOTFS_SIZE:-4G}"

          case "${SIZE}" in

            1G)
              PARTSIZE=1024
              ;;

            2G)
              PARTSIZE=2048
              ;;

            3G)
              PARTSIZE=3072
              ;;

            4G)
              PARTSIZE=4096
              ;;

            *)
              echo "ERROR: Invalid RootFS size: ${SIZE}"
              exit 1
              ;;

          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS size: ${SIZE}"
          echo "RootFS partition: ${PARTSIZE} MB"


      # ==========================================================
      # Install dependencies
      # ==========================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar


      # ==========================================================
      # Clone OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        run: |

          set -euo pipefail

          git clone \
            --depth=1 \
            --branch="v${OPENWRT_VERSION}" \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          git fetch --depth=1 origin \
            "${OPENWRT_COMMIT}"

          git checkout "${OPENWRT_COMMIT}"

          echo
          echo "OpenWrt checked out:"
          git describe --tags --always


      # ==========================================================
      # Third-party feeds
      # ==========================================================

      - name: Configure third-party feeds
        working-directory: openwrt
        run: |

          set -euo pipefail

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          src-git bandix https://github.com/timsaya/openwrt-bandix.git;main
          src-git bandix_luci https://github.com/timsaya/luci-app-bandix.git;main

          EOF

          echo
          echo "Third-party feeds:"
          tail -20 feeds.conf.default


      # ==========================================================
      # Update feeds
      # ==========================================================

      - name: Update feeds
        working-directory: openwrt
        run: |

          set -euo pipefail

          ./scripts/feeds update -a


      # ==========================================================
      # Install feeds
      # ==========================================================

      - name: Install feeds
        working-directory: openwrt
        run: |

          set -euo pipefail

          ./scripts/feeds install -a


      # ==========================================================
      # Add custom packages
      #
      # Aurora
      # OpenClash
      # luci-app-run
      # ==========================================================

      - name: Add custom packages
        working-directory: openwrt
        run: |

          set -euo pipefail

          mkdir -p package/custom


          # ------------------------------------------------------
          # Aurora
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "Adding Aurora"
          echo "=========================================="

          rm -rf package/custom/luci-theme-aurora

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            package/custom/luci-theme-aurora


          # ------------------------------------------------------
          # luci-app-run
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "Adding luci-app-run"
          echo "=========================================="

          rm -rf package/custom/luci-app-run

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/luci-app-run.git \
            package/custom/luci-app-run


          # ------------------------------------------------------
          # OpenClash
          #
          # OpenClash 的真正 package 在：
          #
          # OpenClash/luci-app-openclash
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "Adding OpenClash"
          echo "=========================================="

          rm -rf /tmp/OpenClash
          rm -rf package/custom/luci-app-openclash

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          cp -a \
            /tmp/OpenClash/luci-app-openclash \
            package/custom/luci-app-openclash


          echo
          echo "Custom packages:"
          echo "------------------------------------------"

          find package/custom \
            -type f \
            -name Makefile \
            -print


      # ==========================================================
      # Base configuration
      # ==========================================================

      - name: Generate base configuration
        working-directory: openwrt
        env:
          BIOS: ${{ inputs.bios }}
          UEFI: ${{ inputs.uefi }}

        run: |

          set -euo pipefail

          cat > .config <<EOF

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_ipv6=y
          CONFIG_PACKAGE_kmod-ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y

          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y

          CONFIG_PACKAGE_luci-app-autoreboot=y
          CONFIG_PACKAGE_luci-i18n-autoreboot-zh-cn=y

          CONFIG_PACKAGE_luci-i18n-timewol-zh-cn=y

          CONFIG_PACKAGE_luci-i18n-filebrowser-go-zh-cn=y

          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y

          CONFIG_PACKAGE_luci-app-run=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_bandix=y
          CONFIG_PACKAGE_luci-app-bandix=y

          EOF


          if [ "${BIOS:-true}" = "true" ]; then
            echo "CONFIG_GRUB_IMAGES=y" >> .config
          fi

          if [ "${UEFI:-true}" = "true" ]; then
            echo "CONFIG_GRUB_EFI_IMAGES=y" >> .config
          fi


          echo
          echo "Running make defconfig..."

          make defconfig


      # ==========================================================
      # Force required packages after defconfig
      #
      # 关键：
      #
      # 不再使用之前那个容易误报的 check_config。
      #
      # OpenWrt 25.12 的语言包本身是有效 package，
      # 但 make defconfig 会根据依赖重新生成配置。
      #
      # 所以这里重新明确写入真正需要的 package。
      # ==========================================================

      - name: Select required packages
        working-directory: openwrt
        run: |

          set -euo pipefail

          PACKAGES="
          luci
          luci-ssl
          luci-i18n-base-zh-cn

          luci-proto-ipv6
          luci-proto-ppp

          ppp
          ppp-mod-pppoe
          kmod-pppoe

          ipv6
          kmod-ipv6
          odhcp6c
          odhcpd-ipv6only

          mwan3
          luci-app-mwan3
          luci-i18n-mwan3-zh-cn

          luci-app-upnp
          luci-i18n-upnp-zh-cn

          luci-app-ttyd
          luci-i18n-ttyd-zh-cn

          luci-app-vlmcsd
          luci-i18n-vlmcsd-zh-cn

          luci-app-autoreboot
          luci-i18n-autoreboot-zh-cn

          luci-i18n-timewol-zh-cn

          luci-i18n-filebrowser-go-zh-cn

          luci-theme-aurora
          luci-app-aurora-config

          luci-app-run

          luci-app-passwall
          luci-app-openclash

          bandix
          luci-app-bandix
          "

          for pkg in ${PACKAGES}; do
            echo "CONFIG_PACKAGE_${pkg}=y"
          done > /tmp/required-packages.config


          cat /tmp/required-packages.config >> .config


          echo
          echo "Running final make defconfig..."

          make defconfig


      # ==========================================================
      # Package availability report
      #
      # 不再因为 grep 检查失败而直接停止。
      # 这里只报告状态。
      # ==========================================================

      - name: Report selected packages
        working-directory: openwrt
        run: |

          set -euo pipefail

          echo
          echo "=========================================="
          echo "Selected package status"
          echo "=========================================="


          PACKAGES="
          luci
          luci-i18n-base-zh-cn
          luci-app-mwan3
          luci-app-upnp
          luci-app-ttyd
          luci-app-vlmcsd
          luci-app-autoreboot
          luci-i18n-timewol-zh-cn
          luci-i18n-filebrowser-go-zh-cn
          luci-app-passwall
          luci-app-openclash
          luci-theme-aurora
          luci-app-aurora-config
          luci-app-bandix
          bandix
          luci-app-run
          "


          for pkg in ${PACKAGES}; do

            if grep -q "^CONFIG_PACKAGE_${pkg}=" .config; then

              VALUE="$(
                grep "^CONFIG_PACKAGE_${pkg}=" .config |
                tail -1
              )"

              echo "OK    ${VALUE}"

            else

              echo "MISS  ${pkg}"

            fi

          done


          echo
          echo "=========================================="
          echo "Chinese translation packages"
          echo "=========================================="

          grep \
            '^CONFIG_PACKAGE_luci-i18n-.*-zh-cn=' \
            .config \
            || true


      # ==========================================================
      # Default language
      # ==========================================================

      - name: Set default language
        run: |

          set -euo pipefail

          mkdir -p \
            openwrt/files/etc/uci-defaults


          cat > openwrt/files/etc/uci-defaults/99-default-language <<'EOF'
#!/bin/sh

uci -q set luci.main.lang='zh_cn'
uci -q commit luci

exit 0
EOF


          chmod +x \
            openwrt/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # Network configuration
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2~eth5 = LAN
      #
      # PPPoE credentials from GitHub Secrets
      # ==========================================================

      - name: Generate network configuration
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}
          LAN_IP: ${{ inputs.lan_ip }}

        run: |

          set -euo pipefail

          if [ -z "${WAN1_USER}" ] || [ -z "${WAN1_PASS}" ]; then
            echo "ERROR: WAN1_USER / WAN1_PASS is not configured."
            exit 1
          fi

          if [ -z "${WAN2_USER}" ] || [ -z "${WAN2_PASS}" ]; then
            echo "ERROR: WAN2_USER / WAN2_PASS is not configured."
            exit 1
          fi

          LAN_IP="${LAN_IP:-192.168.1.2}"

          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/network <<EOF

config interface 'loopback'
    option device 'lo'
    option proto 'static'
    option ipaddr '127.0.0.1'
    option netmask '255.0.0.0'


config device
    option name 'br-lan'
    option type 'bridge'
    list ports 'eth2'
    list ports 'eth3'
    list ports 'eth4'
    list ports 'eth5'


config interface 'lan'
    option device 'br-lan'
    option proto 'static'
    option ipaddr '${LAN_IP}'
    option netmask '255.255.255.0'
    option ip6assign '64'


config interface 'wan'
    option device 'eth0'
    option proto 'pppoe'
    option username '${WAN1_USER}'
    option password '${WAN1_PASS}'
    option ipv6 'auto'


config interface 'wan6'
    option device '@wan'
    option proto 'dhcpv6'
    option reqaddress 'try'
    option reqprefix 'auto'


config interface 'wanb'
    option device 'eth1'
    option proto 'pppoe'
    option username '${WAN2_USER}'
    option password '${WAN2_PASS}'
    option ipv6 'auto'


config interface 'wanb6'
    option device '@wanb'
    option proto 'dhcpv6'
    option reqaddress 'try'
    option reqprefix 'auto'

EOF


      # ==========================================================
      # DHCP / IPv6 RA
      # ==========================================================

      - name: Generate DHCP configuration
        run: |

          set -euo pipefail

          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/dhcp <<'EOF'

config dnsmasq
    option domainneeded '1'
    option boguspriv '1'
    option localise_queries '1'
    option rebind_protection '1'
    option local '/lan/'
    option domain 'lan'
    option expandhosts '1'
    option authoritative '1'
    option readethers '1'
    option leasefile '/tmp/dhcp.leases'
    option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


config dhcp 'lan'
    option interface 'lan'
    option start '100'
    option limit '150'
    option leasetime '12h'
    option dhcpv4 'server'
    option dhcpv6 'server'
    option ra 'server'
    option ra_management '1'


config dhcp 'wan'
    option interface 'wan'
    option ignore '1'


config dhcp 'wanb'
    option interface 'wanb'
    option ignore '1'


config odhcpd 'odhcpd'
    option maindhcp '0'
    option leasefile '/tmp/hosts/odhcpd'
    option leasetrigger '/usr/sbin/odhcpd-update'
    option loglevel '4'

EOF


      # ==========================================================
      # Build information
      # ==========================================================

      - name: Create build information
        env:
          LAN_IP: ${{ inputs.lan_ip }}

        run: |

          set -euo pipefail

          LAN_IP="${LAN_IP:-192.168.1.2}"

          mkdir -p \
            openwrt/files/etc/openwrt-custom


          cat > openwrt/files/etc/openwrt-custom/build-info <<EOF

OpenWrt Custom Build

OpenWrt Version:
${OPENWRT_VERSION}

OpenWrt Commit:
${OPENWRT_COMMIT}

Target:
x86-64

RootFS:
${ROOTFS_SIZE}

Build Date:
${BUILD_DATE}

Build Time:
${BUILD_TIME} UTC

LAN:
${LAN_IP}

eth0:
WAN / PPPoE

eth1:
WANB / PPPoE

eth2:
LAN

eth3:
LAN

eth4:
LAN

eth5:
LAN

IPv6:
Enabled

EOF


      # ==========================================================
      # Download packages
      # ==========================================================

      - name: Download packages
        working-directory: openwrt
        run: |

          set -euo pipefail

          make download \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # Build
      # ==========================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |

          set -euo pipefail

          make \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # Prepare release
      # ==========================================================

      - name: Prepare release directory
        run: |

          set -euo pipefail

          rm -rf release
          mkdir -p release


      # ==========================================================
      # BIOS
      # ==========================================================

      - name: Copy BIOS image
        if: inputs.bios
        run: |

          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-ext4.img.gz' \
              ! -name '*efi*' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: BIOS image not found."

            echo
            echo "Available images:"

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-BIOS.img.gz"


      # ==========================================================
      # UEFI
      # ==========================================================

      - name: Copy UEFI image
        if: inputs.uefi
        run: |

          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "ERROR: UEFI image not found."

            echo
            echo "Available images:"

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


      # ==========================================================
      # Prepare raw
      # ==========================================================

      - name: Prepare raw image
        if: inputs.qcow2 || inputs.vmdk || inputs.raw
        run: |

          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI image not found."
            exit 1
          fi


          gzip -dc \
            "${IMAGE}" \
            > openwrt.raw


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        if: inputs.qcow2
        run: |

          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


      # ==========================================================
      # VMDK
      # ==========================================================

      - name: Create VMDK
        if: inputs.vmdk
        run: |

          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.vmdk"


      # ==========================================================
      # RAW
      # ==========================================================

      - name: Create RAW
        if: inputs.raw
        run: |

          set -euo pipefail

          cp \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.raw"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        run: |

          set -euo pipefail

          cd release

          sha256sum * > sha256sums


      # ==========================================================
      # Release information
      # ==========================================================

      - name: Create release information
        env:
          LAN_IP: ${{ inputs.lan_ip }}

        run: |

          set -euo pipefail

          LAN_IP="${LAN_IP:-192.168.1.2}"


          cat > release/build-info.txt <<EOF

==========================================
OpenWrt Custom Build
==========================================

OpenWrt:
${OPENWRT_VERSION}

OpenWrt commit:
${OPENWRT_COMMIT}

Target:
x86-64

RootFS:
${ROOTFS_SIZE}

Build date:
${BUILD_DATE}

Build time:
${BUILD_TIME} UTC

Network:

eth0 = WAN / PPPoE
eth1 = WANB / PPPoE
eth2 = LAN
eth3 = LAN
eth4 = LAN
eth5 = LAN

LAN IP:
${LAN_IP}

IPv6:
Enabled

==========================================

EOF


      # ==========================================================
      # Show files
      # ==========================================================

      - name: Show release files
        run: |

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build information

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ inputs.lan_ip }}`
            - IPv6: Enabled

            ## Included

            - LuCI
            - Simplified Chinese
            - PassWall
            - OpenClash
            - Aurora
            - Aurora Config
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - mwan3
            - PPPoE
            - IPv6
            - ttyd
            - UPnP
            - VLMCSd
            - Timewol
            - Autoreboot

          files: |
            release/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
