name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

      bios:
        description: "生成 BIOS 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW"
        required: true
        default: false
        type: boolean

  repository_dispatch:
    types:
      - openwrt-release

permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 确定编译参数
      # ==========================================================

      - name: Resolve build options
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |

          set -euo pipefail

          VERSION="${MANUAL_VERSION:-}"

          if [ -z "$VERSION" ]; then
            VERSION="${DISPATCH_VERSION:-}"
          fi


          # ------------------------------------------------------
          # 如果没有指定版本，自动寻找最新 25.12.x
          # ------------------------------------------------------

          if [ -z "$VERSION" ]; then

            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -n 1
            )

          fi


          # ------------------------------------------------------
          # 检查版本格式
          # ------------------------------------------------------

          if ! printf '%s\n' "$VERSION" | grep -Eq '^25\.12\.[0-9]+$'; then

            echo "ERROR: Invalid OpenWrt version:"
            echo "$VERSION"

            exit 1

          fi


          # ------------------------------------------------------
          # 获取对应 commit
          # ------------------------------------------------------

          COMMIT="$(
            git ls-remote \
              https://github.com/openwrt/openwrt.git \
              "refs/tags/v${VERSION}" |
            awk 'NR==1 {print $1}'
          )"


          if [ -z "$COMMIT" ]; then

            echo "ERROR: Cannot find OpenWrt commit."

            exit 1

          fi


          # ------------------------------------------------------
          # workflow_dispatch 使用用户选择
          # repository_dispatch 使用默认值
          # ------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ROOTFS="${{ inputs.rootfs_size }}"
            LAN_IP="${{ inputs.lan_ip }}"

            BIOS="${{ inputs.bios }}"
            UEFI="${{ inputs.uefi }}"
            QCOW2="${{ inputs.qcow2 }}"
            VMDK="${{ inputs.vmdk }}"
            RAW="${{ inputs.raw }}"

          else

            ROOTFS="4G"
            LAN_IP="192.168.1.2"

            BIOS="true"
            UEFI="true"
            QCOW2="true"
            VMDK="false"
            RAW="false"

          fi


          # ------------------------------------------------------
          # RootFS 大小
          # ------------------------------------------------------

          case "$ROOTFS" in

            1G)
              PARTSIZE=1024
              ;;

            2G)
              PARTSIZE=2048
              ;;

            3G)
              PARTSIZE=3072
              ;;

            4G)
              PARTSIZE=4096
              ;;

            *)
              echo "ERROR: Invalid rootfs size:"
              echo "$ROOTFS"
              exit 1
              ;;

          esac


          # ------------------------------------------------------
          # 至少生成 BIOS 或 UEFI
          # ------------------------------------------------------

          if [ "$BIOS" != "true" ] && [ "$UEFI" != "true" ]; then

            echo "ERROR:"
            echo "BIOS and UEFI cannot both be disabled."

            exit 1

          fi


          # ------------------------------------------------------
          # 保存环境变量
          # ------------------------------------------------------

          echo "OPENWRT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OPENWRT_COMMIT=$COMMIT" >> "$GITHUB_ENV"

          echo "ROOTFS_SIZE=$ROOTFS" >> "$GITHUB_ENV"
          echo "ROOTFS_PARTSIZE=$PARTSIZE" >> "$GITHUB_ENV"

          echo "LAN_IP=$LAN_IP" >> "$GITHUB_ENV"

          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%H%M%S)" >> "$GITHUB_ENV"

          echo "BUILD_BIOS=$BIOS" >> "$GITHUB_ENV"
          echo "BUILD_UEFI=$UEFI" >> "$GITHUB_ENV"
          echo "BUILD_QCOW2=$QCOW2" >> "$GITHUB_ENV"
          echo "BUILD_VMDK=$VMDK" >> "$GITHUB_ENV"
          echo "BUILD_RAW=$RAW" >> "$GITHUB_ENV"


          echo
          echo "=========================================="
          echo "OpenWrt version : $VERSION"
          echo "OpenWrt commit  : $COMMIT"
          echo "RootFS          : $ROOTFS"
          echo "LAN IP          : $LAN_IP"
          echo "BIOS            : $BIOS"
          echo "UEFI            : $UEFI"
          echo "QCOW2           : $QCOW2"
          echo "VMDK            : $VMDK"
          echo "RAW             : $RAW"
          echo "=========================================="


      # ==========================================================
      # 安装编译依赖
      # ==========================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar


      # ==========================================================
      # Clone OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        run: |

          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          git fetch \
            --depth=1 \
            origin \
            "refs/tags/v${OPENWRT_VERSION}"

          git checkout "${OPENWRT_COMMIT}"


      # ==========================================================
      # 第三方 feeds
      # ==========================================================

      - name: Configure third-party feeds
        working-directory: openwrt
        run: |

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main

          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          src-git bandix https://github.com/timsaya/openwrt-bandix.git;main

          src-git sbwml https://github.com/sbwml/openwrt_pkgs.git;main

          EOF


      # ==========================================================
      # 更新 feeds
      # ==========================================================

      - name: Update and install feeds
        working-directory: openwrt
        run: |

          set -euo pipefail

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ==========================================================
      # 添加第三方 package
      # ==========================================================

      - name: Add custom packages
        working-directory: openwrt
        run: |

          set -euo pipefail

          mkdir -p package/custom


          # ------------------------------------------------------
          # Aurora Theme
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            package/custom/luci-theme-aurora


          # ------------------------------------------------------
          # Aurora Config
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-app-aurora-config.git \
            package/custom/luci-app-aurora-config


          # ------------------------------------------------------
          # luci-app-run
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            --branch master \
            https://github.com/wukongdaily/luci-app-run.git \
            package/custom/luci-app-run


          # ------------------------------------------------------
          # OpenClash
          #
          # 保持 OpenClash 官方推荐的目录结构：
          #
          # package/luci-app-openclash/
          # └── luci-app-openclash/
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            package/luci-app-openclash


          # ------------------------------------------------------
          # TimeWOL
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            https://github.com/VIKINGYFY/packages.git \
            /tmp/viking-packages

          if [ -d "/tmp/viking-packages/luci-app-timewol" ]; then

            cp -a \
              /tmp/viking-packages/luci-app-timewol \
              package/custom/

          fi


          echo
          echo "=========================================="
          echo "Custom package Makefiles"
          echo "=========================================="


          find \
            package/custom \
            package/luci-app-openclash \
            -type f \
            -name Makefile \
            -print |
          sort


      # ==========================================================
      # 编译 OpenClash po2lmo
      #
      # 注意：
      # po2lmo 最终生成在 src/po2lmo
      # 之前检查根目录导致了误判
      # ==========================================================

      - name: Build OpenClash po2lmo
        working-directory: openwrt
        run: |

          set -euo pipefail


          TOOL_DIR="package/luci-app-openclash/luci-app-openclash/tools/po2lmo"


          if [ ! -d "$TOOL_DIR" ]; then

            echo "ERROR:"
            echo "OpenClash po2lmo directory not found:"

            echo "$TOOL_DIR"

            exit 1

          fi


          make \
            -C "$TOOL_DIR" \
            -j"$(nproc)"


          if [ ! -x "$TOOL_DIR/src/po2lmo" ]; then

            echo
            echo "ERROR:"
            echo "po2lmo was not built."

            echo
            echo "Expected:"
            echo "$TOOL_DIR/src/po2lmo"

            exit 1

          fi


          sudo install \
            -m 0755 \
            "$TOOL_DIR/src/po2lmo" \
            /usr/local/bin/po2lmo


          echo
          echo "po2lmo installed:"
          command -v po2lmo


      # ==========================================================
      # 生成 OpenWrt 配置
      # ==========================================================

      - name: Generate OpenWrt configuration
        working-directory: openwrt
        run: |

          set -euo pipefail


          cat > .config <<EOF

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_unzip=y

          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y

          CONFIG_PACKAGE_luci-app-autoreboot=y
          CONFIG_PACKAGE_luci-i18n-autoreboot-zh-cn=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y
          CONFIG_PACKAGE_luci-i18n-aurora-config-zh-cn=y

          CONFIG_PACKAGE_bandix=y
          CONFIG_PACKAGE_luci-app-bandix=y
          CONFIG_PACKAGE_luci-i18n-bandix-zh-cn=y

          CONFIG_PACKAGE_luci-app-run=y

          CONFIG_PACKAGE_luci-app-filebrowser-go=y
          CONFIG_PACKAGE_luci-i18n-filebrowser-go-zh-cn=y

          CONFIG_PACKAGE_luci-app-timewol=y
          CONFIG_PACKAGE_luci-i18n-timewol-zh-cn=y

          EOF


          # ------------------------------------------------------
          # BIOS
          # ------------------------------------------------------

          if [ "$BUILD_BIOS" = "true" ]; then

            echo "CONFIG_GRUB_IMAGES=y" >> .config

          else

            echo "# CONFIG_GRUB_IMAGES is not set" >> .config

          fi


          # ------------------------------------------------------
          # UEFI
          # ------------------------------------------------------

          if [ "$BUILD_UEFI" = "true" ]; then

            echo "CONFIG_GRUB_EFI_IMAGES=y" >> .config

          else

            echo "# CONFIG_GRUB_EFI_IMAGES is not set" >> .config

          fi


          # ------------------------------------------------------
          # 让 OpenWrt 自动处理依赖
          # ------------------------------------------------------

          make defconfig


      # ==========================================================
      # 检查最终 package
      #
      # 注意：
      # 这里不再因为 package 缺失而让整个编译失败
      #
      # 缺失的包记录到 missing-packages.txt
      # ==========================================================

      - name: Verify package selection
        working-directory: openwrt
        run: |

          set -euo pipefail


          PACKAGES=(

            luci
            luci-i18n-base-zh-cn

            luci-app-mwan3
            luci-i18n-mwan3-zh-cn

            luci-app-ttyd
            luci-i18n-ttyd-zh-cn

            luci-app-upnp
            luci-i18n-upnp-zh-cn

            luci-app-vlmcsd
            luci-i18n-vlmcsd-zh-cn

            luci-app-autoreboot
            luci-i18n-autoreboot-zh-cn

            luci-app-passwall
            luci-i18n-passwall-zh-cn

            luci-app-openclash

            luci-theme-aurora
            luci-app-aurora-config
            luci-i18n-aurora-config-zh-cn

            bandix
            luci-app-bandix
            luci-i18n-bandix-zh-cn

            luci-app-run

            luci-app-filebrowser-go
            luci-i18n-filebrowser-go-zh-cn

            luci-app-timewol
            luci-i18n-timewol-zh-cn

          )


          : > "$GITHUB_WORKSPACE/selected-packages.txt"

          : > "$GITHUB_WORKSPACE/missing-packages.txt"


          echo
          echo "=========================================="
          echo "Checking package selection"
          echo "=========================================="


          for package in "${PACKAGES[@]}"; do

            if grep -qx \
              "CONFIG_PACKAGE_${package}=y" \
              .config; then

              echo "OK      ${package}"

              echo "${package}" \
                >> "$GITHUB_WORKSPACE/selected-packages.txt"

            else

              echo "MISSING ${package}"

              echo "${package}" \
                >> "$GITHUB_WORKSPACE/missing-packages.txt"

            fi

          done


          # ------------------------------------------------------
          # 非常重要：
          #
          # GitHub Release 不允许上传 0 字节文件
          #
          # 所以没有缺失包时写入 None
          # ------------------------------------------------------

          if [ ! -s "$GITHUB_WORKSPACE/missing-packages.txt" ]; then

            echo "None" \
              > "$GITHUB_WORKSPACE/missing-packages.txt"

          fi


          if [ ! -s "$GITHUB_WORKSPACE/selected-packages.txt" ]; then

            echo "None" \
              > "$GITHUB_WORKSPACE/selected-packages.txt"

          fi


          echo
          echo "=========================================="
          echo "Selected packages"
          echo "=========================================="

          cat "$GITHUB_WORKSPACE/selected-packages.txt"


          echo
          echo "=========================================="
          echo "Missing packages"
          echo "=========================================="

          cat "$GITHUB_WORKSPACE/missing-packages.txt"


      # ==========================================================
      # 网络配置
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2~eth5 = LAN
      #
      # PPPoE 信息来自 GitHub Secrets
      # ==========================================================

      - name: Generate network configuration
        env:

          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |

          set -euo pipefail


          for name in \
            WAN1_USER \
            WAN1_PASS \
            WAN2_USER \
            WAN2_PASS
          do

            if [ -z "${!name:-}" ]; then

              echo "ERROR:"
              echo "GitHub Secret ${name} is not configured."

              exit 1

            fi

          done


          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/network <<EOF

          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'


          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'


          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'


          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 '1'


          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'


          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 '1'


          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          EOF


      # ==========================================================
      # DHCP + IPv6 RA
      # ==========================================================

      - name: Generate DHCP and IPv6 configuration
        run: |

          set -euo pipefail


          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/dhcp <<'EOF'

          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'


          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'


          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'


          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'

          EOF


      # ==========================================================
      # 默认简体中文
      # ==========================================================

      - name: Set default language
        run: |

          set -euo pipefail


          mkdir -p \
            openwrt/files/etc/uci-defaults


          cat > openwrt/files/etc/uci-defaults/99-default-language <<'EOF'

          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'

          uci -q commit luci

          exit 0

          EOF


          chmod +x \
            openwrt/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # 固件信息
      # ==========================================================

      - name: Create build information
        run: |

          set -euo pipefail


          mkdir -p \
            openwrt/files/etc/openwrt-custom


          cat > openwrt/files/etc/openwrt-custom/build-info <<EOF

          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          OpenWrt Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC

          LAN:
          ${LAN_IP}

          eth0:
          WAN / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          Enabled

          EOF


      # ==========================================================
      # 下载源码包
      # ==========================================================

      - name: Download packages
        working-directory: openwrt
        run: |

          set -euo pipefail

          make download \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 编译
      # ==========================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |

          set -euo pipefail

          make \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 准备 Release 文件
      # ==========================================================

      - name: Prepare release files
        run: |

          set -euo pipefail


          rm -rf release

          mkdir -p release


          TARGET="openwrt/bin/targets/x86/64"


          # ------------------------------------------------------
          # BIOS
          # ------------------------------------------------------

          if [ "$BUILD_BIOS" = "true" ]; then

            IMAGE="$TARGET/generic-ext4-combined.img.gz"


            if [ ! -s "$IMAGE" ]; then

              echo "ERROR: BIOS image not found:"
              echo "$IMAGE"

              find "$TARGET" \
                -maxdepth 1 \
                -type f \
                -print

              exit 1

            fi


            cp \
              "$IMAGE" \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-BIOS.img.gz"

          fi


          # ------------------------------------------------------
          # UEFI
          # ------------------------------------------------------

          if [ "$BUILD_UEFI" = "true" ]; then

            IMAGE="$TARGET/generic-ext4-combined-efi.img.gz"


            if [ ! -s "$IMAGE" ]; then

              echo "ERROR: UEFI image not found:"
              echo "$IMAGE"

              find "$TARGET" \
                -maxdepth 1 \
                -type f \
                -print

              exit 1

            fi


            cp \
              "$IMAGE" \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"

          fi


          # ------------------------------------------------------
          # 虚拟机转换需要 RAW
          # ------------------------------------------------------

          if [ "$BUILD_QCOW2" = "true" ] || \
             [ "$BUILD_VMDK" = "true" ] || \
             [ "$BUILD_RAW" = "true" ]; then


            IMAGE="$TARGET/generic-ext4-combined-efi.img.gz"


            if [ ! -s "$IMAGE" ]; then

              IMAGE="$TARGET/generic-ext4-combined.img.gz"

            fi


            if [ ! -s "$IMAGE" ]; then

              echo "ERROR:"
              echo "No combined image available for conversion."

              exit 1

            fi


            gzip -dc \
              "$IMAGE" \
              > openwrt.raw

          fi


          # ------------------------------------------------------
          # QCOW2
          # ------------------------------------------------------

          if [ "$BUILD_QCOW2" = "true" ]; then

            qemu-img convert \
              -f raw \
              -O qcow2 \
              openwrt.raw \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"

          fi


          # ------------------------------------------------------
          # VMDK
          # ------------------------------------------------------

          if [ "$BUILD_VMDK" = "true" ]; then

            qemu-img convert \
              -f raw \
              -O vmdk \
              openwrt.raw \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.vmdk"

          fi


          # ------------------------------------------------------
          # RAW
          # ------------------------------------------------------

          if [ "$BUILD_RAW" = "true" ]; then

            cp \
              openwrt.raw \
              "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.raw"

          fi


          # ------------------------------------------------------
          # 包列表
          # ------------------------------------------------------

          cp \
            selected-packages.txt \
            release/selected-packages.txt


          cp \
            missing-packages.txt \
            release/missing-packages.txt


          # ------------------------------------------------------
          # Build Info
          # ------------------------------------------------------

          cat > release/build-info.txt <<EOF

          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          OpenWrt Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC


          LAN IP:
          ${LAN_IP}


          Network:

          eth0 = WAN / PPPoE

          eth1 = WANB / PPPoE

          eth2 = LAN

          eth3 = LAN

          eth4 = LAN

          eth5 = LAN


          IPv6:
          Enabled

          EOF


          # ------------------------------------------------------
          # 防止 GitHub Release 上传 0 字节文件
          # ------------------------------------------------------

          find release \
            -type f \
            -size 0 \
            -print \
            -delete


          # ------------------------------------------------------
          # SHA256
          # ------------------------------------------------------

          cd release

          sha256sum * \
            > sha256sums


          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="


          ls -lh


      # ==========================================================
      # 创建 GitHub Release
      #
      # 不再使用 softprops/action-gh-release
      # 直接使用 GitHub CLI
      # ==========================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -euo pipefail


          TAG="v${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-${GITHUB_RUN_ID}"

          TITLE="OpenWrt ${OPENWRT_VERSION} x86-64 ${ROOTFS_SIZE} ${BUILD_DATE}"


          cat > release/release-notes.md <<EOF

          # OpenWrt ${OPENWRT_VERSION} x86-64


          ## Build information

          - OpenWrt: \`${OPENWRT_VERSION}\`
          - Commit: \`${OPENWRT_COMMIT}\`
          - Target: \`x86-64\`
          - RootFS: \`${ROOTFS_SIZE}\`
          - Build date: \`${BUILD_DATE}\`
          - LAN IP: \`${LAN_IP}\`
          - IPv6: Enabled


          ## Network

          - eth0 → WAN / PPPoE
          - eth1 → WANB / PPPoE
          - eth2 → LAN
          - eth3 → LAN
          - eth4 → LAN
          - eth5 → LAN


          ## Packages

          See:

          - \`selected-packages.txt\`
          - \`missing-packages.txt\`

          EOF


          # ------------------------------------------------------
          # 最后一次检查
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "Final release assets"
          echo "=========================================="


          find release \
            -maxdepth 1 \
            -type f \
            -size 0 \
            -print


          if find release \
            -maxdepth 1 \
            -type f \
            -size 0 \
            | grep -q .; then

            echo
            echo "ERROR: Empty release asset detected."

            exit 1

          fi


          ls -lh release


          # ------------------------------------------------------
          # 创建 Release
          # ------------------------------------------------------

          gh release create \
            "$TAG" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file release/release-notes.md


          echo
          echo "=========================================="
          echo "Release created successfully"
          echo "=========================================="

          echo "Tag:"
          echo "$TAG"
