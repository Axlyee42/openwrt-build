name: Build OpenWrt 25.12.5

on:
  workflow_dispatch:

env:
  OPENWRT_VERSION: v25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            swig \
            time

      - name: Clone OpenWrt
        run: |
          git clone \
            --branch ${OPENWRT_VERSION} \
            --depth 1 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure x86_64
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y
          EOF

          make defconfig

      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      - name: Compile OpenWrt
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: Show firmware
        run: |
          echo "===== Firmware files ====="
          find openwrt/bin/targets/x86/64/ -type f \
            \( -name "*.img.gz" -o -name "*.vmdk" -o -name "*.qcow2" \) \
            -print

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-x86-64
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.vmdk
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/*.buildinfo
            openwrt/bin/targets/x86/64/sha256sums
          retention-days: 7
