name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:

      rootfs_size:
        description: "RootFS 分区大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

      build_bios:
        description: "生成 BIOS / Legacy 镜像"
        required: true
        default: true
        type: boolean

      build_uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      build_qcow2:
        description: "生成 QCOW2"
        required: true
        default: true
        type: boolean

      build_vmdk:
        description: "生成 VMDK"
        required: true
        default: false
        type: boolean

      build_raw:
        description: "生成 RAW"
        required: true
        default: false
        type: boolean

  repository_dispatch:
    types:
      - upstream-update


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    env:

      # ----------------------------------------------------------
      # 自动构建时由 sync-upstream.yml 传入
      # 手动构建时自动查询最新稳定版
      # ----------------------------------------------------------

      OPENWRT_VERSION: ${{ github.event.client_payload.openwrt_version }}

      OPENWRT_COMMIT: ${{ github.event.client_payload.openwrt_commit }}

      PACKAGES_COMMIT: ${{ github.event.client_payload.packages_commit }}

      LUCI_COMMIT: ${{ github.event.client_payload.luci_commit }}


    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. 获取最新 OpenWrt 信息
      #
      # 如果是手动运行，则自动查询。
      # 如果是 sync-upstream 触发，则使用 payload。
      # ==========================================================

      - name: Resolve upstream versions
        shell: bash
        run: |

          if [ -z "${OPENWRT_VERSION}" ]; then

            echo "Manual build detected."

            echo "Finding latest OpenWrt 25.12 release..."

            OPENWRT_VERSION="$(
              git ls-remote --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"

            if [ -z "${OPENWRT_VERSION}" ]; then
              echo "ERROR: Cannot determine OpenWrt version."
              exit 1
            fi

            echo "OpenWrt version: ${OPENWRT_VERSION}"


            OPENWRT_COMMIT="$(
              git ls-remote \
                https://github.com/openwrt/openwrt.git \
                "refs/tags/v${OPENWRT_VERSION}" |
              awk '{print $1}'
            )"

            PACKAGES_COMMIT="$(
              git ls-remote \
                https://github.com/openwrt/packages.git \
                refs/heads/openwrt-25.12 |
              awk '{print $1}'
            )"

            LUCI_COMMIT="$(
              git ls-remote \
                https://github.com/openwrt/luci.git \
                refs/heads/openwrt-25.12 |
              awk '{print $1}'
            )"

          fi


          if [ -z "${OPENWRT_COMMIT}" ]; then
            echo "ERROR: OPENWRT_COMMIT is empty."
            exit 1
          fi

          if [ -z "${PACKAGES_COMMIT}" ]; then
            echo "ERROR: PACKAGES_COMMIT is empty."
            exit 1
          fi

          if [ -z "${LUCI_COMMIT}" ]; then
            echo "ERROR: LUCI_COMMIT is empty."
            exit 1
          fi


          echo "OPENWRT_VERSION=${OPENWRT_VERSION}" >> "$GITHUB_ENV"

          echo "OPENWRT_COMMIT=${OPENWRT_COMMIT}" >> "$GITHUB_ENV"

          echo "PACKAGES_COMMIT=${PACKAGES_COMMIT}" >> "$GITHUB_ENV"

          echo "LUCI_COMMIT=${LUCI_COMMIT}" >> "$GITHUB_ENV"


          BUILD_DATE="$(date -u +%Y%m%d)"

          BUILD_TIME="$(date -u +%H%M%S)"

          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"

          echo "BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"


          echo
          echo "=========================================="
          echo "Upstream"
          echo "=========================================="

          echo "OpenWrt:"
          echo "${OPENWRT_VERSION}"
          echo "${OPENWRT_COMMIT}"

          echo
          echo "Packages:"
          echo "${PACKAGES_COMMIT}"

          echo
          echo "LuCI:"
          echo "${LUCI_COMMIT}"

          echo
          echo "Build:"
          echo "${BUILD_DATE} ${BUILD_TIME}"

          echo "=========================================="


      # ==========================================================
      # 3. RootFS size
      # ==========================================================

      - name: Configure RootFS size
        shell: bash
        run: |

          SIZE="${{ inputs.rootfs_size }}"

          # repository_dispatch 没有 workflow inputs
          if [ -z "${SIZE}" ]; then
            SIZE="4G"
          fi

          case "${SIZE}" in

            1G)
              ROOTFS_SIZE=1024
              ;;

            2G)
              ROOTFS_SIZE=2048
              ;;

            3G)
              ROOTFS_SIZE=3072
              ;;

            4G)
              ROOTFS_SIZE=4096
              ;;

            *)
              echo "Invalid RootFS size."
              exit 1
              ;;

          esac

          echo "ROOTFS_SIZE=${ROOTFS_SIZE}" >> "$GITHUB_ENV"

          echo "ROOTFS_HUMAN=${SIZE}" >> "$GITHUB_ENV"


      # ==========================================================
      # 4. Build options
      # ==========================================================

      - name: Configure build options
        shell: bash
        run: |

          BIOS="${{ inputs.build_bios }}"

          UEFI="${{ inputs.build_uefi }}"

          QCOW2="${{ inputs.build_qcow2 }}"

          VMDK="${{ inputs.build_vmdk }}"

          RAW="${{ inputs.build_raw }}"


          if [ -z "${BIOS}" ]; then
            BIOS="true"
          fi

          if [ -z "${UEFI}" ]; then
            UEFI="true"
          fi

          if [ -z "${QCOW2}" ]; then
            QCOW2="true"
          fi

          if [ -z "${VMDK}" ]; then
            VMDK="false"
          fi

          if [ -z "${RAW}" ]; then
            RAW="false"
          fi


          echo "BUILD_BIOS=${BIOS}" >> "$GITHUB_ENV"

          echo "BUILD_UEFI=${UEFI}" >> "$GITHUB_ENV"

          echo "BUILD_QCOW2=${QCOW2}" >> "$GITHUB_ENV"

          echo "BUILD_VMDK=${VMDK}" >> "$GITHUB_ENV"

          echo "BUILD_RAW=${RAW}" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. Dependencies
      # ==========================================================

      - name: Install dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar


      # ==========================================================
      # 6. Clone OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        run: |

          git clone \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          git checkout "${OPENWRT_COMMIT}"

          echo
          echo "OpenWrt:"
          git describe --tags --always

          echo
          echo "Commit:"
          git rev-parse HEAD


      # ==========================================================
      # 7. Update feeds
      # ==========================================================

      - name: Update feeds
        run: |

          cd openwrt

          ./scripts/feeds update -a


      # ==========================================================
      # 8. Pin packages feed
      # ==========================================================

      - name: Pin packages feed
        run: |

          cd openwrt

          cd feeds/packages

          git fetch origin openwrt-25.12

          git checkout "${PACKAGES_COMMIT}"

          echo
          echo "Packages:"
          git rev-parse HEAD

          cd ../..


      # ==========================================================
      # 9. Pin LuCI feed
      # ==========================================================

      - name: Pin LuCI feed
        run: |

          cd openwrt

          cd feeds/luci

          git fetch origin openwrt-25.12

          git checkout "${LUCI_COMMIT}"

          echo
          echo "LuCI:"
          git rev-parse HEAD

          cd ../..


      # ==========================================================
      # 10. Add PassWall
      # ==========================================================

      - name: Add PassWall
        run: |

          cd openwrt

          mkdir -p package/custom

          git clone \
            --depth=1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/custom/passwall-packages

          git clone \
            --depth=1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall.git \
            package/custom/passwall-luci


      # ==========================================================
      # 11. Add OpenClash
      # ==========================================================

      - name: Add OpenClash
        run: |

          cd openwrt

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            package/custom/openclash


      # ==========================================================
      # 12. Add Aurora
      # ==========================================================

      - name: Add Aurora
        run: |

          cd openwrt

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            package/custom/luci-theme-aurora


      # ==========================================================
      # 13. Add Bandix
      # ==========================================================

      - name: Add Bandix
        run: |

          cd openwrt

          git clone \
            --depth=1 \
            https://github.com/timsaya/openwrt-bandix.git \
            package/custom/openwrt-bandix

          git clone \
            --depth=1 \
            https://github.com/timsaya/luci-app-bandix.git \
            package/custom/luci-app-bandix


      # ==========================================================
      # 14. Add luci-app-run
      # ==========================================================

      - name: Add luci-app-run
        run: |

          cd openwrt

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/luci-app-run.git \
            package/custom/luci-app-run


      # ==========================================================
      # 15. Install feeds
      # ==========================================================

      - name: Install feeds
        run: |

          cd openwrt

          ./scripts/feeds install -a


      # ==========================================================
      # 16. Base configuration
      # ==========================================================

      - name: Configure OpenWrt
        run: |

          cd openwrt

          cat > .config <<EOF

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set

          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_SIZE}

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_kmod-ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          CONFIG_PACKAGE_mwan3=y

          EOF


          if [ "${BUILD_BIOS}" = "true" ]; then
            echo "CONFIG_GRUB_IMAGES=y" >> .config
          fi


          if [ "${BUILD_UEFI}" = "true" ]; then
            echo "CONFIG_GRUB_EFI_IMAGES=y" >> .config
          fi


          make defconfig


      # ==========================================================
      # 17. Custom package list
      # ==========================================================

      - name: Install custom package list
        run: |

          cd openwrt

          if [ ! -f ../shell/apk-custom-packages.sh ]; then

            echo "ERROR: apk-custom-packages.sh not found."

            exit 1

          fi


          chmod +x ../shell/apk-custom-packages.sh

          source ../shell/apk-custom-packages.sh


          if [ -z "${CUSTOM_PACKAGES}" ]; then

            echo "ERROR: CUSTOM_PACKAGES is empty."

            exit 1

          fi


          echo
          echo "Custom packages:"
          echo "${CUSTOM_PACKAGES}"


          for pkg in ${CUSTOM_PACKAGES}; do

            echo "CONFIG_PACKAGE_${pkg}=y" >> .config

          done


          make defconfig


      # ==========================================================
      # 18. Validate packages
      # ==========================================================

      - name: Validate packages
        run: |

          cd openwrt

          source ../shell/apk-custom-packages.sh

          FAILED=0


          for pkg in ${CUSTOM_PACKAGES}; do

            if grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then

              echo "OK      ${pkg}"

            else

              echo "MISSING ${pkg}"

              FAILED=1

            fi

          done


          if [ "${FAILED}" -ne 0 ]; then

            echo
            echo "Some packages were removed by defconfig."
            echo "The package name may no longer exist."
            echo

            exit 1

          fi


      # ==========================================================
      # 19. Network configuration
      # ==========================================================

      - name: Create network configuration
        env:

          WAN1_USER: ${{ secrets.WAN1_USER }}

          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}

          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        run: |

          if [ -z "${WAN1_USER}" ] || [ -z "${WAN1_PASS}" ]; then
            echo "WAN1 credentials missing."
            exit 1
          fi

          if [ -z "${WAN2_USER}" ] || [ -z "${WAN2_PASS}" ]; then
            echo "WAN2 credentials missing."
            exit 1
          fi


          LAN_IP="${{ inputs.lan_ip }}"

          if [ -z "${LAN_IP}" ]; then
            LAN_IP="192.168.1.2"
          fi


          mkdir -p openwrt/files/etc/config


          cat > openwrt/files/etc/config/network <<EOF

          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'


          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'


          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'


          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 'auto'


          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'


          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 'auto'


          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          EOF


      # ==========================================================
      # 20. DHCP / IPv6
      # ==========================================================

      - name: Create DHCP configuration
        run: |

          cat > openwrt/files/etc/config/dhcp <<'EOF'

          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'


          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'


          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'


          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'

          EOF


      # ==========================================================
      # 21. Default Chinese
      # ==========================================================

      - name: Set default language
        run: |

          mkdir -p openwrt/files/etc/uci-defaults


          cat > openwrt/files/etc/uci-defaults/99-default-language <<'EOF'

          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'

          uci -q commit luci

          exit 0

          EOF


          chmod +x \
            openwrt/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # 22. Build metadata
      # ==========================================================

      - name: Create build metadata
        run: |

          mkdir -p openwrt/files/etc/openwrt-custom


          cat > openwrt/files/etc/openwrt-custom/build-info <<EOF

          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          OpenWrt Commit:
          ${OPENWRT_COMMIT}

          Packages Commit:
          ${PACKAGES_COMMIT}

          LuCI Commit:
          ${LUCI_COMMIT}

          Target:
          x86_64

          RootFS:
          ${ROOTFS_HUMAN}

          Build Date:
          ${BUILD_DATE}

          Build Time UTC:
          ${BUILD_TIME}

          LAN:
          ${{ inputs.lan_ip }}

          WAN1:
          eth0 / PPPoE

          WAN2:
          eth1 / PPPoE

          LAN:
          eth2 eth3 eth4 eth5

          IPv6:
          enabled

          EOF


      # ==========================================================
      # 23. Download
      # ==========================================================

      - name: Download sources
        run: |

          cd openwrt

          make download \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 24. Compile
      # ==========================================================

      - name: Build OpenWrt
        run: |

          cd openwrt

          make \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 25. Prepare release
      # ==========================================================

      - name: Prepare release
        run: |

          rm -rf release

          mkdir -p release


      # ==========================================================
      # 26. BIOS
      # ==========================================================

      - name: Package BIOS
        if: env.BUILD_BIOS == 'true'
        run: |

          IMAGE_DIR="openwrt/bin/targets/x86/64"


          IMAGE="$(
            find "${IMAGE_DIR}" \
              -maxdepth 1 \
              -name '*ext4-combined.img.gz' \
              ! -name '*efi*' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "BIOS image not found."

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_HUMAN}-${BUILD_DATE}-BIOS.img.gz"


      # ==========================================================
      # 27. UEFI
      # ==========================================================

      - name: Package UEFI
        if: env.BUILD_UEFI == 'true'
        run: |

          IMAGE_DIR="openwrt/bin/targets/x86/64"


          IMAGE="$(
            find "${IMAGE_DIR}" \
              -maxdepth 1 \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "UEFI image not found."

            exit 1

          fi


          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_HUMAN}-${BUILD_DATE}-UEFI.img.gz"


      # ==========================================================
      # 28. RAW extraction
      # ==========================================================

      - name: Prepare RAW
        if: env.BUILD_QCOW2 == 'true' || env.BUILD_VMDK == 'true' || env.BUILD_RAW == 'true'
        run: |

          IMAGE_DIR="openwrt/bin/targets/x86/64"


          IMAGE="$(
            find "${IMAGE_DIR}" \
              -maxdepth 1 \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo "UEFI image required."

            exit 1

          fi


          gunzip -c "${IMAGE}" \
            > openwrt.raw


      # ==========================================================
      # 29. QCOW2
      # ==========================================================

      - name: Create QCOW2
        if: env.BUILD_QCOW2 == 'true'
        run: |

          qemu-img convert \
            -p \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_HUMAN}-${BUILD_DATE}-UEFI.qcow2"


      # ==========================================================
      # 30. VMDK
      # ==========================================================

      - name: Create VMDK
        if: env.BUILD_VMDK == 'true'
        run: |

          qemu-img convert \
            -p \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_HUMAN}-${BUILD_DATE}-UEFI.vmdk"


      # ==========================================================
      # 31. RAW
      # ==========================================================

      - name: Create RAW
        if: env.BUILD_RAW == 'true'
        run: |

          cp openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_HUMAN}-${BUILD_DATE}-UEFI.raw"


      # ==========================================================
      # 32. SHA256
      # ==========================================================

      - name: Generate SHA256
        run: |

          cd release

          sha256sum * > sha256sums


      # ==========================================================
      # 33. Release info
      # ==========================================================

      - name: Generate release information
        run: |

          cat > release/build-info.txt <<EOF

          ==========================================
          OpenWrt Custom Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          OpenWrt commit:
          ${OPENWRT_COMMIT}

          Packages commit:
          ${PACKAGES_COMMIT}

          LuCI commit:
          ${LUCI_COMMIT}

          Target:
          x86_64

          RootFS:
          ${ROOTFS_HUMAN}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME} UTC

          LAN:
          ${{ inputs.lan_ip }}

          eth0:
          WAN1 / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          enabled

          ==========================================

          EOF


      # ==========================================================
      # 34. Show files
      # ==========================================================

      - name: Show release files
        run: |

          ls -lh release


      # ==========================================================
      # 35. GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3

        with:

          tag_name: "OpenWrt-${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_HUMAN }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_HUMAN }} ${{ env.BUILD_DATE }} #${{ github.run_number }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Upstream

            OpenWrt commit:

            `${{ env.OPENWRT_COMMIT }}`

            Packages commit:

            `${{ env.PACKAGES_COMMIT }}`

            LuCI commit:

            `${{ env.LUCI_COMMIT }}`

            ## Network

            - eth0 → WAN1 → PPPoE
            - eth1 → WANB → PPPoE
            - eth2 → LAN
            - eth3 → LAN
            - eth4 → LAN
            - eth5 → LAN

            LAN:

            `${{ inputs.lan_ip }}`

            IPv6 enabled.

            ## Included

            - LuCI
            - Simplified Chinese
            - Aurora
            - Aurora Config
            - PassWall
            - OpenClash
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - mwan3
            - PPPoE
            - IPv6
            - ttyd
            - UPnP
            - VLMCSd
            - Timewol
            - Autoreboot

            Build date:

            `${{ env.BUILD_DATE }}`

          files: |
            release/*

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
