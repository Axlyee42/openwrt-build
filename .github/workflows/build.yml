name: Build OpenWrt x86-64

on:

  # ==========================================================
  # 手动编译
  # ==========================================================

  workflow_dispatch:

    inputs:

      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

      bios:
        description: "生成 BIOS 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW"
        required: true
        default: false
        type: boolean


  # ==========================================================
  # 自动编译
  #
  # 由 check-openwrt.yml 触发
  # ==========================================================

  repository_dispatch:

    types:
      - openwrt-release


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ========================================================
      # 确定 OpenWrt 版本
      # ========================================================

      - name: Resolve OpenWrt version

        shell: bash

        env:

          MANUAL_VERSION: ${{ inputs.openwrt_version }}

          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}

        run: |

          set -e


          VERSION="${MANUAL_VERSION}"


          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION}"
          fi


          # ----------------------------------------------------
          # 如果没有指定版本，则自动获取最新 25.12.x
          # ----------------------------------------------------

          if [ -z "${VERSION}" ]; then

            echo "Detecting latest OpenWrt 25.12.x..."


            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"

          fi


          # ----------------------------------------------------
          # 验证版本
          # ----------------------------------------------------

          if ! echo "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then

            echo
            echo "ERROR: Invalid OpenWrt version:"
            echo "${VERSION}"

            exit 1

          fi


          # ----------------------------------------------------
          # 获取对应 commit
          # ----------------------------------------------------

          COMMIT="$(
            git ls-remote \
              https://github.com/openwrt/openwrt.git \
              "refs/tags/v${VERSION}" |
            awk '{print $1}'
          )"


          if [ -z "${COMMIT}" ]; then

            echo
            echo "ERROR: Cannot find OpenWrt commit."

            exit 1

          fi


          # ----------------------------------------------------
          # 输出环境变量
          # ----------------------------------------------------

          echo "OPENWRT_VERSION=${VERSION}" >> "$GITHUB_ENV"

          echo "OPENWRT_COMMIT=${COMMIT}" >> "$GITHUB_ENV"

          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

          echo "BUILD_TIME=$(date -u +%H%M%S)" >> "$GITHUB_ENV"


          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "OpenWrt commit  : ${COMMIT}"
          echo "Build date      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="


      # ========================================================
      # 固件大小
      # ========================================================

      - name: Configure RootFS

        shell: bash

        run: |

          SIZE="${{ inputs.rootfs_size }}"


          if [ -z "${SIZE}" ]; then
            SIZE="4G"
          fi


          case "${SIZE}" in

            1G)
              PARTSIZE=1024
              ;;

            2G)
              PARTSIZE=2048
              ;;

            3G)
              PARTSIZE=3072
              ;;

            4G)
              PARTSIZE=4096
              ;;

            *)
              echo "ERROR: Invalid RootFS size."
              exit 1
              ;;

          esac


          echo "ROOTFS_SIZE=${SIZE}" >> "$GITHUB_ENV"

          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "$GITHUB_ENV"


      # ========================================================
      # 安装编译依赖
      # ========================================================

      - name: Install build dependencies

        shell: bash

        run: |

          set -e


          sudo apt-get update


          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar \
            npm


      # ========================================================
      # Clone OpenWrt
      # ========================================================

      - name: Clone OpenWrt

        shell: bash

        run: |

          set -e


          git clone \
            https://github.com/openwrt/openwrt.git \
            openwrt


          cd openwrt


          git checkout "${OPENWRT_COMMIT}"


          echo
          echo "OpenWrt checked out:"
          git describe --tags --always


      # ========================================================
      # 第三方 feeds
      # ========================================================

      - name: Configure third-party feeds

        working-directory: openwrt

        shell: bash

        run: |

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main

          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          src-git bandix https://github.com/timsaya/openwrt-bandix.git;main

          src-git bandix_luci https://github.com/timsaya/luci-app-bandix.git;main

          EOF


      # ========================================================
      # 更新 feeds
      # ========================================================

      - name: Update feeds

        working-directory: openwrt

        shell: bash

        run: |

          set -e

          ./scripts/feeds update -a


      # ========================================================
      # 安装 feeds
      # ========================================================

      - name: Install feeds

        working-directory: openwrt

        shell: bash

        run: |

          set -e

          ./scripts/feeds install -a


      # ========================================================
      # 添加 Aurora / OpenClash / luci-app-run
      # ========================================================

      - name: Add custom packages

        working-directory: openwrt

        shell: bash

        run: |

          set -e


          mkdir -p package/custom


          # ====================================================
          # Aurora
          # ====================================================

          echo
          echo "=========================================="
          echo "Adding Aurora"
          echo "=========================================="


          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            package/custom/luci-theme-aurora


          # ====================================================
          # luci-app-run
          # ====================================================

          echo
          echo "=========================================="
          echo "Adding luci-app-run"
          echo "=========================================="


          git clone \
            --depth=1 \
            https://github.com/wukongdaily/luci-app-run.git \
            package/custom/luci-app-run


          # ====================================================
          # OpenClash
          #
          # 只复制真正的 luci-app-openclash package
          # ====================================================

          echo
          echo "=========================================="
          echo "Adding OpenClash"
          echo "=========================================="


          rm -rf /tmp/OpenClash


          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash


          if [ ! -d /tmp/OpenClash/luci-app-openclash ]; then

            echo
            echo "ERROR:"
            echo "OpenClash package directory not found."

            exit 1

          fi


          cp -a \
            /tmp/OpenClash/luci-app-openclash \
            package/custom/luci-app-openclash


          # ====================================================
          # 显示 Makefile
          # ====================================================

          echo
          echo "=========================================="
          echo "Custom package Makefiles"
          echo "=========================================="


          find package/custom \
            -type f \
            -name Makefile \
            -print


      # ========================================================
      # 编译 OpenClash po2lmo
      # ========================================================

      - name: Build OpenClash po2lmo

        working-directory: openwrt

        shell: bash

        run: |

          set -e


          echo
          echo "=========================================="
          echo "Building OpenClash po2lmo"
          echo "=========================================="


          TOOL_DIR="package/custom/luci-app-openclash/tools/po2lmo"


          if [ ! -d "${TOOL_DIR}" ]; then

            echo
            echo "ERROR:"
            echo "OpenClash po2lmo source not found."

            exit 1

          fi


          cd "${TOOL_DIR}"


          make -j"$(nproc)"


          if [ ! -f po2lmo ]; then

            echo
            echo "ERROR:"
            echo "po2lmo was not built."

            exit 1

          fi


          sudo install \
            -m 0755 \
            po2lmo \
            /usr/local/bin/po2lmo


          echo
          echo "po2lmo installed:"


          command -v po2lmo


      # ========================================================
      # 生成 OpenWrt 配置
      # ========================================================

      - name: Generate OpenWrt configuration

        working-directory: openwrt

        shell: bash

        run: |

          set -e


          cat > .config <<EOF

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_ipv6=y
          CONFIG_PACKAGE_kmod-ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y

          # ----------------------------------------------------
          # OpenClash
          # ----------------------------------------------------

          CONFIG_PACKAGE_luci-app-openclash=y

          # ----------------------------------------------------
          # Aurora
          # ----------------------------------------------------

          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y
          CONFIG_PACKAGE_luci-i18n-aurora-config-zh-cn=y

          # ----------------------------------------------------
          # Bandix
          # ----------------------------------------------------

          CONFIG_PACKAGE_bandix=y
          CONFIG_PACKAGE_luci-app-bandix=y
          CONFIG_PACKAGE_luci-i18n-bandix-zh-cn=y

          # ----------------------------------------------------
          # luci-app-run
          # ----------------------------------------------------

          CONFIG_PACKAGE_luci-app-run=y

          # ----------------------------------------------------
          # FileBrowser Go
          # ----------------------------------------------------

          CONFIG_PACKAGE_luci-app-filebrowser-go=y
          CONFIG_PACKAGE_luci-i18n-filebrowser-go-zh-cn=y

          # ----------------------------------------------------
          # 常用中文语言包
          # ----------------------------------------------------

          CONFIG_PACKAGE_luci-i18n-timewol-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-autoreboot-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y

          EOF


          # ====================================================
          # BIOS
          # ====================================================

          if [ "${{ inputs.bios }}" = "true" ]; then

            echo "CONFIG_GRUB_IMAGES=y" >> .config

          fi


          # ====================================================
          # UEFI
          # ====================================================

          if [ "${{ inputs.uefi }}" = "true" ]; then

            echo "CONFIG_GRUB_EFI_IMAGES=y" >> .config

          fi


          # ====================================================
          # 显示关键配置
          # ====================================================

          echo
          echo "=========================================="
          echo "Requested packages"
          echo "=========================================="


          grep '^CONFIG_PACKAGE_' .config || true


          # ====================================================
          # 解析依赖
          # ====================================================

          make defconfig


      # ========================================================
      # 验证自定义 Package
      # ========================================================

      - name: Verify important packages

        working-directory: openwrt

        shell: bash

        run: |

          set -e


          echo
          echo "=========================================="
          echo "Checking package definitions"
          echo "=========================================="


          check_package() {

            local PACKAGE="$1"

            local MAKEFILE=""


            MAKEFILE="$(
              find package feeds \
                -type f \
                -name Makefile \
                -print 2>/dev/null |
              while read -r FILE; do

                if grep -q \
                  -E "^PKG_NAME[[:space:]]*:=[[:space:]]*${PACKAGE}[[:space:]]*$" \
                  "${FILE}" 2>/dev/null; then

                  echo "${FILE}"

                  break

                fi

              done
            )"


            if [ -z "${MAKEFILE}" ]; then

              echo
              echo "ERROR: Package not found: ${PACKAGE}"

              echo
              echo "Possible locations:"


              find package/custom feeds \
                -iname "*${PACKAGE}*" \
                2>/dev/null |
              head -50 || true


              exit 1

            fi


            echo "OK: ${PACKAGE}"
            echo "    ${MAKEFILE}"

          }


          check_package luci-app-openclash
          check_package luci-theme-aurora
          check_package luci-app-aurora-config
          check_package luci-app-bandix
          check_package bandix
          check_package luci-app-run
          check_package luci-app-filebrowser-go


          echo
          echo "=========================================="
          echo "All important packages found."
          echo "=========================================="


      # ========================================================
      # 网络配置
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2~eth5 = LAN
      #
      # PPPoE 用户名密码使用 GitHub Secrets
      # ========================================================

      - name: Generate network configuration

        env:

          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}

          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}

        shell: bash

        run: |

          set -e


          if [ -z "${WAN1_USER}" ] || [ -z "${WAN1_PASS}" ]; then

            echo
            echo "ERROR:"
            echo "WAN1_USER / WAN1_PASS is not configured."

            exit 1

          fi


          if [ -z "${WAN2_USER}" ] || [ -z "${WAN2_PASS}" ]; then

            echo
            echo "ERROR:"
            echo "WAN2_USER / WAN2_PASS is not configured."

            exit 1

          fi


          LAN_IP="${{ inputs.lan_ip }}"


          if [ -z "${LAN_IP}" ]; then
            LAN_IP="192.168.1.2"
          fi


          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/network <<EOF

          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'


          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'


          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${LAN_IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'


          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 '1'


          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'


          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 '1'


          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          EOF


      # ========================================================
      # DHCP / IPv6 RA
      # ========================================================

      - name: Generate DHCP configuration

        shell: bash

        run: |

          set -e


          mkdir -p \
            openwrt/files/etc/config


          cat > openwrt/files/etc/config/dhcp <<'EOF'

          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'


          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'


          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'


          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'


          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'

          EOF


      # ========================================================
      # 默认简体中文
      # ========================================================

      - name: Set default language

        shell: bash

        run: |

          set -e


          mkdir -p \
            openwrt/files/etc/uci-defaults


          cat > openwrt/files/etc/uci-defaults/99-default-language <<'EOF'

          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'

          uci -q commit luci

          exit 0

          EOF


          chmod +x \
            openwrt/files/etc/uci-defaults/99-default-language


      # ========================================================
      # 写入固件信息
      # ========================================================

      - name: Create build information

        shell: bash

        run: |

          set -e


          mkdir -p \
            openwrt/files/etc/openwrt-custom


          cat > openwrt/files/etc/openwrt-custom/build-info <<EOF

          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          OpenWrt Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC

          LAN:
          ${{ inputs.lan_ip }}

          eth0:
          WAN / PPPoE

          eth1:
          WANB / PPPoE

          eth2:
          LAN

          eth3:
          LAN

          eth4:
          LAN

          eth5:
          LAN

          IPv6:
          Enabled

          EOF


      # ========================================================
      # 再次解析配置
      #
      # 自定义 files 和 package 加入之后
      # 确保最终配置有效
      # ========================================================

      - name: Finalize configuration

        working-directory: openwrt

        shell: bash

        run: |

          set -e

          make defconfig


      # ========================================================
      # 下载源码包
      # ========================================================

      - name: Download packages

        working-directory: openwrt

        shell: bash

        run: |

          set -e

          make download \
            -j"$(nproc)" \
            V=s


      # ========================================================
      # 编译
      # ========================================================

      - name: Build OpenWrt

        working-directory: openwrt

        shell: bash

        run: |

          set -e


          echo
          echo "=========================================="
          echo "Building OpenWrt"
          echo "=========================================="


          make \
            -j"$(nproc)" \
            V=s


      # ========================================================
      # 准备 Release
      # ========================================================

      - name: Prepare release directory

        shell: bash

        run: |

          set -e


          rm -rf release

          mkdir -p release


      # ========================================================
      # BIOS
      # ========================================================

      - name: Copy BIOS image

        if: inputs.bios == true

        shell: bash

        run: |

          set -e


          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined.img.gz' \
              ! -name '*efi*' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo
            echo "ERROR: BIOS image not found."

            echo
            echo "Available images:"

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1

          fi


          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-BIOS.img.gz"


      # ========================================================
      # UEFI
      # ========================================================

      - name: Copy UEFI image

        if: inputs.uefi == true

        shell: bash

        run: |

          set -e


          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo
            echo "ERROR: UEFI image not found."

            echo
            echo "Available images:"

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1

          fi


          cp \
            "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


      # ========================================================
      # 准备 RAW
      # ========================================================

      - name: Prepare raw image

        if: inputs.qcow2 == true || inputs.vmdk == true || inputs.raw == true

        shell: bash

        run: |

          set -e


          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"


          if [ -z "${IMAGE}" ]; then

            echo
            echo "ERROR: UEFI image not found."

            exit 1

          fi


          gzip -dc \
            "${IMAGE}" \
            > openwrt.raw


      # ========================================================
      # QCOW2
      # ========================================================

      - name: Create QCOW2

        if: inputs.qcow2 == true

        shell: bash

        run: |

          set -e


          qemu-img convert \
            -f raw \
            -O qcow2 \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


      # ========================================================
      # VMDK
      # ========================================================

      - name: Create VMDK

        if: inputs.vmdk == true

        shell: bash

        run: |

          set -e


          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.vmdk"


      # ========================================================
      # RAW
      # ========================================================

      - name: Create RAW

        if: inputs.raw == true

        shell: bash

        run: |

          set -e


          cp \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.raw"


      # ========================================================
      # SHA256
      # ========================================================

      - name: Generate SHA256

        shell: bash

        run: |

          set -e


          cd release


          sha256sum * > sha256sums


      # ========================================================
      # Release 信息
      # ========================================================

      - name: Create release information

        shell: bash

        run: |

          cat > release/build-info.txt <<EOF

          ==========================================
          OpenWrt Custom Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          OpenWrt commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME} UTC


          Network:

          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          LAN:
          ${{ inputs.lan_ip }}

          IPv6:
          Enabled


          Included:

          LuCI
          Simplified Chinese
          PassWall
          OpenClash
          Aurora
          Aurora Config
          Bandix
          luci-app-run
          FileBrowser Go
          mwan3
          PPPoE
          IPv6
          ttyd
          UPnP
          VLMCSd
          Timewol
          Autoreboot

          ==========================================

          EOF


      # ========================================================
      # 显示最终文件
      # ========================================================

      - name: Show release files

        shell: bash

        run: |

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="


          ls -lh release


      # ========================================================
      # 创建 GitHub Release
      # ========================================================

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"

          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"

          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build information

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ inputs.lan_ip }}`
            - IPv6: Enabled

            ## Included

            - LuCI
            - Simplified Chinese
            - PassWall
            - OpenClash
            - Aurora
            - Aurora Config
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - mwan3
            - PPPoE
            - IPv6
            - ttyd
            - UPnP
            - VLMCSd
            - Timewol
            - Autoreboot

          files: |
            release/*

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
