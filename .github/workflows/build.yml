name: Build OpenWrt x86-64

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 25.12.x 版本，留空自动使用最新版本"
        required: false
        default: ""
        type: string

      rootfs_size:
        description: "固件大小"
        required: true
        default: "4G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"

      lan_ip:
        description: "LAN 管理 IP"
        required: true
        default: "192.168.1.2"
        type: string

      bios:
        description: "生成 BIOS 镜像"
        required: true
        default: true
        type: boolean

      uefi:
        description: "生成 UEFI 镜像"
        required: true
        default: true
        type: boolean

      qcow2:
        description: "生成 QCOW2"
        required: true
        default: true
        type: boolean

      vmdk:
        description: "生成 VMDK"
        required: true
        default: false
        type: boolean

      raw:
        description: "生成 RAW"
        required: true
        default: false
        type: boolean

  repository_dispatch:
    types:
      - openwrt-release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 确定 OpenWrt 版本
      # ==========================================================

      - name: Resolve OpenWrt version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.openwrt_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.openwrt_version }}
        run: |
          set -euo pipefail

          VERSION="${MANUAL_VERSION}"

          if [ -z "${VERSION}" ]; then
            VERSION="${DISPATCH_VERSION}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Detecting latest OpenWrt 25.12.x..."

            VERSION="$(
              git ls-remote \
                --tags \
                https://github.com/openwrt/openwrt.git \
                'refs/tags/v25.12.*' |
              sed 's#.*refs/tags/v##' |
              grep -E '^25\.12\.[0-9]+$' |
              sort -V |
              tail -1
            )"
          fi

          if ! printf '%s\n' "${VERSION}" | grep -Eq '^25\.12\.[0-9]+$'; then
            echo "ERROR: Invalid OpenWrt version: ${VERSION}"
            exit 1
          fi

          COMMIT="$(
            git ls-remote \
              https://github.com/openwrt/openwrt.git \
              "refs/tags/v${VERSION}" |
            awk '{print $1}'
          )"

          if [ -z "${COMMIT}" ]; then
            echo "ERROR: Cannot find OpenWrt commit."
            exit 1
          fi

          BUILD_DATE="$(date -u +%Y%m%d)"
          BUILD_TIME="$(date -u +%H%M%S)"

          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "OPENWRT_COMMIT=${COMMIT}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "OpenWrt version : ${VERSION}"
          echo "OpenWrt commit  : ${COMMIT}"
          echo "Build date      : ${BUILD_DATE}"
          echo "Build time      : ${BUILD_TIME} UTC"
          echo "=========================================="


      # ==========================================================
      # 固件大小
      # ==========================================================

      - name: Configure rootfs size
        shell: bash
        env:
          INPUT_ROOTFS_SIZE: ${{ inputs.rootfs_size }}
        run: |
          set -euo pipefail

          SIZE="${INPUT_ROOTFS_SIZE}"

          if [ -z "${SIZE}" ]; then
            SIZE="4G"
          fi

          case "${SIZE}" in
            1G)
              PARTSIZE=1024
              ;;
            2G)
              PARTSIZE=2048
              ;;
            3G)
              PARTSIZE=3072
              ;;
            4G)
              PARTSIZE=4096
              ;;
            *)
              echo "ERROR: Invalid rootfs size: ${SIZE}"
              exit 1
              ;;
          esac

          echo "ROOTFS_SIZE=${SIZE}" >> "${GITHUB_ENV}"
          echo "ROOTFS_PARTSIZE=${PARTSIZE}" >> "${GITHUB_ENV}"

          echo "RootFS size: ${SIZE}"
          echo "Partition size: ${PARTSIZE} MB"


      # ==========================================================
      # 安装编译依赖
      # ==========================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            qemu-utils \
            dos2unix \
            device-tree-compiler \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar


      # ==========================================================
      # Clone OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          git fetch \
            --depth=1 \
            origin \
            "refs/tags/v${OPENWRT_VERSION}"

          git checkout \
            "${OPENWRT_COMMIT}"


      # ==========================================================
      # 配置第三方 feeds
      # ==========================================================

      - name: Configure third-party feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git bandix https://github.com/timsaya/openwrt-bandix.git;main
          src-git bandix_luci https://github.com/timsaya/luci-app-bandix.git;main

          EOF

          echo "Third-party feeds configured."


      # ==========================================================
      # 更新 feeds
      # ==========================================================

      - name: Update feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          ./scripts/feeds update -a


      # ==========================================================
      # 安装 feeds
      # ==========================================================

      - name: Install feeds
        working-directory: openwrt
        run: |
          set -euo pipefail

          ./scripts/feeds install -a


      # ==========================================================
      # 添加自定义软件源
      #
      # Aurora
      # OpenClash
      # luci-app-run
      # ==========================================================

      - name: Add custom packages
        working-directory: openwrt
        run: |
          set -euo pipefail

          mkdir -p package/custom

          echo
          echo "=========================================="
          echo "Adding Aurora"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/eamonxg/luci-theme-aurora.git \
            package/custom/luci-theme-aurora

          echo
          echo "=========================================="
          echo "Adding OpenClash"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            package/custom/OpenClash

          echo
          echo "=========================================="
          echo "Adding luci-app-run"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/wukongdaily/luci-app-run.git \
            package/custom/luci-app-run

          echo
          echo "Custom package directories:"
          find package/custom \
            -maxdepth 2 \
            -type f \
            -name Makefile \
            -print || true


      # ==========================================================
      # 基础配置
      # ==========================================================

      - name: Generate base configuration
        working-directory: openwrt
        run: |
          set -euo pipefail

          cat > .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_ipv6=y
          CONFIG_PACKAGE_kmod-ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y

          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-app-autoreboot=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-autoreboot-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-timewol-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-filebrowser-go-zh-cn=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y

          CONFIG_PACKAGE_bandix=y
          CONFIG_PACKAGE_luci-app-bandix=y

          CONFIG_PACKAGE_luci-app-run=y

          EOF

          make defconfig


      # ==========================================================
      # 确保需要的软件包被选中
      #
      # 不再使用之前错误的 grep 检查方式。
      # 如果某个第三方包在当前 OpenWrt 分支不存在，
      # 只警告并从最终配置中移除，避免整个编译无意义失败。
      # ==========================================================

      - name: Configure custom packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          PACKAGES="
          luci
          luci-ssl
          luci-proto-ipv6
          luci-proto-ppp
          ppp
          ppp-mod-pppoe
          kmod-pppoe
          ipv6
          kmod-ipv6
          odhcp6c
          odhcpd-ipv6only
          mwan3
          luci-app-mwan3
          luci-app-upnp
          luci-app-ttyd
          luci-app-vlmcsd
          luci-app-autoreboot
          luci-i18n-base-zh-cn
          luci-i18n-mwan3-zh-cn
          luci-i18n-upnp-zh-cn
          luci-i18n-ttyd-zh-cn
          luci-i18n-vlmcsd-zh-cn
          luci-i18n-autoreboot-zh-cn
          luci-i18n-timewol-zh-cn
          luci-i18n-filebrowser-go-zh-cn
          luci-app-passwall
          luci-app-openclash
          luci-theme-aurora
          luci-app-aurora-config
          bandix
          luci-app-bandix
          luci-app-run
          "

          : > /tmp/selected-packages.txt
          : > /tmp/missing-packages.txt

          echo
          echo "=========================================="
          echo "Configuring packages"
          echo "=========================================="

          for PACKAGE in ${PACKAGES}; do

            echo
            echo "Checking: ${PACKAGE}"

            FOUND=0

            if ./scripts/feeds search "${PACKAGE}" 2>/dev/null | grep -q "^${PACKAGE}"; then
              FOUND=1
            fi

            if find package/custom \
              -type f \
              -name Makefile \
              -exec grep -q \
              "define Package/${PACKAGE}" {} \; 2>/dev/null; then
              FOUND=1
            fi

            if [ "${FOUND}" -eq 1 ]; then
              echo "OK: ${PACKAGE}"
              echo "CONFIG_PACKAGE_${PACKAGE}=y" >> .config
              echo "${PACKAGE}" >> /tmp/selected-packages.txt
            else
              echo "WARNING: Package not found: ${PACKAGE}"
              echo "${PACKAGE}" >> /tmp/missing-packages.txt
            fi

          done

          make defconfig

          echo
          echo "=========================================="
          echo "Selected packages"
          echo "=========================================="

          sort -u /tmp/selected-packages.txt || true

          echo
          echo "=========================================="
          echo "Missing packages"
          echo "=========================================="

          sort -u /tmp/missing-packages.txt || true

          cp /tmp/selected-packages.txt \
            selected-packages.txt

          cp /tmp/missing-packages.txt \
            missing-packages.txt


      # ==========================================================
      # 处理 BIOS / UEFI
      # ==========================================================

      - name: Configure image formats
        working-directory: openwrt
        env:
          BIOS: ${{ inputs.bios }}
          UEFI: ${{ inputs.uefi }}
        run: |
          set -euo pipefail

          BIOS_VALUE="${BIOS}"
          UEFI_VALUE="${UEFI}"

          if [ -z "${BIOS_VALUE}" ]; then
            BIOS_VALUE="true"
          fi

          if [ -z "${UEFI_VALUE}" ]; then
            UEFI_VALUE="true"
          fi

          if [ "${BIOS_VALUE}" = "true" ]; then
            echo "CONFIG_GRUB_IMAGES=y" >> .config
          fi

          if [ "${UEFI_VALUE}" = "true" ]; then
            echo "CONFIG_GRUB_EFI_IMAGES=y" >> .config
          fi

          make defconfig


      # ==========================================================
      # 网络配置
      #
      # eth0 = WAN
      # eth1 = WANB
      # eth2-eth5 = LAN
      #
      # PPPoE 用户名密码从 GitHub Secrets 获取
      # ==========================================================

      - name: Generate network configuration
        env:
          WAN1_USER: ${{ secrets.WAN1_USER }}
          WAN1_PASS: ${{ secrets.WAN1_PASS }}
          WAN2_USER: ${{ secrets.WAN2_USER }}
          WAN2_PASS: ${{ secrets.WAN2_PASS }}
          LAN_IP: ${{ inputs.lan_ip }}
        run: |
          set -euo pipefail

          if [ -z "${WAN1_USER}" ]; then
            echo "ERROR: WAN1_USER is not configured."
            exit 1
          fi

          if [ -z "${WAN1_PASS}" ]; then
            echo "ERROR: WAN1_PASS is not configured."
            exit 1
          fi

          if [ -z "${WAN2_USER}" ]; then
            echo "ERROR: WAN2_USER is not configured."
            exit 1
          fi

          if [ -z "${WAN2_PASS}" ]; then
            echo "ERROR: WAN2_PASS is not configured."
            exit 1
          fi

          IP="${LAN_IP}"

          if [ -z "${IP}" ]; then
            IP="192.168.1.2"
          fi

          mkdir -p openwrt/files/etc/config

          cat > openwrt/files/etc/config/network <<EOF
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
              list ports 'eth5'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${IP}'
              option netmask '255.255.255.0'
              option ip6assign '64'

          config interface 'wan'
              option device 'eth0'
              option proto 'pppoe'
              option username '${WAN1_USER}'
              option password '${WAN1_PASS}'
              option ipv6 'auto'

          config interface 'wan6'
              option device '@wan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

          config interface 'wanb'
              option device 'eth1'
              option proto 'pppoe'
              option username '${WAN2_USER}'
              option password '${WAN2_PASS}'
              option ipv6 'auto'

          config interface 'wanb6'
              option device '@wanb'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'
          EOF

          echo "Network configuration generated."


      # ==========================================================
      # DHCP / IPv6 RA
      # ==========================================================

      - name: Generate DHCP configuration
        run: |
          set -euo pipefail

          mkdir -p openwrt/files/etc/config

          cat > openwrt/files/etc/config/dhcp <<'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'server'
              option ra 'server'
              option ra_management '1'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'

          config dhcp 'wanb'
              option interface 'wanb'
              option ignore '1'

          config dhcp 'wan6'
              option interface 'wan6'
              option ignore '1'

          config dhcp 'wanb6'
              option interface 'wanb6'
              option ignore '1'

          config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          EOF


      # ==========================================================
      # 默认简体中文
      # ==========================================================

      - name: Set default language
        run: |
          set -euo pipefail

          mkdir -p openwrt/files/etc/uci-defaults

          cat > openwrt/files/etc/uci-defaults/99-default-language <<'EOF'
          #!/bin/sh

          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          exit 0
          EOF

          chmod +x \
            openwrt/files/etc/uci-defaults/99-default-language


      # ==========================================================
      # 写入构建信息
      # ==========================================================

      - name: Create build information
        run: |
          set -euo pipefail

          mkdir -p openwrt/files/etc/openwrt-custom

          cat > openwrt/files/etc/openwrt-custom/build-info <<EOF
          OpenWrt Custom Build

          OpenWrt Version:
          ${OPENWRT_VERSION}

          OpenWrt Commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build Date:
          ${BUILD_DATE}

          Build Time:
          ${BUILD_TIME} UTC

          LAN:
          ${{ inputs.lan_ip }}

          Network:
          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          IPv6:
          Enabled
          EOF


      # ==========================================================
      # 显示最终配置
      # ==========================================================

      - name: Show final configuration
        working-directory: openwrt
        run: |
          echo
          echo "=========================================="
          echo "Final OpenWrt configuration"
          echo "=========================================="

          grep '^CONFIG_TARGET_' .config | head -50 || true

          echo
          echo "Selected packages:"
          grep '^CONFIG_PACKAGE_' .config | sort || true


      # ==========================================================
      # 下载软件包
      # ==========================================================

      - name: Download packages
        working-directory: openwrt
        run: |
          set -euo pipefail

          make download \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 编译
      # ==========================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          set -euo pipefail

          make \
            -j"$(nproc)" \
            V=s


      # ==========================================================
      # 准备 Release
      # ==========================================================

      - name: Prepare release directory
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp openwrt/selected-packages.txt \
            release/selected-packages.txt

          if [ -f openwrt/missing-packages.txt ]; then
            cp openwrt/missing-packages.txt \
              release/missing-packages.txt
          fi


      # ==========================================================
      # BIOS 镜像
      # ==========================================================

      - name: Copy BIOS image
        if: ${{ inputs.bios != false }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined.img.gz' \
              ! -name '*efi*' |
            head -1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: BIOS image not found."

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-BIOS.img.gz"


      # ==========================================================
      # UEFI 镜像
      # ==========================================================

      - name: Copy UEFI image
        if: ${{ inputs.uefi != false }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI image not found."

            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          cp "${IMAGE}" \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.img.gz"


      # ==========================================================
      # 准备 RAW
      # ==========================================================

      - name: Prepare raw image
        if: ${{ inputs.qcow2 || inputs.vmdk || inputs.raw }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find openwrt/bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*ext4-combined-efi.img.gz' |
            head -1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: UEFI image not found."
            exit 1
          fi

          gzip -dc \
            "${IMAGE}" \
            > openwrt.raw


      # ==========================================================
      # QCOW2
      # ==========================================================

      - name: Create QCOW2
        if: ${{ inputs.qcow2 }}
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O qcow2 \
            -o compression_type=zstd \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.qcow2"


      # ==========================================================
      # VMDK
      # ==========================================================

      - name: Create VMDK
        if: ${{ inputs.vmdk }}
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vmdk \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.vmdk"


      # ==========================================================
      # RAW
      # ==========================================================

      - name: Create RAW
        if: ${{ inputs.raw }}
        run: |
          set -euo pipefail

          cp \
            openwrt.raw \
            "release/OpenWrt-${OPENWRT_VERSION}-x86-64-${ROOTFS_SIZE}-${BUILD_DATE}-UEFI.raw"


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256
        run: |
          set -euo pipefail

          cd release

          sha256sum \
            *.img.gz \
            *.qcow2 \
            *.vmdk \
            *.raw \
            2>/dev/null > sha256sums || true


      # ==========================================================
      # Release 信息
      # ==========================================================

      - name: Create release information
        run: |
          set -euo pipefail

          cat > release/build-info.txt <<EOF
          ==========================================
          OpenWrt Custom Build
          ==========================================

          OpenWrt:
          ${OPENWRT_VERSION}

          OpenWrt commit:
          ${OPENWRT_COMMIT}

          Target:
          x86-64

          RootFS:
          ${ROOTFS_SIZE}

          Build date:
          ${BUILD_DATE}

          Build time:
          ${BUILD_TIME} UTC

          Network:

          eth0 = WAN / PPPoE
          eth1 = WANB / PPPoE
          eth2 = LAN
          eth3 = LAN
          eth4 = LAN
          eth5 = LAN

          LAN:
          ${{ inputs.lan_ip }}

          IPv6:
          Enabled

          ==========================================
          EOF


      # ==========================================================
      # 显示最终文件
      # ==========================================================

      - name: Show release files
        run: |
          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release


      # ==========================================================
      # 创建 GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.OPENWRT_VERSION }}-x86-64-${{ env.ROOTFS_SIZE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}"
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} x86-64 ${{ env.ROOTFS_SIZE }} ${{ env.BUILD_DATE }}"
          body: |
            # OpenWrt ${{ env.OPENWRT_VERSION }} x86-64

            ## Build information

            - OpenWrt: `${{ env.OPENWRT_VERSION }}`
            - Target: `x86-64`
            - RootFS: `${{ env.ROOTFS_SIZE }}`
            - Build date: `${{ env.BUILD_DATE }}`

            ## Network

            - `eth0` → WAN / PPPoE
            - `eth1` → WANB / PPPoE
            - `eth2` → LAN
            - `eth3` → LAN
            - `eth4` → LAN
            - `eth5` → LAN

            - LAN IP: `${{ inputs.lan_ip }}`
            - IPv6: Enabled

            ## Included

            - LuCI
            - Simplified Chinese
            - PassWall
            - OpenClash
            - Aurora
            - Aurora Config
            - Bandix
            - luci-app-run
            - FileBrowser Go
            - mwan3
            - PPPoE
            - IPv6
            - ttyd
            - UPnP
            - VLMCSd
            - Timewol
            - Autoreboot

            ## WAN

            WAN1 and WAN2 PPPoE credentials are provided through GitHub Actions Secrets.

          files: |
            release/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
